rice=2): cash=max(0, -1+2-2)=0,    hold=max(-1, 0-2)=-1\n *   Day 3 (price=8): cash=max(0, -1+8-2)=5,    hold=max(-1, 5-8)=-1\n *   Day 4 (price=4): cash=max(5, -1+4-2)=5,    hold=max(-1, 5-4)=1\n *   Day 5 (price=9): cash=max(5, 1+9-2)=8,     hold=max(1, 8-9)=1\n *   Answer: cash = 8 \u2713\n *\n * Time:  O(n)\n * Space: O(1)\n */\npublic class BestTimeBuySellStockWithTransactionFee {\n\n    // -------------------- Optimal O(1) Space --------------------\n    public static int maxProfit(int[] prices, int fee) {\n        // cash: best profit ending in \"not holding\" state\n        // hold: best profit ending in \"holding\" state\n        int cash = 0;\n        int hold = -prices[0]; // Buy on day 0\n\n        for (int i = 1; i < prices.length; i++) {\n            // Sell: transition from hold -> cash, pay fee\n            int newCash = Math.max(cash, hold + prices[i] - fee);\n            // Buy: transition from cash -> hold\n            int newHold = Math.max(hold, cash - prices[i]);\n\n            cash = newCash;\n            hold = newHold;\n        }\n\n        // Must end in \"not holding\" state for maximum profit\n        return cash;\n    }\n\n    // -------------------- Recursive + Memoization --------------------\n    public static int maxProfitRecursive(int[] prices, int fee) {\n        int[][] memo = new int[prices.length][2];\n        for (int[] row : memo) java.util.Arrays.fill(row, -1);\n        return solve(prices, fee, 0, 0, memo);\n    }\n\n    /**\n     * @param idx   current day index\n     * @param hold  0 = not holding, 1 = holding\n     */\n    private static int solve(int[] prices, int fee, int idx, int hold, int[][] memo) {\n        if (idx == prices.length) return 0;\n        if (memo[idx][hold] != -1) return memo[idx][hold];\n\n        // Option 1: Do nothing (rest)\n        int rest = solve(prices, fee, idx + 1, hold, memo);\n\n        if (hold == 1) {\n            // Option 2: Sell today (pay fee)\n            int sell = prices[idx] - fee + solve(prices, fee, idx + 1, 0, memo);\n            memo[idx][hold] = Math.max(rest, sell);\n        } else {\n            // Option 2: Buy today\n            int buy = -prices[idx] + solve(prices, fee, idx + 1, 1, memo);\n            memo[idx][hold] = Math.max(rest, buy);\n        }\n\n        return memo[idx][hold];\n    }\n\n    public static void main(String[] args) {\n        int[] prices1 = {1, 3, 2, 8, 4, 9};\n        System.out.println(\"Example 1: \" + maxProfit(prices1, 2));          // 8\n        System.out.println(\"Recursive: \" + maxProfitRecursive(prices1, 2)); // 8\n\n        int[] prices2 = {1, 3, 7, 5, 10, 3};\n        System.out.println(\"Example 2: \" + maxProfit(prices2, 3));          // 6\n    }\n}\n"}, {"name": "BestTimeBuySellStock_2", "subcat": "stock", "link": "", "code": "package leetcode.dp.stock;\n\n/**\n * 122. Best Time to Buy and Sell Stock II\n * https://leetcode.com/problems/best-time-to-buy-and-sell-stock-ii/\n *\n * You are given an integer array prices where prices[i] is the price of a\n * given stock on the i-th day. On each day, you may decide to buy and/or\n * sell the stock. You can hold at most one share at a time. You can buy and\n * sell on the same day. Find the maximum profit you can achieve.\n *\n * Example 1: Input: prices = [7,1,5,3,6,4] -> Output: 7\n *   Explanation: Buy day 2, sell day 3 (profit 4). Buy day 4, sell day 5 (profit 3). Total = 7.\n *\n * Example 2: Input: prices = [1,2,3,4,5] -> Output: 4\n * Example 3: Input: prices = [7,6,4,3,1] -> Output: 0\n *\n * Constraints:\n *   1 <= prices.length <= 3 * 10^4\n *   0 <= prices[i] <= 10^4\n *\n * ---\n * Approach: Greedy\n *\n * Collect every upward price movement. Whenever tomorrow's price is higher\n * than today's, add the difference as profit. This is equivalent to buying\n * and selling on every consecutive profitable pair.\n *\n * Time:  O(n)\n * Space: O(1)\n */\npublic class BestTimeBuySellStock_2 {\n\n    public static int maxProfit(int[] prices) {\n        int profit = 0;\n\n        // Accumulate profit from every upward price movement\n        for (int i = 1; i < prices.length; i++) {\n            if (prices[i] > prices[i - 1]) {\n                profit += prices[i] - prices[i - 1];\n            }\n        }\n\n        return profit;\n    }\n\n    public static void main(String[] args) {\n        // Test case 1\n        int[] prices1 = { 7, 1, 5, 3, 6, 4 };\n        System.out.println(maxProfit(prices1)); // Output: 7\n\n        // Test case 2\n        int[] prices2 = { 1, 2, 3, 4, 5 };\n        System.out.println(maxProfit(prices2)); // Output: 4\n\n        // Test case 3\n        int[] prices3 = { 7, 6, 4, 3, 1 };\n        System.out.println(maxProfit(prices3)); // Output: 0\n    }\n}\n"}, {"name": "BestTimeBuySellStock_3", "subcat": "stock", "link": "", "code": "package leetcode.dp.stock;\n\n/**\n * 123. Best Time to Buy and Sell Stock III\n * https://leetcode.com/problems/best-time-to-buy-and-sell-stock-iii/\n *\n * You are given an array prices where prices[i] is the price of a given stock\n * on the i-th day. Find the maximum profit you can achieve. You may complete\n * at most two transactions. You may not engage in multiple transactions\n * simultaneously (you must sell the stock before you buy again).\n *\n * Example 1: Input: prices = [3,3,5,0,0,3,1,4] -> Output: 6\n *   Explanation: Buy day 4 (price=0), sell day 6 (price=3), profit=3.\n *                Buy day 7 (price=1), sell day 8 (price=4), profit=3. Total=6.\n *\n * Example 2: Input: prices = [1,2,3,4,5] -> Output: 4\n * Example 3: Input: prices = [7,6,4,3,1] -> Output: 0\n *\n * Constraints:\n *   1 <= prices.length <= 10^5\n *   0 <= prices[i] <= 10^5\n *\n * ---\n * Approach: State Machine / DP in O(1) space\n *\n * Track 4 variables across one pass:\n *   minPrice1: cheapest buy for transaction 1\n *   profit1:   max profit after selling transaction 1\n *   minPrice2: effective cheapest buy for transaction 2 (price - profit1)\n *   profit2:   max profit after selling transaction 2\n *\n * The trick: minPrice2 = min(price - profit1) accounts for the profit\n * already earned from the first transaction, so profit2 captures the\n * combined profit of both transactions.\n *\n * Time:  O(n)\n * Space: O(1)\n */\npublic class BestTimeBuySellStock_3 {\n\n    public static int maxProfit(int[] prices) {\n        if (prices == null || prices.length == 0) {\n            return 0;\n        }\n\n        int minPrice1 = Integer.MAX_VALUE;  // Min buy price for 1st transaction\n        int minPrice2 = Integer.MAX_VALUE;  // Effective min buy price for 2nd transaction\n        int profit1 = 0;                     // Max profit from 1st transaction\n        int profit2 = 0;                     // Max profit from both transactions\n\n        for (int price : prices) {\n            // Transaction 1: find best single buy-sell\n            minPrice1 = Math.min(minPrice1, price);\n            profit1 = Math.max(profit1, price - minPrice1);\n\n            // Transaction 2: effective buy price = price - profit1\n            // This \"reinvests\" profit1 so profit2 captures total of both\n            minPrice2 = Math.min(minPrice2, price - profit1);\n            profit2 = Math.max(profit2, price - minPrice2);\n        }\n\n        return profit2;\n    }\n\n    public static void main(String[] args) {\n        // Test case 1\n        int[] prices1 = { 3, 3, 5, 0, 0, 3, 1, 4 };\n        System.out.println(maxProfit(prices1)); // Output: 6\n\n        // Test case 2\n        int[] prices2 = { 1, 2, 3, 4, 5 };\n        System.out.println(maxProfit(prices2)); // Output: 4\n\n        // Test case 3\n        int[] prices3 = { 7, 6, 4, 3, 1 };\n        System.out.println(maxProfit(prices3)); // Output: 0\n    }\n}\n"}, {"name": "BestTimeBuySellStock_4", "subcat": "stock", "link": "", "code": "package leetcode.dp.stock;\n\nimport java.util.Arrays;\n\n/**\n * 188. Best Time to Buy and Sell Stock IV\n * https://leetcode.com/problems/best-time-to-buy-and-sell-stock-iv/\n *\n * You are given an integer array prices where prices[i] is the price of a\n * given stock on the i-th day, and an integer k.\n * Find the maximum profit you can achieve with at most k transactions.\n * You may not hold more than one share at a time.\n *\n * Example 1: Input: k = 2, prices = [2,4,1] -> Output: 2\n *   Explanation: Buy day 1 (price=2), sell day 2 (price=4), profit = 2.\n *\n * Example 2: Input: k = 2, prices = [3,2,6,5,0,3] -> Output: 7\n *   Explanation: Buy day 2, sell day 3 (profit 4). Buy day 5, sell day 6 (profit 3). Total=7.\n *\n * Constraints:\n *   1 <= k <= 100\n *   1 <= prices.length <= 1000\n *   0 <= prices[i] <= 1000\n *\n * ---\n * Approach: DP with buy[] and sell[] arrays\n *\n * Generalization of Stock III. Maintain k buy/sell states:\n *   buy[i]  = max profit when holding stock after i-th buy\n *   sell[i] = max profit when NOT holding stock after i-th sell\n *\n * For each price, update all k transactions:\n *   buy[i]  = max(buy[i], sell[i-1] - price)  // buy using profit from previous sell\n *   sell[i] = max(sell[i], buy[i] + price)     // sell the stock we hold\n *\n * Time:  O(n * k)\n * Space: O(k)\n */\npublic class BestTimeBuySellStock_4 {\n\n    public static int maxProfit(int k, int[] prices) {\n        int[] buy = new int[k + 1];   // buy[i] = max profit in \"holding\" state for i-th transaction\n        int[] sell = new int[k + 1];  // sell[i] = max profit in \"sold\" state for i-th transaction\n\n        // Initialize buy states to -infinity (haven't bought yet)\n        Arrays.fill(buy, Integer.MIN_VALUE);\n\n        for (int price : prices) {\n            for (int i = 1; i <= k; i++) {\n                // Either keep holding, or buy today using previous sell's profit\n                buy[i] = Math.max(buy[i], sell[i - 1] - price);\n                // Either keep waiting, or sell today\n                sell[i] = Math.max(sell[i], buy[i] + price);\n            }\n        }\n        return sell[k];\n\n    }\n\n    public static void main(String[] args) {\n        // Test case 1\n        int[] prices1 = { 2, 4, 1 };\n        System.out.println(maxProfit(2, prices1)); // Output: 2\n\n        // Test case 2\n        int[] prices2 = { 3, 2, 6, 5, 0, 3 };\n        System.out.println(maxProfit(2, prices2)); // Output: 7\n    }\n}\n"}, {"name": "DistinctSubsequences", "subcat": "string", "link": "", "code": "package leetcode.dp.string;\n\nimport java.util.Arrays;\n\n/**\n * 115. Distinct Subsequences\n * https://leetcode.com/problems/distinct-subsequences/\n *\n * Given two strings s and t, return the number of distinct subsequences of s\n * which equals t.\n *\n * A subsequence of a string is a new string formed by deleting some (or no)\n * characters without disturbing the relative positions of the remaining characters.\n *\n * Example 1: Input: s = \"rabbbit\", t = \"rabbit\" -> Output: 3\n * Example 2: Input: s = \"babgbag\", t = \"bag\"    -> Output: 5\n *\n * Constraints:\n *   1 <= s.length, t.length <= 1000\n *   s and t consist of English letters.\n *\n * ---\n * Approach: 2D DP (top-down memoization + bottom-up iterative)\n *\n * STATE:      dp[i][j] = number of ways to form t[0..i-1] from s[0..j-1]\n * BASE:       dp[0][j] = 1 for all j (empty t matches any prefix of s exactly once)\n * TRANSITION: If t[i-1] == s[j-1]: dp[i][j] = dp[i-1][j-1] + dp[i][j-1]\n *               (match this char OR skip s[j-1])\n *             Else: dp[i][j] = dp[i][j-1] (skip s[j-1])\n * ANSWER:     dp[t.length][s.length]\n *\n * Time:  O(m * n)\n * Space: O(m * n)\n */\npublic class DistinctSubsequences {\n\n    // Top-down: count ways to match t[j..] using s[i..]\n    public static int helper(String s, String t, int i, int j, int[][] dp) {\n        // All of t is matched\n        if (j >= t.length()) return 1;\n        // s is exhausted but t is not\n        if (i >= s.length()) return 0;\n\n        if (dp[i][j] != -1) return dp[i][j];\n\n        if (s.charAt(i) == t.charAt(j)) {\n            // Two choices: use s[i] to match t[j], or skip s[i]\n            dp[i][j] = helper(s, t, i + 1, j + 1, dp) + helper(s, t, i + 1, j, dp);\n\n        } else {\n            // Characters don't match, must skip s[i]\n            dp[i][j] = helper(s, t, i + 1, j, dp);\n        }\n\n        return dp[i][j];\n    }\n\n    public static int recursive(String s, String t) {\n        int[][] dp = new int[s.length()][t.length()];\n        for (int[] m : dp) Arrays.fill(m, -1);\n\n        return helper(s, t, 0, 0, dp);\n    }\n\n    /**\n     * Bottom-up iterative DP\n     *\n     * Example: s = \"babgbag\", t = \"bag\" -> 5\n     *\n     * dp[i][j] = number of ways to form t[0..i-1] from s[0..j-1]\n     *\n     *          \"\"  b  a  b  g  b  a  g\n     *     \"\"  [ 1, 1, 1, 1, 1, 1, 1, 1 ]   <- base: empty t matches any prefix once\n     *     b   [ 0, 1, 1, 2, 2, 3, 3, 3 ]\n     *     a   [ 0, 0, 1, 1, 1, 1, 4, 4 ]\n     *     g   [ 0, 0, 0, 0, 1, 1, 1, 5 ]   <- answer: dp[3][7] = 5\n     *\n     * Trace for dp[2][6] (t=\"ba\", s=\"babgba\"):\n     *   t[1]='a' == s[5]='a' \u2192 dp[1][5] + dp[2][5] = 3 + 1 = 4\n     *   (3 ways to match 'b' in \"babgb\" + 1 way already found for \"ba\" in \"babgb\")\n     */\n    public static int iterative(String s, String t) {\n        int m = t.length(); // Target\n        int n = s.length(); // Source\n        int[][] dp = new int[m + 1][n + 1];\n\n        // Base case: empty t can be formed from any prefix of s in exactly 1 way\n        for (int j = 0; j <= n; j++) {\n            dp[0][j] = 1;\n        }\n\n        for (int i = 1; i <= m; i++) {\n            for (int j = 1; j <= n; j++) {\n                if (t.charAt(i - 1) == s.charAt(j - 1)) {\n                    // Match s[j-1] with t[i-1] + skip s[j-1]\n                    dp[i][j] = dp[i - 1][j - 1] + dp[i][j - 1];\n                } else {\n                    // Skip s[j-1]\n                    dp[i][j] = dp[i][j - 1];\n                }\n            }\n        }\n\n        return dp[t.length()][s.length()];\n    }\n\n    public static int numDistinct(String s, String t) {\n        return recursive(s, t);\n    }\n\n    public static void main(String[] args) {\n        String s = \"rabbbit\";\n        String t = \"rabbit\";\n\n        System.out.println(numDistinct(s, t));\n    }\n\n\n}\n"}, {"name": "EditDistance", "subcat": "string", "link": "", "code": "package leetcode.dp.string;\n\nimport java.util.Arrays;\n\n/**\n * 72. Edit Distance\n * https://leetcode.com/problems/edit-distance/\n *\n * Given two strings word1 and word2, return the minimum number of operations\n * required to convert word1 into word2. You have three operations:\n * Insert a character, Delete a character, Replace a character.\n *\n * Example 1: Input: word1 = \"horse\", word2 = \"ros\" -> Output: 3\n *   Explanation: horse -> rorse (replace h with r) -> rose (remove r) -> ros (remove e)\n *\n * Example 2: Input: word1 = \"intention\", word2 = \"execution\" -> Output: 5\n *\n * Constraints:\n *   0 <= word1.length, word2.length <= 500\n *   word1 and word2 consist of lowercase English letters.\n *\n * ---\n * Approach: 2D DP (top-down + bottom-up)\n *\n * STATE:      dp[i][j] = min operations to convert word1[0..i-1] to word2[0..j-1]\n * BASE:       dp[i][0] = i (delete all), dp[0][j] = j (insert all)\n * TRANSITION: If chars match: dp[i][j] = dp[i-1][j-1]\n *             Else: dp[i][j] = 1 + min(dp[i][j-1], dp[i-1][j], dp[i-1][j-1])\n *                                      (insert,     delete,     replace)\n * ANSWER:     dp[m][n]\n *\n * Time:  O(m * n)\n * Space: O(m * n)\n */\npublic class EditDistance {\n\n    public static int recursive(String word1, String word2, int i, int j, int[][] dp) {\n        // Base case: If one string is empty\n        if (i == 0) return j; // Insert all characters of word2\n        if (j == 0) return i; // Remove all characters of word1\n\n        // Check if the result is already computed\n        if (dp[i][j] != -1) {\n            return dp[i][j];\n        }\n\n        // If the characters are the same, no operation is needed\n        if (word1.charAt(i - 1) == word2.charAt(j - 1)) {\n            dp[i][j] = recursive(word1, word2, i - 1, j - 1, dp);\n        } else {\n            // Calculate the minimum of three operations (Insert, Delete, Replace)\n            int insert = recursive(word1, word2, i, j - 1, dp);    // Insert character from word2\n            int delete = recursive(word1, word2, i - 1, j, dp);    // Delete character from word1\n            int replace = recursive(word1, word2, i - 1, j - 1, dp); // When you replace, it becomes equal\n\n            dp[i][j] = 1 + Math.min(insert, Math.min(delete, replace));\n        }\n\n        return dp[i][j];\n    }\n\n    /**\n     * Bottom-up iterative DP\n     *\n     * Example: word1 = \"horse\", word2 = \"ros\" -> 3\n     *\n     * dp[i][j] = min operations to convert word1[0..i-1] to word2[0..j-1]\n     *\n     *          \"\"  r  o  s\n     *     \"\"  [ 0, 1, 2, 3 ]   <- base: insert all of word2\n     *     h   [ 1, 1, 2, 3 ]   h\u2192r: replace(0+1=1)\n     *     o   [ 2, 2, 1, 2 ]   o==o: diagonal(1)\n     *     r   [ 3, 2, 2, 2 ]   r==r: diagonal(2)\n     *     s   [ 4, 3, 3, 2 ]   s==s: diagonal(2)\n     *     e   [ 5, 4, 4, 3 ]   <- answer: dp[5][3] = 3\n     *              \u2191\n     *          base: delete all of word1\n     *\n     * Trace for dp[5][3] (word1=\"horse\", word2=\"ros\"):\n     *   'e' != 's' \u2192 1 + min(dp[4][3], dp[5][2], dp[4][2]) = 1 + min(2, 4, 3) = 3\n     *                       (delete)  (insert)  (replace)\n     */\n    public static int iterative(String word1, String word2) {\n        int m = word1.length();\n        int n = word2.length();\n\n        // dp[i][j] = min operations to convert word1[0..i-1] to word2[0..j-1]\n        int[][] dp = new int[m + 1][n + 1];\n\n        // Base case: if word1 is empty, we need to insert all characters of word2\n        for (int i = 0; i <= m; i++) {\n            dp[i][0] = i;\n        }\n\n        // Base case: if word2 is empty, we need to remove all characters of word1\n        for (int j = 0; j <= n; j++) {\n            dp[0][j] = j;\n        }\n\n        for (int i = 1; i <= m; i++) {\n            for (int j = 1; j <= n; j++) {\n                if (word1.charAt(i - 1) == word2.charAt(j - 1)) {\n                    dp[i][j] = dp[i - 1][j - 1];\n                } else {\n                    // Take the minimum of Insert, Delete, and Replace operations\n                    dp[i][j] = 1 + Math.min(dp[i - 1][j], Math.min(dp[i][j - 1], dp[i - 1][j - 1]));\n                }\n            }\n        }\n\n        return dp[m][n];\n    }\n\n    public static int minDistance(String word1, String word2) {\n        int m = word1.length();\n        int n = word2.length();\n\n        int[][] dp = new int[m + 1][n + 1];\n        for (int[] row : dp) {\n            Arrays.fill(row, -1);\n        }\n\n        return recursive(word1, word2, m, n, dp);\n    }\n\n\n    public static void main(String[] args) {\n        String word1 = \"a\";\n        String word2 = \"x\";\n        System.out.println(minDistance(word1, word2));\n    }\n\n}\n"}, {"name": "InterleavingString", "subcat": "string", "link": "", "code": "package leetcode.dp.string;\n\n/**\n * 97. Interleaving String\n * https://leetcode.com/problems/interleaving-string/\n *\n * Given strings s1, s2, and s3, determine whether s3 is formed by an\n * interleaving of s1 and s2. An interleaving is defined as choosing\n * characters from s1 and s2 such that their relative order is preserved.\n *\n * Example 1: Input: s1=\"aabcc\", s2=\"dbbca\", s3=\"aadbbcbcac\" -> Output: true\n * Example 2: Input: s1=\"aabcc\", s2=\"dbbca\", s3=\"aadbbbaccc\" -> Output: false\n * Example 3: Input: s1=\"\", s2=\"\", s3=\"\" -> Output: true\n *\n * Constraints:\n *   0 <= s1.length, s2.length <= 100\n *   0 <= s3.length <= 200\n *   s1, s2, and s3 consist of lowercase English letters.\n *\n * ---\n * Approach: 2D DP (top-down + bottom-up)\n *\n * STATE:      dp[i][j] = true if s1[0..i-1] and s2[0..j-1] interleave to form s3[0..i+j-1]\n * BASE:       dp[0][0] = true; first row/col check prefix matches\n * TRANSITION: dp[i][j] = (s1[i-1]==s3[k] && dp[i-1][j]) || (s2[j-1]==s3[k] && dp[i][j-1])\n *             where k = i + j - 1\n * ANSWER:     dp[n][m]\n *\n * Time:  O(n * m)\n * Space: O(n * m)\n */\npublic class InterleavingString {\n\n    // Top-down: check if s1[i..] and s2[j..] can interleave to form s3[k..]\n    public static boolean helper(String s1, String s2, String s3, int i, int j, int k, Boolean[][] dp) {\n        // Both strings fully consumed -> s3 is fully matched\n        if (i == s1.length() && j == s2.length()) return true;\n\n        if (dp[i][j] != null) return dp[i][j];\n\n        // Try taking the next character from s1\n        if (i < s1.length() && s1.charAt(i) == s3.charAt(k)) {\n            dp[i][j] = helper(s1, s2, s3, i + 1, j, k + 1, dp);\n\n            if (dp[i][j]) return true;\n        }\n\n        // Try taking the next character from s2\n        if (j < s2.length() && s2.charAt(j) == s3.charAt(k)) {\n            dp[i][j] = helper(s1, s2, s3, i, j + 1, k + 1, dp);\n\n            if (dp[i][j]) return true;\n        }\n\n        // Neither character matches -> interleaving not possible from here\n        return dp[i][j] = false;\n    }\n\n    public static boolean recursive(String s1, String s2, String s3) {\n        if (s1.length() + s2.length() != s3.length()) return false;\n\n        Boolean[][] dp = new Boolean[s1.length() + 1][s2.length() + 1];\n        helper(s1, s2, s3, 0, 0, 0, dp);\n\n        return helper(s1, s2, s3, 0, 0, 0, dp);\n    }\n\n\n    /**\n     * Bottom-up iterative DP\n     *\n     * Example: s1 = \"ab\", s2 = \"cd\", s3 = \"acbd\" -> true\n     *   Interleaving: a(s1) c(s2) b(s1) d(s2) = \"acbd\"\n     *\n     * dp[i][j] = can s1[0..i-1] and s2[0..j-1] interleave to form s3[0..i+j-1]?\n     *\n     *          \"\"    c     d\n     *     \"\"  [ T,   F,    F ]   s2[0]='c' != s3[0]='a'\n     *     a   [ T,   T,    F ]   s1[0]='a'==s3[0], s2[0]='c'==s3[1]\n     *     b   [ F,   T,    T ]   <- answer: dp[2][2] = T\n     *\n     * Trace for dp[2][2] (s3[3]='d'):\n     *   s1[1]='b' != s3[3]='d' \u2192 skip\n     *   s2[1]='d' == s3[3]='d' && dp[2][1]=T \u2192 T\n     */\n    public static boolean iterative(String s1, String s2, String s3) {\n        int n = s1.length(), m = s2.length();\n\n        if (n + m != s3.length()) return false;\n\n        boolean[][] dp = new boolean[n + 1][m + 1];\n\n        dp[0][0] = true;\n\n        // Fill the first column (considering only s1)\n        for (int i = 1; i <= n; i++) {\n            dp[i][0] = dp[i - 1][0] && s1.charAt(i - 1) == s3.charAt(i - 1);\n        }\n\n        // Fill the first row (considering only s2)\n        for (int j = 1; j <= m; j++) {\n            dp[0][j] = dp[0][j - 1] && s2.charAt(j - 1) == s3.charAt(j - 1);\n        }\n\n        // Fill the DP table\n        for (int i = 1; i <= n; i++) {\n            for (int j = 1; j <= m; j++) {\n                // current index in s3 that we are checking\n                int k = (i + j) - 1;\n                // Check if the current character from s1 or s2 matches the character at index k in s3.\n                // If it matches, inherit truth from previous valid states.\n                // dp[i][j] checks if s1[0..i-1] and s2[0..j-1] match s3[0..i+j-1].\n                dp[i][j] = (s1.charAt(i - 1) == s3.charAt(k) && dp[i - 1][j]) || (s2.charAt(j - 1) == s3.charAt(k) && dp[i][j - 1]);\n            }\n        }\n\n        return dp[n][m];\n    }\n\n\n    public static boolean isInterleave(String s1, String s2, String s3) {\n        return true;\n    }\n\n    public static void main(String[] args) {\n        String s1 = \"aabcc\";\n        String s2 = \"dbbca\";\n        String s3 = \"aadbbcbcac\"; // \"aa dbbc bc a c\";\n        System.out.println(iterative(s1, s2, s3));\n    }\n}\n"}, {"name": "LongestCommonSubsequence", "subcat": "string", "link": "", "code": "package leetcode.dp.string;\n\nimport java.util.Arrays;\n\n/**\n * 1143. Longest Common Subsequence\n * https://leetcode.com/problems/longest-common-subsequence/\n *\n * Given two strings text1 and text2, return the length of their longest\n * common subsequence. If there is no common subsequence, return 0.\n *\n * Example 1: Input: text1 = \"abcde\", text2 = \"ace\" -> Output: 3\n *   Explanation: The longest common subsequence is \"ace\".\n *\n * Example 2: Input: text1 = \"abc\", text2 = \"abc\" -> Output: 3\n * Example 3: Input: text1 = \"abc\", text2 = \"def\" -> Output: 0\n *\n * Constraints:\n *   1 <= text1.length, text2.length <= 1000\n *   text1 and text2 consist of only lowercase English characters.\n *\n * ---\n * Approach: 2D DP (top-down + bottom-up)\n *\n * STATE:      dp[i][j] = LCS length of text1[0..i-1] and text2[0..j-1]\n * BASE:       dp[0][j] = dp[i][0] = 0 (empty string has LCS of 0)\n * TRANSITION: If chars match: dp[i][j] = dp[i-1][j-1] + 1\n *             Else: dp[i][j] = max(dp[i-1][j], dp[i][j-1])\n * ANSWER:     dp[m][n]\n *\n * Time:  O(m * n)\n * Space: O(m * n)\n */\npublic class LongestCommonSubsequence {\n\n    // Top-down: find LCS of text1[i..] and text2[j..]\n    public static int helper(char[] text1, char[] text2, int i, int j, int[][] dp) {\n        // Base case: one string is exhausted\n        if (i >= text1.length || j >= text2.length) return 0;\n\n        if (dp[i][j] != -1) return dp[i][j];\n\n        if (text1[i] == text2[j]) {\n            // Characters match: include in LCS and advance both\n            dp[i][j] = 1 + helper(text1, text2, i + 1, j + 1, dp);\n\n        } else {\n            // Don't match: try skipping one character from each string\n            int max1 = helper(text1, text2, i + 1, j, dp);\n            int max2 = helper(text1, text2, i, j + 1, dp);\n\n            dp[i][j] = Math.max(max1, max2);\n        }\n\n        return dp[i][j];\n    }\n\n\n    public static int recursive(String text1, String text2) {\n        int[][] dp = new int[text1.length()][text2.length()];\n        for (int[] m : dp) {\n            Arrays.fill(m, -1);\n        }\n        return helper(text1.toCharArray(), text2.toCharArray(), 0, 0, dp);\n    }\n\n\n    /**\n     * Bottom-up iterative DP\n     *\n     * Example: text1 = \"abcde\", text2 = \"ace\" -> 3 (LCS = \"ace\")\n     *\n     * dp[i][j] = LCS length of text1[0..i-1] and text2[0..j-1]\n     *\n     *          \"\"  a  c  e\n     *     \"\"  [ 0, 0, 0, 0 ]   <- base: LCS with empty = 0\n     *     a   [ 0, 1, 1, 1 ]   a==a \u2192 0+1=1\n     *     b   [ 0, 1, 1, 1 ]   b\u2260a,c,e \u2192 carry forward\n     *     c   [ 0, 1, 2, 2 ]   c==c \u2192 1+1=2\n     *     d   [ 0, 1, 2, 2 ]   d\u2260a,c,e \u2192 carry forward\n     *     e   [ 0, 1, 2, 3 ]   e==e \u2192 2+1=3  <- answer\n     *\n     * Trace for dp[5][3] (text1=\"abcde\", text2=\"ace\"):\n     *   'e' == 'e' \u2192 dp[4][2] + 1 = 2 + 1 = 3\n     */\n    public static int iterative(String str1, String str2) {\n        int m = str1.length();\n        int n = str2.length();\n        int[][] dp = new int[m + 1][n + 1];\n\n        // Base cases: dp[i][0] = 0, dp[0][j] = 0 (already zero-initialized)\n        for (int i = 0; i <= m; i++) {\n            dp[i][0] = 0;\n        }\n\n        for (int j = 0; j <= n; j++) {\n            dp[0][j] = 0;\n        }\n\n        for (int i = 1; i <= m; i++) {\n            for (int j = 1; j <= n; j++) {\n                if (str1.charAt(i - 1) == str2.charAt(j - 1)) {\n                    // Characters match: extend LCS by 1\n                    dp[i][j] = dp[i - 1][j - 1] + 1;\n                } else {\n                    // Skip one character from either string\n                    dp[i][j] = Math.max(dp[i - 1][j], dp[i][j - 1]);\n                }\n            }\n        }\n\n        return dp[m][n];\n    }\n\n\n    public static int longestCommonSubsequence(String text1, String text2) {\n        return recursive(text1, text2);\n    }\n\n\n    public static void main(String[] args) {\n        String text1 = \"mom\";\n        String text2 = \"mom\";\n\n        System.out.println(longestCommonSubsequence(text1, text2));\n    }\n\n\n}\n"}, {"name": "LongestPalindromeSubsequence", "subcat": "string", "link": "", "code": "package leetcode.dp.string;\n\nimport java.util.Arrays;\n\n/**\n * 516. Longest Palindromic Subsequence\n * https://leetcode.com/problems/longest-palindromic-subsequence/\n *\n * Given a string s, find the longest palindromic subsequence's length in s.\n * A subsequence is derived by deleting some or no characters without\n * changing the relative order of the remaining characters.\n *\n * Example 1: Input: s = \"bbbab\" -> Output: 4  (\"bbbb\")\n * Example 2: Input: s = \"cbbd\"  -> Output: 2  (\"bb\")\n *\n * Constraints:\n *   1 <= s.length <= 1000\n *   s consists only of lowercase English letters.\n *\n * ---\n * Approach: Interval DP (top-down + bottom-up)\n *\n * STATE:      dp[i][j] = length of longest palindromic subsequence in s[i..j]\n * BASE:       dp[i][i] = 1 (single character is a palindrome)\n * TRANSITION: If s[i] == s[j]: dp[i][j] = 2 + dp[i+1][j-1]\n *             Else: dp[i][j] = max(dp[i+1][j], dp[i][j-1])\n * ANSWER:     dp[0][n-1]\n *\n * Time:  O(n^2)\n * Space: O(n^2)\n */\npublic class LongestPalindromeSubsequence {\n\n    // Top-down: find longest palindromic subsequence in s[i..j]\n    public static int helper(String s, int i, int j, int[][] dp) {\n        if (i > j) return 0;           // Invalid range\n        if (i == j) return 1;           // Single character palindrome\n\n        if (dp[i][j] != -1) return dp[i][j];\n\n        if (s.charAt(i) == s.charAt(j)) {\n            // Both ends match: include them + solve inner substring\n            dp[i][j] = 2 + helper(s, i + 1, j - 1, dp);\n        } else {\n            // Ends don't match: try excluding one end at a time\n            dp[i][j] = Math.max(helper(s, i + 1, j, dp), helper(s, i, j - 1, dp));\n        }\n\n        return dp[i][j];\n    }\n\n\n    public static int recursive(String s) {\n        int[][] dp = new int[s.length()][s.length()];\n        for (int[] row : dp) Arrays.fill(row, -1);\n\n        return helper(s, 0, s.length() - 1, dp);\n    }\n\n    /**\n     * Bottom-up: fill diagonally from single chars toward full string\n     *\n     * Example: s = \"cbbd\" -> 2 (LPS = \"bb\")\n     *\n     * dp[i][j] = length of longest palindromic subsequence in s[i..j]\n     *\n     *          c    b    b    d\n     *     c  [ 1,   1,   2,   2 ]   <- dp[0][3] = 2 (answer)\n     *     b  [ -,   1,   2,   2 ]   dp[1][2]: b==b \u2192 2+0=2\n     *     b  [ -,   -,   1,   1 ]   dp[2][3]: b\u2260d \u2192 max(1,1)=1\n     *     d  [ -,   -,   -,   1 ]   <- base: single chars = 1\n     *\n     * '-' = unused (i > j)\n     *\n     * Trace for dp[0][3] (s=\"cbbd\"):\n     *   s[0]='c' != s[3]='d' \u2192 max(dp[1][3], dp[0][2]) = max(2, 2) = 2\n     */\n    public static int iterative(String s) {\n        int n = s.length();\n\n        int[][] dp = new int[n][n];\n\n        // Base case: every single character is a palindrome of length 1\n        for (int i = 0; i < n; i++) dp[i][i] = 1;\n\n        // Fill column by column; for each j, process all i < j (bottom-up)\n        for (int j = 0; j < n; j++) {\n            for (int i = j - 1; i >= 0; i--) {\n                if (s.charAt(i) == s.charAt(j)) {\n                    dp[i][j] = 2 + dp[i + 1][j - 1];\n                } else {\n                    dp[i][j] = Math.max(dp[i + 1][j], dp[i][j - 1]);\n                }\n            }\n        }\n\n        return dp[0][n - 1];\n    }\n\n\n    public static int longestPalindromeSubseq(String s) {\n        return recursive(s);\n    }\n\n\n    public static void main(String[] args) {\n        String s = \"cbbd\";\n        System.out.println(iterative(s));\n    }\n\n\n}\n"}, {"name": "LongestPalindromicSubstring", "subcat": "string", "link": "", "code": "package leetcode.dp.string;\n\n/**\n * 5. Longest Palindromic Substring\n * https://leetcode.com/problems/longest-palindromic-substring/\n *\n * Given a string s, return the longest palindromic substring in s.\n *\n * Example 1: Input: s = \"babad\" -> Output: \"bab\" (or \"aba\")\n * Example 2: Input: s = \"cbbd\"  -> Output: \"bb\"\n *\n * Constraints:\n *   1 <= s.length <= 1000\n *   s consist of only digits and English letters.\n *\n * ---\n * Approach: 2D DP\n *\n * dp[j][i] = true if s[j..i] is a palindrome.\n * A substring s[j..i] is a palindrome if:\n *   1. s[j] == s[i], AND\n *   2. The inner substring is a palindrome (i-j <= 2 OR dp[j+1][i-1])\n *\n * Track the longest palindrome found during the fill.\n *\n * Time:  O(n^2)\n * Space: O(n^2)\n */\npublic class LongestPalindromicSubstring {\n\n    /**\n     * Bottom-up iterative DP\n     *\n     * Example: s = \"babad\" -> \"bab\"\n     *\n     * dp[j][i] = true if substring s[j..i] is a palindrome\n     *\n     *          b     a     b     a     d\n     *     b  [ T,    F,    T,    F,    F ]\n     *     a  [ -,    T,    F,    T,    F ]\n     *     b  [ -,    -,    T,    F,    F ]\n     *     a  [ -,    -,    -,    T,    F ]\n     *     d  [ -,    -,    -,    -,    T ]\n     *\n     * '-' = below diagonal (j > i), not used\n     *\n     * Trace for dp[0][2] (s[0..2] = \"bab\"):\n     *   s[0]='b' == s[2]='b', i-j=2 <= 2 \u2192 T (palindrome!)\n     *   length 3 > current best \u2192 result = \"bab\"\n     *\n     * Trace for dp[1][3] (s[1..3] = \"aba\"):\n     *   s[1]='a' == s[3]='a', i-j=2 <= 2 \u2192 T\n     *   length 3 = current best \u2192 no update\n     */\n    public static String iterative(String s) {\n        String result = \"\";\n        boolean[][] dp = new boolean[s.length()][s.length()];\n\n        // Base case: every single character is a palindrome\n        for (int i = 0; i < s.length(); i++) {\n            dp[i][i] = true;\n        }\n\n        for (int i = 0; i < s.length(); i++) {\n            for (int j = 0; j <= i; j++) {\n                // s[j..i] is palindrome if ends match AND inner part is valid\n                // (i-j <= 2 handles length 2 and 3 substrings directly)\n                if (s.charAt(i) == s.charAt(j) && (i - j <= 2 || dp[j + 1][i - 1])) {\n                    dp[j][i] = true;\n\n                    // Update result if this palindrome is longer\n                    if (i - j + 1 > result.length()) {\n                        result = s.substring(j, Math.min(i + 1, s.length()));\n                    }\n                }\n            }\n        }\n\n        return result;\n    }\n\n\n    static String longestPalindrome(String s) {\n        return iterative(s);\n    }\n\n    public static void main(String[] args) {\n        String s = \"babad\";\n        System.out.println(longestPalindrome(s));\n    }\n\n}\n"}, {"name": "RegularExpressionMatching", "subcat": "string", "link": "", "code": "package leetcode.dp.string;\n\n/**\n * 10. Regular Expression Matching\n * https://leetcode.com/problems/regular-expression-matching/\n *\n * Given an input string s and a pattern p, implement regular expression matching\n * with support for '.' and '*' where:\n *   '.' Matches any single character.\n *   '*' Matches zero or more of the preceding element.\n *\n * The matching should cover the ENTIRE input string (not partial).\n *\n * Example 1: s = \"aa\", p = \"a\"   -> false\n * Example 2: s = \"aa\", p = \"a*\"  -> true  (a* means zero or more 'a')\n * Example 3: s = \"ab\", p = \".*\"  -> true  (.* means zero or more of any char)\n *\n * Constraints:\n *   1 <= s.length <= 20\n *   1 <= p.length <= 20\n *   s contains only lowercase English letters.\n *   p contains only lowercase English letters, '.', and '*'.\n *   Each '*' has a previous valid character to repeat.\n *\n * ---\n * Approach: 2D DP\n *\n * STATE:  dp[i][j] = does s[0..i-1] match p[0..j-1]?\n * BASE:   dp[0][0] = true (empty string matches empty pattern)\n *         dp[0][j] = true if p[j-1]=='*' and dp[0][j-2] (pattern like a*b*c* can match \"\")\n * TRANSITION:\n *   If p[j-1] == s[i-1] or p[j-1] == '.':\n *     dp[i][j] = dp[i-1][j-1]   (characters match, move both pointers)\n *   If p[j-1] == '*':\n *     dp[i][j] = dp[i][j-2]     (use * as zero occurrences, skip X* pair)\n *          OR   dp[i-1][j]       (if p[j-2] matches s[i-1], use * for one more)\n *\n * KEY DIFFERENCE from Wildcard Matching (LC 44):\n *   - In Wildcard, '*' matches any sequence independently\n *   - Here, '*' modifies the PRECEDING character (X* = zero or more X)\n *   - So we always look at p[j-2] when handling '*'\n *\n * DP Matrix trace: s = \"aab\", p = \"c*a*b\"\n *\n *          \"\"    c     *     a     *     b\n *    \"\"  [ T,    F,    T,    F,    T,    F ]\n *     a  [ F,    F,    F,    T,    T,    F ]\n *     a  [ F,    F,    F,    F,    T,    F ]\n *     b  [ F,    F,    F,    F,    F,    T ]\n *\n *   dp[0][2]: p[1]='*', dp[0][0]=T -> T (c* matches \"\")\n *   dp[0][4]: p[3]='*', dp[0][2]=T -> T (c*a* matches \"\")\n *   dp[1][3]: p[2]='a' == s[0]='a', dp[0][2]=T -> T\n *   dp[1][4]: p[3]='*', dp[1][2]=F (zero a) OR (p[2]='a'==s[0]='a', dp[0][4]=T) -> T\n *   dp[2][4]: p[3]='*', dp[2][2]=F OR (p[2]='a'==s[1]='a', dp[1][4]=T) -> T\n *   dp[3][5]: p[4]='b'==s[2]='b', dp[2][4]=T -> T  \u2713\n *\n * ANSWER: dp[m][n]\n *\n * Time:  O(m * n) where m = s.length(), n = p.length()\n * Space: O(m * n)\n */\npublic class RegularExpressionMatching {\n\n    // -------------------- Recursive + Memoization --------------------\n    public static boolean isMatchRecursive(String s, String p) {\n        Boolean[][] memo = new Boolean[s.length() + 1][p.length() + 1];\n        return solve(s, p, 0, 0, memo);\n    }\n\n    private static boolean solve(String s, String p, int i, int j, Boolean[][] memo) {\n        // Base case: pattern exhausted\n        if (j == p.length()) return i == s.length();\n\n        if (memo[i][j] != null) return memo[i][j];\n\n        // Check if current characters match\n        boolean firstMatch = (i < s.length()) &&\n                             (s.charAt(i) == p.charAt(j) || p.charAt(j) == '.');\n\n        boolean result;\n        if (j + 1 < p.length() && p.charAt(j + 1) == '*') {\n            // Two choices for X*:\n            // 1. Skip X* entirely (zero occurrences) -> advance pattern by 2\n            // 2. If first char matches, consume one char from s, keep pattern (more occurrences)\n            result = solve(s, p, i, j + 2, memo) ||             // zero occurrences\n                     (firstMatch && solve(s, p, i + 1, j, memo)); // one+ occurrences\n        } else {\n            // No star ahead: must match current character and advance both\n            result = firstMatch && solve(s, p, i + 1, j + 1, memo);\n        }\n\n        memo[i][j] = result;\n        return result;\n    }\n\n    // -------------------- Iterative (Bottom-Up) --------------------\n    public static boolean isMatch(String s, String p) {\n        int m = s.length();\n        int n = p.length();\n        boolean[][] dp = new boolean[m + 1][n + 1];\n\n        // Empty string matches empty pattern\n        dp[0][0] = true;\n\n        // Fill first row: patterns like a*, a*b*, a*b*c* can match \"\"\n        for (int j = 1; j <= n; j++) {\n            if (p.charAt(j - 1) == '*') {\n                dp[0][j] = dp[0][j - 2]; // X* matches zero X's\n            }\n        }\n\n        for (int i = 1; i <= m; i++) {\n            for (int j = 1; j <= n; j++) {\n                char sc = s.charAt(i - 1); // Current char in s\n                char pc = p.charAt(j - 1); // Current char in p\n\n                if (pc == '.' || pc == sc) {\n                    // Characters match: inherit diagonal\n                    dp[i][j] = dp[i - 1][j - 1];\n                } else if (pc == '*') {\n                    // Star: always try zero occurrences first\n                    dp[i][j] = dp[i][j - 2]; // Zero occurrences of p[j-2]\n\n                    // If the preceding pattern char matches s[i-1], try one more occurrence\n                    char preceding = p.charAt(j - 2);\n                    if (preceding == '.' || preceding == sc) {\n                        dp[i][j] = dp[i][j] || dp[i - 1][j];\n                        // dp[i-1][j] means: s up to i-1 already matched with same pattern,\n                        // so we can extend by consuming one more character\n                    }\n                }\n                // else: mismatch, dp[i][j] stays false\n            }\n        }\n\n        return dp[m][n];\n    }\n\n    public static void main(String[] args) {\n        System.out.println(isMatch(\"aa\", \"a\"));       // false\n        System.out.println(isMatch(\"aa\", \"a*\"));      // true\n        System.out.println(isMatch(\"ab\", \".*\"));      // true\n        System.out.println(isMatch(\"aab\", \"c*a*b\"));  // true\n        System.out.println(isMatch(\"mississippi\", \"mis*is*p*.\")); // false\n\n        System.out.println(\"--- Recursive ---\");\n        System.out.println(isMatchRecursive(\"aab\", \"c*a*b\"));  // true\n        System.out.println(isMatchRecursive(\"ab\", \".*\"));       // true\n    }\n}\n"}, {"name": "WildcardMatching", "subcat": "string", "link": "", "code": "package leetcode.dp.string;\n\nimport java.util.Arrays;\n\n/**\n * 44. Wildcard Matching\n * https://leetcode.com/problems/wildcard-matching/\n *\n * Given an input string s and a pattern p, implement wildcard pattern matching\n * with support for '?' and '*' where:\n *   '?' matches any single character.\n *   '*' matches any sequence of characters (including the empty sequence).\n * The matching should cover the entire input string.\n *\n * Example 1: Input: s = \"aa\", p = \"a\"   -> Output: false\n * Example 2: Input: s = \"aa\", p = \"*\"   -> Output: true\n * Example 3: Input: s = \"cb\", p = \"?a\"  -> Output: false\n *\n * Constraints:\n *   0 <= s.length, p.length <= 2000\n *   s contains only lowercase English letters.\n *   p contains only lowercase English letters, '?' or '*'.\n *\n * ---\n * Approach: 2D DP (top-down + bottom-up)\n *\n * STATE:      dp[i][j] = true if s[0..i-1] matches p[0..j-1]\n * BASE:       dp[0][0] = true; dp[0][j] = true if p[0..j-1] are all '*'\n * TRANSITION: If p[j-1] == s[i-1] or '?': dp[i][j] = dp[i-1][j-1]\n *             If p[j-1] == '*': dp[i][j] = dp[i-1][j] || dp[i][j-1]\n *               (match 1+ chars OR match empty)\n *\n * Time:  O(m * n)\n * Space: O(m * n)\n */\npublic class WildcardMatching {\n\n    private static boolean helper(String s, String p, int i, int j, int[][] dp) {\n        // If the pattern is exhausted, check if the string is also exhausted\n        if (j == p.length()) {\n            return i == s.length();\n        }\n\n        // If the string is exhausted but the pattern is not\n        if (i == s.length()) {\n            // All remaining characters in the pattern must be '*'\n            for (int k = j; k < p.length(); k++) {\n                if (p.charAt(k) != '*') {\n                    return false;\n                }\n            }\n            return true;\n        }\n\n        // Check if the result is already computed\n        if (dp[i][j] != -1) {\n            return dp[i][j] == 1;\n        }\n\n        // If the characters match or the pattern has '?', move both pointers\n        if (p.charAt(j) == s.charAt(i) || p.charAt(j) == '?') {\n            dp[i][j] = helper(s, p, i + 1, j + 1, dp) ? 1 : 0;\n        }\n        // If the pattern has a '*' character\n        else if (p.charAt(j) == '*') {\n            // Try two cases:\n            // 1. '*' matches zero characters (skip the '*' in a pattern).\n            // 2. '*' matches one or more characters (move to the next character in s).\n            dp[i][j] = (helper(s, p, i + 1, j, dp) || helper(s, p, i, j + 1, dp)) ? 1 : 0;\n        } else {\n            dp[i][j] = 0; // Characters do not match and no special wildcard\n        }\n\n        return dp[i][j] == 1;\n    }\n\n\n    public static boolean recursive(String s, String p) {\n        int m = s.length();\n        int n = p.length();\n        int[][] dp = new int[m + 1][n + 1];\n\n        for (int[] row : dp) {\n            Arrays.fill(row, -1);\n        }\n\n        return helper(s, p, 0, 0, dp);\n    }\n\n\n    /**\n     * Bottom-up iterative DP\n     *\n     * Example: s = \"abc\", p = \"a*c\" -> true\n     *\n     * dp[i][j] = true if s[0..i-1] matches p[0..j-1]\n     *\n     *          \"\"    a     *     c\n     *     \"\"  [ T,   F,    F,    F ]   <- base: empty s vs pattern\n     *     a   [ F,   T,    T,    F ]   'a'=='a' \u2192 T; '*' \u2192 dp[0][2]||dp[1][1] = T\n     *     b   [ F,   F,    T,    F ]   '*' \u2192 dp[1][2]||dp[2][1] = T (absorbs 'b')\n     *     c   [ F,   F,    T,    T ]   <- answer: dp[3][3] = T\n     *\n     * Trace for dp[3][3] (s=\"abc\", p=\"a*c\"):\n     *   p[2]='c' == s[2]='c' \u2192 dp[2][2] = T\n     *\n     * Trace for dp[2][2] (s=\"ab\", p=\"a*\"):\n     *   p[1]='*' \u2192 dp[1][2] || dp[2][1] = T || F = T\n     *   ('*' matches \"b\" by extending: dp[1][2] means '*' already matched, absorb one more char)\n     */\n    public static boolean iterative(String s, String p) {\n        int m = s.length();\n        int n = p.length();\n        boolean[][] dp = new boolean[m + 1][n + 1];\n\n        // Empty pattern matches empty string\n        dp[0][0] = true;\n\n        // Fill in the first row (when string is empty but the pattern is not)\n        for (int j = 1; j <= n; j++) {\n            if (p.charAt(j - 1) == '*') {\n                dp[0][j] = dp[0][j - 1]; // '*' can match an empty sequence\n            }\n        }\n\n        // Fill the DP table\n        for (int i = 1; i <= m; i++) {\n            for (int j = 1; j <= n; j++) {\n                if (p.charAt(j - 1) == s.charAt(i - 1) || p.charAt(j - 1) == '?') {\n                    dp[i][j] = dp[i - 1][j - 1]; // Match the current characters\n                } else if (p.charAt(j - 1) == '*') {\n                    dp[i][j] = dp[i - 1][j] || dp[i][j - 1]; // '*' matches zero or more characters\n                }\n            }\n        }\n\n        return dp[m][n];\n    }\n\n\n    public static boolean isMatch(String s, String p) {\n        return recursive(s, p);\n    }\n\n\n    public static void main(String[] args) {\n        System.out.println(iterative(\"abc\", \"a*b*\"));\n    }\n\n}\n"}, {"name": "HouseRobber3", "subcat": "trees", "link": "", "code": "package leetcode.dp.trees;\n\nimport java.util.HashMap;\nimport java.util.Map;\n\n/**\n * 337. House Robber III\n * https://leetcode.com/problems/house-robber-iii/\n *\n * The thief has found a new place to rob. The houses form a binary tree.\n * The thief cannot rob two directly linked houses (parent-child).\n * Return the maximum amount of money the thief can rob.\n *\n * Example 1:\n *       3\n *      / \\\n *     2   3\n *      \\   \\\n *       3   1\n *   Output: 7  (3 + 3 + 1 = 7, rob root + grandchildren)\n *\n * Example 2:\n *       3\n *      / \\\n *     4   5\n *    / \\   \\\n *   1   3   1\n *   Output: 9  (4 + 5 = 9, rob the two children)\n *\n * Constraints:\n *   The number of nodes is in the range [1, 10^4].\n *   0 <= Node.val <= 10^4\n *\n * ---\n * Approach: Tree DP (post-order DFS)\n *\n * For each node, return a pair [robThis, skipThis]:\n *   robThis:  max money if we ROB this node (can't rob children)\n *   skipThis: max money if we SKIP this node (children free to be robbed or not)\n *\n * TRANSITION:\n *   robThis  = node.val + left[skipThis] + right[skipThis]\n *   skipThis = max(left[robThis], left[skipThis]) + max(right[robThis], right[skipThis])\n *\n * ANSWER: max(root[robThis], root[skipThis])\n *\n * Time:  O(n) \u2014 visit each node once\n * Space: O(h) \u2014 recursion stack, h = tree height\n */\npublic class HouseRobber3 {\n\n    // Simple TreeNode definition for this problem\n    static class TreeNode {\n        int val;\n        TreeNode left;\n        TreeNode right;\n\n        TreeNode(int val) {\n            this.val = val;\n        }\n    }\n\n    /**\n     * Optimal approach: return int[2] = {robThis, skipThis} for each node.\n     * No extra hash map needed.\n     */\n    public static int rob(TreeNode root) {\n        int[] result = dfs(root);\n        return Math.max(result[0], result[1]);\n    }\n\n    /**\n     * Post-order DFS: returns [robThisNode, skipThisNode]\n     */\n    private static int[] dfs(TreeNode node) {\n        if (node == null) return new int[]{0, 0};\n\n        int[] left = dfs(node.left);\n        int[] right = dfs(node.right);\n\n        // Rob this node: can't rob children, take their skip values\n        int robThis = node.val + left[1] + right[1];\n\n        // Skip this node: each child can be robbed or skipped (take max of each)\n        int skipThis = Math.max(left[0], left[1]) + Math.max(right[0], right[1]);\n\n        return new int[]{robThis, skipThis};\n    }\n\n    /**\n     * Alternative: HashMap memoization (less optimal but intuitive)\n     *\n     * rob(node) = max money we can get from the subtree rooted at node.\n     * Two choices:\n     *   1. Rob node: node.val + rob(grandchildren)\n     *   2. Skip node: rob(left child) + rob(right child)\n     */\n    public static int robMemo(TreeNode root) {\n        return robHelper(root, new HashMap<>());\n    }\n\n    private static int robHelper(TreeNode node, Map<TreeNode, Integer> memo) {\n        if (node == null) return 0;\n        if (memo.containsKey(node)) return memo.get(node);\n\n        // Choice 1: Rob this node + skip children + rob grandchildren\n        int robThis = node.val;\n        if (node.left != null) {\n            robThis += robHelper(node.left.left, memo) + robHelper(node.left.right, memo);\n        }\n        if (node.right != null) {\n            robThis += robHelper(node.right.left, memo) + robHelper(node.right.right, memo);\n        }\n\n        // Choice 2: Skip this node, rob children\n        int skipThis = robHelper(node.left, memo) + robHelper(node.right, memo);\n\n        int result = Math.max(robThis, skipThis);\n        memo.put(node, result);\n        return result;\n    }\n\n    public static void main(String[] args) {\n        // Example 1:     3\n        //               / \\\n        //              2   3\n        //               \\   \\\n        //                3   1\n        TreeNode root1 = new TreeNode(3);\n        root1.left = new TreeNode(2);\n        root1.right = new TreeNode(3);\n        root1.left.right = new TreeNode(3);\n        root1.right.right = new TreeNode(1);\n        System.out.println(\"Example 1 (pair):  \" + rob(root1));     // 7\n        System.out.println(\"Example 1 (memo):  \" + robMemo(root1)); // 7\n\n        // Example 2:     3\n        //               / \\\n        //              4   5\n        //             / \\   \\\n        //            1   3   1\n        TreeNode root2 = new TreeNode(3);\n        root2.left = new TreeNode(4);\n        root2.right = new TreeNode(5);\n        root2.left.left = new TreeNode(1);\n        root2.left.right = new TreeNode(3);\n        root2.right.right = new TreeNode(1);\n        System.out.println(\"Example 2 (pair):  \" + rob(root2));     // 9\n        System.out.println(\"Example 2 (memo):  \" + robMemo(root2)); // 9\n    }\n}\n"}, {"name": "MaxGoodSubtreeScore", "subcat": "trees", "link": "", "code": "package leetcode.dp.trees;\n\nimport java.util.*;\n\n/**\n * 3531. Maximum Good Subtree Score\n * https://leetcode.com/problems/maximum-good-subtree-score/\n *\n * You are given an undirected tree rooted at node 0 with n nodes numbered\n * from 0 to n - 1; vals[i] is the value of the i-th node, and par[i] is\n * the parent of the i-th node (par[0] == -1 for the root).\n *\n * A subtree of node i is \"good\" if every digit (0-9) that appears in the\n * values of nodes in the subtree appears at most once. Return the maximum\n * sum of values in any good subtree. Since the answer may be large, return\n * it modulo 10^9 + 7.\n *\n * Constraints:\n *   1 <= n <= 10^4\n *   1 <= vals[i] <= 10^9\n *\n * ---\n * Approach: Tree DP with bitmask (digits 0-9 as 10-bit mask)\n *\n * Each digit 0-9 is mapped to a bit (10 bits total, 2^10 = 1024 states).\n * For a node's value, compute which digits appear and how many times.\n * If any digit repeats, that node alone is invalid (mask = -1).\n *\n * dp[mask] at each node = maximum sum achievable by selecting a subset of\n * nodes (from the subtree rooted at this node) whose combined digit-mask\n * is exactly `mask`. We merge children one by one using a knapsack-like\n * combination of non-overlapping masks.\n *\n * After processing all nodes, the answer is max(dp[mask]) at any node\n * for any mask, taken modulo 10^9 + 7.\n *\n * Time:  O(n * 3^10) \u2014 for each node, merging masks with each child is O(3^10)\n *        because we iterate over all pairs of submasks that don't overlap.\n * Space: O(n * 2^10) for storing dp at each node, simplified to O(2^10) per DFS frame.\n */\npublic class MaxGoodSubtreeScore {\n\n    static final int MOD = 1_000_000_007;\n    static final int FULL = 1 << 10; // 1024 states for 10 digits\n\n    public int goodSubtreeSum(int[] vals, int[] par) {\n        int n = vals.length;\n\n        // Build adjacency list (children only, since it's a rooted tree)\n        List<List<Integer>> children = new ArrayList<>();\n        for (int i = 0; i < n; i++) {\n            children.add(new ArrayList<>());\n        }\n        for (int i = 1; i < n; i++) {\n            children.get(par[i]).add(i);\n        }\n\n        // Precompute the digit bitmask for each node's value.\n        // digitMask[i] = bitmask of digits in vals[i], or -1 if any digit repeats.\n        int[] digitMask = new int[n];\n        for (int i = 0; i < n; i++) {\n            digitMask[i] = computeDigitMask(vals[i]);\n        }\n\n        // DFS iteratively (to avoid stack overflow on large trees)\n        // dp[node][mask] = max sum of a \"good\" subset from node's subtree with digit-mask = mask\n        // We use long to avoid overflow before taking mod at the end.\n        // -1 means this mask state is unreachable.\n        long[][] dp = new long[n][FULL];\n        for (long[] row : dp) Arrays.fill(row, -1);\n\n        // Topological order via iterative DFS (post-order)\n        int[] order = new int[n];\n        int idx = 0;\n        Deque<Integer> stack = new ArrayDeque<>();\n        stack.push(0);\n        while (!stack.isEmpty()) {\n            int node = stack.pop();\n            order[idx++] = node;\n            for (int child : children.get(node)) {\n                stack.push(child);\n            }\n        }\n\n        // Process nodes in reverse order (leaves first, root last)\n        for (int i = n - 1; i >= 0; i--) {\n            int node = order[i];\n\n            // Base case: the empty subset (select no nodes) has sum 0 and mask 0\n            dp[node][0] = 0;\n\n            // If this node's value has no repeated digits, we can select it alone\n            if (digitMask[node] != -1) {\n                dp[node][digitMask[node]] = vals[node];\n            }\n\n            // Merge each child's dp into this node's dp (knapsack-style)\n            for (int child : children.get(node)) {\n                // We need to merge dp[node] with dp[child].\n                // To avoid using a child's result twice, iterate over current dp[node]\n                // and combine with dp[child] where masks don't overlap.\n\n                // Take a snapshot of current dp[node] to avoid mid-iteration mutation issues\n                long[] snapshot = dp[node].clone();\n\n                // For each reachable mask in the child\n                for (int cmask = 0; cmask < FULL; cmask++) {\n                    if (dp[child][cmask] < 0) continue; // unreachable in child\n\n                    // Combine with each reachable mask in current node's dp\n                    // that doesn't overlap with cmask.\n                    // Iterate over submasks of the complement of cmask.\n                    int complement = (FULL - 1) ^ cmask;\n                    for (int pmask = complement; pmask >= 0; pmask = (pmask - 1) & complement) {\n                        if (snapshot[pmask] >= 0) {\n                            int combined = pmask | cmask;\n                            dp[node][combined] = Math.max(dp[node][combined],\n                                    snapshot[pmask] + dp[child][cmask]);\n                        }\n                        if (pmask == 0) break; // important: avoid infinite loop when pmask wraps\n                    }\n                }\n            }\n        }\n\n        // The answer is the max across ALL nodes' subtrees, for any non-zero mask.\n        // Each node is the root of its own subtree, so check dp[every node].\n        long ans = 0;\n        for (int node = 0; node < n; node++) {\n            for (int mask = 1; mask < FULL; mask++) {\n                if (dp[node][mask] > ans) {\n                    ans = dp[node][mask];\n                }\n            }\n        }\n\n        return (int) (ans % MOD);\n    }\n\n    /**\n     * Computes the digit bitmask for a number.\n     * Returns a bitmask where bit i is set if digit i appears in the number.\n     * Returns -1 if any digit appears more than once (invalid for a \"good\" subtree).\n     */\n    private int computeDigitMask(int num) {\n        int mask = 0;\n        while (num > 0) {\n            int digit = num % 10;\n            int bit = 1 << digit;\n            if ((mask & bit) != 0) {\n                return -1; // Repeated digit\n            }\n            mask |= bit;\n            num /= 10;\n        }\n        return mask;\n    }\n\n    public static void main(String[] args) {\n        MaxGoodSubtreeScore solver = new MaxGoodSubtreeScore();\n\n        // Test Case 1: vals = [2,3], par = [-1,0]\n        // Node 0 (val=2), Node 1 (val=3, child of 0)\n        // Best good subtree: {0,1} with sum = 5, digits {2,3} no repeats\n        int[] vals1 = {2, 3};\n        int[] par1 = {-1, 0};\n        System.out.println(\"Test 1: \" + solver.goodSubtreeSum(vals1, par1)); // Expected: 5\n\n        // Test Case 2: vals = [1,5,2], par = [-1,0,0]\n        // Tree: 0 -> {1, 2}. vals = {1, 5, 2}\n        // All digit masks: 1->{1}, 5->{5}, 2->{2}. No overlaps.\n        // Best: pick all 3 nodes, sum = 8\n        int[] vals2 = {1, 5, 2};\n        int[] par2 = {-1, 0, 0};\n        System.out.println(\"Test 2: \" + solver.goodSubtreeSum(vals2, par2)); // Expected: 8\n\n        // Test Case 3: vals = [11,22,33], par = [-1,0,0]\n        // All nodes have repeated digits (11->digit 1 twice, etc.)\n        // No single node is valid, so answer = 0\n        int[] vals3 = {11, 22, 33};\n        int[] par3 = {-1, 0, 0};\n        System.out.println(\"Test 3: \" + solver.goodSubtreeSum(vals3, par3)); // Expected: 0\n    }\n}\n"}], "Graph": [{"name": "GraphValidTree_261", "subcat": "", "link": "", "code": "package leetcode.graph;\n\n/**\n * 261. Graph Valid Tree\n * https://leetcode.com/problems/graph-valid-tree/\n *\n * Given n nodes labeled from 0 to n-1 and a list of undirected edges\n * (each edge is a pair of nodes), write a function to check whether\n * these edges make up a valid tree.\n *\n * A valid tree must satisfy:\n *   1. No cycles\n *   2. All nodes are connected (exactly one connected component)\n *   => Equivalently: n nodes and exactly n-1 edges with no cycle.\n *\n * Example 1:\n *   Input: n = 5, edges = [[0,1],[0,2],[0,3],[1,4]]\n *   Output: true\n *\n * Example 2:\n *   Input: n = 5, edges = [[0,1],[1,2],[2,3],[1,3],[1,4]]\n *   Output: false (cycle between 1-2-3)\n *\n * Constraints:\n *   1 <= n <= 2000\n *   0 <= edges.length <= 5000\n *   edges[i].length == 2\n *   No duplicate edges.\n *\n * ---\n * Approach: Union-Find\n *\n * For each edge, union the two nodes:\n *   - If they already share the same root -> cycle detected -> not a tree.\n *   - After processing all edges, also need edges.length == n-1 for connectivity.\n *\n * Time:  O(E * \u03b1(N)) \u2248 O(E) with path compression + union by rank\n * Space: O(N)\n */\npublic class GraphValidTree_261 {\n\n    private static class unionFind {\n        private int[] parent;\n        private int[] rank;\n\n        /**\n         * Initialize the Union Set\n         *\n         * @param n number of vertices\n         */\n        private void initializeUnionSet(int n) {\n            parent = new int[n + 1];\n            rank = new int[n + 1];\n            for (int i = 0; i <= n; i++) {\n                parent[i] = i;\n                rank[i] = 0;\n            }\n        }\n\n        /**\n         * Find the root of the set\n         *\n         * @param x vertex\n         * @return root of the set\n         */\n        private int find(int x) {\n            if (parent[x] != x) {\n                parent[x] = find(parent[x]);\n            }\n            return parent[x];\n        }\n\n        /**\n         * Union the two sets\n         *\n         * @param x vertex\n         * @param y vertex\n         * @return true if union is successful, false otherwise\n         */\n        private boolean union(int x, int y) {\n            int rootX = find(x);\n            int rootY = find(y);\n\n            if (rootX == rootY) return false;\n\n            if (rank[rootX] < rank[rootY]) {\n                parent[rootX] = rootY;\n                rank[rootY]++;\n            } else {\n                parent[rootY] = rootX;\n                rank[rootX]++;\n            }\n\n            return true;\n        }\n    }\n\n    /**\n     * Given n nodes labeled from 0 to n - 1 and a list of undirected edges (each edge is a pair of nodes),\n     * write a function to check whether these edges make up a valid tree.\n     *\n     * @param n     number of nodes\n     * @param edges list of edges\n     * @return true if the edges make up a valid tree, false otherwise\n     */\n    public static boolean validTree(int n, int[][] edges) {\n       unionFind uf = new unionFind();\n       uf.initializeUnionSet(n);\n       for (int[] edge : edges) {\n           if (!uf.union(edge[0], edge[1])) {\n                return false;\n           }\n       }\n       return true;\n    }\n\n\n    public static void main(String[] args){\n        int n = 5;\n        int[][] edges = new int[][] {{0, 1}, {0, 2}, {0, 3}, {1, 4}};\n        System.out.println(validTree(n, edges)); // true\n        edges = new int[][]{ {0, 1},  {1, 2},  {2, 3},  {1, 3},  {1, 4}};\n        System.out.println(validTree(n, edges));// false\n    }\n\n}\n"}, {"name": "BellmanFord", "subcat": "algo", "link": "", "code": "package leetcode.graph.algo;\n\n\nimport java.util.ArrayList;\nimport java.util.Arrays;\nimport java.util.List;\n\n/**\n * Bellman-Ford Algorithm \u2014 Single-Source Shortest Path\n *\n * PROBLEM IT SOLVES:\n *   Given a weighted directed graph and a source vertex, find the shortest\n *   distance from the source to every other vertex. Unlike Dijkstra, it\n *   handles NEGATIVE edge weights and can DETECT negative-weight cycles.\n *\n * WHEN TO USE:\n *   - Graph has negative edge weights (Dijkstra fails here).\n *   - You need to detect negative-weight cycles.\n *   - Problems like \"Cheapest Flights Within K Stops\" (LC 787).\n *\n * ALGORITHM STEPS:\n *   Step 1: Initialize dist[] array \u2014 set source to 0, everything else to INF.\n *   Step 2: Relax ALL edges (V - 1) times.\n *           - Why V-1? The shortest path between any two vertices has at most V-1 edges.\n *           - In each iteration, at least one vertex gets its correct shortest distance.\n *           - Relaxation: if dist[u] + weight(u,v) < dist[v], update dist[v].\n *   Step 3: Do one MORE pass over all edges (the Vth pass).\n *           - If any distance still decreases, a negative-weight cycle exists.\n *           - Because in a cycle-free graph, V-1 passes are always enough.\n *\n * TIME:  O(V * E) \u2014 V-1 passes, each scanning all E edges.\n * SPACE: O(V)     \u2014 for the dist[] array.\n *\n * COMPARISON:\n *   Dijkstra:      O((V+E) log V), no negative weights, greedy.\n *   Bellman-Ford:   O(V * E),       handles negatives, detects cycles.\n *   Floyd-Warshall: O(V^3),         all-pairs shortest path.\n */\npublic class BellmanFord {\n\n    public List<Edge> graph;\n    public int V;\n\n    public BellmanFord(int v) {\n        graph = new ArrayList<>(v);\n        V = v;\n    }\n\n    public void addEdge(int s, int d, int w) {\n        graph.add(new Edge(s, d, w));\n    }\n\n    //1. Directed Weighted Edge\n    public static class Edge {\n        public int src, dest, weight;\n\n        public Edge(int s, int d, int w) {\n            src = s;\n            dest = d;\n            weight = w;\n        }\n    }\n\n    public int[] bellmanFord(int source) {\n        // Step 1: Initialize distances \u2014 source is 0, everything else is \"infinity\".\n        int[] dist = new int[V];\n        Arrays.fill(dist, Integer.MAX_VALUE);\n        dist[source] = 0;\n\n        // Step 2: Relax ALL edges, repeated (V - 1) times.\n        //   Why V-1? In a graph with V vertices, the longest shortest path\n        //   (without cycles) can have at most V-1 edges.\n        //   Each iteration guarantees at least one more vertex gets its final distance.\n        //\n        //   Relaxation: if going through edge (u -> v) gives a shorter path\n        //   than what we currently know for v, update it.\n        for (int i = 0; i < V - 1; i++) {\n            for (Edge edge : graph) {\n                if (dist[edge.src] != Integer.MAX_VALUE && dist[edge.dest] > dist[edge.src] + edge.weight) {\n                    dist[edge.dest] = dist[edge.src] + edge.weight;\n                }\n            }\n        }\n\n        // Step 3: Negative cycle detection (the Vth pass).\n        //   If we can STILL relax an edge after V-1 passes, it means\n        //   distances keep decreasing infinitely \u2014 a negative cycle exists.\n        for (Edge edge : graph) {\n            if (dist[edge.src] != Integer.MAX_VALUE && dist[edge.dest] > dist[edge.src] + edge.weight) {\n                throw new IllegalStateException(\"Negative Weight Cycle Exist\");\n            }\n        }\n\n        return dist;\n    }\n\n    public static void main(String[] args) {\n        int V = 5;\n        BellmanFord bellmanFord = new BellmanFord(V);\n\n        // Sample Graph\n        bellmanFord.addEdge(0, 1, 6);\n        bellmanFord.addEdge(0, 4, 7);\n        bellmanFord.addEdge(1, 2, 5);\n        bellmanFord.addEdge(1, 3, -4);\n        bellmanFord.addEdge(1, 4, 8);\n        bellmanFord.addEdge(2, 3, -2);\n        bellmanFord.addEdge(3, 2, 7);\n        bellmanFord.addEdge(4, 2, -3);\n        bellmanFord.addEdge(4, 3, 9);\n\n        int[] dist = bellmanFord.bellmanFord(0);\n        for (int i = 0; i < V; i++) {\n            System.out.println(\"Distance from 0 to \" + i + \" is \" + dist[i]);\n        }\n    }\n\n\n}\n"}, {"name": "Dijkstra", "subcat": "algo", "link": "", "code": "package leetcode.graph.algo;\n\nimport java.util.ArrayList;\nimport java.util.Arrays;\nimport java.util.List;\nimport java.util.PriorityQueue;\n\n/**\n * Dijkstra's Algorithm \u2014 Single-Source Shortest Path (Non-Negative Weights)\n *\n * PROBLEM IT SOLVES:\n *   Given a weighted graph with NON-NEGATIVE edge weights and a source vertex,\n *   find the shortest distance from the source to every other vertex.\n *\n * WHEN TO USE:\n *   - Shortest path from a single source.\n *   - All edge weights >= 0 (use Bellman-Ford if negatives exist).\n *   - Problems: Network Delay Time (LC 743), Cheapest Flights (LC 787), etc.\n *\n * ALGORITHM STEPS:\n *   Step 1: Initialize dist[] array \u2014 source = 0, all others = INF.\n *           Add (source, 0) to a min-heap (priority queue sorted by distance).\n *   Step 2: While the min-heap is not empty:\n *       a) Poll the vertex u with the smallest distance.\n *       b) If u is already visited, skip it (we already found its shortest path).\n *       c) Mark u as visited.\n *       d) For each neighbour v of u, try to RELAX the edge:\n *          if dist[u] + weight(u,v) < dist[v], update dist[v] and push (v, newDist) to heap.\n *   Step 3: dist[] now contains shortest distances from source to all vertices.\n *\n * WHY GREEDY WORKS:\n *   With non-negative weights, the vertex with the smallest current distance\n *   is guaranteed to have its final shortest distance. No future path through\n *   other vertices can be shorter (because all remaining edges add >= 0).\n *\n * TIME:  O((V + E) log V) with min-heap (binary heap).\n * SPACE: O(V + E) for adjacency list + dist[] + heap.\n */\npublic class Dijkstra {\n    public List<List<Edge>> graph;\n    public static int V;\n\n    public Dijkstra(int v) {\n        this.V = v;\n        this.graph = new ArrayList<>();\n\n        for (int i = 0; i < V; i++) {\n            graph.add(new ArrayList<>());\n        }\n    }\n\n\n    public void addEdge(int src, int dest, int weight) {\n        graph.get(src).add(new Edge(dest, weight));\n    }\n\n    public static class Edge {\n        public int dest;\n        public int weight;\n\n        public Edge(int dest, int weight) {\n            this.dest = dest;\n            this.weight = weight;\n        }\n    }\n\n    public int[] dijkstra(int source) {\n        boolean[] visited = new boolean[V];\n\n        // Step 1: Initialize \u2014 source distance = 0, all others = infinity.\n        int[] dist = new int[V];\n        Arrays.fill(dist, Integer.MAX_VALUE);\n        dist[source] = 0;\n\n        // Min-heap stores {vertex, distance}. Sorted by distance (ascending).\n        PriorityQueue<int[]> pq = new PriorityQueue<>((a, b) -> a[1] - b[1]);\n        pq.add(new int[]{source, 0});\n\n        // Step 2: Greedily process the closest unvisited vertex.\n        while (!pq.isEmpty()) {\n            int[] current = pq.poll();\n            int u = current[0];\n\n            // Step 2b: If already visited, skip (stale entry in heap).\n            if (visited[u]) continue;\n\n            // Step 2c: Mark as visited \u2014 u's shortest distance is now finalized.\n            visited[u] = true;\n\n            // Step 2d: Relax all outgoing edges from u.\n            //   If going through u provides a shorter path to v, update dist[v].\n            for (Edge edge : graph.get(u)) {\n                int v = edge.dest;\n                int weight = edge.weight;\n\n                // Relaxation: dist[v] = min(dist[v], dist[u] + weight)\n                if (dist[v] > dist[u] + weight) {\n                    dist[v] = dist[u] + weight;\n                    pq.add(new int[]{v, dist[v]});\n                }\n            }\n        }\n\n        // Step 3: dist[] now holds the shortest distances from source.\n        return dist;\n    }\n\n\n    public static void main(String[] args) {\n        Dijkstra graph1 = new Dijkstra(6);\n        graph1.addEdge(0, 1, 2);\n        graph1.addEdge(0, 2, 4);\n        graph1.addEdge(1, 2, 1);\n        graph1.addEdge(1, 3, 7);\n        graph1.addEdge(2, 4, 3);\n        graph1.addEdge(3, 5, 1);\n        graph1.addEdge(4, 3, 2);\n        graph1.addEdge(4, 5, 5);\n\n        int source1 = 0;\n        int[] distances1 = graph1.dijkstra(source1);\n\n        System.out.println(\"Shortest distances from vertex \" + source1 + \":\");\n        for (int i = 0; i < V; i++) {\n            System.out.println(\"Vertex \" + i + \": \" + distances1[i]);\n        }\n\n        \n    }\n}\n\n\n\n\n"}, {"name": "FloydWarshall", "subcat": "algo", "link": "", "code": "package leetcode.graph.algo;\n\nimport java.util.Arrays;\n\n/**\n * Floyd-Warshall Algorithm \u2014 All-Pairs Shortest Path\n *\n * PROBLEM IT SOLVES:\n *   Given a weighted graph, find the shortest distance between EVERY pair\n *   of vertices. Works with negative weights (but NOT negative cycles).\n *\n * WHEN TO USE:\n *   - You need shortest paths between ALL pairs, not just from one source.\n *   - Graph is dense or small (V is manageable since O(V^3)).\n *   - Problems: detecting negative cycles, transitive closure, etc.\n *\n * ALGORITHM STEPS:\n *   Step 1: Initialize a V x V distance matrix dist[][] from the input graph.\n *           - dist[i][j] = weight of edge i->j if it exists, INF otherwise.\n *           - dist[i][i] = 0 for all vertices.\n *\n *   Step 2: For each INTERMEDIATE vertex k (0 to V-1):\n *       For each source i:\n *         For each destination j:\n *           if dist[i][k] + dist[k][j] < dist[i][j]:\n *             dist[i][j] = dist[i][k] + dist[k][j]\n *\n *   INTUITION: In each iteration of k, we ask:\n *     \"Is it shorter to go from i to j through vertex k?\"\n *     After considering all V vertices as intermediates, we've found\n *     all shortest paths.\n *\n *   Step 3 (optional): Check the diagonal \u2014 if dist[i][i] < 0 for any i,\n *           a negative-weight cycle exists.\n *\n * TIME:  O(V^3) \u2014 three nested loops.\n * SPACE: O(V^2) \u2014 for the distance matrix.\n *\n * COMPARISON:\n *   Dijkstra (per source): O((V+E) log V) \u2014 run V times for all-pairs = O(V(V+E) log V)\n *   Floyd-Warshall:         O(V^3) \u2014 simpler, better when graph is dense.\n */\npublic class FloydWarshall {\n\n    final static int INF = 99999; // Represents infinity\n    final static int V = 4;       // Number of vertices\n\n    public int[][] floydWarshall(int[][] graph) {\n        // Step 1: Initialize dist[][] as a copy of the input adjacency matrix.\n        //   dist[i][j] = direct edge weight from i to j (or INF if no edge).\n        int[][] dist = new int[V][V];\n        for (int i = 0; i < V; i++) {\n            System.arraycopy(graph[i], 0, dist[i], 0, V);\n        }\n\n        // Step 2: Try every vertex k as an INTERMEDIATE node.\n        //   For each pair (i, j), check: is the path i -> k -> j shorter\n        //   than the current best path i -> j?\n        //\n        //   After k=0: all shortest paths that may go through vertex 0 are found.\n        //   After k=1: paths through vertices {0,1} are found.\n        //   ...after k=V-1: all shortest paths are found.\n        for (int k = 0; k < V; k++) {\n            for (int i = 0; i < V; i++) {\n                for (int j = 0; j < V; j++) {\n                    // Relaxation: is going through k cheaper?\n                    if (dist[i][k] + dist[k][j] < dist[i][j]) {\n                        dist[i][j] = dist[i][k] + dist[k][j];\n                    }\n                }\n            }\n        }\n\n        return dist;\n    }\n\n    public static void main(String[] args) {\n        FloydWarshall floydWarshall = new FloydWarshall();\n        int graph[][] = {\n                { 0,   5,  INF, 10 },\n                { INF, 0,   3,  INF },\n                { INF, INF, 0,   1 },\n                { INF, INF, INF, 0 }\n        };\n\n        floydWarshall.floydWarshall(graph);\n        System.out.println(Arrays.deepToString(floydWarshall.floydWarshall(graph)));\n    }\n}\n"}, {"name": "Kosaraju", "subcat": "algo", "link": "", "code": "package leetcode.graph.algo;\n\nimport java.util.*;\n\n/**\n * Kosaraju's Algorithm \u2014 Finding Strongly Connected Components (SCCs)\n *\n * PROBLEM IT SOLVES:\n *   Given a directed graph, find all Strongly Connected Components.\n *   An SCC is a maximal set of vertices where every vertex is reachable\n *   from every other vertex in the set.\n *\n * WHEN TO USE:\n *   - Detect SCCs in a directed graph.\n *   - Simplify a directed graph into a DAG of its components.\n *   - Problems: 2-SAT, checking if a digraph is strongly connected, etc.\n *\n * ALGORITHM STEPS (3 passes):\n *   Step 1 \u2014 DFS on the ORIGINAL graph to get finish order.\n *       - Run DFS from every unvisited vertex.\n *       - After a vertex finishes (all descendants explored), push it onto a stack.\n *       - The stack now holds vertices in reverse topological order (by finish time).\n *       - WHY? Vertices that finish last have the \"highest reach\" and should be\n *         processed first when we reverse edges.\n *\n *   Step 2 \u2014 Build the TRANSPOSED graph (reverse all edge directions).\n *       - For every edge u -> v in the original, add v -> u in the transposed graph.\n *\n *   Step 3 \u2014 DFS on the TRANSPOSED graph in stack order.\n *       - Pop vertices from the stack (highest finish time first).\n *       - Each DFS from an unvisited vertex in the transposed graph discovers\n *         one complete SCC.\n *       - WHY? In the transposed graph, if u can reach v AND v can reach u\n *         (original graph), they are in the same SCC. The finish-time ordering\n *         ensures we don't \"leak\" into other components.\n *\n * INTUITION:\n *   If A can reach B in the original graph, and B can reach A in the\n *   transposed graph (which means A can reach B in the original too),\n *   then A and B are in the same SCC.\n *\n * TIME:  O(V + E) \u2014 two DFS passes + transpose construction.\n * SPACE: O(V + E) \u2014 for both graphs + stack + visited array.\n *\n * COMPARISON WITH TARJAN:\n *   - Kosaraju: 2 DFS passes + transpose. Conceptually simpler.\n *   - Tarjan:   1 DFS pass, uses disc/low arrays. More efficient in practice.\n */\npublic class Kosaraju {\n\n    private final int vertices;\n    private final List<List<Integer>> graph;\n    private final List<List<Integer>> transposedGraph;\n\n\n    // Constructs a graph with the specified number of vertices.\n    public Kosaraju(int vertices) {\n        this.vertices = vertices;\n        this.graph = new ArrayList<>(vertices);\n        this.transposedGraph = new ArrayList<>(vertices);\n\n        for (int i = 0; i < vertices; i++) {\n            graph.add(new ArrayList<>());\n            transposedGraph.add(new ArrayList<>());\n        }\n    }\n\n\n    public void addEdge(int src, int dest) {\n        graph.get(src).add(dest);\n    }\n\n    // Step 1: DFS on original graph \u2014 records finish order.\n    //   When all neighbours of v are fully explored, push v onto the stack.\n    //   This means v finishes AFTER all vertices reachable from it.\n    //   Result: stack top = vertex with the latest finish time.\n    private void fillOrder(int v, boolean[] visited, Stack<Integer> stack) {\n        visited[v] = true;\n\n        for (int neighbor : graph.get(v)) {\n            if (!visited[neighbor]) {\n                fillOrder(neighbor, visited, stack);\n            }\n        }\n\n        stack.push(v); // Records Finish Time of Nodes (Topological Order)\n    }\n\n    // Step 2: Build the transposed graph (reverse every edge direction).\n    //   Original: u -> v  becomes  Transposed: v -> u\n    //   This lets us check \"can v reach u?\" by doing DFS from u in the transposed graph.\n    private void createTransposedGraph() {\n        for (int v = 0; v < vertices; v++) {\n            for (int neighbor : graph.get(v)) {\n                transposedGraph.get(neighbor).add(v);\n            }\n        }\n    }\n\n    // Step 3: DFS on the transposed graph to collect one SCC.\n    //   All vertices reachable from v in the transposed graph (that haven't been\n    //   assigned to an SCC yet) form a single strongly connected component.\n    private void dfsUtil(int v, boolean[] visited, List<Integer> component) {\n        visited[v] = true;\n        component.add(v);\n\n        for (int neighbor : transposedGraph.get(v)) {\n            if (!visited[neighbor]) {\n                dfsUtil(neighbor, visited, component);\n            }\n        }\n    }\n\n\n    public List<List<Integer>> findSCCs() {\n        Stack<Integer> stack = new Stack<>();\n        boolean[] visited = new boolean[vertices];\n\n        // --- Step 1: Firs
