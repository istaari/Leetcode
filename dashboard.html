<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeetCode Problem Dashboard</title>
    <style>
        /* ── Theme: Dark (GitHub Dark) ── */
        :root,
        [data-theme="dark"] {
            --bg: #0d1117;
            --surface: #161b22;
            --surface2: #21262d;
            --border: #30363d;
            --text: #e6edf3;
            --text-muted: #8b949e;
            --accent: #58a6ff;
            --accent-hover: #79c0ff;
            --green: #3fb950;
            --red: #f85149;
            --orange: #d29922;
            --purple: #bc8cff;
            --yellow: #e3b341;
            --cyan: #39d2c0;
            --code-bg: #0d1117;
            --code-text: #e6edf3;
            --code-border: #30363d;
            --kw: #ff7b72;
            --str: #a5d6ff;
            --num: #79c0ff;
            --cmt: #8b949e;
            --ann: #d2a8ff;
        }

        /* ── Theme: Light ── */
        [data-theme="light"] {
            --bg: #ffffff;
            --surface: #f6f8fa;
            --surface2: #eaeef2;
            --border: #d1d9e0;
            --text: #1f2328;
            --text-muted: #59636e;
            --accent: #0969da;
            --accent-hover: #0550ae;
            --green: #1a7f37;
            --red: #cf222e;
            --orange: #9a6700;
            --purple: #8250df;
            --yellow: #7d6608;
            --cyan: #0e7c6b;
            --code-bg: #24292e;
            --code-text: #e1e4e8;
            --code-border: #444d56;
            --kw: #f97583;
            --str: #9ecbff;
            --num: #79b8ff;
            --cmt: #6a737d;
            --ann: #b392f0;
        }

        /* ── Theme: Sepia (Warm, easy on eyes) ── */
        [data-theme="sepia"] {
            --bg: #f4ecd8;
            --surface: #ede4ce;
            --surface2: #e3d9bf;
            --border: #c9bc9f;
            --text: #433422;
            --text-muted: #78664a;
            --accent: #8b5e34;
            --accent-hover: #6d4525;
            --green: #4a7c3f;
            --red: #b5403a;
            --orange: #96692a;
            --purple: #7b5ea7;
            --yellow: #7d6608;
            --cyan: #3a7d6e;
            --code-bg: #2b2118;
            --code-text: #e6dcc8;
            --code-border: #5a4a36;
            --kw: #ff8c7c;
            --str: #e6c38e;
            --num: #d2a57e;
            --cmt: #9c8b6e;
            --ann: #c5a0e0;
        }

        /* ── Theme: Solarized Dark ── */
        [data-theme="solarized"] {
            --bg: #002b36;
            --surface: #073642;
            --surface2: #0a4050;
            --border: #2a5c66;
            --text: #93a1a1;
            --text-muted: #657b83;
            --accent: #268bd2;
            --accent-hover: #2aa198;
            --green: #859900;
            --red: #dc322f;
            --orange: #cb4b16;
            --purple: #6c71c4;
            --yellow: #b58900;
            --cyan: #2aa198;
            --code-bg: #002b36;
            --code-text: #93a1a1;
            --code-border: #2a5c66;
            --kw: #859900;
            --str: #2aa198;
            --num: #d33682;
            --cmt: #586e75;
            --ann: #6c71c4;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh
        }

        /* Header */
        .header {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 14px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100
        }

        .header h1 {
            font-size: 20px;
            font-weight: 600
        }

        .header h1 span {
            color: var(--accent)
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 12px
        }

        .search-box {
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 6px 12px;
            color: var(--text);
            font-size: 14px;
            width: 240px;
            outline: none
        }

        .search-box:focus {
            border-color: var(--accent)
        }

        .stats {
            font-size: 12px;
            color: var(--text-muted)
        }

        /* Toolbar */
        .toolbar {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 8px 24px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap
        }

        .filter-btn {
            background: var(--surface2);
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 4px 12px;
            border-radius: 14px;
            font-size: 12px;
            cursor: pointer;
            transition: all .15s
        }

        .filter-btn:hover,
        .filter-btn.active {
            border-color: var(--accent);
            color: var(--accent);
            background: rgba(88, 166, 255, .1)
        }

        .filter-btn.active-green {
            border-color: var(--green);
            color: var(--green);
            background: rgba(63, 185, 80, .1)
        }

        .filter-btn.active-orange {
            border-color: var(--orange);
            color: var(--orange);
            background: rgba(210, 153, 34, .1)
        }

        .filter-btn.active-red {
            border-color: var(--red);
            color: var(--red);
            background: rgba(248, 81, 73, .1)
        }

        .toolbar-sep {
            width: 1px;
            height: 20px;
            background: var(--border)
        }

        /* Tabs */
        .tabs-container {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 16px;
            overflow-x: auto;
            scrollbar-width: thin;
            scrollbar-color: var(--border) transparent
        }

        .tabs-container::-webkit-scrollbar {
            height: 4px
        }

        .tabs-container::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 2px
        }

        .tab-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            padding: 10px 14px;
            font-size: 13px;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            white-space: nowrap;
            transition: all .15s;
            display: flex;
            align-items: center;
            gap: 6px
        }

        .tab-btn:hover {
            color: var(--text)
        }

        .tab-btn.active {
            color: var(--accent);
            border-bottom-color: var(--accent)
        }

        .tab-btn .badge {
            background: var(--surface2);
            color: var(--text-muted);
            font-size: 11px;
            padding: 1px 7px;
            border-radius: 10px
        }

        .tab-btn.active .badge {
            background: rgba(88, 166, 255, .15);
            color: var(--accent)
        }

        .add-tab-btn {
            background: none;
            border: 1px dashed var(--border);
            color: var(--text-muted);
            padding: 4px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 18px;
            margin-left: 8px;
            flex-shrink: 0;
            transition: all .15s
        }

        .add-tab-btn:hover {
            border-color: var(--accent);
            color: var(--accent)
        }

        /* Content */
        .content {
            padding: 20px 24px
        }

        .category-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 10px
        }

        .category-title {
            font-size: 18px;
            font-weight: 600
        }

        .subcategory-tag {
            display: inline-block;
            background: rgba(88, 166, 255, .12);
            color: var(--accent);
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 12px;
            margin-left: 8px
        }

        /* Cards Grid */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: 14px
        }

        /* Card */
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
            transition: border-color .15s, box-shadow .15s
        }

        .card:hover {
            border-color: var(--accent);
            box-shadow: 0 0 0 1px rgba(88, 166, 255, .15)
        }

        .card.confidence-high {
            border-left: 3px solid var(--green)
        }

        .card.confidence-medium {
            border-left: 3px solid var(--orange)
        }

        .card.confidence-low {
            border-left: 3px solid var(--red)
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px;
            border-bottom: 1px solid var(--border);
            gap: 6px
        }

        .card-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text);
            word-break: break-word
        }

        .card-subcat {
            font-size: 10px;
            color: var(--purple);
            background: rgba(188, 140, 255, .1);
            padding: 2px 8px;
            border-radius: 10px;
            flex-shrink: 0
        }

        .card-actions {
            display: flex;
            gap: 2px;
            flex-shrink: 0
        }

        .card-actions button {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 3px 5px;
            border-radius: 4px;
            font-size: 13px;
            transition: all .15s
        }

        .card-actions button:hover {
            background: var(--surface2);
            color: var(--text)
        }

        .card-actions .delete-btn:hover {
            color: var(--red)
        }

        .card-body {
            padding: 10px 14px
        }

        /* Card Meta Row */
        .card-meta {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
            flex-wrap: wrap
        }

        .difficulty-badge {
            font-size: 10px;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 10px;
            text-transform: uppercase;
            letter-spacing: .5px
        }

        .difficulty-easy {
            background: rgba(63, 185, 80, .15);
            color: var(--green)
        }

        .difficulty-medium {
            background: rgba(210, 153, 34, .15);
            color: var(--orange)
        }

        .difficulty-hard {
            background: rgba(248, 81, 73, .15);
            color: var(--red)
        }

        .confidence-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0
        }

        .confidence-label {
            font-size: 11px;
            color: var(--text-muted)
        }

        .card-link {
            display: flex;
            align-items: center;
            gap: 5px;
            margin-bottom: 6px
        }

        .card-link a {
            color: var(--accent);
            text-decoration: none;
            font-size: 12px;
            word-break: break-all
        }

        .card-link a:hover {
            text-decoration: underline;
            color: var(--accent-hover)
        }

        /* Complexity */
        .complexity-row {
            display: flex;
            gap: 12px;
            margin-bottom: 8px;
            font-size: 11px;
            color: var(--text-muted)
        }

        .complexity-row span {
            display: flex;
            align-items: center;
            gap: 4px
        }

        .complexity-row .label {
            color: var(--cyan);
            font-weight: 600
        }

        /* Notes */
        .card-notes {
            background: rgba(227, 179, 65, .06);
            border: 1px solid rgba(227, 179, 65, .15);
            border-radius: 4px;
            padding: 6px 10px;
            font-size: 12px;
            color: var(--yellow);
            margin-bottom: 8px;
            line-height: 1.5;
            white-space: pre-wrap
        }

        /* Code */
        .code-toggle {
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 6px 12px;
            font-size: 11px;
            color: var(--text-muted);
            cursor: pointer;
            width: 100%;
            text-align: left;
            transition: all .15s;
            display: flex;
            align-items: center;
            justify-content: space-between
        }

        .code-toggle:hover {
            border-color: var(--accent);
            color: var(--accent)
        }

        .code-block {
            background: var(--code-bg, var(--bg));
            border: 1px solid var(--code-border, var(--border));
            border-radius: 6px;
            padding: 12px 14px;
            font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
            font-size: 12px;
            line-height: 1.6;
            overflow: auto;
            white-space: pre;
            color: var(--code-text, var(--text));
            scrollbar-width: thin;
            scrollbar-color: var(--code-border, var(--border)) transparent;
            tab-size: 4
        }

        .code-block::-webkit-scrollbar {
            width: 6px;
            height: 6px
        }

        .code-block::-webkit-scrollbar-thumb {
            background: var(--code-border, var(--border));
            border-radius: 3px
        }

        /* Code Drawer Panel */
        .code-drawer-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .4);
            z-index: 150
        }

        .code-drawer-overlay.open {
            display: block
        }

        .code-drawer {
            position: fixed;
            top: 0;
            right: 0;
            bottom: 0;
            width: 55vw;
            max-width: 900px;
            min-width: 380px;
            background: var(--surface);
            border-left: 1px solid var(--border);
            z-index: 160;
            transform: translateX(100%);
            transition: transform .25s ease;
            display: flex;
            flex-direction: column;
            box-shadow: -8px 0 30px rgba(0, 0, 0, .3)
        }

        .code-drawer.open {
            transform: translateX(0)
        }

        .drawer-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 20px;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
            gap: 12px
        }

        .drawer-header h3 {
            font-size: 15px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis
        }

        .drawer-header-actions {
            display: flex;
            gap: 8px;
            flex-shrink: 0
        }

        .drawer-close {
            background: none;
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 4px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px
        }

        .drawer-close:hover {
            color: var(--text);
            border-color: var(--text-muted)
        }

        .drawer-copy {
            background: var(--accent);
            border: none;
            color: #fff;
            padding: 4px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px
        }

        .drawer-copy:hover {
            background: var(--accent-hover)
        }

        .drawer-meta {
            display: flex;
            gap: 12px;
            padding: 10px 20px;
            border-bottom: 1px solid var(--border);
            font-size: 12px;
            color: var(--text-muted);
            flex-shrink: 0;
            flex-wrap: wrap;
            align-items: center
        }

        .drawer-meta .tag {
            background: var(--surface2);
            padding: 2px 10px;
            border-radius: 10px
        }

        .drawer-body {
            flex: 1;
            overflow: auto;
            padding: 0
        }

        .drawer-body .code-block {
            border: none;
            border-radius: 0;
            height: 100%;
            max-height: none
        }

        @media(max-width:900px) {
            .code-drawer {
                width: 85vw
            }
        }

        /* Revision date */
        .revision-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 8px;
            padding-top: 6px;
            border-top: 1px solid var(--border)
        }

        .revision-date {
            font-size: 11px;
            color: var(--text-muted)
        }

        .mark-revised-btn {
            background: none;
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 2px 10px;
            border-radius: 4px;
            font-size: 11px;
            cursor: pointer;
            transition: all .15s
        }

        .mark-revised-btn:hover {
            border-color: var(--green);
            color: var(--green)
        }

        /* Add card */
        .add-card {
            border: 2px dashed var(--border);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100px;
            cursor: pointer;
            color: var(--text-muted);
            font-size: 14px;
            transition: all .15s;
            gap: 8px
        }

        .add-card:hover {
            border-color: var(--accent);
            color: var(--accent)
        }

        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .6);
            backdrop-filter: blur(4px);
            z-index: 200;
            align-items: center;
            justify-content: center
        }

        .modal-overlay.open {
            display: flex
        }

        .modal {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            width: 620px;
            max-width: 95vw;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 16px 48px rgba(0, 0, 0, .4)
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 20px;
            border-bottom: 1px solid var(--border)
        }

        .modal-header h2 {
            font-size: 16px;
            font-weight: 600
        }

        .modal-close {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 20px;
            cursor: pointer;
            padding: 4px
        }

        .modal-close:hover {
            color: var(--text)
        }

        .modal-body {
            padding: 16px 20px
        }

        .form-group {
            margin-bottom: 14px
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 500;
            margin-bottom: 4px;
            color: var(--text-muted)
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 7px 10px;
            color: var(--text);
            font-size: 13px;
            outline: none;
            font-family: inherit
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            border-color: var(--accent)
        }

        .form-group textarea {
            font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
            font-size: 12px;
            line-height: 1.5;
            min-height: 180px;
            resize: vertical
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px
        }

        .form-row-3 {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 12px
        }

        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            padding: 14px 20px;
            border-top: 1px solid var(--border)
        }

        .btn {
            padding: 7px 16px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            border: 1px solid var(--border);
            transition: all .15s
        }

        .btn-secondary {
            background: var(--surface2);
            color: var(--text)
        }

        .btn-secondary:hover {
            background: var(--border)
        }

        .btn-primary {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent)
        }

        .btn-primary:hover {
            background: var(--accent-hover)
        }

        .btn-danger {
            background: var(--red);
            color: #fff;
            border-color: var(--red)
        }

        .btn-danger:hover {
            opacity: .9
        }

        .btn-sm {
            padding: 4px 10px;
            font-size: 11px
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: var(--green);
            color: #fff;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            transform: translateY(80px);
            opacity: 0;
            transition: all .3s;
            z-index: 300
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1
        }

        .empty-state {
            text-align: center;
            padding: 48px;
            color: var(--text-muted)
        }

        .empty-state .icon {
            font-size: 40px;
            margin-bottom: 12px
        }

        .confirm-msg {
            font-size: 14px;
            line-height: 1.6;
            color: var(--text-muted)
        }

        /* Syntax highlighting — uses theme vars */
        .kw {
            color: var(--kw)
        }

        .str {
            color: var(--str)
        }

        .num {
            color: var(--num)
        }

        .cmt {
            color: var(--cmt);
            font-style: italic
        }

        .ann {
            color: var(--ann)
        }

        .typ {
            color: var(--orange)
        }

        .fn {
            color: var(--ann)
        }

        /* Theme picker */
        .theme-picker {
            position: relative;
            display: inline-block
        }

        .theme-btn {
            background: var(--surface2);
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 4px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: all .15s
        }

        .theme-btn:hover {
            border-color: var(--accent);
            color: var(--text)
        }

        .theme-dropdown {
            display: none;
            position: absolute;
            right: 0;
            top: calc(100% + 6px);
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            min-width: 170px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, .25);
            z-index: 110;
            overflow: hidden
        }

        .theme-dropdown.open {
            display: block
        }

        .theme-option {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 9px 14px;
            font-size: 13px;
            color: var(--text);
            cursor: pointer;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
            transition: background .1s
        }

        .theme-option:hover {
            background: var(--surface2)
        }

        .theme-option.active {
            color: var(--accent)
        }

        .theme-swatch {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            border: 2px solid var(--border);
            flex-shrink: 0
        }

        /* Progress bar */

            height: 3px;
            background: var(--surface2);
            border-radius: 2px;
            overflow: hidden;
            margin-top: 4px
        }

        .progress-fill {
            height: 100%;
            border-radius: 2px;
            transition: width .3s
        }

        /* Keyboard shortcuts hint */
        .shortcuts-hint {
            position: fixed;
            bottom: 24px;
            left: 24px;
            font-size: 11px;
            color: var(--text-muted);

        }

            background: var(--surface2);
            border: 1px solid var(--border);
            padding: 1px 5px;
            border-radius: 3px;
            font-size: 10px
        }

        @media(max-width:600px) {
            .cards-grid {
                grid-template-columns: 1fr
            }

            .form-row,
            .form-row-3 {
                grid-template-columns: 1fr
            }

<body>

    <div class="header">

        </div>

                    </button>
                    <button class="theme-option" onclick="setTheme('light')">
                        <span class="theme-swatch" style="background:#ffffff;border-color:#d1d9e0"></span> Light
                    </button>
                    <button class="theme-option" onclick="setTheme('sepia')">
                        <span class="theme-swatch" style="background:#f4ecd8;border-color:#c9bc9f"></span> Sepia (Warm)
                    </button>
                    <button class="theme-option" onclick="setTheme('solarized')">
                        <span class="theme-swatch" style="background:#002b36;border-color:#2a5c66"></span> Solarized
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="toolbar" id="toolbar">

            Review</button>
        <button class="filter-btn" data-filter="revised-today" onclick="setFilter('revised-today')">&#x2705; Revised
            Today</button>

                            placeholder="O(1)"></div>

                            placeholder="e.g. Two Pointers, DFS"></div>

                <div class="form-group"><label>Revision Notes (Key Insights, Gotchas, Tricks)</label>
                    <textarea id="cardNotes" style="font-family:inherit;min-height:70px"

                        placeholder="Paste your solution code here..."></textarea></div>
            </div>
            <div class="modal-footer">

    <!-- Category Modal -->
    <div class="modal-overlay" id="categoryModal">

    <script>
        // ━━━ INITIAL DATA ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        const INITIAL_DATA = {"Array": [{"name": "CheckArraySortedAndRotated", "subcat": "", "link": "", "code": "package leetcode.array;\n\n// LeetCode 1752: Check if Array Is Sorted and Rotated\n//\n// Problem Statement:\n// Given an array of integers `nums`, return `true` if the array was originally sorted in\n// non-decreasing order, then rotated some number of positions (including zero).\n// Otherwise, return `false`.\n//\n// An array A rotated by x positions results in an array B of the same length such\n// that B[i] = A[(i+x) % A.length], where % is the modulo operation.\n// Note that there can be duplicate elements in the array.\n//\n// Examples:\n// - nums = [3,4,5,1,2] -> true. The original sorted array was [1,2,3,4,5] rotated by 3 positions.\n// - nums = [2,1,3,4] -> false. This array cannot be obtained by rotating a sorted array.\n// - nums = [1,2,3] -> true. This is a sorted array rotated by 0 positions.\n\npublic class CheckArraySortedAndRotated {\n\n    public static boolean check(int[] nums) {\n        int deviations = 0;\n        for (int i = 0; i < nums.length; i++) {\n\n            // If rotated and sorted array [3,4,5,1,2] there will be only one deviation\n            // If not rotated and sorted array [1,2,3,4,5] there will be no deviation\n            // If not sorted array [2,1,3,4] there will be two deviations\n            if (nums[i] > nums[(i + 1) % nums.length]) {\n                deviations++;\n            }\n        }\n\n        return deviations < 2;\n    }\n\n    public static void main(String[] args) {\n        int[] nums = {1, 2};\n        System.out.println(check(nums));\n    }\n}\n"}, {"name": "ContainsDuplicate_2", "subcat": "", "link": "", "code": "package leetcode.array;\n\nimport java.util.HashMap;\nimport java.util.Map;\n\n\n// LeetCode 219: Contains Duplicate II\n//\n// Problem Statement:\n// Given an integer array `nums` and an integer `k`, return `true` if there are two\n// distinct indices `i` and `j` in the array such that `nums[i] == nums[j]` and\n// the absolute difference `abs(i - j)` is at most `k`.\n//\n// Examples:\n// - nums = [1,2,3,1], k = 3  -> true.  The 1s at index 0 and 3 have a difference of 3, which is <= k.\n// - nums = [1,0,1,1], k = 1  -> true.  The 1s at index 2 and 3 have a difference of 1, which is <= k.\n// - nums = [1,2,3,1,2,3], k = 2 -> false. The minimum distance for any duplicate pair is 3, which is > k.\n\npublic class ContainsDuplicate_2 {\n\n\n    public static boolean containsNearbyDuplicate(int[] nums, int k) {\n        // The map stores the number and its most recently seen index.\n        Map<Integer, Integer> indexMap = new HashMap<>();\n        int difference;\n\n        for (int i = 0; i < nums.length; i++) {\n            // Check if we have seen this number before.\n            if (indexMap.containsKey(nums[i])) {\n                // Get the last index where we saw this number.\n                int lastSeenIndex = indexMap.get(nums[i]);\n                difference = i - lastSeenIndex;\n\n                // Check if the difference is within our threshold 'k'.\n                if (difference <= k) {\n                    return true;\n                }\n            }\n\n            // we always have the closest possible index for future checks.\n            indexMap.put(nums[i], i);\n        }\n\n        // If we finish the loop, no such pair was found.\n        return false;\n    }\n\n\n    public static void main(String[] args) {\n        int[] nums;\n        int k;\n\n        // First case\n        nums = new int[]{1, 0, 1, 1};\n        k = 1;\n        System.out.println(containsNearbyDuplicate(nums, k));\n\n        // Third case\n        nums = new int[]{1, 2, 3, 1, 2, 3};\n        k = 2;\n        System.out.println(containsNearbyDuplicate(nums, k));\n    }\n}\n"}, {"name": "DegreeOfArray", "subcat": "", "link": "", "code": "package leetcode.array;\n\nimport java.util.HashMap;\nimport java.util.Map;\n\n\n// LeetCode 697: Degree of an Array\n//\n// Problem Statement:\n// Given a non-empty array of non-negative integers `nums`, the degree of this array is\n// defined as the maximum frequency of any one of its elements.\n//\n// Your task is to find the length of the shortest, contiguous subarray of `nums` that\n// has the same degree as `nums`.\n//\n// Example 1:\n// Input: nums = [1,2,2,3,1]\n// Output: 2\n// Explanation:\n// The degree of the array is 2 because both 1 and 2 appear twice.\n// The subarrays that have the same degree are:\n// [1,2,2,3,1] (contains all 1s, length 5)\n// [2,2]       (contains all 2s, length 2)\n// The shortest length is 2.\n//\n// Example 2:\n// Input: nums = [1,2,2,3,1,4,2]\n// Output: 6\n// Explanation:\n// The degree is 3 (element 2 appears 3 times).\n// The subarray containing all 2s is [2,2,3,1,4,2], which starts at index 1 and ends at index 6.\n// Its length is 6 - 1 + 1 = 6.\n\npublic class DegreeOfArray {\n\n\n    public static int findShortestSubArray(int[] nums) {\n        if (nums.length == 0) return 0;\n\n        // The map's value is an array of: [count, first_index, last_index]\n        Map<Integer, int[]> map = new HashMap<>();\n\n        // === PASS 1: GATHER DATA ===\n        for (int i = 0; i < nums.length; i++) {\n            if (!map.containsKey(nums[i])) {\n                // First time seeing this number\n                map.put(nums[i], new int[]{1, i, i});\n            } else {\n                // Already seen this number, update its count and last_index\n                int[] temp = map.get(nums[i]);\n                temp[0]++;       // Increment count\n                temp[2] = i;     // Update last seen index\n            }\n        }\n\n        // === PASS 2: ANALYZE DATA ===\n        int result = Integer.MAX_VALUE;\n        int maxCount = Integer.MIN_VALUE;\n\n        // Iterate through the map's values to find the shortest subarray\n        for (int[] temp : map.values()) {\n            int count = temp[0];\n            int firstIndex = temp[1];\n            int lastIndex = temp[2];\n\n            if (count > maxCount) {\n                // This is the new highest frequency element found so far\n                maxCount = count;\n                result = lastIndex - firstIndex + 1;\n            } else if (count == maxCount) {\n                // There's a tie in frequency, so we check if this element\n                // provides a shorter subarray length.\n                result = Math.min(result, lastIndex - firstIndex + 1);\n            }\n        }\n\n        return result;\n    }\n\n    public static void main(String[] args) {\n        // Example 1: The user's original example\n        int[] nums1 = new int[]{1, 2, 2, 3, 1, 4, 2};\n        System.out.println(\"For [1,2,2,3,1,4,2], shortest subarray length is: \" + findShortestSubArray(nums1));\n        // Expected: 6\n        // Degree is 3 (the number 2 appears 3 times).\n        // The first '2' is at index 1. The last '2' is at index 6.\n        // The shortest subarray is [2,2,3,1,4,2], length = 6 - 1 + 1 = 6.\n        // Your original comment had '7', which was likely a typo.\n\n        // Example 2: The classic LeetCode example\n        int[] nums2 = new int[]{1, 2, 2, 3, 1};\n        System.out.println(\"For [1,2,2,3,1], shortest subarray length is: \" + findShortestSubArray(nums2));\n        // Expected: 2\n        // Degree is 2. The candidates are 1 and 2.\n        // Subarray for 1s: [1,2,2,3,1] -> length = 4 - 0 + 1 = 5.\n        // Subarray for 2s: [2,2] -> length = 2 - 1 + 1 = 2.\n        // The minimum length is 2.\n    }\n}"}, {"name": "HIndex", "subcat": "", "link": "", "code": "\npackage leetcode.array;\n\nimport java.util.Arrays;\n\n\n// LeetCode 274: H-Index & LeetCode 275: H-Index II\n//\n// Problem Statement:\n// Given an array of integers `citations` where `citations[i]` is the number of citations a\n// researcher has for their i-th paper, compute the researcher's h-index.\n//\n// Definition of h-index:\n// A scientist has an h-index of `h` if `h` of their `N` papers have **at least** `h` citations each,\n// and the other `N - h` papers have **no more than** `h` citations each. The goal is to find the\n// maximum possible value of `h`.\n//\n// Example: citations = [3, 0, 6, 1, 5] (N=5 papers)\n// - Can h be 3? We need 3 papers with at least 3 citations. We have [3, 6, 5]. Yes.\n// - Can h be 4? We need 4 papers with at least 4 citations. We only have [6, 5]. No.\n// So, the maximum h-index is 3.\n//\n// Note: The two methods in this file solve two versions of the problem.\n// - `hIndex()` solves H-Index I (unsorted input).\n// - `hIndexB()` solves H-Index II (input is guaranteed to be sorted in ascending order).\n\n\npublic class HIndex {\n\n    /**\n     * ### Intuition Behind the Binary Search Solution (`hIndexB`)\n     *\n     * This method assumes the `citations` array is already sorted in ascending order.\n     * This sorting creates a monotonic property that allows for binary search.\n     *\n     * 1.  **The Search Space:** We are not searching for a value *in* the array. We are searching\n     * for the optimal value of `h`. The search space is the range of possible h-indices,\n     * which can be mapped to the indices of the array.\n     *\n     * 2.  **The Monotonic Condition:** Let's define a condition for a given index `mid`:\n     * - Let `h = n - mid`. This `h` is the number of papers from index `mid` to the end.\n     * - Let `c = citations[mid]`. This `c` is the *minimum* number of citations for this group of `h` papers (since the array is sorted).\n     * - The h-index condition is: \"Do we have `h` papers with at least `h` citations?\"\n     * - This translates to the check: `c >= h`, or `citations[mid] >= n - mid`.\n     *\n     * 3.  **The Binary Search Logic:**\n     * - `if (citations[mid] >= n - mid)`: This means an h-index of `(n - mid)` is possible. Since we want the *maximum* possible `h`, we should try to find an even better solution. A larger `h` corresponds to a smaller `mid`. So, we store this as a potential answer (`max = n - mid`) and search in the left half (`right = mid - 1`).\n     * - `else`: The number of citations `citations[mid]` is too small for this many papers (`n - mid`). We need to consider fewer papers (a smaller `h`), which means moving to the right half of the array (`left = mid + 1`).\n     *\n     * This binary search efficiently narrows down the search space to find the optimal partition point that defines the maximum h-index.\n     */\n    public static int hIndexB(int[] citations) {\n        int left = 0;\n        int right = citations.length - 1;\n        int n = citations.length;\n        int max = 0;\n\n        while (left <= right) {\n            int mid = left + (right - left) / 2;\n            int h = n - mid; // The potential h-index value\n\n            // Check if the h-index definition is met at this partition\n            if (citations[mid] >= h) {\n                // This is a valid h-index. Store it and try for a larger one.\n                // A larger h means a smaller mid, so we search the left side.\n                max = h;\n                right = mid - 1;\n            } else {\n                // The number of citations is too low for this many papers.\n                // We need a smaller h, which means a larger mid, so search the right side.\n                left = mid + 1;\n            }\n        }\n        return max;\n    }\n\n    /**\n     * ### Intuition Behind the Sorting Solution (`hIndex`)\n     *\n     * This method works for an unsorted input array.\n     *\n     * 1.  **Sort the Data:** The definition of h-index depends on counts of papers relative to\n     * citation numbers. Sorting makes this relationship much easier to analyze.\n     *\n     * 2.  **Sort Descending:** The code sorts ascending and then reverses. This is equivalent to\n     * sorting in descending order. Let's consider the array `[6, 5, 3, 1, 0]`.\n     *\n     * 3.  **The Logic:** After sorting descending, the index `i` can represent the number of papers\n     * we are considering (well, `i+1` does).\n     * - At `i=0`, we are looking at the top `1` paper. It has `citations[0] = 6` citations. Is `1 <= 6`? Yes. So h-index is at least 1.\n     * - At `i=1`, we are looking at the top `2` papers. The one with fewer citations has `citations[1] = 5`. Is `2 <= 5`? Yes. So h-index is at least 2.\n     * - At `i=2`, we look at the top `3` papers. The minimum citations is `citations[2] = 3`. Is `3 <= 3`? Yes. So h-index is at least 3.\n     * - At `i=3`, we look at the top `4` papers. The minimum citations is `citations[3] = 1`. Is `4 <= 1`? No. The condition breaks.\n     *\n     * The loop finds the largest `i+1` (which is our `h`) that satisfies the condition `h <= citations[h-1]`.\n     */\n    public static int hIndex(int[] citations) {\n        Arrays.sort(citations); // Sort in ascending order: e.g., [0, 1, 3, 5, 6]\n\n        int n = citations.length;\n        // Reverse the array to get descending order: e.g., [6, 5, 3, 1, 0]\n        for (int i = 0; i < n / 2; i++) {\n            int temp = citations[i];\n            citations[i] = citations[n - i - 1];\n            citations[n - i - 1] = temp;\n        }\n\n        int h = 0;\n        // Find the largest h such that the h-th paper has at least h citations\n        for (int i = 0; i < n; i++) {\n            // i+1 is the number of papers (our potential h)\n            // citations[i] is the citation count for the i-th paper (0-indexed)\n            if (i + 1 <= citations[i]) {\n                h = i + 1;\n            } else {\n                // As soon as the condition fails, we can stop because the citation\n                // counts will only get smaller from here.\n                break;\n            }\n        }\n\n        return h;\n    }\n\n    public static void main(String[] args) {\n        // --- Testing the Binary Search Method (for sorted input) ---\n        System.out.println(\"--- Binary Search Method (hIndexB) ---\");\n\n        int[] citations1 = {0, 1, 3, 5, 6};\n        System.out.println(\"For [0,1,3,5,6], h-index is: \" + hIndexB(citations1));\n        // Expected: 3. There are 3 papers ([3,5,6]) with at least 3 citations each.\n\n        int[] citations2 = {0, 1};\n        System.out.println(\"For [0,1], h-index is: \" + hIndexB(citations2));\n        // Expected: 1. There is 1 paper ([1]) with at least 1 citation.\n\n        int[] citations3 = {1, 2, 100};\n        System.out.println(\"For [1,2,100], h-index is: \" + hIndexB(citations3));\n        // Expected: 2. There are 2 papers ([2,100]) with at least 2 citations each.\n\n        int[] citations4 = {11, 15};\n        System.out.println(\"For [11,15], h-index is: \" + hIndexB(citations4));\n        // Expected: 2. There are 2 papers with at least 2 citations each.\n    }\n}"}, {"name": "LongestHarmoniousSubsequence", "subcat": "", "link": "", "code": "\n\npackage leetcode.array;\n\nimport java.util.HashMap;\nimport java.util.Map;\n\n\n// LeetCode 594: Longest Harmonious Subsequence\n//\n// Problem Statement:\n// We define a harmonious array as an array where the difference between its maximum value and\n// its minimum value is exactly 1.\n//\n// Given an integer array `nums`, return the length of its longest harmonious subsequence\n// among all its possible subsequences.\n//\n// A subsequence of an array is a sequence that can be derived from the array by deleting some\n// or no elements without changing the order of the remaining elements.\n//\n// Example:\n// Input: nums = [1,3,2,2,5,2,3,7]\n// Output: 5\n// Explanation: The longest harmonious subsequence is [3,2,2,2,3]. Its max is 3, min is 2,\n// and the difference is 1. The length is 5.\npublic class LongestHarmoniousSubsequence {\n\n    /**\n     * ### Intuition Behind the Solution\n     *\n     * 1.  **Understanding \"Harmonious Subsequence\":**\n     * - The definition is key: a subsequence where `max - min = 1`.\n     * - This means a harmonious subsequence can only be formed by two kinds of numbers: some number `x` and its neighbor `x + 1`.\n     * - For example, a subsequence `[2,3,2,3,2]` is harmonious, but `[2,3,4]` is not (max-min=2).\n     *\n     * 2.  **Simplifying the Problem:**\n     * - Since the order of elements in a subsequence doesn't matter for its min/max values, this problem isn't about finding a contiguous subarray. It's about finding counts.\n     * - The problem boils down to: \"Find a number `x` in the array such that `x+1` also exists, and the sum of their frequencies is maximized.\"\n     *\n     * 3.  **The Algorithm's Plan:**\n     * - We can't solve this without knowing the counts of each number. The perfect tool for this is a **HashMap** to store the frequency of each number.\n     *\n     * - **Pass 1: Count Frequencies.**\n     * - We iterate through the entire `nums` array once and populate our frequency map. For `[1,3,2,2,5,2,3,7]`, the map would become `{1=1, 2=3, 3=2, 5=1, 7=1}`.\n     *\n     * - **Pass 2: Find the Longest Pair.**\n     * - Now that we have the counts, we can iterate through the numbers again (or more efficiently, through the keys of our map).\n     * - For each number `num` we look at, we check if its harmonious partner `num + 1` also exists as a key in our map.\n     * - If it does, we calculate the potential length of this harmonious subsequence by adding their counts: `count.get(num) + count.get(num + 1)`.\n     * - We keep track of the maximum length we find during this process.\n     *\n     * - **Final Result:** After checking all the numbers for their harmonious partners, the `maxLen` variable will hold the length of the longest harmonious subsequence. If no such pair was found, it will remain 0.\n     *\n     * This two-pass approach cleanly and efficiently solves the problem by first gathering the necessary data (counts) and then analyzing it.\n     */\n    public static int findLHS(int[] nums) {\n        // Pass 1: Count the frequency of each number.\n        Map<Integer, Integer> count = new HashMap<>();\n        for (int num : nums) {\n            count.put(num, count.getOrDefault(num, 0) + 1);\n        }\n\n        int maxLen = 0;\n\n        // Pass 2: Iterate through the keys (unique numbers) to find harmonious pairs.\n        // Note: Iterating through the keySet is slightly more efficient than iterating through\n        // the original nums array again, as it avoids re-checking the same number.\n        for (int num : count.keySet()) {\n            // Check if the harmonious partner (num + 1) exists in our map.\n            if (count.containsKey(num + 1)) {\n                // If it exists, calculate the combined length and update the max.\n                maxLen = Math.max(maxLen, count.get(num) + count.get(num + 1));\n            }\n        }\n\n        return maxLen;\n    }\n\n    public static void main(String[] args) {\n        // Example 1: The user's original example\n        int[] nums1 = {1, 3, 2, 2, 5, 2, 3, 7};\n        System.out.println(\"For [1,3,2,2,5,2,3,7], LHS length is: \" + findLHS(nums1));\n    }\n}"}, {"name": "LongestPalindrome", "subcat": "", "link": "", "code": "package leetcode.array;\n\nimport java.util.HashSet;\nimport java.util.Set;\n\n// LeetCode 409: Longest Palindrome\n//\n// Problem Statement:\n// Given a string `s` which consists of lowercase or uppercase English letters, return the\n// length of the longest palindrome that can be built with those letters.\n//\n// Note that this is case-sensitive, so \"a\" and \"A\" are considered different characters.\n// We are not finding a palindromic substring within `s`, but rearranging the letters of `s`\n// to form the longest possible new string that is a palindrome.\n//\n// Example:\n// Input: s = \"abccccdd\"\n// Output: 7\n// Explanation: One longest palindrome that can be built is \"dccaccd\", which has a length of 7.\n\npublic class LongestPalindrome {\n\n    public static int longestPalindrome(String s) {\n        // This 'count' is actually counting the number of PAIRS of characters.\n        int count = 0;\n        Set<Character> set = new HashSet<>();\n\n        for (int i = 0; i < s.length(); i++) {\n            char c = s.charAt(i);\n            // The remove() method returns true if the element was in the set.\n            // This is a clever trick to check for existence and remove in one step.\n            if (set.remove(c)) {\n                // If we successfully removed the character, it means we found its pair.\n                count++;\n            } else {\n                // If the character was not in the set, add it. It's now waiting for a pair.\n                set.add(c);\n            }\n        }\n\n        // Each pair contributes 2 to the length of the palindrome.\n        int lengthFromPairs = count * 2;\n\n        // If the set is not empty, it means there are leftover unpaired characters.\n        // We can place exactly ONE of these in the center of the palindrome.\n        if (!set.isEmpty()) {\n            return lengthFromPairs + 1;\n        } else {\n            // If the set is empty, all characters formed perfect pairs. No center is needed.\n            return lengthFromPairs;\n        }\n    }\n\n    public static void main(String[] args) {\n        String s = \"abccccdd\";\n        System.out.println(longestPalindrome(s));\n    }\n\n}\n"}, {"name": "MajorityElement", "subcat": "", "link": "", "code": "package leetcode.array;\n\nimport java.util.ArrayList;\nimport java.util.List;\n\n\n// LeetCode 229: Majority Element II\n//\n// Problem Statement:\n// Given an integer array `nums` of size `n`, find all the elements that appear more than\n// `\u230a n/3 \u230b` times.\n//\n// Note: The algorithm should run in linear time and in O(1) space.\n//\n// Example 1:\n// Input: nums = [3,2,3]\n// Output: [3]\n//\n// Example 2:\n// Input: nums = [1]\n// Output: [1]\n//\n// Example 3:\n// Input: nums = [1,2]\n// Output: [1,2]\npublic class MajorityElement {\n\n    public static List<Integer> majorityElement(int[] nums) {\n        List<Integer> result = new ArrayList<>();\n        if (nums == null || nums.length == 0) {\n            return result;\n        }\n\n        // --- PASS 1: Find the two potential candidates ---\n        int count1 = 0;\n        // Initialize with values that are guaranteed not to be in the array if possible,\n        // but the logic handles this. Using 0 and 1 is fine as placeholders.\n        int candidate1 = 0;\n\n        int count2 = 0;\n        int candidate2 = 1;\n\n        // This is a slightly different but valid implementation of the voting logic.\n        // A more common pattern is a single if-else-if cascade.\n        for (int val : nums) {\n            if (candidate1 == val) {\n                count1++;\n            } else if (candidate2 == val) {\n                count2++;\n            } else if (count1 == 0) {\n                candidate1 = val;\n                count1 = 1;\n            } else if (count2 == 0) {\n                candidate2 = val;\n                count2 = 1;\n            } else {\n                // This is the \"cancellation\" step for a trio of distinct numbers.\n                count1--;\n                count2--;\n            }\n        }\n\n        // --- PASS 2: Verify the candidates ---\n        count1 = 0;\n        count2 = 0;\n\n        for (int val : nums) {\n            if (val == candidate1) count1++;\n            else if (val == candidate2) count2++;\n        }\n\n        // Check if the counts exceed n/3\n        if (count1 > nums.length / 3) {\n            result.add(candidate1);\n        }\n\n        // The 'candidate1 != candidate2' check is important for cases where only one\n        // majority element exists and might end up in both candidate slots initially.\n        if (candidate1 != candidate2 && count2 > nums.length / 3) {\n            result.add(candidate2);\n        }\n\n        return result;\n    }\n\n\n    public static void main(String[] args) {\n        // Example 1: The user's original example\n        int[] nums1 = {1, 2};\n        System.out.println(\"For [1, 2], majority elements are: \" + majorityElement(nums1));\n        // Expected: [1, 2].\n        // n=2, n/3 = 0. Both 1 and 2 appear 1 time, which is > 0.\n\n        // Example 2: A clear winner\n        int[] nums2 = {3, 2, 3};\n        System.out.println(\"For [3, 2, 3], majority elements are: \" + majorityElement(nums2));\n        // Expected: [3].\n        // n=3, n/3 = 1. '3' appears 2 times (> 1). '2' appears 1 time (not > 1).\n\n        // Example 3: Two winners\n        int[] nums3 = {2, 2, 1, 1, 1, 2, 2};\n        System.out.println(\"For [2,2,1,1,1,2,2], majority elements are: \" + majorityElement(nums3));\n        // Expected: [1, 2] (or [2, 1]).\n        // n=7, n/3 = 2. '1' appears 3 times (> 2). '2' appears 4 times (> 2).\n\n        // Example 4: No winners\n        int[] nums4 = {1, 2, 3};\n        System.out.println(\"For [1, 2, 3], majority elements are: \" + majorityElement(nums4));\n        // Expected: [].\n        // n=3, n/3 = 1. No element appears more than 1 time.\n    }\n}"}, {"name": "MaxConsecutiveOnes", "subcat": "", "link": "", "code": "package leetcode.array;\n\npublic class MaxConsecutiveOnes {\n\n    public static int findMaxConsecutiveOnes(int[] nums) {\n        int max = 0;\n        int count = 0;\n\n        for (int num : nums) {\n            if (num == 1) {\n                count++;\n            } else { // If we encounter a 0, we reset the count\n                max = Math.max(max, count);\n                count = 0;\n            }\n        }\n        return max;\n    }\n\n    public static void main(String[] args) {\n        int[] nums = {1, 1, 0, 1, 1, 1};\n        System.out.println(findMaxConsecutiveOnes(nums));\n    }\n}\n"}, {"name": "MaximumGap", "subcat": "", "link": "", "code": "\n\npackage leetcode.array;\nimport java.util.Arrays;\n\n\n// LeetCode 164: Maximum Gap\n//\n// Problem Statement:\n// Given an integer array `nums`, return the maximum difference between two successive\n// elements in its sorted form. If the array contains less than two elements, return 0.\n//\n// You must write an algorithm that runs in linear time and uses linear extra space.\n//\n// Example 1:\n// Input: nums = [3,6,9,1]\n// Output: 3\n// Explanation: The sorted form of the array is [1,3,6,9], and the maximum\n// difference is between (3,6) or (6,9), which is 3.\n//\n// Example 2:\n// Input: nums = [10]\n// Output: 0\n// Explanation: The array contains less than 2 elements.\n//\n// Constraint: The O(N) time complexity rules out a simple O(N log N) sorting approach.\n\npublic class MaximumGap {\n\n    /**\n     * ### Intuition Behind the Solution (Pigeonhole Principle & Bucket Sort)\n     *\n     * 1.  **The Constraint is Key:** The problem requires an O(N) solution. This immediately tells us we\n     * cannot use a standard comparison-based sort (like `Arrays.sort()`), which takes O(N log N). We\n     * must use a non-comparison-based sorting idea like Radix Sort or Bucket Sort. This solution\n     * cleverly uses the principles of Bucket Sort.\n     *\n     * 2.  **The Pigeonhole Principle:**\n     * - Imagine we have `N` numbers in the array. In their sorted form, there will be `N-1` gaps\n     * between successive elements.\n     * - The total range of values is `max - min`.\n     * - The *average* gap size would be `(max - min) / (N - 1)`.\n     * - By the pigeonhole principle, the *maximum gap* between any two successive sorted elements must\n     * be **at least** this average gap size.\n     *\n     * 3.  **The Bucket Strategy (The \"Aha!\" Moment):**\n     * - What if we create \"buckets\" to group our numbers, and we make the size of each bucket\n     * smaller than the average gap? Let's say `bucketSize = (max - min) / (N - 1)`.\n     * - Any two numbers that fall into the **same bucket** will have a difference between them that is\n     * less than `bucketSize`.\n     * - Since we know the true `maximumGap` must be greater than or equal to `bucketSize`, this means\n     * the maximum gap **cannot possibly occur inside a single bucket**.\n     * - Therefore, the maximum gap must occur **between** two numbers in **different buckets**.\n     * Specifically, it must be the difference between the **maximum** value in some bucket `i`\n     * and the **minimum** value in the *next non-empty* bucket `j`.\n     *\n     * 4.  **The Algorithm's Plan:**\n     * - **Pass 1:** Find the `min` and `max` values in the array.\n     * - **Calculate Bucket Info:** Determine the `bucketSize` and `bucketCount`.\n     * - **Pass 2 (Distribution):** Create `bucketCount` buckets. For each bucket, we only need to\n     * store the minimum and maximum number that falls into it. We can discard all other numbers\n     * in between, because they can't form the maximum gap.\n     * - **Pass 3 (Gap Calculation):** Iterate through the buckets. Ignore any empty buckets. The\n     * maximum gap will be the largest difference found between the `min` of the current non-empty\n     * bucket and the `max` of the previous non-empty bucket.\n     */\n    public static int maximumGap(int[] nums) {\n\n        if (nums.length < 2) return 0;\n\n        // Pass 1: Find min and max elements\n        int max = Integer.MIN_VALUE;\n        int min = Integer.MAX_VALUE;\n        for (int val : nums) {\n            max = Math.max(max, val);\n            min = Math.min(min, val);\n        }\n\n        if (max == min) return 0; // All elements are the same\n\n        // Calculate bucket size and count based on the Pigeonhole Principle\n        int bucketSize = Math.max(1, (max - min) / (nums.length - 1));\n        int bucketCount = (max - min) / bucketSize + 1;\n\n        // Create buckets, each storing only the min and max value within it\n        int[] bucketMin = new int[bucketCount];\n        int[] bucketMax = new int[bucketCount];\n        Arrays.fill(bucketMin, Integer.MAX_VALUE);\n        Arrays.fill(bucketMax, Integer.MIN_VALUE);\n\n        // Pass 2: Distribute numbers into buckets\n        for (int val : nums) {\n            int bucketIndex = (val - min) / bucketSize;\n            bucketMin[bucketIndex] = Math.min(bucketMin[bucketIndex], val);\n            bucketMax[bucketIndex] = Math.max(bucketMax[bucketIndex], val);\n        }\n\n        // Pass 3: Calculate the maximum gap between non-empty buckets\n        int prevMax = min; // Start with the global min\n        int maxGap = 0;\n\n        for (int i = 0; i < bucketCount; i++) {\n            // Skip empty buckets\n            if (bucketMin[i] == Integer.MAX_VALUE) {\n                continue;\n            }\n\n            // The maximum gap must be between the max of a previous bucket and the min of a current one.\n            maxGap = Math.max(maxGap, bucketMin[i] - prevMax);\n            // Update the previous max for the next iteration\n            prevMax = bucketMax[i];\n        }\n\n        return maxGap;\n    }\n\n    public static void main(String[] args) {\n        // Example 1: The user's original example\n        int[] nums1 = {3, 6, 9, 1};\n        System.out.println(\"For [3, 6, 9, 1], Maximum Gap is: \" + maximumGap(nums1));\n        // Expected: 3.\n        // Sorted form is [1, 3, 6, 9].\n        // Gaps are (3-1)=2, (6-3)=3, (9-6)=3. The max is 3.\n\n        // Example 2: An array with an empty bucket in the middle\n        int[] nums2 = {1, 10, 5};\n        System.out.println(\"For [1, 10, 5], Maximum Gap is: \" + maximumGap(nums2));\n        // Expected: 5.\n        // Sorted form is [1, 5, 10].\n        // Gaps are (5-1)=4, (10-5)=5. The max is 5.\n        // The algorithm will place 1, 5, and 10 in different buckets, and find the gap between them.\n\n        // Example 3: Less than 2 elements\n        int[] nums3 = {100};\n        System.out.println(\"For [100], Maximum Gap is: \" + maximumGap(nums3));\n        // Expected: 0. The array has fewer than two elements.\n    }\n}"}, {"name": "MaximumProduct", "subcat": "", "link": "", "code": "package leetcode.array;\n\npublic class MaximumProduct {\n\n    public int maximumProduct(int[] nums) {\n        int max1 = Integer.MIN_VALUE;\n        int max2 = Integer.MIN_VALUE;\n        int max3 = Integer.MIN_VALUE;\n\n        int min1 = Integer.MAX_VALUE;\n        int min2 = Integer.MAX_VALUE;\n\n        for (int num : nums) {\n            // Find the three largest numbers\n            if (num > max1) {\n                max3 = max2;\n                max2 = max1;\n                max1 = num;\n            } else if (num > max2) {\n                max3 = max2;\n                max2 = num;\n            } else if (num > max3) {\n                max3 = num;\n            }\n\n            // Find the two smallest numbers\n            if (num < min1) {\n                min2 = min1;\n                min1 = num;\n            } else if (num < min2) {\n                min2 = num;\n            }\n        }\n\n        // The maximum product can be either the product of the three largest numbers\n        return Math.max(max1 * max2 * max3, min1 * min2 * max1);\n    }\n\n\n    public static void main(String[] args) {\n        int[] nums = {-100, -98, -1, 2, 3, 4};\n        System.out.println(new MaximumProduct().maximumProduct(nums));\n    }\n}\n"}, {"name": "MergeSortedArray", "subcat": "", "link": "", "code": "package leetcode.array;\n\nimport java.util.Arrays;\n\n\n// LeetCode 88: Merge Sorted Array\n//\n// Problem Statement:\n// You are given two integer arrays, `nums1` and `nums2`, sorted in non-decreasing order,\n// and two integers `m` and `n`, representing the number of elements in `nums1` and `nums2`\n// respectively.\n//\n// Merge `nums2` into `nums1` as a single sorted array.\n//\n// The final sorted array should not be returned by the function, but instead be stored\n// inside the array `nums1`. To accommodate this, `nums1` has a length of `m + n`,\n// where the first `m` elements denote the elements that should be merged, and the last `n`\n// elements are set to 0 and should be ignored.\n//\n// Example:\n// Input: nums1 = [1,2,3,0,0,0], m = 3, nums2 = [2,5,6], n = 3\n// Output: [1,2,2,3,5,6]\n\npublic class MergeSortedArray {\n\n\n    public static void merge(int[] nums1, int m, int[] nums2, int n) {\n        // Pointer for the last valid element in the initial part of nums1\n        int i = m - 1;\n        // Pointer for the last element in nums2\n        int j = n - 1;\n        // Pointer for the last position in the merged array (the end of nums1)\n        int k = m + n - 1;\n\n        // Loop as long as there are elements in nums2 to merge\n        while (j >= 0) {\n            // Check if there are still elements in nums1 to compare and if the\n            // element in nums1 is larger than the element in nums2.\n            if (i >= 0 && nums1[i] > nums2[j]) {\n                // Place the larger element from nums1 at the end\n                nums1[k] = nums1[i];\n                i--;\n            } else {\n                // Place the element from nums2 (it's either larger or we're out of nums1 elements)\n                nums1[k] = nums2[j];\n                j--;\n            }\n            // Move the write pointer to the left\n            k--;\n        }\n    }\n\n    public static void main(String[] args) {\n        // Example 1: Standard case\n        int[] nums1_case1 = {1, 2, 3, 0, 0, 0};\n        int m1 = 3;\n        int[] nums2_case1 = {2, 5, 6};\n        int n1 = 3;\n        merge(nums1_case1, m1, nums2_case1, n1);\n        System.out.println(\"Case 1 Merged Array: \" + Arrays.toString(nums1_case1));\n        // Expected: [1, 2, 2, 3, 5, 6]\n    }\n}"}, {"name": "MoveZeroes", "subcat": "", "link": "", "code": "package leetcode.array;\n\nimport java.util.Arrays;\n\n\n// LeetCode 283: Move Zeroes\n//\n// Problem Statement:\n// Given an integer array `nums`, move all 0's to the end of it while maintaining the\n// relative order of the non-zero elements.\n//\n// Note that you must do this in-place without making a copy of the array.\n//\n// Example:\n// Input: nums = [0,1,0,3,12]\n// Output: [1,3,12,0,0]\n\npublic class MoveZeroes {\n\n    /**\n     * Moves all zeroes to the end of the array in-place, maintaining the relative\n     * order of non-zero elements.\n     *\n     * This refactored solution uses the \"Snowplow\" or \"Write Pointer\" method.\n     *\n     * 1. A pointer `insertPosition` tracks the next valid spot for a non-zero element.\n     * 2. We iterate through the array. When we find a non-zero element, we place it\n     * at `insertPosition` and increment `insertPosition`.\n     * 3. After this first pass, all non-zero elements are at the front.\n     * 4. A second pass fills the rest of the array with zeroes.\n     *\n     * This approach is clearer and minimizes the number of write operations.\n     *\n     * @param nums The array to be modified.\n     */\n    public static void moveZeroes(int[] nums) {\n        if (nums == null || nums.length == 0) {\n            return;\n        }\n\n        int insertPosition = 0;\n\n        // Pass 1: Move all non-zero elements to the front of the array.\n        for (int num : nums) {\n            if (num != 0) {\n                nums[insertPosition] = num;\n                insertPosition++;\n            }\n        }\n\n        // Pass 2: Fill the remaining part of the array with zeroes.\n        while (insertPosition < nums.length) {\n            nums[insertPosition] = 0;\n            insertPosition++;\n        }\n    }\n\n    public static void main(String[] args) {\n        // Your original test case\n        int[] nums1 = {0, 1, 0, 3, 12};\n        moveZeroes(nums1);\n        System.out.println(\"For [0, 1, 0, 3, 12], result is: \" + Arrays.toString(nums1));\n        // Expected: [1, 3, 12, 0, 0]\n    }\n}"}, {"name": "NextPermutation", "subcat": "", "link": "", "code": "package leetcode.array;\n\nimport java.util.Arrays;\n\n\n// LeetCode 31: Next Permutation\n//\n// Problem Statement:\n// Implement `next permutation`, which rearranges numbers into the lexicographically next\n// greater permutation of numbers.\n//\n// If such an arrangement is not possible (i.e., the array is already in descending order),\n// the array must be rearranged as the lowest possible order (i.e., sorted in ascending order).\n//\n// The replacement must be in-place and use only constant extra memory.\n//\n// Example 1:\n// Input: nums = [1,2,3]\n// Output: [1,3,2]\n//\n// Example 2:\n// Input: nums = [3,2,1]\n// Output: [1,2,3]\n//\n// Example 3:\n// Input: nums = [1,1,5]\n// Output: [1,5,1]\n\npublic class NextPermutation {\n\n    /**\n     * ### Intuition Behind the Algorithm\n     *\n     * The problem asks us to find the very next \"larger\" number we can form by rearranging the\n     * digits, just like finding the next word in a dictionary. Let's think about how we would\n     * do this manually for a number like `236541`.\n     *\n     * 1.  **Goal:** To make the number larger, but only by the smallest possible amount. This means we\n     * should try to change the rightmost digits first.\n     *\n     * 2.  **Find the \"Pivot\":** We scan the number from right to left.\n     * - `1`\n     * - `41`\n     * - `541`\n     * - `6541`\n     * The sequence `6, 5, 4, 1` is in descending order. We cannot rearrange just this part to make\n     * a larger number. The first digit we encounter that is *smaller* than its right neighbor is `3`\n     * (because `3 < 6`). This is our **pivot**. This is the digit we need to increase to get the\n     * next permutation. Your code finds this pivot and stores its index in `pi`.\n     *\n     * 3.  **Find the Successor:** We need to replace the pivot (`3`) with the smallest possible digit\n     * from the suffix `[6, 5, 4, 1]` that is still *larger* than `3`. Scanning the suffix from\n     * right to left, the first number we find that is greater than `3` is `4`. This is our successor.\n     * Your code finds this and stores its index in `greater`.\n     *\n     * 4.  **Swap:** We swap the pivot and its successor.\n     * - `2, 3, 6, 5, 4, 1`  --> swap(3, 4) -->  `2, 4, 6, 5, 3, 1`\n     *\n     * 5.  **Sort the Suffix:** We've now made the prefix of the number larger (`23...` became `24...`).\n     * To make the *overall* number the smallest possible next permutation, the suffix that comes\n     * after the swapped pivot position must be in its smallest possible order (i.e., sorted ascendingly).\n     * - The suffix is `[6, 5, 3, 1]`.\n     * - A key observation is that this suffix is *always* in descending order. Therefore, the most\n     * efficient way to sort it ascendingly is to simply **reverse** it.\n     * - Reversing `[6, 5, 3, 1]` gives `[1, 3, 5, 6]`.\n     *\n     * 6.  **Final Result:**\n     * - `2, 4` + `1, 3, 5, 6`  -->  `[2, 4, 1, 3, 5, 6]`\n     *\n     * This is the exact sequence of steps your code implements.\n     *\n     * **Edge Case:** If the entire array is in descending order (e.g., `[3, 2, 1]`), no pivot `pi`\n     * will be found (it remains -1). This means we are at the largest possible permutation. The \"next\"\n     * one is the smallest, which is the array sorted in ascending order. Reversing the entire\n     * array achieves this.\n     */\n    public static void nextPermutation(int[] nums) {\n        if (nums == null || nums.length <= 1) return;\n\n        // Step 1: Find the first element from the right that is smaller than its next element.\n        // This is our \"pivot\".\n        int pi = -1; // pivot index\n        for (int i = nums.length - 2; i >= 0; i--) {\n            if (nums[i] < nums[i + 1]) {\n                pi = i;\n                break;\n            }\n        }\n\n        // Edge Case: If no such element is found, the array is in descending order (e.g., [3,2,1]).\n        // This is the largest permutation. The \"next\" is the smallest (sorted ascending).\n        if (pi == -1) {\n            reverse(0, nums.length - 1, nums);\n            return;\n        }\n\n        // Step 2: Find the smallest element in the suffix (to the right of the pivot)\n        // that is just larger than the pivot.\n        for (int i = nums.length - 1; i > pi; i--) {\n            if (nums[i] > nums[pi]) {\n                // Step 3: Swap the pivot with this successor element.\n                swap(pi, i, nums);\n                break;\n            }\n        }\n\n        // Step 4: Reverse the suffix to make it the smallest possible sequence.\n        reverse(pi + 1, nums.length - 1, nums);\n    }\n\n    public static void swap(int a, int b, int[] nums) {\n        int temp = nums[b];\n        nums[b] = nums[a];\n        nums[a] = temp;\n    }\n\n    public static void reverse(int left, int right, int[] nums) {\n        while (left < right) {\n            swap(left, right, nums);\n            left++;\n            right--;\n        }\n    }\n\n    public static void main(String[] args) {\n        // --- Test Cases ---\n\n        // Example 1: Standard case (from the user)\n        int[] nums1 = {2, 3, 6, 5, 4, 1};\n        System.out.println(\"Original: \" + Arrays.toString(nums1));\n        nextPermutation(nums1);\n        System.out.println(\"Next Permutation: \" + Arrays.toString(nums1));\n        // Expected: [2, 4, 1, 3, 5, 6]\n\n        // Example 2: Simple increasing sequence\n        int[] nums2 = {1, 2, 3};\n        System.out.println(\"\\nOriginal: \" + Arrays.toString(nums2));\n        nextPermutation(nums2);\n        System.out.println(\"Next Permutation: \" + Arrays.toString(nums2));\n        // Expected: [1, 3, 2]\n\n        // Example 3: Descending sequence (the largest permutation)\n        int[] nums3 = {3, 2, 1};\n        System.out.println(\"\\nOriginal: \" + Arrays.toString(nums3));\n        nextPermutation(nums3);\n        System.out.println(\"Next Permutation: \" + Arrays.toString(nums3));\n        // Expected: [1, 2, 3]\n\n        // Example 4: Array with duplicates\n        int[] nums4 = {1, 1, 5};\n        System.out.println(\"\\nOriginal: \" + Arrays.toString(nums4));\n        nextPermutation(nums4);\n        System.out.println(\"Next Permutation: \" + Arrays.toString(nums4));\n        // Expected: [1, 5, 1]\n    }\n}"}, {"name": "PivotIndex", "subcat": "", "link": "", "code": "package leetcode.array;\n\npublic class PivotIndex {\n\n    public static int pivotIndex(int[] nums) {\n        int n = nums.length;\n        int[] prefix = new int[n];\n        int[] postfix = new int[n];\n\n        int pre = 0;\n        int post = 0;\n\n        for (int i = 0; i < n; i++) {\n            prefix[i] = pre;\n            pre += nums[i];\n\n            postfix[n - 1 - i] = post;\n            post += nums[n - 1 - i];\n        }\n\n        for (int i = 0; i < n; i++) {\n            if (prefix[i] == postfix[i]) return i;\n        }\n\n        return -1;\n    }\n\n\n    public static void main(String[] args) {\n        int[] a = new int[]{1, 7, 3, 6, 5, 6};\n        // a = new int[]{2, 1, -1};\n        System.out.println(pivotIndex(a));\n    }\n\n}\n"}, {"name": "RelativeSortArray", "subcat": "", "link": "", "code": "package leetcode.array;\n\nimport java.util.Arrays;\n\n\n// LeetCode 1122: Relative Sort Array\n//\n// Problem Statement:\n// Given two arrays, `arr1` and `arr2`. The elements of `arr2` are distinct, and every\n// element in `arr2` is also in `arr1`.\n//\n// Sort the elements of `arr1` such that the relative ordering of items in `arr1` is the\n// same as the relative ordering of items in `arr2`. Elements that do not appear in `arr2`\n// should be placed at the end of `arr1` in ascending order.\n//\n// Constraints: The values in the arrays will be between 0 and 1000.\n//\n// Example:\n// Input: arr1 = [2,3,1,3,2,4,6,7,9,2,19], arr2 = [2,1,4,3,9,6]\n// Output: [2,2,2,1,4,3,3,9,6,7,19]\n\npublic class RelativeSortArray {\n\n    /**\n     * ### Intuition Behind the Solution (Counting Sort)\n     *\n     * 1.  **The Constraint is a Big Hint:** The problem states that the numbers in the arrays are\n     * within a limited range (0 to 1000). This is a classic signal to use a non-comparison-based\n     * sorting algorithm like **Counting Sort**, which can be much faster (linear time) than\n     * `O(N log N)` algorithms like QuickSort or MergeSort.\n     *\n     * 2.  **The Core Idea:** We need to handle two groups of numbers separately:\n     * - Group A: Numbers that are present in `arr2`. These must be ordered according to `arr2`.\n     * - Group B: Numbers that are *not* in `arr2`. These must be sorted ascendingly at the end.\n     *\n     * 3.  **The Algorithm's Plan (A Three-Phase Approach):**\n     * The code cleverly accomplishes this in three distinct phases.\n     *\n     * - **Phase 1: Frequency Counting.**\n     * - We can't sort or rearrange anything until we know how many of each number we have in `arr1`.\n     * - We create a \"counting\" array (or frequency map) of size 1001. `counting[x]` will store the\n     * number of times `x` appears in `arr1`.\n     * - We make a single pass through `arr1` to populate these counts.\n     *\n     * - **Phase 2: Enforce Relative Order.**\n     * - Now, we build the first part of our result. We iterate through `arr2` (e.g., `[2, 1, 4, ...]`).\n     * - For the first element `2`, we look up its count. Let's say it's 3. We then place three `2`s\n     * at the beginning of `arr1`.\n     * - For the next element `1`, we look up its count and place that many `1`s right after the `2`s.\n     * - We continue this for all elements in `arr2`. A write-pointer `index` keeps track of where to place the next number.\n     * - An important step here is to \"consume\" the counts. After placing three `2`s, we set `counting[2]` to `0` so they aren't processed again in the next phase.\n     *\n     * - **Phase 3: Append Remaining Elements.**\n     * - At this point, the `counting` array only has non-zero counts for numbers that were in `arr1` but not `arr2`.\n     * - The problem requires these to be sorted in ascending order.\n     * - We can achieve this simply by iterating through our `counting` array from index `0` to `1000`.\n     * - If `counting[i]` is greater than zero, we append `i` to our result array `arr1` that many times. Since we are iterating in ascending order of `i`, the remaining elements are automatically sorted.\n     */\n    public static int[] relativeSortArray(int[] arr1, int[] arr2) {\n        // Phase 1: Count the frequency of each number in arr1.\n        // The constraint `0 <= arr1[i] <= 1000` allows this efficient array-based counting.\n        int[] counting = new int[1001];\n        for (int val : arr1) {\n            counting[val]++;\n        }\n\n        // `index` will be our write-pointer for modifying arr1 in-place.\n        int index = 0;\n\n        // Phase 2: Place all elements from arr2 into arr1 in the correct relative order.\n        for (int val : arr2) {\n            // Place the element 'val' as many times as it was counted.\n            while (counting[val] > 0) {\n                arr1[index] = val;\n                index++;\n                counting[val]--; // Decrement the count to mark it as \"used\".\n            }\n        }\n\n        // Phase 3: Place all remaining elements (those not in arr2) at the end.\n        // We iterate through the entire possible range of numbers (0 to 1000).\n        for (int i = 0; i < counting.length; i++) {\n            // If the count for number 'i' is still positive, it means it was not in arr2.\n            while (counting[i] > 0) {\n                arr1[index] = i;\n                index++;\n                counting[i]--;\n            }\n        }\n\n        return arr1;\n    }\n\n\n    public static void main(String[] args) {\n        // Example 1: The user's original example\n        int[] arr1 = {2, 3, 1, 3, 2, 4, 6, 7, 9, 2, 19};\n        int[] arr2 = {2, 1, 4, 3, 9, 6};\n        System.out.println(\"Or
