t DFS on original graph to fill the stack with finish order ---\n        //   Loop ensures we cover disconnected components too.\n        for (int i = 0; i < vertices; i++) {\n            if (!visited[i]) {\n                fillOrder(i, visited, stack);\n            }\n        }\n\n        // --- Step 2: Create the transposed graph (reverse all edges) ---\n        createTransposedGraph();\n\n        Arrays.fill(visited, false);\n\n        List<List<Integer>> sccs = new ArrayList<>();\n\n        // --- Step 3: Second DFS on transposed graph in stack order ---\n        //   Pop vertices by decreasing finish time.\n        //   Each DFS from an unvisited vertex discovers one complete SCC.\n        while (!stack.isEmpty()) {\n            int v = stack.pop();\n            if (!visited[v]) {\n                List<Integer> component = new ArrayList<>();\n                dfsUtil(v, visited, component);\n                sccs.add(component);\n            }\n        }\n\n        return sccs;\n    }\n\n\n    public static void main(String[] args) {\n        Kosaraju g = new Kosaraju(5);\n        g.addEdge(1, 0);\n        g.addEdge(0, 2);\n        g.addEdge(2, 1);\n        g.addEdge(0, 3);\n        g.addEdge(3, 4);\n\n        System.out.println(g.findSCCs());\n    }\n\n}"}, {"name": "Kruskal", "subcat": "algo", "link": "", "code": "package leetcode.graph.algo;\n\nimport java.util.ArrayList;\nimport java.util.Collections;\nimport java.util.List;\n\n/**\n * Kruskal's Algorithm \u2014 Minimum Spanning Tree (MST)\n *\n * PROBLEM IT SOLVES:\n *   Given a weighted, undirected, connected graph, find the subset of edges\n *   that connects all vertices with the MINIMUM total edge weight and no cycles.\n *   This subset is called the Minimum Spanning Tree.\n *\n * WHEN TO USE:\n *   - Finding MST in sparse graphs (few edges relative to vertices).\n *   - Edge list representation is natural for the input.\n *   - Problems: Min Cost to Connect All Points (LC 1584), etc.\n *\n * ALGORITHM STEPS:\n *   Step 1: Collect all edges into a list.\n *   Step 2: Sort all edges by weight in ascending order.\n *   Step 3: Initialize Union-Find with V components (each vertex is its own set).\n *   Step 4: Iterate through sorted edges, for each edge (u, v, w):\n *       a) Check if u and v are in DIFFERENT components (using Union-Find \"find\").\n *       b) If YES: add edge to MST and merge their components (using \"union\").\n *          If NO:  skip the edge (it would create a cycle).\n *       c) Stop once we have V-1 edges (MST of V vertices always has V-1 edges).\n *\n * WHY IT WORKS (Greedy + Cut Property):\n *   The cut property says: for any cut of the graph, the lightest edge crossing\n *   the cut is safe to include in the MST. By processing edges in weight order,\n *   each edge we add is the cheapest that connects two separate components.\n *\n * TIME:  O(E log E) \u2014 dominated by sorting. Union-Find ops are ~O(1) amortized.\n * SPACE: O(V + E) \u2014 edge list + Union-Find arrays.\n *\n * COMPARISON:\n *   Kruskal: O(E log E), edge-centric, good for sparse graphs.\n *   Prim:    O((V + E) log V) with heap, vertex-centric, good for dense graphs.\n */\npublic class Kruskal {\n\n    public List<Edge> graph;\n    public int V;\n\n    public Kruskal(int v) {\n        graph = new ArrayList<>(v);\n        V = v;\n    }\n\n    public void addEdge(int s, int d, int w) {\n        graph.add(new Edge(s, d, w));\n    }\n\n    // Step 1: Weighted directed edge representation.\n    public static class Edge implements Comparable<Edge> {\n        public int src, dest, weight;\n\n        public Edge(int s, int d, int w) {\n            src = s;\n            dest = d;\n            weight = w;\n        }\n\n        // Step 2: Edges are sorted by weight (ascending) for the greedy approach.\n        public int compareTo(Edge other) {\n            return this.weight - other.weight;\n        }\n\n        @Override\n        public String toString() {\n            return \"Edge{\" + \"src=\" + src + \", dest=\" + dest + \", weight=\" + weight + '}';\n        }\n    }\n\n    // Step 3: Union-Find (Disjoint Set Union) \u2014 used to detect cycles.\n    //   find(x): returns the root/representative of x's component. Uses path compression.\n    //   union(x, y): merges two components. Uses union by rank for balance.\n    //   If find(x) == find(y), adding edge (x,y) would create a cycle.\n    public static class UnionFind {\n\n        private final int[] parent;\n        private final int[] rank;\n\n        public UnionFind(int n) {\n            parent = new int[n];\n            rank = new int[n];\n\n            for (int i = 0; i < n; i++) {\n                parent[i] = i;\n                rank[i] = 1;\n            }\n        }\n\n        // Find operation with path compression\n        public int find(int x) {\n            if (parent[x] != x) {\n                parent[x] = find(parent[x]);\n            }\n            return parent[x];\n        }\n\n        // Union (in broad terms, this method adds an edge between two nodes)\n        public boolean union(int x, int y) {\n            int xRoot = find(x);\n            int yRoot = find(y);\n\n            if (xRoot == yRoot) return false;\n\n            // Attach the smaller rank tree under the root of the larger rank tree\n            if (rank[xRoot] < rank[yRoot]) {\n                parent[xRoot] = yRoot;\n            } else if (rank[xRoot] > rank[yRoot]) {\n                parent[yRoot] = xRoot;\n            } else {\n                parent[yRoot] = xRoot;\n                rank[xRoot]++;\n            }\n\n            return true;\n        }\n\n    }\n\n    public List<Edge> findMST() {\n        List<Edge> result = new ArrayList<>();\n        UnionFind unionFind = new UnionFind(V);\n\n        // Step 2: Sort all edges by weight (ascending).\n        Collections.sort(graph);\n\n        // Step 4: Iterate through sorted edges and greedily build the MST.\n        for (Edge edge : graph) {\n            // Step 4a-b: If u and v are in different components, add edge to MST.\n            //   union() returns true if they were in different sets (no cycle).\n            //   Returns false if they're already connected (would form a cycle).\n            if (unionFind.union(edge.src, edge.dest)) {\n                result.add(edge);\n            }\n            // Step 4c: MST is complete when we have exactly V-1 edges.\n            if (result.size() == V - 1) break;\n        }\n\n        return result;\n    }\n\n\n    public static void main(String[] args) {\n        Kruskal kruskal = new Kruskal(4);\n        kruskal.addEdge(0, 1, 10);\n        kruskal.addEdge(0, 2, 6);\n        kruskal.addEdge(0, 3, 5);\n        kruskal.addEdge(1, 3, 15);\n        kruskal.addEdge(2, 3, 4);\n\n        System.out.println(kruskal.findMST().toString());// Total weight = 4 + 5 + 10 = 19\n        \n    }\n\n\n}\n"}, {"name": "Prims", "subcat": "algo", "link": "", "code": "package leetcode.graph.algo;\n\nimport java.util.ArrayList;\nimport java.util.List;\nimport java.util.PriorityQueue;\n\n/**\n * Prim's Algorithm \u2014 Minimum Spanning Tree (MST)\n *\n * PROBLEM IT SOLVES:\n *   Given a weighted, undirected, connected graph, find the MST \u2014 the subset\n *   of edges connecting all vertices with minimum total weight and no cycles.\n *\n * WHEN TO USE:\n *   - Finding MST, especially for dense graphs (adjacency list/matrix input).\n *   - When you grow the MST from a starting vertex outward.\n *   - Problems: Min Cost to Connect All Points (LC 1584), etc.\n *\n * ALGORITHM STEPS:\n *   Step 1: Start from an arbitrary vertex (vertex 0). Add it to a min-heap\n *           with weight 0. Mark all vertices as unvisited.\n *   Step 2: While the heap is not empty:\n *       a) Poll the edge with the smallest weight from the heap.\n *       b) If the destination vertex is already visited, skip (prevents cycles).\n *       c) Mark the vertex as visited (it's now part of the MST).\n *       d) Record this edge in the result.\n *       e) For each unvisited neighbour of this vertex, add the edge to the heap.\n *   Step 3: The result contains V edges (including the dummy start edge).\n *           The MST has V-1 real edges with minimum total weight.\n *\n * WHY IT WORKS (Greedy + Cut Property):\n *   At each step, we pick the cheapest edge crossing the cut between\n *   \"MST vertices\" and \"non-MST vertices\". The cut property guarantees\n *   this edge is safe to include in the MST.\n *\n * KEY DIFFERENCE FROM KRUSKAL:\n *   - Prim grows the MST from one vertex, expanding outward (vertex-centric).\n *   - Kruskal processes global edges in weight order (edge-centric).\n *\n * TIME:  O((V + E) log V) with binary heap.\n * SPACE: O(V + E) for adjacency list + heap + visited array.\n */\n@SuppressWarnings(\"all\")\npublic class Prims {\n    public List<List<Edge>> graph;\n    public int V;\n\n    public Prims(int v) {\n        this.V = v;\n        this.graph = new ArrayList<>();\n\n        for (int i = 0; i < V; i++) {\n            graph.add(new ArrayList<>());\n        }\n    }\n\n    public static class Edge {\n        public int dest;\n        public int weight;\n\n        public Edge(int dest, int weight) {\n            this.dest = dest;\n            this.weight = weight;\n        }\n    }\n\n    public void addEdge(int src, int dest, int weight) {\n        graph.get(src).add(new Edge(dest, weight));\n    }\n\n    public List<Edge> findMST() {\n        boolean[] visited = new boolean[V];\n\n        // Min-heap: always gives us the cheapest available edge.\n        PriorityQueue<Edge> pq = new PriorityQueue<>((e1, e2) -> e1.weight - e2.weight);\n\n        // Step 1: Start from vertex 0 with a dummy edge of weight 0.\n        pq.add(new Edge(0, 0));\n        List<Edge> result = new ArrayList<>();\n\n        // Step 2: Greedily pick the cheapest edge that connects to an unvisited vertex.\n        while (!pq.isEmpty()) {\n            // Step 2a: Poll the minimum-weight edge from the heap.\n            Edge edge = pq.poll();\n\n            // Step 2b: If destination is already in MST, skip (prevents cycles).\n            if (visited[edge.dest]) continue;\n\n            // Step 2c: Mark this vertex as part of the MST.\n            visited[edge.dest] = true;\n\n            // Step 2d: Record the edge (including the start edge with weight 0).\n            result.add(new Edge(edge.dest, edge.weight));\n\n            // Step 2e: Add all edges to unvisited neighbours as candidates.\n            for (Edge neighbor : graph.get(edge.dest)) {\n                if (!visited[neighbor.dest]) {\n                    pq.add(new Edge(neighbor.dest, neighbor.weight));\n                }\n            }\n        }\n\n        return result;\n    }\n\n    public static void main(String[] args) {\n        Prims prim = new Prims(3);\n        // A=0, B=1, C=2\n        prim.addEdge(0, 1, 2);\n        prim.addEdge(1, 0, 2);\n\n        prim.addEdge(1, 2, 1);\n        prim.addEdge(2, 1, 1);\n\n        prim.addEdge(0, 2, 3);\n        prim.addEdge(2, 0, 3);\n\n        List<Edge> mst = prim.findMST();\n        int totalWeight = 0;\n        for (Edge e : mst) {\n            System.out.println(\"Connected to: \" + e.dest + \", Weight: \" + e.weight);\n            totalWeight += e.weight;\n        }\n\n        System.out.println(\"Total Weight of MST: \" + totalWeight);\n    }\n}\n"}, {"name": "Tarjan", "subcat": "algo", "link": "", "code": "package leetcode.graph.algo;\n\nimport java.util.*;\n\n/**\n * Tarjan's Algorithm \u2014 Finding Strongly Connected Components (SCCs)\n *\n * PROBLEM IT SOLVES:\n *   Given a directed graph, find all Strongly Connected Components in a\n *   SINGLE DFS pass. An SCC is a maximal set of vertices where every\n *   vertex is reachable from every other vertex.\n *\n * WHEN TO USE:\n *   - Finding SCCs (same as Kosaraju, but single-pass and often preferred).\n *   - Finding bridges and articulation points (variant of Tarjan).\n *   - Problems: Critical Connections in a Network (LC 1192), 2-SAT, etc.\n *\n * KEY DATA STRUCTURES:\n *   disc[u]: Discovery time \u2014 when we first visit vertex u during DFS.\n *   low[u]:  The lowest discovery time reachable from u's subtree\n *            (including back edges to ancestors still on the stack).\n *   stack:   Holds vertices in the current DFS path / current SCC candidates.\n *   inStack[u]: Whether u is currently on the stack.\n *\n * ALGORITHM STEPS:\n *   Step 1: Initialize disc[] to -1 (unvisited), time = 0.\n *   Step 2: For each unvisited vertex, run DFS:\n *\n *   DFS(u):\n *     a) Set disc[u] = low[u] = time++. Push u onto stack. Mark inStack[u] = true.\n *     b) For each neighbour v of u:\n *        - If v is UNVISITED: recurse DFS(v), then low[u] = min(low[u], low[v]).\n *          (Propagate the lowest reachable ancestor back up.)\n *        - If v is ON THE STACK (back edge): low[u] = min(low[u], disc[v]).\n *          (v is an ancestor in the current DFS path \u2014 we can reach it.)\n *        - If v is VISITED but NOT on stack: ignore.\n *          (v belongs to an already-identified SCC.)\n *     c) After processing all neighbours, check: is disc[u] == low[u]?\n *        - YES: u is the ROOT of an SCC. Pop vertices from the stack until\n *          we pop u itself. All popped vertices form one SCC.\n *        - NO: u is not the root; its SCC root is higher in the DFS tree.\n *\n * INTUITION:\n *   - disc[u] == low[u] means u cannot reach any ancestor earlier than itself.\n *     It is the \"highest\" node in its SCC (the root).\n *   - The stack keeps all vertices that might still be part of the current SCC.\n *   - Back edges (to ancestors on the stack) tell us about cycles.\n *\n * TIME:  O(V + E) \u2014 single DFS pass.\n * SPACE: O(V)     \u2014 for disc[], low[], stack, inStack[].\n *\n * COMPARISON WITH KOSARAJU:\n *   - Tarjan:   1 DFS pass, slightly more complex logic. No transpose needed.\n *   - Kosaraju: 2 DFS passes + graph transpose. Conceptually simpler.\n */\npublic class Tarjan {\n\n    private int time = 0; // global timer for discovery times\n    private int[] disc;   // discovery time of each node\n    private int[] low;    // lowest discovery time reachable\n    private boolean[] inStack; // whether a node is in the current DFS stack\n    private Stack<Integer> stack; // current DFS path\n    private List<List<Integer>> sccs; // list of SCCs\n    private List<List<Integer>> graph; // adjacency list\n\n    public List<List<Integer>> findSCCs(int n, List<List<Integer>> graph) {\n        this.graph = graph;\n        disc = new int[n];\n        low = new int[n];\n        inStack = new boolean[n];\n        stack = new Stack<>();\n        sccs = new ArrayList<>();\n\n        Arrays.fill(disc, -1); // -1 means unvisited\n\n        for (int i = 0; i < n; i++) {\n            if (disc[i] == -1) {\n                dfs(i);\n            }\n        }\n\n        return sccs;\n    }\n\n    private void dfs(int u) {\n        // Step 2a: Assign discovery time and low value. Push onto stack.\n        disc[u] = low[u] = time++;\n        stack.push(u);\n        inStack[u] = true;\n\n        for (int v : graph.get(u)) {\n            if (disc[v] == -1) {\n                // Case 1: v is UNVISITED \u2014 tree edge, recurse.\n                dfs(v);\n                // After DFS returns, propagate the lowest reachable time.\n                // If v (or its descendants) can reach an earlier ancestor, so can u.\n                low[u] = Math.min(low[u], low[v]);\n            } else if (inStack[v]) {\n                // Case 2: v is ON THE STACK \u2014 back edge (cycle detected).\n                //   v is an ancestor of u in the current DFS path.\n                //   Update low[u] to reflect that u can reach as far back as v.\n                low[u] = Math.min(low[u], disc[v]);\n            }\n            // Case 3: v is visited but NOT on stack \u2014 belongs to an already\n            //   completed SCC. Ignore it (cross edge to a finished component).\n        }\n\n        // Step 2c: If disc[u] == low[u], u is the ROOT of an SCC.\n        //   This means u cannot reach any ancestor earlier than itself.\n        //   Pop everything from the stack down to u \u2014 that's the SCC.\n        if (disc[u] == low[u]) {\n            int v;\n            List<Integer> component = new ArrayList<>();\n            do {\n                v = stack.pop();\n                component.add(v);\n                inStack[v] = false;\n            } while (u != v);\n\n            sccs.add(component);\n        }\n    }\n\n    // Test Example\n    public static void main(String[] args) {\n        Tarjan tarjan = new Tarjan();\n\n        int n = 5;\n        List<List<Integer>> graph = new ArrayList<>();\n        for (int i = 0; i < n; i++) {\n            graph.add(new ArrayList<>());\n        }\n\n        graph.get(0).add(1);\n        graph.get(1).add(2);\n        graph.get(2).add(3);\n        graph.get(3).add(4);\n        graph.get(4).add(1);\n\n        System.out.println(tarjan.findSCCs(n, graph));\n    }\n}\n"}, {"name": "UnionFind", "subcat": "algo", "link": "", "code": "package leetcode.graph.algo;\n\n/**\n * Union-Find (Disjoint Set Union) \u2014 By Rank\n *\n * PROBLEM IT SOLVES:\n *   Efficiently manages a collection of disjoint (non-overlapping) sets.\n *   Supports two operations:\n *     - find(x):    Which set does x belong to? (returns the representative/root)\n *     - union(x,y): Merge the sets containing x and y into one set.\n *\n * WHEN TO USE:\n *   - Detect cycles in undirected graphs (if find(u) == find(v) before adding edge u-v, cycle exists).\n *   - Count connected components (each root = one component).\n *   - Kruskal's MST algorithm (check if adding an edge creates a cycle).\n *   - Problems: Number of Connected Components (LC 323), Redundant Connection (LC 684),\n *     Accounts Merge (LC 721), Graph Valid Tree (LC 261), etc.\n *\n * KEY OPTIMIZATIONS:\n *   1. PATH COMPRESSION (in find):\n *      After finding the root, make every node on the path point directly to the root.\n *      This flattens the tree, making future finds nearly O(1).\n *\n *   2. UNION BY RANK:\n *      Always attach the shorter tree under the taller tree's root.\n *      Keeps the tree balanced, preventing degeneration into a linked list.\n *      Rank is an upper bound on the tree height.\n *\n * ALGORITHM STEPS:\n *   Initialization:\n *     - parent[i] = i  (each element is its own root/set)\n *     - rank[i] = 1    (each tree starts with height 1)\n *\n *   find(x):\n *     Step 1: If x is its own parent, return x (it's the root).\n *     Step 2: Otherwise, recursively find root of parent[x].\n *     Step 3: Set parent[x] = root (path compression \u2014 shortcut to root).\n *     Step 4: Return the root.\n *\n *   union(x, y):\n *     Step 1: Find roots: xRoot = find(x), yRoot = find(y).\n *     Step 2: If same root, they're already in the same set \u2014 do nothing.\n *     Step 3: Attach shorter tree under taller tree (compare ranks).\n *             If equal rank, pick one as root and increment its rank.\n *\n * TIME:  O(\u03b1(n)) per operation, where \u03b1 is the inverse Ackermann function.\n *        Effectively O(1) amortized for all practical inputs.\n * SPACE: O(n) for parent[] and rank[] arrays.\n */\npublic class UnionFind {\n\n    private final int[] parent;\n    private final int[] rank;\n\n    public UnionFind(int n) {\n        parent = new int[n];\n        rank = new int[n];\n\n        for (int i = 0; i < n; i++) {\n            parent[i] = i;\n            rank[i] = 1;\n        }\n    }\n\n    // find(x): Returns the root representative of x's set.\n    //   Uses PATH COMPRESSION: after finding the root, every node on the\n    //   path from x to root gets its parent set directly to root.\n    //   This flattens the tree for fast future lookups.\n    //\n    //   Example: find(5) where 5->3->1->0 (root)\n    //     After: 5->0, 3->0, 1->0 (all point to root directly)\n    public int find(int x) {\n        if (parent[x] != x) {\n            parent[x] = find(parent[x]); // path compression\n        }\n        return parent[x];\n    }\n\n    // union(x, y): Merge the sets containing x and y.\n    //   Uses UNION BY RANK: attach the shorter tree under the taller one.\n    //   This keeps the tree balanced (height grows only when equal ranks merge).\n    //\n    //   Cases:\n    //     rank[xRoot] < rank[yRoot]: attach x's tree under y's root.\n    //     rank[xRoot] > rank[yRoot]: attach y's tree under x's root.\n    //     equal ranks: pick x as root, increment x's rank.\n    public void union(int x, int y) {\n        int xRoot = find(x);\n        int yRoot = find(y);\n\n        if (xRoot == yRoot) return; // Already in the same set\n\n        // Attach the smaller rank tree under the root of the larger rank tree\n        if (rank[xRoot] < rank[yRoot]) {\n            parent[xRoot] = yRoot;\n        } else if (rank[xRoot] > rank[yRoot]) {\n            parent[yRoot] = xRoot;\n        } else {\n            parent[yRoot] = xRoot;\n            rank[xRoot]++;\n        }\n    }\n\n    public static void main(String[] args) {\n        UnionFind unionFind = new UnionFind(8);\n        unionFind.union(1, 2);\n        unionFind.union(2, 3);\n        unionFind.union(4, 5);\n        unionFind.union(5, 6);\n        unionFind.union(6, 7);\n\n        System.out.println(\"\\nAfter find(3):\");\n        unionFind.find(3);\n        System.out.println(unionFind);\n\n        System.out.println(\"\\nAfter find(7):\");\n        unionFind.find(7);\n        System.out.println(unionFind);\n\n    }\n}\n\n\n\n\n\n"}, {"name": "UnionFindBySize", "subcat": "algo", "link": "", "code": "package leetcode.graph.algo;\n\n/**\n * Union-Find (Disjoint Set Union) \u2014 By Size\n *\n * PROBLEM IT SOLVES:\n *   Same as Union-Find by Rank: manages disjoint sets with find and union.\n *   The difference is the UNION STRATEGY: instead of tracking tree height (rank),\n *   we track the NUMBER OF NODES (size) in each set.\n *\n * WHEN TO USE:\n *   - Same use cases as UnionFind (by Rank): cycle detection, connected components,\n *     Kruskal's MST, etc.\n *   - Preferred when you need to KNOW THE SIZE of each component\n *     (e.g., \"largest connected component\" problems).\n *   - size[find(x)] directly gives the component size \u2014 no extra work.\n *\n * KEY DIFFERENCE FROM UNION BY RANK:\n *   - Union by Rank: attach shorter tree under taller tree. Rank tracks height.\n *   - Union by Size: attach smaller set under larger set. Size tracks node count.\n *   - Both achieve the same amortized time complexity.\n *   - Size variant is useful when component sizes are needed.\n *\n * ALGORITHM STEPS:\n *   Initialization:\n *     - parent[i] = i  (each element is its own root)\n *     - size[i] = 1    (each set starts with 1 element)\n *\n *   find(x): Same as by-rank \u2014 path compression to flatten the tree.\n *\n *   union(x, y):\n *     Step 1: Find roots: rootX = find(x), rootY = find(y).\n *     Step 2: If same root, already in the same set \u2014 do nothing.\n *     Step 3: Attach SMALLER set under LARGER set's root.\n *             Update the size of the new root: size[root] += size[other].\n *\n * TIME:  O(\u03b1(n)) per operation (amortized, effectively O(1)).\n * SPACE: O(n) for parent[] and size[] arrays.\n */\npublic class UnionFindBySize {\n\n    private final int[] parent;\n    private final int[] size;\n\n    public UnionFindBySize(int size) {\n        parent = new int[size];\n        this.size = new int[size];\n\n        for (int i = 0; i < size; i++) {\n            parent[i] = i;\n            this.size[i] = 1;\n        }\n    }\n\n    // find(x): Returns the root of x's set. Uses path compression.\n    public int find(int x) {\n        if (parent[x] != x) {\n            parent[x] = find(parent[x]); // path compression\n        }\n        return parent[x];\n    }\n\n    // union(x, y): Merge sets containing x and y.\n    //   Attach the SMALLER set under the LARGER set's root.\n    //   Then add the smaller set's size to the larger set's size.\n    //\n    //   Example: union(3, 7) where set(3) has 2 nodes, set(7) has 5 nodes.\n    //     rootX=find(3), rootY=find(7)\n    //     size[rootX]=2 < size[rootY]=5, so parent[rootX] = rootY\n    //     size[rootY] = 5 + 2 = 7\n    public void union(int x, int y) {\n        int rootX = find(x);\n        int rootY = find(y);\n\n        if (rootX == rootY) return; // Already in the same set\n\n        // Attach the smaller tree under the root of the larger tree\n        if (size[rootX] > size[rootY]) {\n            parent[rootY] = rootX;\n            size[rootX] += size[rootY];\n        } else {\n            parent[rootX] = rootY;\n            size[rootY] += size[rootX];\n        }\n    }\n}\n"}, {"name": "EvaluateDivision", "subcat": "connectedComponents/DG", "link": "", "code": "package leetcode.graph.connectedComponents.DG;\n\nimport java.util.*;\n\n/**\n * 399. Evaluate Division\n * https://leetcode.com/problems/evaluate-division/\n *\n * You are given an array of variable pairs equations and an array of real values\n * values, where equations[i] = [Ai, Bi] and values[i] represent the equation\n * Ai / Bi = values[i]. Each Ai or Bi is a string that represents a single variable.\n *\n * You are also given some queries, where queries[j] = [Cj, Dj] represents the\n * j-th query where you must find the answer for Cj / Dj.\n *\n * Return the answers to all queries. If a single answer cannot be determined,\n * return -1.0.\n *\n * Example 1:\n *   Input: equations = [[\"a\",\"b\"],[\"b\",\"c\"]],\n *          values = [2.0, 3.0],\n *          queries = [[\"a\",\"c\"],[\"b\",\"a\"],[\"a\",\"e\"],[\"a\",\"a\"],[\"x\",\"x\"]]\n *   Output: [6.0, 0.5, -1.0, 1.0, -1.0]\n *   Explanation: a/b=2, b/c=3 -> a/c=6, b/a=0.5, a/e=-1 (e unknown)\n *\n * Example 2:\n *   Input: equations = [[\"a\",\"b\"],[\"b\",\"c\"],[\"bc\",\"cd\"]],\n *          values = [1.5, 2.5, 5.0],\n *          queries = [[\"a\",\"c\"],[\"c\",\"b\"],[\"bc\",\"cd\"],[\"cd\",\"bc\"]]\n *   Output: [3.75, 0.4, 5.0, 0.2]\n *\n * Constraints:\n *   1 <= equations.length <= 20\n *   1 <= queries.length <= 20\n *   All strings are non-empty and consist of lowercase English letters and digits.\n *\n * ---\n * Approach: Directed Weighted Graph + DFS\n *\n * Model as a directed graph with weighted edges:\n *   a/b = 2.0  =>  edge a -> b with weight 2.0\n *                   edge b -> a with weight 0.5 (reciprocal)\n *\n * For query a/c:\n *   Find a path from a to c in the graph. The answer = product of edge weights.\n *   a -> b (2.0) -> c (3.0) => a/c = 2.0 * 3.0 = 6.0\n *\n * This is a connected components problem on a directed weighted graph:\n *   - Variables in the same component can be divided.\n *   - Variables in different components return -1.0.\n *\n * Time:  O(Q * (V + E)) where Q = queries, V = variables, E = equations\n * Space: O(V + E)\n */\npublic class EvaluateDivision {\n\n    public static double[] calcEquation(List<List<String>> equations,\n                                        double[] values,\n                                        List<List<String>> queries) {\n        // Build directed weighted graph\n        Map<String, Map<String, Double>> graph = new HashMap<>();\n\n        for (int i = 0; i < equations.size(); i++) {\n            String a = equations.get(i).get(0);\n            String b = equations.get(i).get(1);\n            double val = values[i];\n\n            // a/b = val => a -> b (weight=val), b -> a (weight=1/val)\n            graph.computeIfAbsent(a, k -> new HashMap<>()).put(b, val);\n            graph.computeIfAbsent(b, k -> new HashMap<>()).put(a, 1.0 / val);\n        }\n\n        double[] result = new double[queries.size()];\n        for (int i = 0; i < queries.size(); i++) {\n            String src = queries.get(i).get(0);\n            String dst = queries.get(i).get(1);\n\n            if (!graph.containsKey(src) || !graph.containsKey(dst)) {\n                // Variable doesn't exist in any equation\n                result[i] = -1.0;\n            } else if (src.equals(dst)) {\n                // x / x = 1.0\n                result[i] = 1.0;\n            } else {\n                // DFS to find path from src to dst, multiply edge weights\n                Set<String> visited = new HashSet<>();\n                result[i] = dfs(graph, src, dst, 1.0, visited);\n            }\n        }\n\n        return result;\n    }\n\n    /**\n     * DFS: find path from current to target, accumulating the product of weights.\n     *\n     * @param graph   adjacency list with weighted edges\n     * @param current current node\n     * @param target  target node\n     * @param product running product of edge weights along the path\n     * @param visited set of visited nodes (to avoid cycles)\n     * @return the product of weights from current to target, or -1.0 if unreachable\n     */\n    private static double dfs(Map<String, Map<String, Double>> graph,\n                              String current, String target,\n                              double product, Set<String> visited) {\n        visited.add(current);\n\n        // Check if target is a direct neighbor\n        Map<String, Double> neighbors = graph.get(current);\n        if (neighbors.containsKey(target)) {\n            return product * neighbors.get(target);\n        }\n\n        // Explore all unvisited neighbors\n        for (Map.Entry<String, Double> entry : neighbors.entrySet()) {\n            String neighbor = entry.getKey();\n            double weight = entry.getValue();\n\n            if (!visited.contains(neighbor)) {\n                double result = dfs(graph, neighbor, target, product * weight, visited);\n                if (result != -1.0) return result;\n            }\n        }\n\n        return -1.0; // Target unreachable from current\n    }\n\n    // -------------------- BFS Alternative --------------------\n    public static double[] calcEquationBFS(List<List<String>> equations,\n                                           double[] values,\n                                           List<List<String>> queries) {\n        Map<String, Map<String, Double>> graph = new HashMap<>();\n\n        for (int i = 0; i < equations.size(); i++) {\n            String a = equations.get(i).get(0);\n            String b = equations.get(i).get(1);\n            graph.computeIfAbsent(a, k -> new HashMap<>()).put(b, values[i]);\n            graph.computeIfAbsent(b, k -> new HashMap<>()).put(a, 1.0 / values[i]);\n        }\n\n        double[] result = new double[queries.size()];\n        for (int i = 0; i < queries.size(); i++) {\n            String src = queries.get(i).get(0);\n            String dst = queries.get(i).get(1);\n            result[i] = bfs(graph, src, dst);\n        }\n        return result;\n    }\n\n    private static double bfs(Map<String, Map<String, Double>> graph,\n                              String src, String dst) {\n        if (!graph.containsKey(src) || !graph.containsKey(dst)) return -1.0;\n        if (src.equals(dst)) return 1.0;\n\n        // Queue holds (node, productSoFar)\n        Queue<Object[]> queue = new LinkedList<>();\n        Set<String> visited = new HashSet<>();\n        queue.offer(new Object[]{src, 1.0});\n        visited.add(src);\n\n        while (!queue.isEmpty()) {\n            Object[] curr = queue.poll();\n            String node = (String) curr[0];\n            double product = (double) curr[1];\n\n            for (Map.Entry<String, Double> entry : graph.get(node).entrySet()) {\n                String neighbor = entry.getKey();\n                double weight = entry.getValue();\n\n                if (neighbor.equals(dst)) return product * weight;\n\n                if (!visited.contains(neighbor)) {\n                    visited.add(neighbor);\n                    queue.offer(new Object[]{neighbor, product * weight});\n                }\n            }\n        }\n\n        return -1.0;\n    }\n\n    public static void main(String[] args) {\n        List<List<String>> equations = List.of(List.of(\"a\", \"b\"), List.of(\"b\", \"c\"));\n        double[] values = {2.0, 3.0};\n        List<List<String>> queries = List.of(\n            List.of(\"a\", \"c\"), List.of(\"b\", \"a\"),\n            List.of(\"a\", \"e\"), List.of(\"a\", \"a\"), List.of(\"x\", \"x\")\n        );\n\n        System.out.println(\"DFS: \" + Arrays.toString(calcEquation(equations, values, queries)));\n        // [6.0, 0.5, -1.0, 1.0, -1.0]\n\n        System.out.println(\"BFS: \" + Arrays.toString(calcEquationBFS(equations, values, queries)));\n        // [6.0, 0.5, -1.0, 1.0, -1.0]\n    }\n}\n"}, {"name": "AccountsMerge", "subcat": "connectedComponents/UG", "link": "", "code": "package leetcode.graph.connectedComponents.UG;\n\nimport java.util.ArrayList;\nimport java.util.Arrays;\nimport java.util.Collections;\nimport java.util.HashMap;\nimport java.util.HashSet;\nimport java.util.List;\nimport java.util.Map;\nimport java.util.Set;\n\n/**\n * 721. Accounts Merge\n * https://leetcode.com/problems/accounts-merge/\n *\n * Given a list of accounts where each element accounts[i] is a list of strings,\n * where the first element accounts[i][0] is a name, and the rest of the elements\n * are emails representing emails of the account.\n *\n * Now, we would like to merge these accounts. Two accounts belong to the same\n * person if there is some common email to both accounts. After merging, return\n * the accounts in the format: the first element is the name, the rest are emails\n * in sorted order.\n *\n * Example:\n *   Input: accounts = [[\"John\",\"johnsmith@mail.com\",\"john_newyork@mail.com\"],\n *                      [\"John\",\"johnsmith@mail.com\",\"john00@mail.com\"],\n *                      [\"Mary\",\"mary@mail.com\"],\n *                      [\"John\",\"johnnybravo@mail.com\"]]\n *   Output: [[\"John\",\"john00@mail.com\",\"john_newyork@mail.com\",\"johnsmith@mail.com\"],\n *            [\"Mary\",\"mary@mail.com\"],\n *            [\"John\",\"johnnybravo@mail.com\"]]\n *\n * Constraints:\n *   1 <= accounts.length <= 1000\n *   2 <= accounts[i].length <= 10\n *   1 <= accounts[i][j].length <= 30\n *\n * ---\n * Approach: DFS on undirected graph of emails\n *\n * 1. Build a graph: for each account, connect the first email to all other emails\n *    (they belong to the same person).\n * 2. DFS/BFS to find connected components \u2014 each component is one merged account.\n * 3. Sort the emails in each component and prepend the name.\n *\n * Time:  O(N * K * log(N * K)) where N = accounts, K = max emails per account\n * Space: O(N * K)\n */\npublic class AccountsMerge {\n\n    /**\n     * emailToName {\n     * \"johnsmith@mail.com\" -> [\"john_newyork@mail.com\", \"john00@mail.com\"],\n     * \"john_newyork@mail.com\" -> [\"johnsmith@mail.com\"],\n     * \"john00@mail.com\" -> [\"johnsmith@mail.com\"],\n     * \"mary@mail.com\" -> [\"mary@mail.com\"], // only one email, no edges\n     * \"johnnybravo@mail.com\" -> [\"johnnybravo@mail.com\"] // same\n     * }\n     * \n     * graph {\n     * \"johnsmith@mail.com\": [\"johnsmith@mail.com\", \"john_newyork@mail.com\",\n     * \"johnsmith@mail.com\", \"john00@mail.com\"],\n     * \"john_newyork@mail.com\": [\"johnsmith@mail.com\"],\n     * \"john00@mail.com\": [\"johnsmith@mail.com\"],\n     * \"mary@mail.com\": [\"mary@mail.com\"],\n     * \"johnnybravo@mail.com\": [\"johnnybravo@mail.com\"]\n     * }\n     * \n     **/\n\n    public List<List<String>> accountsMerge(List<List<String>> accounts) {\n        Map<String, String> emailToName = new HashMap<>();\n        Map<String, List<String>> graph = new HashMap<>();\n\n        for (List<String> account : accounts) {\n            for (int i = 1; i < account.size(); i++) {\n                // Map Email to Name\n                emailToName.put(account.get(i), account.get(0));\n                // Build Undirected Graph\n                graph.computeIfAbsent(account.get(1), k -> new ArrayList<>()).add(account.get(i));\n                graph.computeIfAbsent(account.get(i), k -> new ArrayList<>()).add(account.get(1));\n            }\n        }\n\n        List<List<String>> result = new ArrayList<>();\n        Set<String> visited = new HashSet<>();\n\n        for (String node : graph.keySet()) {\n            List<String> component = new ArrayList<>();\n            if (visited.contains(node))\n                continue;\n\n            dfsUtil(node, graph, visited, component);\n            Collections.sort(component);\n            component.add(0, emailToName.get(node));\n            result.add(component);\n        }\n\n        return result;\n    }\n\n    public void dfsUtil(String node, Map<String, List<String>> graph, Set<String> visited, List<String> component) {\n        visited.add(node);\n        component.add(node);\n\n        for (String neighbour : graph.get(node)) {\n            if (!visited.contains(neighbour)) {\n                dfsUtil(neighbour, graph, visited, component);\n            }\n        }\n    }\n\n    public static void main(String[] args) {\n        List<List<String>> accounts = Arrays.asList(\n                Arrays.asList(\"John\", \"johnsmith@mail.com\", \"john_newyork@mail.com\"),\n                Arrays.asList(\"John\", \"johnsmith@mail.com\", \"john00@mail.com\"),\n                Arrays.asList(\"Mary\", \"mary@mail.com\"),\n                Arrays.asList(\"John\", \"johnnybravo@mail.com\"));\n\n        System.out.println(new AccountsMerge().accountsMerge(accounts));\n    }\n\n}\n"}, {"name": "ConnectedComponentsUF", "subcat": "connectedComponents/UG", "link": "", "code": "package leetcode.graph.connectedComponents.UG;\n\n/**\n * 323. Number of Connected Components in an Undirected Graph\n * https://leetcode.com/problems/number-of-connected-components-in-an-undirected-graph/\n *\n * You have a graph of n nodes. You are given an integer n and an array edges\n * where edges[i] = [ai, bi] indicates that there is an edge between ai and bi\n * in the graph.\n *\n * Return the number of connected components in the graph.\n *\n * Example 1:\n *   Input: n = 5, edges = [[0,1],[1,2],[3,4]]\n *   Output: 2\n *\n * Example 2:\n *   Input: n = 5, edges = [[0,1],[1,2],[2,3],[3,4]]\n *   Output: 1\n *\n * Constraints:\n *   1 <= n <= 2000\n *   1 <= edges.length <= 5000\n *\n * ---\n * Approach: Union-Find\n *\n * Start with n components. For each edge, union the two nodes.\n * Each successful union decrements the component count by 1.\n * Final count = number of connected components.\n *\n * Time:  O(E * \u03b1(N)) \u2248 O(E)\n * Space: O(N)\n */\npublic class ConnectedComponentsUF {\n\n    private static class UnionFind {\n        private int count;\n        private int[] parent;\n        private int[] rank;\n\n        /**\n         * Initialize the Union Set\n         *\n         * @param n number of vertices\n         */\n        private UnionFind(int n) {\n            parent = new int[n];\n            rank = new int[n];\n            count = n;\n            for (int i = 0; i < n; i++) {\n                parent[i] = i;\n                rank[i] = 0;\n            }\n        }\n\n        /**\n         * Find the root of the set\n         *\n         * @param x vertex\n         * @return root of the set\n         */\n        private int find(int x) {\n            if (parent[x] != x) {\n                parent[x] = find(parent[x]);\n            }\n            return parent[x];\n        }\n\n        /**\n         * Union the two sets\n         *\n         * @param x vertex\n         * @param y vertex\n         */\n        private void union(int x, int y) {\n            int rootX = find(x);\n            int rootY = find(y);\n\n            if (rootX == rootY) return;\n\n            if (rank[rootX] < rank[rootY]) {\n                parent[rootX] = rootY;\n                rank[rootY]++;\n            } else {\n                parent[rootY] = rootX;\n                rank[rootX]++;\n            }\n\n            count--;\n        }\n    }\n\n\n    /**\n     * Count the number of connected components in the graph\n     *\n     * @param n     number of vertices\n     * @param edges edges of the graph\n     * @return number of connected components\n     */\n    public static int countComponents(int n, int[][] edges) {\n        UnionFind uf = new UnionFind(n);\n        for (int[] edge : edges) {\n            uf.union(edge[0], edge[1]);\n        }\n        return uf.count;\n    }\n\n\n    public static void main(String[] args){\n       int  n = 5;\n       int[][] edges = new int[][] {{0, 1}, {1, 2}, {3, 4}};\n       System.out.println(countComponents(n, edges)); // 2\n       edges = new int[][] {{0, 1}, {1, 2}, {2, 3}, {3, 4}};\n       System.out.println(countComponents(n, edges)); // 1\n    }\n\n}\n"}, {"name": "RedundantConnectionDFS", "subcat": "cycle/DG", "link": "", "code": "package leetcode.graph.cycle.DG;\n\nimport java.util.ArrayList;\nimport java.util.Arrays;\nimport java.util.List;\n\n/**\n * 684. Redundant Connection\n * https://leetcode.com/problems/redundant-connection/\n *\n * In this problem, a tree is an undirected graph that is connected and has no cycles.\n * You are given a graph that started as a tree with n nodes (1 to n), with one\n * additional edge added. The added edge connects two vertices and is not a duplicate.\n *\n * Return an edge that can be removed so that the resulting graph is a tree.\n * If there are multiple answers, return the answer that occurs last in the input.\n *\n * Example 1:\n *   Input: edges = [[1,2],[1,3],[2,3]]\n *   Output: [2,3]\n *\n * Example 2:\n *   Input: edges = [[1,2],[2,3],[3,4],[1,4],[1,5]]\n *   Output: [1,4]\n *\n * Constraints:\n *   n == edges.length\n *   3 <= n <= 1000\n *   There are no repeated edges or self-loops.\n *\n * ---\n * Approach: DFS Cycle Detection\n *\n * Build the graph incrementally. After adding each edge, run DFS to check\n * for a cycle. The first edge that creates a cycle is the redundant one.\n *\n * Time:  O(N^2) \u2014 DFS after each edge insertion\n * Space: O(N)\n */\npublic class RedundantConnectionDFS {\n\n    private static boolean hasCycle(int current, int parent, boolean[] visited, List<List<Integer>> graph) {\n        visited[current] = true;\n\n        for (int neighbor : graph.get(current)) {\n            // Skip the edge that connects to the parent node\n            if (neighbor == parent) {\n                continue;\n            }\n            // If we found a visited node that's not our parent, we have a cycle\n            if (visited[neighbor]) {\n                return true;\n            }\n            // Recursively check the unvisited neighbor\n            if (hasCycle(neighbor, current, visited, graph)) {\n                return true;\n            }\n        }\n\n        return false;\n    }\n\n    public static int[] findRedundantConnection(int[][] edges) {\n        int n = edges.length;\n        List<List<Integer>> adjacencyList = new ArrayList<>(n + 1);\n\n        for (int i = 0; i <= n; i++) {\n            adjacencyList.add(new ArrayList<>());\n        }\n\n        for (int[] edge : edges) {\n            int u = edge[0];\n            int v = edge[1];\n\n            adjacencyList.get(u).add(v);\n            adjacencyList.get(v).add(u);\n\n            boolean[] visited = new boolean[n + 1];\n\n            if (hasCycle(u, -1, visited, adjacencyList)) {\n                return edge;\n            }\n        }\n\n        return new int[2];\n    }\n\n    public static void main(String[] args) {\n        int[][] edges = { { 1, 2 }, { 1, 3 }, { 2, 3 } };\n        int[] result = findRedundantConnection(edges);\n        System.out.println(Arrays.toString(result));\n    }\n\n}\n"}, {"name": "RedundantConnectionUF", "subcat": "cycle/DG", "link": "", "code": "package leetcode.graph.cycle.DG;\n\nimport java.util.Arrays;\n\n/**\n * 684. Redundant Connection (Union-Find approach)\n * https://leetcode.com/problems/redundant-connection/\n *\n * In this problem, a tree is an undirected graph that is connected and has no cycles.\n * You are given a graph that started as a tree with n nodes (1 to n), with one\n * additional edge added. Return an edge that can be removed so that the resulting\n * graph is a tree. If multiple answers, return the one occurring last in input.\n *\n * Example 1: edges = [[1,2],[1,3],[2,3]] -> [2,3]\n * Example 2: edges = [[1,2],[2,3],[3,4],[1,4],[1,5]] -> [1,4]\n *\n * ---\n * Approach: Union-Find\n *\n * Process edges one by one. For each edge (u, v):\n *   - If find(u) == find(v), they're already connected -> this edge creates a cycle.\n *   - Otherwise, union them.\n * The first edge where union fails (same root) is the redundant connection.\n *\n * Time:  O(N * \u03b1(N)) \u2248 O(N)\n * Space: O(N)\n */\n@SuppressWarnings(\"all\")\npublic class RedundantConnectionUF {\n\n    private static class UnionFind {\n        private final int[] parent;\n        private final int[] rank;\n\n        /**\n         * Initialize the Union Set\n         *\n         * @param n number of vertices\n         */\n        private UnionFind(int n) {\n            parent = new int[n];\n            rank = new int[n];\n            for (int i = 0; i < n; i++) {\n                parent[i] = i;\n                rank[i] = 1;\n            }\n        }\n\n\n        private int find(int x) {\n            if (parent[x] != x) {\n                parent[x] = find(parent[x]);\n            }\n            return parent[x];\n        }\n\n\n        private boolean union(int x, int y) {\n            int rootX = find(x);\n            int rootY = find(y);\n\n            if (rootX == rootY) return true;\n\n            if (rank[rootX] < rank[rootY]) {\n                parent[rootX] = rootY;\n                rank[rootY]++;\n            } else {\n                parent[rootY] = rootX;\n                rank[rootX]++;\n            }\n\n            return false;\n        }\n    }\n\n\n    /**\n     * Find the redundant connection\n     *\n     * @param edges edges of the graph\n     * @return redundant connection\n     */\n    public static int[] findRedundantConnection(int[][] edges) {\n        int n = edges.length + 1;\n        UnionFind uf = new UnionFind(n);\n        for (int[] edge : edges) {\n            if (uf.union(edge[0], edge[1])) {\n                return new int[]{edge[0], edge[1]};\n            }\n        }\n        return new int[0];\n    }\n\n\n    public static void main(String[] args) {\n        int[][] edges = {{1, 2}, {1, 3}, {2, 3}};\n        int[] result = findRedundantConnection(edges);\n        System.out.println(Arrays.toString(result));\n    }\n\n\n}\n"}, {"name": "BipartiteGraph", "subcat": "cycle/UG", "link": "", "code": "package leetcode.graph.cycle.UG;\n\nimport java.util.LinkedList;\nimport java.util.Queue;\n\n/**\n * 785. Is Graph Bipartite?\n * https://leetcode.com/problems/is-graph-bipartite/\n *\n * There is an undirected graph with n nodes, where each node is numbered\n * between 0 and n-1. You are given a 2D array graph, where graph[u] is an\n * array of nodes that node u is adjacent to.\n *\n * A graph is bipartite if the nodes can be partitioned into two independent\n * sets A and B such that every edge connects a node in A to a node in B.\n *\n * Return true if and only if it is bipartite.\n *\n * Example 1:\n *   Input: graph = [[1,2,3],[0,2],[0,1,3],[0,2]]\n *   Output: false\n *   Explanation: No way to partition nodes into two sets so that every edge\n *   crosses sets. (0-1, 0-2, 1-2 form an odd cycle)\n *\n * Example 2:\n *   Input: graph = [[1,3],[0,2],[1,3],[0,2]]\n *   Output: true\n *   Explanation: Partition: A={0,2}, B={1,3}. All edges cross the partition.\n *\n * Constraints:\n *   graph.length == n\n *   1 <= n <= 100\n *   0 <= graph[u].length < n\n *   No self-edges. No parallel edges. If v \u2208 graph[u], then u \u2208 graph[v].\n *\n * ---\n * Key insight: A graph is bipartite \u27fa it contains no odd-length cycle.\n *\n * Approach: BFS / DFS graph coloring\n *\n * Try to 2-color the graph:\n *   - Pick an uncolored node, color it RED.\n *   - All its neighbors must be BLUE, their neighbors RED, etc.\n *   - If we ever try to color a node that's already the WRONG color -> not bipartite.\n *\n * Must handle disconnected components: iterate over all nodes, run BFS/DFS\n * on each unvisited component.\n *\n * Time:  O(V + E)\n * Space: O(V)\n */\npublic class BipartiteGraph {\n\n    // -------------------- BFS (2-coloring) --------------------\n    public static boolean isBipartiteBFS(int[][] graph) {\n        int n = graph.length;\n        // color[i]: 0 = unvisited, 1 = color A, -1 = color B\n        int[] color = new int[n];\n\n        // Handle disconnected components\n        for (int i = 0; i < n; i++) {\n            if (color[i] != 0) continue; // Already colored\n\n            // BFS from node i\n            Queue<Integer> queue = new LinkedList<>();\n            queue.offer(i);\n            color[i] = 1; // Start with color A\n\n            while (!queue.isEmpty()) {\n                int node = queue.poll();\n\n                for (int neighbor : graph[node]) {\n                    if (color[neighbor] == 0) {\n                        // Unvisited: assign opposite color\n                        color[neighbor] = -color[node];\n                        queue.offer(neighbor);\n                    } else if (color[neighbor] == color[node]) {\n                        // Same color as current node -> odd cycle -> not bipartite\n                        return false;\n                    }\n                    // else: already colored with the correct opposite color, skip\n                }\n            }\n        }\n\n        return true;\n    }\n\n    // -------------------- DFS (2-coloring) --------------------\n    public static boolean isBipartiteDFS(int[][] graph) {\n        int n = graph.length;\n        int[] color = new int[n]; // 0 = unvisited, 1 = color A, -1 = color B\n\n        for (int i = 0; i < n; i++) {\n            // If unvisited, try to 2-color the component starting from node i\n            if (color[i] == 0 && !dfs(graph, color, i, 1)) {\n                return false;\n            }\n        }\n\n        return true;\n    }\n\n    private static boolean dfs(int[][] graph, int[] color, int node, int c) {\n        color[node] = c;\n\n        for (int neighbor : graph[node]) {\n            if (color[neighbor] == 0) {\n                // Unvisited: color with opposite and recurse\n                if (!dfs(graph, color, neighbor, -c)) {\n                    return false;\n                }\n            } else if (color[neighbor] == c) {\n                // Conflict: neighbor has the same color\n                return false;\n            }\n        }\n\n        return true;\n    }\n\n    public static void main(String[] args) {\n        // Example 1: Not bipartite (triangle 0-1-2)\n        int[][] graph1 = {{1, 2, 3}, {0, 2}, {0, 1, 3}, {0, 2}};\n        System.out.println(\"BFS: \" + isBipartiteBFS(graph1)); // false\n        System.out.println(\"DFS: \" + isBipartiteDFS(graph1)); // false\n\n        // Example 2: Bipartite (even cycle 0-1-2-3)\n        int[][] graph2 = {{1, 3}, {0, 2}, {1, 3}, {0, 2}};\n        System.out.println(\"BFS: \" + isBipartiteBFS(graph2)); // true\n        System.out.println(\"DFS: \" + isBipartiteDFS(graph2)); // true\n    }\n}\n"}, {"name": "MinCostToConnectAllPoints", "subcat": "mst", "link": "", "code": "package leetcode.graph.mst;\n\nimport java.util.ArrayList;\nimport java.util.Arrays;\nimport java.util.List;\nimport java.util.PriorityQueue;\n\n/**\n * 1584. Min Cost to Connect All Points\n * https://leetcode.com/problems/min-cost-to-connect-all-points/\n *\n * You are given an array points where points[i] = [xi, yi] represents a point\n * on the X-Y plane. The cost of connecting two points [xi, yi] and [xj, yj] is\n * the Manhattan distance between them: |xi - xj| + |yi - yj|.\n *\n * Return the minimum cost to make all points connected. All points are connected\n * if there is exactly one simple path between any two points.\n *\n * Example 1:\n *   Input: points = [[0,0],[2,2],[3,10],[5,2],[7,0]]\n *   Output: 20\n *\n * Example 2:\n *   Input: points = [[3,12],[-2,5],[-4,1]]\n *   Output: 18\n *\n * Constraints:\n *   1 <= points.length <= 1000\n *   -10^6 <= xi, yi <= 10^6\n *   All pairs (xi, yi) are distinct.\n *\n * ---\n * Approach: MST (Minimum Spanning Tree)\n *\n * The problem is finding an MST on a complete graph where edge weight = Manhattan distance.\n *\n * Two classic algorithms:\n * 1. Kruskal's: Sort all edges by weight, greedily add edges using Union-Find to avoid cycles.\n *    Time: O(N^2 log N) for sorting all N*(N-1)/2 edges.\n * 2. Prim's: Grow the MST from a source, always picking the cheapest edge to an unvisited node.\n *    Time: O(N^2) with adjacency matrix / O(N^2 log N) with priority queue.\n *\n * Time:  O(N^2 log N)\n * Space: O(N^2)\n */\npublic class MinCostToConnectAllPoints {\n\n    private static class UnionFind {\n        private final int[] parent;\n        private final int[] rank;\n\n        /**\n         * Initialize the Union Set\n         *\n         * @param n number of vertices\n         */\n        private UnionFind(int n) {\n            parent = new int[n];\n            rank = new int[n];\n            for (int i = 0; i < n; i++) {\n                parent[i] = i;\n                rank[i] = 1;\n            }\n        }\n\n        /**\n         * Find the root of the set\n         *\n         * @param x vertex\n         * @return root of the set\n         */\n        private int find(int x) {\n            if (parent[x] != x) {\n                parent[x] = find(parent[x]);\n            }\n            return parent[x];\n        }\n\n        /**\n         * Union the two sets\n         *\n         * @param x vertex\n         * @param y vertex\n         */\n        private boolean union(int x, int y) {\n            int rootX = find(x);\n            int rootY = find(y);\n\n            if (rootX == rootY) return false;\n\n            if (rank[rootX] < rank[rootY]) {\n                parent[rootX] = rootY;\n                rank[rootY]++;\n            } else {\n                parent[rootY] = rootX;\n                rank[rootX]++;\n            }\n\n            return true;\n        }\n    }\n\n    /**\n     * Manhattan Distance between two points\n     *\n     * @param p1 point 1\n     * @param p2 point 2\n     * @return manhattan distance\n     */\n    private static int manhattanDistance(int[] p1, int[] p2) {\n        return Math.abs(p1[0] - p2[0]) + Math.abs(p1[1] - p2[1]);\n    }\n\n    //---------------------------------------------kruskal's Algorithm---------------------------------------------//\n\n    /**\n     * Kruskal's Algorithm\n     *\n     * @param points points\n     * @return minimum cost to connect all points\n     */\n    private static int kruskal(int[][] points) {\n        int vertex = points.length;  // Number of vertices\n        List<int[]> edges = new ArrayList<>();\n\n        // Step 1: Generate all edges with their Manhattan distances\n        for (int i = 0; i < vertex; i++) {\n            for (int j = i + 1; j < vertex; j++) {\n                int dist = manhattanDistance(points[i], points[j]);\n                edges.add(new int[]{i, j, dist});\n            }\n        }\n\n        /*  Step 2: Sort edges by distance */\n        edges.sort((a, b) -> Integer.compare(a[2], b[2]));  // a[2] and b[2] are distances\n\n        /* Step 3. Create a Union Find data structure to detect cycle */\n        UnionFind uf = new UnionFind(vertex);\n        int minCost = 0;\n\n        /*Step 4. Spanning tree always will have total vertex - 1 edges */\n        int minimumSpanningTree = vertex - 1;\n\n        /*Step 5. Traverse through the edges and add the cost of edge if it doesn't form a cycle */\n        for (int[] edge : edges) {\n            int u = edge[0];\n            int v = edge[1];\n            int cost = edge[2];\n\n            // Add the edge if there is no cycle\n            if (uf.union(u, v)) {\n                minCost += cost;\n                minimumSpanningTree--;\n\n                if (minimumSpanningTree == 0) break;\n            }\n        }\n\n        return minCost;\n    }\n\n    //---------------------------------------------Prims Algorithm---------------------------------------------//\n\n    private static int prims(int[][] points) {\n        int n = points.length;\n\n        // 1. Create a priority queue that will store the minimum cost edge for each point.\n        PriorityQueue<int[]> priorityQueue = new PriorityQueue<>((a, b) -> a[0] - b[0]);\n\n        // push the first vertex with cost 0 (the source vertex)\n        priorityQueue.add(new int[]{0, 0}); // {cost, vertex index}\n\n        // 2. Create an array to store the minimum cost to connect each vertex.\n        int[] minCost = new int[n];\n        Arrays.fill(minCost, Integer.MAX_VALUE);\n\n        minCost[0] = 0;\n\n        // 3. Create a visited array to check whether a vertex has been added to the MST.\n        boolean[] visited = new boolean[n];\n        int totalCost = 0;\n\n        // 4. Iterate through the priority queue to process all vertices.\n        while (!priorityQueue.isEmpty()) {\n\n            // Get the vertex with the smallest edge weight.\n            int[] current = priorityQueue.poll();\n            int cost = current[0];\n            int u = current[1];\n\n            // If this vertex is already visited, continue.\n            if (visited[u]) continue;\n            visited[u] = true;\n\n            // Add the current cost to the total cost (this is part of the MST).\n            totalCost += cost;\n\n            // 5. For each neighboring vertex, calculate the Manhattan distance.\n            for (int v = 0; v < n; v++) {\n                if (!visited[v]) {\n                    int newCost = manhattanDistance(points[u], points[v]);\n\n                    // If this edge offers a smaller cost, update the priority queue and the minCost array.\n                    if (newCost < minCost[v]) {\n                        minCost[v] = newCost;\n                        priorityQueue.add(new int[]{newCost, v});\n                    }\n                }\n            }\n        }\n\n        return totalCost;\n    }\n\n\n    public static int minCostConnectPoints(int[][] points) {\n        return prims(points);\n    }\n\n    public static void main(String[] args) {\n        int[][] points = {{0, 0}, {2, 2}, {3, 10}, {5, 2}, {7, 0}};\n        System.out.println(kruskal(points));\n        System.out.println(prims(points));\n    }\n\n}\n"}, {"name": "AdjacencyMatrix", "subcat": "representations", "link": "", "code": "package leetcode.graph.representations;\n\n\npublic class AdjacencyMatrix {\n\n    private final int[][] matrix;\n    private final int numVertices;\n    private static final int INFINITY = Integer.MAX_VALUE;\n\n\n    public AdjacencyMatrix(int numVertices) {\n        this.numVertices = numVertices;\n        this.matrix = new int[numVertices][numVertices];\n\n        // Initialize all connections to infinity and diagonals to 0.\n        for (int i = 0; i < numVertices; i++) {\n            for (int j = 0; j < numVertices; j++) {\n                if (i == j) {\n                    matrix[i][j] = 0;\n                } else {\n                    matrix[i][j] = INFINITY;\n                }\n            }\n        }\n    }\n\n    /**\n     * Adds an edge to the graph. For an undirected graph, it adds\n     * the edge in both directions.\n     */\n    public void addEdge(int source, int destination, int weight) {\n        if (source < 0 || source >= numVertices || destination < 0 || destination >= numVertices) {\n            throw new IllegalArgumentException(\"Vertex out of bounds\");\n        }\n        matrix[source][destination] = weight;\n        matrix[destination][source] = weight; // For undirected graph\n    }\n\n\n    static void main(String[] args) {\n        int numVertices = 4;\n        AdjacencyMatrix graph = new AdjacencyMatrix(numVertices);\n\n        // Add the edges from our example\n        graph.addEdge(0, 1, 5);\n        graph.addEdge(0, 2, 9);\n        graph.addEdge(1, 3, 2);\n        graph.addEdge(2, 3, 3);\n    }\n}\n"}, {"name": "EdgeList", "subcat": "representations", "link": "", "code": "package leetcode.graph.representations;\n\nimport java.util.ArrayList;\nimport java.util.List;\n\npublic class EdgeList {\n\n    // A simple inner class to represent an edge\n    static class Edge {\n        int source;\n        int destination;\n        int weight;\n\n        public Edge(int source, int destination, int weight) {\n            this.source = source;\n            this.destination = destination;\n            this.weight = weight;\n        }\n\n        @Override\n        public String toString() {\n            return String.format(\"(%d -- %d, w:%d)\", source, destination, weight);\n        }\n    }\n\n    private final List<Edge> edgeList;\n    private final int numVertices;\n\n    public EdgeList(int numVertices) {\n        this.numVertices = numVertices;\n        this.edgeList = new ArrayList<>();\n    }\n\n    public void addEdge(int source, int destination, int weight) {\n        if (source < 0 || source >= numVertices || destination < 0 || destination >= numVertices) {\n            throw new IllegalArgumentException(\"Vertex out of bounds\");\n        }\n        // For both directed and undirected graphs, we just add one edge object\n        Edge edge = new Edge(source, destination, weight);\n        edgeList.add(edge);\n    }\n\n\n     static void main(String[] args) {\n        int numVertices = 4;\n         EdgeList graph = new EdgeList(numVertices);\n\n        // Add the edges from our example\n        graph.addEdge(0, 1, 5);\n        graph.addEdge(0, 2, 9);\n        graph.addEdge(1, 3, 2);\n        graph.addEdge(2, 3, 3);\n    }\n}\n"}, {"name": "Node", "subcat": "representations", "link": "", "code": "package leetcode.graph.representations;\n\nimport java.util.ArrayList;\nimport java.util.List;\n\n/**\n * Defines a Node for an unweighted graph.\n * Each node contains a value and a list of references to its neighbors.\n * This is a common structure for graph problems where the graph is\n * built dynamically or provided as a network of objects.\n */\npublic class Node {\n    // The value or label of the node.\n    public int val;\n    // A list of direct references to neighboring nodes.\n    public List<Node> neighbors;\n\n    /**\n     * Default constructor. Initializes an empty node with value 0.\n     */\n    public Node() {\n        val = 0;\n        neighbors = new ArrayList<>();\n    }\n\n    /**\n     * Constructor to create a node with a specific value.\n     *\n     * @param _val The integer value for the node.\n     */\n    public Node(int _val) {\n        val = _val;\n        neighbors = new ArrayList<>();\n    }\n\n    /**\n     * Constructor to create a node with a specific value and a predefined list of neighbors.\n     *\n     * @param _val       The integer value for the node.\n     * @param _neighbors A list of nodes that are neighbors to this node.\n     */\n    public Node(int _val, List<Node> _neighbors) {\n        val = _val;\n        neighbors = _neighbors;\n    }\n\n    /**\n     * Adds a directed edge from this node to a neighbor node.\n     * To create an undirected graph, you must call this method on both nodes.\n     * For example: nodeA.addEdge(nodeB) and nodeB.addEdge(nodeA).\n     *\n     * @param neighbor The node to connect to.\n     */\n    public void addEdge(Node neighbor) {\n        this.neighbors.add(neighbor);\n    }\n\n    @Override\n    public String toString() {\n        StringBuilder sb = new StringBuilder();\n        sb.append(\"Node(val: \").append(val).append(\", neighbors: [\");\n        if (neighbors != null) {\n            for (int i = 0; i < neighbors.size(); i++) {\n                // We print neighbor.val to avoid infinite recursion in graphs with cycles\n                sb.append(neighbors.get(i).val);\n                if (i < neighbors.size() - 1) {\n                    sb.append(\", \");\n                }\n            }\n        }\n        sb.append(\"])\");\n        return sb.toString();\n    }\n\n}\n\n\n"}, {"name": "UnweightedGraph", "subcat": "representations", "link": "", "code": "package leetcode.graph.representations;\n\n\nimport java.util.ArrayList;\nimport java.util.List;\n\npublic class UnweightedGraph {\n\n    // The total number of vertices in the graph.\n    public final int vertices;\n    public final List<List<Integer>> adjacencyList;\n\n    public UnweightedGraph(int vertices) {\n        this.vertices = vertices;\n        this.adjacencyList = new ArrayList<>(vertices);\n        for (int i = 0; i < vertices; i++) {\n            adjacencyList.add(new ArrayList<>());\n        }\n    }\n\n\n    public void addEdge(int source, int destination) {\n        // Ensure the vertices are within the valid range.\n        if (source < 0 || source >= vertices || destination < 0 || destination >= vertices) {\n            throw new IllegalArgumentException(\"Vertex out of bounds\");\n        }\n\n        // Add an edge from source to destination.\n        adjacencyList.get(source).add(destination);\n\n        // Since this is an undirected graph, add an edge from destination to source as well.\n        // For a directed graph, you would remove the line below.\n        adjacencyList.get(destination).add(source);\n    }\n\n}"}, {"name": "WeightedGraph", "subcat": "representations", "link": "", "code": "package leetcode.graph.representations;\n\n\nimport java.util.ArrayList;\nimport java.util.List;\n\n\npublic class WeightedGraph {\n\n    public static class Edge {\n        int destination;\n        int weight;\n\n        public Edge(int destination, int weight) {\n            this.destination = destination;\n            this.weight = weight;\n        }\n\n        @Override\n        public String toString() {\n            return \"(\" + destination + \", w:\" + weight + \")\";\n        }\n    }\n\n    // The total number of vertices in the graph.\n    public final int vertices;\n    // The adjacency list stores a list of Edges for each vertex.\n    public final List<List<Edge>> adjacencyList;\n\n\n    public WeightedGraph(int vertices) {\n        this.vertices = vertices;\n        this.adjacencyList = new ArrayList<>(vertices);\n        for (int i = 0; i < vertices; i++) {\n            adjacencyList.add(new ArrayList<>());\n        }\n    }\n\n    public void addEdge(int source, int destination, int weight) {\n        if (source < 0 || source >= vertices || destination < 0 || destination >= vertices) {\n            throw new IllegalArgumentException(\"Vertex out of bounds\");\n        }\n\n        // Create a new edge from source to destination.\n        Edge edge = new Edge(destination, weight);\n        adjacencyList.get(source).add(edge);\n\n        // For an undirected graph, add the reverse edge.\n        // For a directed graph, you would remove the lines below.\n        Edge reverseEdge = new Edge(source, weight);\n        adjacencyList.get(destination).add(reverseEdge);\n    }\n\n\n}"}, {"name": "WeightedNode", "subcat": "representations", "link": "", "code": "package leetcode.graph.representations;\n\n\nimport java.util.ArrayList;\nimport java.util.List;\n\n/**\n * Defines a Node for a weighted graph using an object-oriented approach.\n * Each node contains a value and a list of its outgoing edges, where each\n * edge stores a reference to the destination node and the edge's weight.\n */\npublic class WeightedNode {\n\n    /**\n     * A helper class to represent a weighted edge. It encapsulates the\n     * destination node and the weight of the connection.\n     */\n    public static class Edge {\n        public WeightedNode destination;\n        public int weight;\n\n        /**\n         * Constructs a new Edge.\n         *\n         * @param destination The node this edge connects to.\n         * @param weight      The weight of this edge.\n         */\n        public Edge(WeightedNode destination, int weight) {\n            this.destination = destination;\n            this.weight = weight;\n        }\n    }\n\n    // The value or label of the node.\n    public int val;\n    // A list of outgoing edges from this node.\n    public List<Edge> neighbors;\n\n\n    public WeightedNode() {\n        this.val = 0;\n        this.neighbors = new ArrayList<>();\n    }\n\n    public WeightedNode(int val) {\n        this.val = val;\n        this.neighbors = new ArrayList<>();\n    }\n\n\n    public void addEdge(WeightedNode destination, int weight) {\n        Edge newEdge = new Edge(destination, weight);\n        this.neighbors.add(newEdge);\n    }\n\n\n    // --- Main Method to Demonstrate Usage ---\n    static void main(String[] args) {\n        // Define the number of vertices in the graph\n        int numVertices = 5;\n\n        // Create an instance of the graph\n        WeightedGraph graph = new WeightedGraph(numVertices);\n\n        // Add weighted edges to the graph\n        // This creates an undirected edge between the vertices\n        graph.addEdge(0, 1, 10);\n        graph.addEdge(0, 4, 5);\n        graph.addEdge(1, 2, 7);\n        graph.addEdge(1, 3, 2);\n        graph.addEdge(2, 3, 6);\n        graph.addEdge(3, 4, 9);\n\n        System.out.println(\"Successfully created a weighted graph with \" + numVertices + \" vertices.\\n\");\n    }\n\n}\n"}, {"name": "CheapestFlightsWithinKStops", "subcat": "shortestPath/DG", "link": "", "code": "package leetcode.graph.shortestPath.DG;\n\nimport java.util.*;\n\n/**\n * 787. Cheapest Flights Within K Stops\n * https://leetcode.com/problems/cheapest-flights-within-k-stops/\n *\n * There are n cities connected by some number of flights. You are given an array\n * flights where flights[i] = [fromi, toi, pricei] indicates a flight from city\n * fromi to city toi with cost pricei.\n *\n * You are also given three integers src, dst, and k. Return the cheapest price\n * from src to dst with at most k stops. If there is no such route, return -1.\n *\n * Example 1:\n *   Input: n=4, flights=[[0,1,100],[1,2,100],[2,0,100],[1,3,600],[2,3,200]],\n *          src=0, dst=3, k=1\n *   Output: 700\n *   Explanation: 0 -> 1 -> 3 (cost=100+600=700, 1 stop)\n *                0 -> 1 -> 2 -> 3 would cost 400 but has 2 stops.\n *\n * Example 2:\n *   Input: n=3, flights=[[0,1,100],[1,2,100],[0,2,500]], src=0, dst=2, k=1\n *   Output: 200  (0 -> 1 -> 2, 1 stop)\n *\n * Example 3:\n *   Input: n=3, flights=[[0,1,100],[1,2,100],[0,2,500]], src=0, dst=2, k=0\n *   Output: 500  (0 -> 2 directly, 0 stops)\n *\n * Constraints:\n *   1 <= n <= 100\n *   0 <= flights.length <= n * (n - 1) / 2\n *   0 <= src, dst, k < n\n *\n * ---\n * Approach 1: Modified Bellman-Ford\n *\n * Standard Bellman-Ford relaxes all edges (V-1) times.\n * Here, \"at most k stops\" means at most (k+1) edges.\n * So relax all edges exactly (k+1) times.\n *\n * IMPORTANT: Use a copy of the distance array for each round to prevent\n * \"chaining\" updates within the same round (which could use more edges).\n *\n * Approach 2: BFS with pruning\n *\n * BFS level by level where each level = one flight (one edge).\n * Track best cost to reach each node. Prune if current cost > best known.\n * Stop after (k+1) levels.\n *\n * Time:  O(K * E) for Bellman-Ford, O(K * E) for BFS\n * Space: O(V) for Bellman-Ford, O(V) for BFS\n */\npublic class CheapestFlightsWithinKStops {\n\n    // -------------------- Bellman-Ford (K+1 rounds) --------------------\n    public static int findCheapestPrice(int n, int[][] flights, int src, int dst, int k) {\n        // dist[i] = cheapest cost to reach city i from src\n        int[] dist = new int[n];\n        Arrays.fill(dist, Integer.MAX_VALUE);\n        dist[src] = 0;\n\n        // Relax all edges (k+1) times (at most k+1 edges = k stops)\n        for (int i = 0; i <= k; i++) {\n            // CRITICAL: copy the array to avoid chaining within the same round.\n            // Without this, a path could use more than (k+1) edges.\n            int[] prev = dist.clone();\n\n            for (int[] flight : flights) {\n                int from = flight[0], to = flight[1], price = flight[2];\n                // Only relax from the PREVIOUS round's distances\n                if (prev[from] != Integer.MAX_VALUE) {\n                    dist[to] = Math.min(dist[to], prev[from] + price);\n                }\n            }\n        }\n\n        return dist[dst] == Integer.MAX_VALUE ? -1 : dist[dst];\n    }\n\n    // -------------------- BFS (level-by-level) --------------------\n    public static int findCheapestPriceBFS(int n, int[][] flights, int src, int dst, int k) {\n        // Build adjacency list\n        List<List<int[]>> graph = new ArrayList<>();\n        for (int i = 0; i < n; i++) graph.add(new ArrayList<>());\n        for (int[] f : flights) graph.get(f[0]).add(new int[]{f[1], f[2]});\n\n        // best[i] = cheapest cost to reach city i found so far\n        int[] best = new int[n];\n        Arrays.fill(best, Integer.MAX_VALUE);\n        best[src] = 0;\n\n        // BFS: queue holds (node, costSoFar)\n        Queue<int[]> queue = new LinkedList<>();\n        queue.offer(new int[]{src, 0});\n        int stops = 0;\n\n        while (!queue.isEmpty() && stops <= k) {\n            int size = queue.size();\n            for (int i = 0; i < size; i++) {\n                int[] curr = queue.poll();\n                int node = curr[0], cost = curr[1];\n\n                for (int[] edge : graph.get(node)) {\n                    int next = edge[0], price = edge[1];\n                    int newCost = cost + price;\n\n                    // Only explore if this path is cheaper than what we've seen\n                    if (newCost < best[next]) {\n                        best[next] = newCost;\n                        queue.offer(new int[]{next, newCost});\n                    }\n                }\n            }\n            stops++;\n        }\n\n        return best[dst] == Integer.MAX_VALUE ? -1 : best[dst];\n    }\n\n    public static void main(String[] args) {\n        int[][] flights1 = {{0, 1, 100}, {1, 2, 100}, {2, 0, 100}, {1, 3, 600}, {2, 3, 200}};\n        System.out.println(\"BF:  \" + findCheapestPrice(4, flights1, 0, 3, 1));     // 700\n        System.out.println(\"BFS: \" + findCheapestPriceBFS(4, flights1, 0, 3, 1));  // 700\n\n        int[][] flights2 = {{0, 1, 100}, {1, 2, 100}, {0, 2, 500}};\n        System.out.println(\"BF:  \" + findCheapestPrice(3, flights2, 0, 2, 1));     // 200\n        System.out.println(\"BFS: \" + findCheapestPriceBFS(3, flights2, 0, 2, 1));  // 200\n\n        System.out.println(\"BF:  \" + findCheapestPrice(3, flights2, 0, 2, 0));     // 500\n        System.out.println(\"BFS: \" + findCheapestPriceBFS(3, flights2, 0, 2, 0));  // 500\n    }\n}\n"}, {"name": "NetworkDelayTime", "subcat": "shortestPath/DG", "link": "", "code": "package leetcode.graph.shortestPath.DG;\n\nimport java.util.*;\n\n/**\n * 743. Network Delay Time\n * https://leetcode.com/problems/network-delay-time/\n *\n * You are given a network of n nodes, labeled from 1 to n. You are also given\n * times, a list of travel times as directed edges times[i] = (ui, vi, wi),\n * where ui is the source node, vi is the target node, and wi is the time it\n * takes for a signal to travel from source to target.\n *\n * We will send a signal from a given node k. Return the minimum time it takes\n * for all n nodes to receive the signal. If it is impossible for all nodes to\n * receive the signal, return -1.\n *\n * Example 1:\n *   Input: times = [[2,1,1],[2,3,1],[3,4,1]], n = 4, k = 2\n *   Output: 2\n *   Explanation: Node 2 sends signal:\n *     t=0: node 2\n *     t=1: node 1, node 3\n *     t=2: node 4 (from node 3)\n *     All nodes reached by t=2.\n *\n * Example 2:\n *   Input: times = [[1,2,1]], n = 2, k = 2\n *   Output: -1  (node 1 can't reach node 2 but signal starts at 2, node 1 unreachable)\n *\n * Constraints:\n *   1 <= k <= n <= 100\n *   1 <= times.length <= 6000\n *   1 <= ui, vi <= n, 0 <= wi <= 100\n *\n * ---\n * Approach: Dijkstra's Algorithm (single-source shortest path)\n *\n * This is the textbook Dijkstra problem:\n * 1. Build adjacency list from directed edges with weights.\n * 2. Use a min-heap (PriorityQueue) keyed by distance.\n * 3. Start from node k with distance 0.\n * 4. Greedily expand the closest unvisited node, relax its neighbors.\n * 5. Answer = max distance among all nodes (time for the last node to be reached).\n *\n * Why Dijkstra works: All edge weights are non-negative.\n *\n * Time:  O(E log V) with binary heap\n * Space: O(V + E)\n */\npublic class NetworkDelayTime {\n\n    // -------------------- Dijkstra's Algorithm --------------------\n    public static int networkDelayTime(int[][] times, int n, int k) {\n        // Build adjacency list: node -> [(neighbor, weight), ...]\n        List<List<int[]>> graph = new ArrayList<>();\n        for (int i = 0; i <= n; i++) graph.add(new ArrayList<>());\n\n        for (int[] edge : times) {\n            graph.get(edge[0]).add(new int[]{edge[1], edge[2]});\n        }\n\n        // dist[i] = shortest distance from k to i\n        int[] dist = new int[n + 1];\n        Arrays.fill(dist, Integer.MAX_VALUE);\n        dist[k] = 0;\n\n        // Min-heap: (distance, node). Sorted by distance.\n        PriorityQueue<int[]> pq = new PriorityQueue<>((a, b) -> a[0] - b[0]);\n        pq.offer(new int[]{0, k});\n\n        while (!pq.isEmpty()) {\n            int[] curr = pq.poll();\n            int d = curr[0];   // Current distance\n            int u = curr[1];   // Current node\n\n            // Skip if we already found a shorter path to u\n            // (lazy deletion: stale entries remain in the heap)\n            if (d > dist[u]) continue;\n\n            // Relax all neighbors of u\n            for (int[] edge : graph.get(u)) {\n                int v = edge[0];      // Neighbor\n                int w = edge[1];      // Edge weight\n                int newDist = d + w;\n\n                // If we found a shorter path to v through u\n                if (newDist < dist[v]) {\n                    dist[v] = newDist;\n                    pq.offer(new int[]{newDist, v});\n                }\n            }\n        }\n\n        // The answer = max distance to any node (time for last node to be reached)\n        int maxDist = 0;\n        for (int i = 1; i <= n; i++) {\n            if (dist[i] == Integer.MAX_VALUE) return -1; // Node unreachable\n            maxDist = Math.max(maxDist, dist[i]);\n        }\n\n        return maxDist;\n    }\n\n    // -------------------- Bellman-Ford (alternative) --------------------\n    /**\n     * Bellman-Ford: Relax all edges (V-1) times.\n     * Simpler but slower than Dijkstra. Handles negative weights (not needed here).\n     *\n     * Time:  O(V * E)\n     * Space: O(V)\n     */\n    public static int networkDelayTimeBF(int[][] times, int n, int k) {\n        int[] dist = new int[n + 1];\n        Arrays.fill(dist, Integer.MAX_VALUE);\n        dist[k] = 0;\n\n        // Relax all edges (n-1) times\n        for (int i = 0; i < n - 1; i++) {\n            for (int[] edge : times) {\n                int u = edge[0], v = edge[1], w = edge[2];\n                if (dist[u] != Integer.MAX_VALUE && dist[u] + w < dist[v]) {\n                    dist[v] = dist[u] + w;\n                }\n            }\n        }\n\n        int maxDist = 0;\n        for (int i = 1; i <= n; i++) {\n            if (dist[i] == Integer.MAX_VALUE) return -1;\n            maxDist = Math.max(maxDist, dist[i]);\
