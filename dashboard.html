und", "subcat": "", "link": "", "code": "package leetcode.string;\n\npublic class LongestPalindromicSubstringExpandAround {\n\n    public static String findLongestPalindromicSubstring(String s) {\n        if (s == null || s.isEmpty()) return \"\";\n\n        int n = s.length();\n        int start = 0;\n        int maxLength = 1;\n\n        for (int i = 0; i < n; i++) {\n\n            // Check for odd length palindromes (centered at i)\n            int left = i, right = i;\n            while (left >= 0 && right < n && s.charAt(left) == s.charAt(right)) {\n                if (right - left + 1 > maxLength) {\n                    start = left;\n                    maxLength = right - left + 1;\n                }\n                left--;\n                right++;\n            }\n\n            // Check for even length palindromes (centered between i-1 and i)\n            left = i;\n            right = i + 1;\n            while (left >= 0 && right < n && s.charAt(left) == s.charAt(right)) {\n                if (right - left + 1 > maxLength) {\n                    start = left;\n                    maxLength = right - left + 1;\n                }\n                left--;\n                right++;\n            }\n\n        }\n\n        return s.substring(start, start + maxLength);\n    }\n\n\n    static void main(String[] args) {\n        String s = \"babad\";\n        System.out.println(findLongestPalindromicSubstring(s));\n    }\n\n}\n"}, {"name": "ReverseVowels", "subcat": "", "link": "", "code": "package leetcode.string;\n\nimport java.util.HashSet;\nimport java.util.Set;\n\npublic class ReverseVowels {\n\n    public static String reverseVowels(String s) {\n        char[] ch = s.toCharArray();\n        Set<Character> vowelSet = new HashSet<>(Set.of('a', 'e', 'i', 'o', 'u', 'A', 'E', 'I', 'O', 'U'));\n\n        int i = 0;\n        int j = ch.length - 1;\n\n        while (i < j) {\n\n            while (i < j && !vowelSet.contains(ch[i])) {\n                i++;\n            }\n\n            while (i < j && !vowelSet.contains(ch[j])) {\n                j--;\n            }\n\n            char temp = ch[i];\n            ch[i] = ch[j];\n            ch[j] = temp;\n\n            i++;\n            j--;\n        }\n\n        return String.valueOf(ch);\n    }\n\n    public static void main(String[] args) {\n        String s = \"icecream\";\n        System.out.println(\"Icecream : \" + reverseVowels(s)); // acecreim\n\n        s = \"leetcode\";\n        System.out.println(\"leetcode : \" +  reverseVowels(s)); // leotcede\n    }\n\n}\n"}, {"name": "ShortestDistanceCharacter", "subcat": "", "link": "", "code": "package leetcode.string;\n\nimport java.util.*;\n\n/*\n * LeetCode Problem: 821. Shortest Distance to a Character\n *\n * Question:\n * Given a string s and a character c that occurs in s, return an array of integers\n * answer where answer.length == s.length and answer[i] is the shortest distance\n * from s[i] to the character c in s.\n *\n * The distance between two indices i and j is abs(i - j).\n *\n * Example 1:\n * Input: s = \"loveleetcode\", c = 'e'\n * Output: [3,2,1,0,1,0,0,1,2,2,1,0]\n * Explanation: The character 'e' appears at indices 3, 5, 6, and 11 (0-indexed).\n * The distance from index 0 to 'e' is min(abs(0-3), abs(0-5), abs(0-6), abs(0-11)) = 3.\n * The distance from index 1 to 'e' is min(abs(1-3), abs(1-5), abs(1-6), abs(1-11)) = 2.\n * For index 4, min(abs(4-3), abs(4-5), abs(4-6), abs(4-11)) = 1.\n * For index 8, min(abs(8-3), abs(8-5), abs(8-6), abs(8-11)) = 3.\n *\n */\n\npublic class ShortestDistanceCharacter {\n\n\n    // Uses treeSet to store indices of character c\n    @SuppressWarnings(\"all\")\n    public static int[] shortestToChar(String s, char c) {\n        TreeSet<Integer> treeSet = new TreeSet<>();\n\n        // put all indices of character c in the TreeSet\n        for (int i = 0; i < s.length(); i++) {\n            if (s.charAt(i) == c) {\n                treeSet.add(i);\n            }\n        }\n\n        int[] result = new int[s.length()];\n\n        for (int i = 0; i < s.length(); i++) {\n            int min;\n\n            int ceilMin = Integer.MAX_VALUE;\n            int floorMin = Integer.MAX_VALUE;\n\n            if (treeSet.ceiling(i) != null) {\n                ceilMin = treeSet.ceiling(i) - i;\n            }\n\n            if (treeSet.floor(i) != null) {\n                floorMin = i - treeSet.floor(i);\n            }\n\n            min = Math.min(ceilMin, floorMin);\n            result[i] = min;\n        }\n\n        return result;\n    }\n\n    /**\n     * Solves the same problem using a pre-computed list of character indices and binary search.\n     * This approach follows the user's suggestion.\n     *\n     * @param s The input string.\n     * @param c The target character.\n     * @return An array of integers representing the shortest distances.\n     */\n    public static int[] shortestToCharBinarySearch(String s, char c) {\n        // Step 1: Find all indices of the character 'c' and store them in a sorted list.\n        List<Integer> cIndices = new ArrayList<>();\n        for (int i = 0; i < s.length(); i++) {\n            if (s.charAt(i) == c) {\n                cIndices.add(i);\n            }\n        }\n\n        int n = s.length();\n        int[] result = new int[n];\n\n        // Step 2: For each character in the string, find the shortest distance to 'c'.\n        for (int i = 0; i < n; i++) {\n            // Use binary search to find the insertion point of the current index 'i'\n            // in our list of 'c' indices. This helps us quickly find the nearest neighbors.\n            int insertionPoint = Collections.binarySearch(cIndices, i);\n\n            // Case 1: 'i' is an index where 'c' is present. The distance is 0.\n            if (insertionPoint >= 0) {\n                result[i] = 0;\n            } else {\n                // Case 2: 'i' is not an index of 'c'.\n                // The binarySearch method returns (-(insertion point) - 1).\n                // We convert it back to the actual insertion point.\n                insertionPoint = -(insertionPoint + 1);\n\n                // Calculate distance to the 'c' on the left.\n                int distToLeft = Integer.MAX_VALUE;\n                // The neighbor to the left is at `insertionPoint - 1`.\n                if (insertionPoint > 0) {\n                    distToLeft = i - cIndices.get(insertionPoint - 1);\n                }\n\n                // Calculate distance to the 'c' on the right.\n                int distToRight = Integer.MAX_VALUE;\n                // The neighbor to the right is at the `insertionPoint`.\n                if (insertionPoint < cIndices.size()) {\n                    distToRight = cIndices.get(insertionPoint) - i;\n                }\n\n                // The shortest distance is the minimum of the two.\n                result[i] = Math.min(distToLeft, distToRight);\n            }\n        }\n\n        return result;\n    }\n\n    /**\n     * Solves the problem using a two-pass (left-to-right and right-to-left) approach.\n     * This corresponds to the \"peaks and valleys\" visualization.\n     *\n     * @param s The input string.\n     * @param c The target character.\n     * @return An array of integers representing the shortest distances.\n     */\n    public static int[] shortestToCharTwoPass(String s, char c) {\n        int n = s.length();\n        int[] result = new int[n];\n        int pos = -n; // Random number should be less than -n\n\n        // Pass 1: Left to Right\n        // For each index, we find the distance to the nearest 'c' on its left.\n        for (int i = 0; i < n; i++) {\n            if (s.charAt(i) == c) {\n                pos = i; // Update the position of the last seen 'c'.\n            }\n            result[i] = i - pos;\n        }\n\n        // Pass 2: Right to Left\n        // For each index, we find the distance to the nearest 'c' on its right.\n        // Then we take the minimum of the left-distance and the right-distance.\n        for (int i = n - 1; i >= 0; i--) {\n            if (s.charAt(i) == c) {\n                pos = i; // Update the position of the last seen 'c'.\n            }\n            // result[i] currently holds the distance to the left 'c'.\n            // pos - i is the distance to the right 'c'. We need the minimum.\n            result[i] = Math.min(result[i], Math.abs(i - pos));\n        }\n\n        return result;\n    }\n\n\n\n\n    public static void main(String[] args) {\n        String s = \"loveleetcode\";\n        char c = 'e';\n        System.out.println(\"Input String: \" + s);\n        System.out.println(\"Target Character: \" + c);\n        System.out.println(\"Result: \" + Arrays.toString(shortestToChar(s, c)));\n    }\n}\n"}, {"name": "StringCompression", "subcat": "", "link": "", "code": "package leetcode.string;\n\nimport java.util.Arrays;\n\n/**\n * LeetCode Problem 443: String Compression\n * * Given an array of characters chars, compress it using the following algorithm:\n * * Begin with an empty string s. For each group of consecutive repeating characters in chars:\n * - If the group's length is 1, append the character to s.\n * - Otherwise, append the character followed by the group's length.\n * * The compressed string s should not be returned separately, but instead, be stored in the input character array chars.\n * Note that group lengths that are 10 or longer will be split into multiple characters in chars.\n * * After you are done modifying the input array, return the new length of the array.\n * * You must write an algorithm that uses only constant extra space.\n * * Example 1:\n * Input: chars = [\"a\",\"a\",\"b\",\"b\",\"c\",\"c\",\"c\"]\n * Output: Return 6, and the first 6 characters of the input array should be: [\"a\",\"2\",\"b\",\"2\",\"c\",\"3\"]\n * * Example 2:\n * Input: chars = [\"a\"]\n * Output: Return 1, and the first character of the input array should be: [\"a\"]\n * * Example 3:\n * Input: chars = [\"a\",\"b\",\"b\",\"b\",\"b\",\"b\",\"b\",\"b\",\"b\",\"b\",\"b\",\"b\",\"b\"]\n * Output: Return 4, and the first 4 characters of the input array should be: [\"a\",\"b\",\"1\",\"2\"]\n */\n\npublic class StringCompression {\n\n    /**\n     * Compresses the character array in-place.\n     * This is an optimized solution using a two-pointer approach (a read pointer and a write pointer).\n     *\n     * @param chars The input array of characters to be compressed.\n     * @return The new length of the compressed array.\n     */\n    public static int compress(char[] chars) {\n        // 'writeIndex' is the pointer where we will write the next compressed character.\n        int writeIndex = 0;\n        // 'readIndex' is the pointer that scans through the original array.\n        int readIndex = 0;\n\n        // Loop until we have scanned the entire array.\n        while (readIndex < chars.length) {\n            char currentChar = chars[readIndex];\n            int count = 0;\n\n            // Count consecutive occurrences of the currentChar.\n            while (readIndex < chars.length && chars[readIndex] == currentChar) {\n                count++;\n                readIndex++; // Move the read pointer forward.\n            }\n\n            // Write the character to the compressed part of the array.\n            chars[writeIndex++] = currentChar;\n\n            // If the character was repeated more than once, write its count.\n            if (count > 1) {\n                // Convert the count to a string to handle multi-digit numbers (e.g., 12).\n                String countStr = String.valueOf(count);\n                for (char digit : countStr.toCharArray()) {\n                    chars[writeIndex++] = digit;\n                }\n            }\n        }\n\n        // 'writeIndex' is now at the end of the compressed content, which is the new length.\n        return writeIndex;\n    }\n\n    public static void main(String[] args) {\n        char[] chars1 = {'a', 'a', 'b', 'b', 'c', 'c', 'c'};\n        int newLength1 = compress(chars1);\n        System.out.println(\"Test Case 1:\");\n        System.out.println(\"New Length: \" + newLength1); // Expected: 6\n        System.out.println(\"Modified Array: \" + Arrays.toString(Arrays.copyOf(chars1, newLength1))); // Expected: [a, 2, b, 2, c, 3]\n        System.out.println(\"--------------------\");\n\n        char[] chars2 = {'a'};\n        int newLength2 = compress(chars2);\n        System.out.println(\"Test Case 2:\");\n        System.out.println(\"New Length: \" + newLength2); // Expected: 1\n        System.out.println(\"Modified Array: \" + Arrays.toString(Arrays.copyOf(chars2, newLength2))); // Expected: [a]\n        System.out.println(\"--------------------\");\n\n        char[] chars3 = {'a', 'b', 'b', 'b', 'b', 'b', 'b', 'b', 'b', 'b', 'b', 'b', 'b'};\n        int newLength3 = compress(chars3);\n        System.out.println(\"Test Case 3:\");\n        System.out.println(\"New Length: \" + newLength3); // Expected: 4\n        System.out.println(\"Modified Array: \" + Arrays.toString(Arrays.copyOf(chars3, newLength3))); // Expected: [a, b, 1, 2]\n    }\n}\n"}, {"name": "ValidPalindrome", "subcat": "", "link": "", "code": "package leetcode.string;\n\npublic class ValidPalindrome {\n\n    public static boolean validPalindrome(String s) {\n        int i = 0;\n        int j = s.length() - 1;\n\n        while (i < j) {\n            if (s.charAt(i) != s.charAt(j)) {\n                return isPalindrome(s, i + 1, j) || isPalindrome(s, i, j - 1);\n            }\n\n            i++;\n            j--;\n        }\n\n        return true;\n    }\n\n    public static boolean isPalindrome(String s, int i, int j) {\n        while (i < j) {\n            if (s.charAt(i) != s.charAt(j)) return false;\n            i++;\n            j--;\n        }\n\n        return true;\n    }\n\n    public static void main(String[] args) {\n        System.out.println(validPalindrome(\"MOM\"));\n    }\n}\n"}, {"name": "ZigzagConversion", "subcat": "", "link": "", "code": "package leetcode.string;\n\npublic class ZigzagConversion {\n\n    public static String convert(String s, int numRows) {\n        StringBuilder[] stringBuilders = new StringBuilder[numRows];\n\n        for (int i = 0; i < numRows; i++) {\n            stringBuilders[i] = new StringBuilder();\n        }\n\n        int i = 0;\n        int size = s.length();\n\n        while (i < size) {\n\n            for (int index = 0; index < numRows && i < size; index++) {\n                stringBuilders[index].append(s.charAt(i));\n                i++;\n            }\n\n            for (int index = numRows - 2; index >=1 && i < size; index--) {\n                stringBuilders[index].append(s.charAt(i));\n                i++;\n            }\n\n        }\n\n        for (int k = 1; k < numRows; k++) {\n            stringBuilders[0].append(stringBuilders[k]);\n        }\n\n        return stringBuilders[0].toString();\n    }\n\n    public static void main(String[] args) {\n        String s = \"PAYPALISHIRING\";\n        int numRows = 4;\n        System.out.println(convert(s, numRows));// PAHNAPLSIIGYIR\n    }\n}\n"}], "Tree": [{"name": "Node", "subcat": "", "link": "", "code": "package leetcode.tree;\n\nimport java.util.ArrayList;\nimport java.util.List;\n\npublic class Node {\n    public int val;\n    public List<Node> children;\n\n    public Node() {\n    }\n\n    public Node(int _val) {\n        val = _val;\n        children = new ArrayList<>();\n    }\n\n    public Node(int _val, List<Node> _children) {\n        val = _val;\n        children = _children;\n    }\n}\n"}, {"name": "TreeNode", "subcat": "", "link": "", "code": "package leetcode.tree;\n\npublic class TreeNode {\n    public int val;\n    public TreeNode left;\n    public TreeNode right;\n\n    public TreeNode() {\n    }\n\n    public TreeNode(int val) {\n        this.val = val;\n    }\n\n    public TreeNode(int val, TreeNode left, TreeNode right) {\n        this.val = val;\n        this.left = left;\n        this.right = right;\n    }\n}\n"}, {"name": "BottomLeftTreeValue", "subcat": "BFS", "link": "", "code": "package leetcode.tree.BFS;\n\nimport leetcode.tree.TreeNode;\n\nimport java.util.*;\n\n/**\n * LeetCode 513: Find Bottom Left Tree Value\n * https://leetcode.com/problems/find-bottom-left-tree-value/\n *\n * Given the root of a binary tree, return the leftmost value in the last row of the tree.\n *\n * Example 1:\n *   Input: root = [2,1,3]\n *   Output: 1\n *\n * Example 2:\n *   Input: root = [1,2,3,4,null,5,6,null,null,7]\n *   Output: 7\n *\n * Constraints:\n *   - The number of nodes is in [1, 10^4]\n *   - -2^31 <= Node.val <= 2^31 - 1\n *\n * Approach: BFS right-to-left\n *   - Process each level right-to-left (add right child before left child).\n *   - The last node processed in the entire BFS is the bottom-left value.\n *\n * Time Complexity: O(n)\n * Space Complexity: O(n)\n */\npublic class BottomLeftTreeValue {\n\n    public int findBottomLeftValue(TreeNode root) {\n\n        Queue<TreeNode> queue = new LinkedList<>();\n        queue.add(root);\n\n        int result = 0;\n        while (!queue.isEmpty()) {\n            int size = queue.size();\n\n            for (int i = 0; i < size; i++) {\n                TreeNode current = queue.poll();\n                assert current != null;\n                result = current.val;\n\n                if (current.right != null) queue.add(current.right);\n                if (current.left != null) queue.add(current.left);\n            }\n        }\n\n        return result;\n    }\n\n}\n"}, {"name": "LargestValueInTreeRow", "subcat": "BFS", "link": "", "code": "package leetcode.tree.BFS;\n\nimport leetcode.tree.TreeNode;\n\nimport java.util.ArrayList;\nimport java.util.LinkedList;\nimport java.util.List;\nimport java.util.Queue;\n\n/**\n * LeetCode 515: Find Largest Value in Each Tree Row\n * https://leetcode.com/problems/find-largest-value-in-each-tree-row/\n *\n * Given the root of a binary tree, return an array of the largest value\n * in each row of the tree (0-indexed).\n *\n * Example 1:\n *   Input: root = [1,3,2,5,3,null,9]\n *   Output: [1,3,9]\n *\n * Example 2:\n *   Input: root = [1,2,3]\n *   Output: [1,3]\n *\n * Constraints:\n *   - The number of nodes is in [0, 10^4]\n *   - -2^31 <= Node.val <= 2^31 - 1\n *\n * Approach: Level-order BFS\n *   - Process each level, track the max value per level.\n *\n * Time Complexity: O(n)\n * Space Complexity: O(n)\n */\npublic class LargestValueInTreeRow {\n\n    @SuppressWarnings(\"all\")\n    public List<Integer> largestValues(TreeNode root) {\n        List<Integer> result = new ArrayList<>();\n\n        if (root == null) return result;\n\n        Queue<TreeNode> queue = new LinkedList<>();\n        queue.add(root);\n\n        while (!queue.isEmpty()) {\n            int size = queue.size();\n            int max = Integer.MIN_VALUE;\n\n            for (int i = 0; i < size; i++) {\n                TreeNode current = queue.poll();\n                max = Math.max(max, current.val);\n\n                if (current.left != null) queue.add(current.left);\n                if (current.right != null) queue.add(current.right);\n            }\n\n            result.add(max);\n        }\n\n        return result;\n    }\n\n\n}\n"}, {"name": "LevelOrderTraversal", "subcat": "BFS", "link": "", "code": "package leetcode.tree.BFS;\n\nimport leetcode.tree.TreeNode;\n\nimport java.util.ArrayList;\nimport java.util.LinkedList;\nimport java.util.List;\nimport java.util.Queue;\n\n/**\n * LeetCode 102: Binary Tree Level Order Traversal\n * https://leetcode.com/problems/binary-tree-level-order-traversal/\n *\n * Given the root of a binary tree, return the level order traversal of its\n * nodes' values (i.e., from left to right, level by level).\n *\n * Example 1:\n *   Input: root = [3,9,20,null,null,15,7]\n *   Output: [[3],[9,20],[15,7]]\n *\n * Example 2:\n *   Input: root = [1]\n *   Output: [[1]]\n *\n * Example 3:\n *   Input: root = []\n *   Output: []\n *\n * Constraints:\n *   - The number of nodes is in [0, 2000]\n *   - -1000 <= Node.val <= 1000\n *\n * Approach: BFS with Queue\n *   - Use a queue to process nodes level by level.\n *   - For each level, drain the queue (size = number of nodes at this level).\n *   - Collect values for the level, enqueue children for the next level.\n *\n * Time Complexity: O(n)\n * Space Complexity: O(n)\n */\npublic class LevelOrderTraversal {\n\n    public List<List<Integer>> levelOrder(TreeNode root) {\n        List<List<Integer>> result = new ArrayList<>();\n        if (root == null) return result;\n\n        Queue<TreeNode> queue = new LinkedList<>();\n        queue.add(root);\n\n        while (!queue.isEmpty()) {\n            int size = queue.size();\n            List<Integer> level = new ArrayList<>();\n\n            for (int i = 0; i < size; i++) {\n                TreeNode current = queue.poll();\n                level.add(current.val);\n\n                if (current.left != null) queue.add(current.left);\n                if (current.right != null) queue.add(current.right);\n            }\n\n            result.add(level);\n        }\n\n        return result;\n    }\n\n    public static void main(String[] args) {\n        TreeNode root = new TreeNode(3);\n        root.left = new TreeNode(9);\n        root.right = new TreeNode(20);\n        root.right.left = new TreeNode(15);\n        root.right.right = new TreeNode(7);\n\n        System.out.println(new LevelOrderTraversal().levelOrder(root));\n        // [[3], [9, 20], [15, 7]]\n    }\n}\n"}, {"name": "FindTarget", "subcat": "BST", "link": "", "code": "package leetcode.tree.BST;\n\nimport leetcode.tree.TreeNode;\n\nimport java.util.ArrayList;\nimport java.util.List;\n\n/**\n * LeetCode 653: Two Sum IV - Input is a BST\n * https://leetcode.com/problems/two-sum-iv-input-is-a-bst/\n *\n * Given the root of a binary search tree and an integer k, return true if there\n * exist two elements in the BST such that their sum is equal to k.\n *\n * Example 1:\n *   Input: root = [5,3,6,2,4,null,7], k = 9\n *   Output: true\n *\n * Example 2:\n *   Input: root = [5,3,6,2,4,null,7], k = 28\n *   Output: false\n *\n * Constraints:\n *   - The number of nodes is in [1, 10^4]\n *   - -10^4 <= Node.val <= 10^4\n *   - root is a valid BST\n *   - -10^5 <= k <= 10^5\n *\n * Approach: DFS + Complement List\n *   - For each node, check if (k - node.val) was seen before.\n *   - Store complements in a list during DFS traversal.\n *\n * Time Complexity: O(n)\n * Space Complexity: O(n)\n */\npublic class FindTarget {\n\n    public static boolean helper(TreeNode root, int k, List<Integer> remaining) {\n        if (root == null) return false;\n\n        if(remaining.contains(root.val)) return true;\n\n        remaining.add(k - root.val);\n\n        return helper(root.left, k ,remaining) || helper(root.right, k, remaining);\n    }\n\n    public static boolean findTarget(TreeNode root, int k) {\n        return helper(root, k, new ArrayList<>());\n    }\n\n    public static void main(String[] args) {\n        int k = 9;\n        // Creating nodes manually\n        TreeNode root = new TreeNode(5);\n        root.left = new TreeNode(3);\n        root.right = new TreeNode(6);\n        root.left.left = new TreeNode(2);\n        root.left.right = new TreeNode(4);\n        root.right.right = new TreeNode(7);\n\n        System.out.println(findTarget(root, k));\n    }\n\n\n}\n"}, {"name": "KthSmallestInBST", "subcat": "BST", "link": "", "code": "package leetcode.tree.BST;\n\nimport leetcode.tree.TreeNode;\n\n/**\n * LeetCode 230: Kth Smallest Element in a BST\n * https://leetcode.com/problems/kth-smallest-element-in-a-bst/\n *\n * Given the root of a BST and an integer k, return the kth smallest value\n * (1-indexed) of all the values of the nodes in the tree.\n *\n * Example 1:\n *   Input: root = [3,1,4,null,2], k = 1\n *   Output: 1\n *\n * Example 2:\n *   Input: root = [5,3,6,2,4,null,null,1], k = 3\n *   Output: 3\n *\n * Constraints:\n *   - The number of nodes is n, 1 <= k <= n <= 10^4\n *   - 0 <= Node.val <= 10^4\n *\n * Approach: Inorder Traversal (BST property \u2192 sorted order)\n *   - Inorder traversal visits nodes in ascending order.\n *   - Count nodes visited; when count == k, that's the answer.\n *   - Early termination once found.\n *\n * Time Complexity: O(h + k) \u2014 traverse to leftmost, then k more\n * Space Complexity: O(h)\n */\npublic class KthSmallestInBST {\n\n    int count = 0;\n    int result = -1;\n\n    public int kthSmallest(TreeNode root, int k) {\n        inorder(root, k);\n        return result;\n    }\n\n    private void inorder(TreeNode node, int k) {\n        if (node == null || count >= k) return;\n\n        inorder(node.left, k);\n\n        count++;\n        if (count == k) {\n            result = node.val;\n            return;\n        }\n\n        inorder(node.right, k);\n    }\n\n    public static void main(String[] args) {\n        // [5,3,6,2,4,null,null,1], k = 3\n        TreeNode root = new TreeNode(5);\n        root.left = new TreeNode(3);\n        root.right = new TreeNode(6);\n        root.left.left = new TreeNode(2);\n        root.left.right = new TreeNode(4);\n        root.left.left.left = new TreeNode(1);\n\n        System.out.println(new KthSmallestInBST().kthSmallest(root, 3)); // 3\n    }\n}\n"}, {"name": "MinAbsoluteInBST", "subcat": "BST", "link": "", "code": "package leetcode.tree.BST;\n\nimport leetcode.tree.TreeNode;\n\n/**\n * LeetCode 530: Minimum Absolute Difference in BST\n * https://leetcode.com/problems/minimum-absolute-difference-in-bst/\n *\n * Given the root of a BST, return the minimum absolute difference between\n * the values of any two different nodes in the tree.\n *\n * Example 1:\n *   Input: root = [4,2,6,1,3]\n *   Output: 1\n *\n * Example 2:\n *   Input: root = [1,0,48,null,null,12,49]\n *   Output: 1\n *\n * Constraints:\n *   - The number of nodes is in [2, 10^4]\n *   - 0 <= Node.val <= 10^5\n *\n * Approach: Inorder Traversal with Previous Tracking\n *   - Inorder traversal of BST yields sorted order.\n *   - Track previous node and compute diff with current node at each step.\n *   - Keep the minimum difference.\n *\n * Time Complexity: O(n)\n * Space Complexity: O(h) \u2014 recursion stack\n */\npublic class MinAbsoluteInBST {\n\n    int minDiff = Integer.MAX_VALUE;\n    TreeNode prev = null;\n\n\n    // https://leetcode.com/problems/minimum-absolute-difference-in-bst/description/\n    // Keeping track of previous value in inorder traversal\n    public void helper(TreeNode root) {\n\n\n        if (root == null) {\n            return;\n        }\n\n        helper(root.left);\n\n        if (prev != null) {\n            minDiff = Math.min(minDiff, Math.abs(root.val - prev.val));\n        }\n\n        prev = root;\n\n        helper(root.right);\n    }\n\n\n    public int getMinimumDifference(TreeNode root) {\n        helper(root);\n        return minDiff;\n    }\n\n    public static void main(String[] args) {\n        // Constructing the nodes\n        TreeNode root = new TreeNode(236);\n        TreeNode node104 = new TreeNode(104);\n        TreeNode node701 = new TreeNode(701);\n        TreeNode node227 = new TreeNode(227);\n        TreeNode node911 = new TreeNode(911);\n\n        // Setting up the left and right child relationships\n        root.left = node104;\n        root.right = node701;\n        node104.right = node227;\n        node701.right = node911;\n\n        System.out.println(new MinAbsoluteInBST().getMinimumDifference(root));\n    }\n\n\n}\n"}, {"name": "ModeInBST", "subcat": "BST", "link": "", "code": "package leetcode.tree.BST;\n\nimport leetcode.tree.TreeNode;\n\nimport java.util.*;\n\n/**\n * LeetCode 501: Find Mode in Binary Search Tree\n * https://leetcode.com/problems/find-mode-in-binary-search-tree/\n *\n * Given the root of a BST with duplicates, return all the mode(s)\n * (i.e., the most frequently occurred element).\n *\n * Example 1:\n *   Input: root = [1,null,2,2]\n *   Output: [2]\n *\n * Example 2:\n *   Input: root = [0]\n *   Output: [0]\n *\n * Constraints:\n *   - The number of nodes is in [1, 10^4]\n *   - -10^5 <= Node.val <= 10^5\n *\n * Approach: Inorder Traversal + Frequency Map\n *   - Inorder traversal to visit all nodes.\n *   - Build a frequency map, then find the max frequency and collect all keys with that frequency.\n *\n * Time Complexity: O(n)\n * Space Complexity: O(n)\n */\npublic class ModeInBST {\n\n\n\n    // https://leetcode.com/problems/find-mode-in-binary-search-tree/description/\n    Map<Integer, Integer> map = new HashMap<>();\n\n    public void helper(TreeNode root) {\n        if (root == null) return;\n\n        helper(root.left);\n        map.put(root.val, map.getOrDefault(root.val, 0) + 1);\n        helper(root.right);\n    }\n\n    public int[] findMode(TreeNode root) {\n        map.clear();\n\n        helper(root);\n        int max = Integer.MIN_VALUE;\n\n        for (int value : map.values()) {\n            if (value > max) max = value;\n        }\n\n        List<Integer> result = new ArrayList<>();\n\n        for (Map.Entry<Integer, Integer> entry : map.entrySet()) {\n            if (entry.getValue() == max) {\n                result.add(entry.getKey());\n            }\n        }\n\n        return result.stream().mapToInt(Integer::intValue).toArray();\n    }\n\n\n    public static void main(String[] args) {\n\n        ModeInBST modeInBST = new ModeInBST();\n\n        TreeNode root = new TreeNode(1);\n        root.right = new TreeNode(2);\n        System.out.println(Arrays.toString(modeInBST.findMode(root)));\n\n    }\n\n}\n"}, {"name": "SearchInBST", "subcat": "BST", "link": "", "code": "package leetcode.tree.BST;\n\nimport leetcode.tree.TreeNode;\n\n/**\n * LeetCode 700: Search in a Binary Search Tree\n * https://leetcode.com/problems/search-in-a-binary-search-tree/\n *\n * You are given the root of a BST and an integer val. Find the node whose\n * value equals val and return the subtree rooted with that node. If such a\n * node does not exist, return null.\n *\n * Example 1:\n *   Input: root = [4,2,7,1,3], val = 2\n *   Output: [2,1,3]\n *\n * Example 2:\n *   Input: root = [4,2,7,1,3], val = 5\n *   Output: []\n *\n * Constraints:\n *   - Number of nodes in [1, 5000]\n *   - 1 <= Node.val <= 10^7\n *   - root is a valid BST\n *\n * Approach: Recursive + Iterative BST search\n *   - Exploit BST property: go left if val < root, right if val > root.\n *\n * Time Complexity: O(h) where h is tree height\n * Space Complexity: O(h) recursive, O(1) iterative\n */\npublic class SearchInBST {\n\n\n    public TreeNode searchBST(TreeNode root, int val) {\n\n        if (root == null) return null;\n\n        if (val == root.val) return root;\n\n        if (val < root.val) {\n            return searchBST(root.left, val);\n        } else {\n            return searchBST(root.right, val);\n        }\n\n    }\n\n\n    public TreeNode searchBSTIterative(TreeNode root, int val) {\n        TreeNode current = root;\n\n        while (current != null) {\n\n            if (val == current.val) {\n                return current;\n            }\n\n            if (val < root.val) {\n                current = current.left;\n            } else {\n                current = current.right;\n            }\n\n        }\n\n        return null;\n    }\n\n\n}\n"}, {"name": "SortedArrayToBinarySearchTree", "subcat": "BST", "link": "", "code": "package leetcode.tree.BST;\n\nimport leetcode.tree.TreeNode;\n\n/**\n * LeetCode 108: Convert Sorted Array to Binary Search Tree\n * https://leetcode.com/problems/convert-sorted-array-to-binary-search-tree/\n *\n * Given an integer array nums where the elements are sorted in ascending order,\n * convert it to a height-balanced BST.\n *\n * Example 1:\n *   Input: nums = [-10,-3,0,5,9]\n *   Output: [0,-3,9,-10,null,5] (one possible answer)\n *\n * Example 2:\n *   Input: nums = [1,3]\n *   Output: [3,1] or [1,null,3]\n *\n * Constraints:\n *   - 1 <= nums.length <= 10^4\n *   - -10^4 <= nums[i] <= 10^4\n *   - nums is sorted in strictly increasing order\n *\n * Approach: Binary Search + Divide and Conquer\n *   - Pick middle element as root for balanced tree.\n *   - Recursively build left subtree from left half, right subtree from right half.\n *\n * Time Complexity: O(n)\n * Space Complexity: O(log n) \u2014 recursion stack\n */\npublic class SortedArrayToBinarySearchTree {\n\n    public static TreeNode sortedArrayToBST(int[] nums) {\n        int left = 0;\n        int right = nums.length - 1;\n\n        TreeNode root = helper(nums, left, right);\n\n        return root;\n    }\n\n    public static TreeNode helper(int[] nums, int left, int right) {\n\n        if (left > right)\n            return null;\n\n        int mid = left + (right - left) / 2;\n        TreeNode root = new TreeNode(nums[mid]);\n        root.left = helper(nums, left, mid - 1);\n        root.right = helper(nums, mid + 1, right);\n\n        return root;\n    }\n\n    public static void main(String[] args) {\n        int[] nums = { -10, -3, 0, 5, 9 };\n        System.out.println(sortedArrayToBST(nums));\n    }\n}\n"}, {"name": "ValidateBST", "subcat": "BST", "link": "", "code": "package leetcode.tree.BST;\n\nimport leetcode.tree.TreeNode;\n\n/**\n * LeetCode 98: Validate Binary Search Tree\n * https://leetcode.com/problems/validate-binary-search-tree/\n *\n * Given the root of a binary tree, determine if it is a valid BST.\n * A valid BST is defined as:\n *   - The left subtree of a node contains only nodes with keys < the node's key.\n *   - The right subtree of a node contains only nodes with keys > the node's key.\n *   - Both left and right subtrees must also be valid BSTs.\n *\n * Example 1:\n *   Input: root = [2,1,3]\n *   Output: true\n *\n * Example 2:\n *   Input: root = [5,1,4,null,null,3,6]\n *   Output: false (4 is in right subtree of 5 but 4 < 5... wait, 3 < 5)\n *\n * Constraints:\n *   - The number of nodes is in [1, 10^4]\n *   - -2^31 <= Node.val <= 2^31 - 1\n *\n * Approach 1: Recursive with valid range\n *   - Pass (min, max) bounds down. Each node must be within its valid range.\n *   - Left child gets (min, parent.val), right child gets (parent.val, max).\n *\n * Approach 2: Inorder traversal\n *   - Inorder of valid BST is strictly increasing.\n *   - Track previous value and check each node is greater.\n *\n * Time Complexity: O(n)\n * Space Complexity: O(h)\n */\npublic class ValidateBST {\n\n    // Approach 1: Valid range\n    public boolean isValidBST(TreeNode root) {\n        return validate(root, Long.MIN_VALUE, Long.MAX_VALUE);\n    }\n\n    private boolean validate(TreeNode node, long min, long max) {\n        if (node == null) return true;\n\n        if (node.val <= min || node.val >= max) return false;\n\n        return validate(node.left, min, node.val)\n                && validate(node.right, node.val, max);\n    }\n\n    //------------------------------------------------------------------//\n\n    // Approach 2: Inorder traversal with previous tracking\n    TreeNode prev = null;\n\n    public boolean isValidBSTInorder(TreeNode root) {\n        if (root == null) return true;\n\n        if (!isValidBSTInorder(root.left)) return false;\n\n        if (prev != null && root.val <= prev.val) return false;\n        prev = root;\n\n        return isValidBSTInorder(root.right);\n    }\n\n    public static void main(String[] args) {\n        // Valid BST: [2,1,3]\n        TreeNode valid = new TreeNode(2);\n        valid.left = new TreeNode(1);\n        valid.right = new TreeNode(3);\n\n        // Invalid BST: [5,1,4,null,null,3,6]\n        TreeNode invalid = new TreeNode(5);\n        invalid.left = new TreeNode(1);\n        invalid.right = new TreeNode(4);\n        invalid.right.left = new TreeNode(3);\n        invalid.right.right = new TreeNode(6);\n\n        ValidateBST v = new ValidateBST();\n        System.out.println(v.isValidBST(valid));   // true\n        System.out.println(v.isValidBST(invalid)); // false\n    }\n}\n"}, {"name": "CousinsInBinaryTree", "subcat": "DFS", "link": "", "code": "package leetcode.tree.DFS;\n\nimport leetcode.tree.TreeNode;\n\n/**\n * LeetCode Problem 993: Cousins in Binary Tree\n * <p>\n * Given the root of a binary tree with unique values, and the values of two\n * different nodes in the tree x and y, return true if the nodes corresponding\n * to the values x and y in the tree are cousins, or false otherwise.\n * <p>\n * Two nodes of a binary tree are cousins if they have the same depth with\n * different parents.\n * <p>\n * This class uses an optimized single-pass DFS approach.\n * <p>\n * Example:\n * Input: root = [1,2,3,4], x = 4, y = 3\n * 1\n * / \\\n * 2   3\n * /\n * 4\n * Output: false (Different depths)\n */\npublic class CousinsInBinaryTree {\n\n    // Class-level variables to store the results from our single traversal.\n    private TreeNode xParent = null;\n    private TreeNode yParent = null;\n    private int xDepth = -1;\n    private int yDepth = -1;\n\n\n    /**\n     * Determines if nodes x and y are cousins.\n     *\n     * @param root The root of the binary tree.\n     * @param x    The value of the first node.\n     * @param y    The value of the second node.\n     * @return true if x and y are cousins, false otherwise.\n     */\n    public boolean isCousins(TreeNode root, int x, int y) {\n        // Start the DFS traversal to find parents and depths.\n        findDepthAndParent(root, x, y, 0, null);\n\n        // After the traversal, check the two conditions for being cousins.\n        // 1. Depths must be equal.\n        // 2. Parents must NOT be the same.\n        return xDepth == yDepth && xParent != yParent;\n    }\n\n    /**\n     * A helper function that traverses the tree to find the depth and parent\n     * of both nodes x and y in a single pass.\n     *\n     * @param node   The current node in the traversal.\n     * @param x      The value of the first target node.\n     * @param y      The value of the second target node.\n     * @param depth  The depth of the current node.\n     * @param parent The parent of the current node.\n     */\n    private void findDepthAndParent(TreeNode node, int x, int y, int depth, TreeNode parent) {\n        // Base case: If the node is null, stop this path.\n        if (node == null) {\n            return;\n        }\n\n        // If the current node's value is x, record its parent and depth.\n        if (node.val == x) {\n            xParent = parent;\n            xDepth = depth;\n        }\n        // If the current node's value is y, record its parent and depth.\n        else if (node.val == y) {\n            yParent = parent;\n            yDepth = depth;\n        }\n\n        // Optimization: If we have already found both nodes, we can stop early.\n        if (xDepth != -1 && yDepth != -1) {\n            return;\n        }\n\n        // Continue the traversal on the left and right children.\n        // The depth for the children will be `depth + 1`.\n        // The parent for the children will be the `node` itself.\n        findDepthAndParent(node.left, x, y, depth + 1, node);\n        findDepthAndParent(node.right, x, y, depth + 1, node);\n    }\n\n\n    static void main(String[] args) {\n        // Construct the tree:\n        //      1\n        //     / \\\n        //    2   3\n        //     \\   \\\n        //      4   5\n        TreeNode root = new TreeNode(1);\n        root.left = new TreeNode(2);\n        root.right = new TreeNode(3);\n        root.left.right = new TreeNode(4);\n        root.right.right = new TreeNode(5);\n\n        CousinsInBinaryTree solution = new CousinsInBinaryTree();\n        // Nodes 4 and 5 are at the same depth (2) and have different parents (2 and 3).\n        boolean result = solution.isCousins(root, 5, 4);\n\n        System.out.println(\"Are nodes 5 and 4 cousins? \" + result); // Expected: true\n    }\n\n}\n"}, {"name": "DiameterOfBinaryTree", "subcat": "DFS", "link": "", "code": "package leetcode.tree.DFS;\n\nimport leetcode.tree.TreeNode;\n\n/**\n * LeetCode 543: Diameter of Binary Tree\n * https://leetcode.com/problems/diameter-of-binary-tree/\n *\n * Given the root of a binary tree, return the length of the diameter of the tree.\n * The diameter is the length of the longest path between any two nodes. This path\n * may or may not pass through the root. The length is measured by the number of\n * edges between them.\n *\n * Example 1:\n *   Input: root = [1,2,3,4,5]\n *   Output: 3 (path 4 -> 2 -> 1 -> 3 or 5 -> 2 -> 1 -> 3)\n *       1\n *      / \\\n *     2   3\n *    / \\\n *   4   5\n *\n * Example 2:\n *   Input: root = [1,2]\n *   Output: 1\n *\n * Constraints:\n *   - The number of nodes is in [1, 10^4]\n *   - -100 <= Node.val <= 100\n *\n * Approach: DFS (similar to Binary Tree Maximum Path Sum)\n *   - At each node, the path through it = height(left) + height(right).\n *   - Track the global maximum diameter.\n *   - Return height = 1 + max(height(left), height(right)) for parent.\n *\n * Time Complexity: O(n)\n * Space Complexity: O(h)\n */\npublic class DiameterOfBinaryTree {\n\n    int diameter = 0;\n\n    public int diameterOfBinaryTree(TreeNode root) {\n        height(root);\n        return diameter;\n    }\n\n    private int height(TreeNode node) {\n        if (node == null) return 0;\n\n        int leftHeight = height(node.left);\n        int rightHeight = height(node.right);\n\n        // Update diameter: path through this node = left + right edges\n        diameter = Math.max(diameter, leftHeight + rightHeight);\n\n        return 1 + Math.max(leftHeight, rightHeight);\n    }\n\n    public static void main(String[] args) {\n        TreeNode root = new TreeNode(1);\n        root.left = new TreeNode(2);\n        root.right = new TreeNode(3);\n        root.left.left = new TreeNode(4);\n        root.left.right = new TreeNode(5);\n\n        System.out.println(new DiameterOfBinaryTree().diameterOfBinaryTree(root)); // 3\n    }\n}\n"}, {"name": "MaximumDepthOfBinaryTree", "subcat": "DFS", "link": "", "code": "package leetcode.tree.DFS;\n\nimport leetcode.tree.TreeNode;\n\n/**\n * LeetCode 104: Maximum Depth of Binary Tree\n * https://leetcode.com/problems/maximum-depth-of-binary-tree/\n *\n * Given the root of a binary tree, return its maximum depth.\n * A binary tree's maximum depth is the number of nodes along the longest path\n * from the root node down to the farthest leaf node.\n *\n * Example 1:\n *   Input: root = [3,9,20,null,null,15,7]\n *   Output: 3\n *\n * Example 2:\n *   Input: root = [1,null,2]\n *   Output: 2\n *\n * Constraints:\n *   - The number of nodes is in [0, 10^4]\n *   - -100 <= Node.val <= 100\n *\n * Approach: Recursive DFS\n *   - Depth = 1 + max(depth(left), depth(right))\n *   - Base case: null node has depth 0.\n *\n * Time Complexity: O(n)\n * Space Complexity: O(h)\n */\npublic class MaximumDepthOfBinaryTree {\n\n    public int maxDepth(TreeNode root) {\n        if (root == null) return 0;\n        return 1 + Math.max(maxDepth(root.left), maxDepth(root.right));\n    }\n\n    public static void main(String[] args) {\n        TreeNode root = new TreeNode(3);\n        root.left = new TreeNode(9);\n        root.right = new TreeNode(20);\n        root.right.left = new TreeNode(15);\n        root.right.right = new TreeNode(7);\n\n        System.out.println(new MaximumDepthOfBinaryTree().maxDepth(root)); // 3\n    }\n}\n"}, {"name": "MaximumDepthOfNaryTree", "subcat": "DFS", "link": "", "code": "package leetcode.tree.DFS;\n\n\nimport leetcode.tree.Node;\n\nimport java.util.Arrays;\nimport java.util.LinkedList;\nimport java.util.Queue;\n\n/**\n * LeetCode Problem 559: Maximum Depth of N-ary Tree\n * <p>\n * Given an n-ary tree, find its maximum depth.\n * <p>\n * The maximum depth is the number of nodes along the longest path from the\n * root node down to the farthest leaf node.\n * <p>\n * An N-ary tree is a tree in which each node has no more than N children.\n * <p>\n * This file provides two solutions:\n * 1. A recursive Depth-First Search (DFS) approach.\n * 2. An iterative Breadth-First Search (BFS) approach.\n * <p>\n * Example:\n * Input: root = [1,null,3,2,4,null,5,6]\n * This represents the tree:\n *   1\n * / | \\\n * 3  2  4\n * / \\\n * 5   6\n * <p>\n * Output: 3\n */\npublic class MaximumDepthOfNaryTree {\n\n    /**\n     * Finds the maximum depth of an N-ary tree using a recursive DFS approach.\n     * The logic is: the depth of a tree is 1 + the maximum depth among all its children.\n     *\n     * @param root The root node of the N-ary tree.\n     * @return The maximum depth of the tree.\n     */\n    public static int maxDepthDFS(Node root) {\n        // Base case 1: If the tree is empty, its depth is 0.\n        if (root == null) {\n            return 0;\n        }\n\n        // Initialize a variable to keep track of the max depth found among children.\n        int maxChildDepth = 0;\n\n        // Recursively find the depth of each child subtree.\n        for (Node child : root.children) {\n            // Update maxChildDepth with the maximum value found so far.\n            maxChildDepth = Math.max(maxChildDepth, maxDepthDFS(child));\n        }\n\n        // The depth of the tree rooted at the current node is 1 (for the current node)\n        // plus the maximum depth of its children.\n        return maxChildDepth + 1;\n    }\n\n\n\n    /**\n     * Finds the maximum depth of an N-ary tree using an iterative BFS approach.\n     * The logic is to perform a level-order traversal and count the number of levels.\n     *\n     * @param root The root node of the N-ary tree.\n     * @return The maximum depth of the tree.\n     */\n    public static int maxDepthBFS(Node root) {\n        // Base case: If the tree is empty, its depth is 0.\n        if (root == null) {\n            return 0;\n        }\n\n        Queue<Node> queue = new LinkedList<>();\n        queue.offer(root);\n        int depth = 0;\n\n        // Continue traversal as long as there are nodes to process.\n        while (!queue.isEmpty()) {\n            // Get the number of nodes at the current level.\n            int size = queue.size();\n\n            // Process all nodes at the current level.\n            for (int i = 0; i < size; i++) {\n                Node current = queue.poll();\n                // Add all children of the current node to the queue for the next level.\n                for (Node child : current.children) {\n                    queue.offer(child);\n                }\n            }\n\n            // After processing all nodes of a level, increment the depth.\n            depth++;\n        }\n\n        return depth;\n    }\n\n\n    static void main(String[] args) {\n        // Manually construct the N-ary tree from the LeetCode example.\n        // Tree structure:\n        //      1\n        //    / | \\\n        //   3  2  4\n        //  / \\\n        // 5   6\n        Node node5 = new Node(5);\n        Node node6 = new Node(6);\n        Node node3 = new Node(3, Arrays.asList(node5, node6));\n        Node node2 = new Node(2);\n        Node node4 = new Node(4);\n        Node root = new Node(1, Arrays.asList(node3, node2, node4));\n\n        System.out.println(\"Finding max depth for the example tree...\");\n\n        // Calculate depth using DFS\n        int depthFromDFS = maxDepthDFS(root);\n        System.out.println(\"Max depth (using DFS): \" + depthFromDFS); // Expected: 3\n\n        // Calculate depth using BFS\n        int depthFromBFS = maxDepthBFS(root);\n        System.out.println(\"Max depth (using BFS): \" + depthFromBFS); // Expected: 3\n    }\n}"}, {"name": "SameTree", "subcat": "DFS", "link": "", "code": "package leetcode.tree.DFS;\n\nimport leetcode.tree.TreeNode;\n\n/**\n * LeetCode 100: Same Tree\n * https://leetcode.com/problems/same-tree/\n *\n * Given the roots of two binary trees p and q, check if they are the same or not.\n * Two binary trees are the same if they are structurally identical and the nodes\n * have the same value.\n *\n * Example 1:\n *   Input: p = [1,2,3], q = [1,2,3]\n *   Output: true\n *\n * Example 2:\n *   Input: p = [1,2], q = [1,null,2]\n *   Output: false\n *\n * Constraints:\n *   - The number of nodes in both trees is in [0, 100]\n *   - -10^4 <= Node.val <= 10^4\n *\n * Approach: Recursive DFS\n *   - Both null \u2192 same. One null \u2192 not same.\n *   - Values must match, and left/right subtrees must recursively be the same.\n *\n * Time Complexity: O(min(m, n))\n * Space Complexity: O(min(h1, h2))\n */\npublic class SameTree {\n\n    public boolean isSameTree(TreeNode p, TreeNode q) {\n        if (p == null && q == null) return true;\n        if (p == null || q == null) return false;\n        return (p.val == q.val)\n                && isSameTree(p.left, q.left)\n                && isSameTree(p.right, q.right);\n    }\n\n    public static void main(String[] args) {\n        TreeNode p = new TreeNode(1);\n        p.left = new TreeNode(2);\n        p.right = new TreeNode(3);\n\n        TreeNode q = new TreeNode(1);\n        q.left = new TreeNode(2);\n        q.right = new TreeNode(3);\n\n        System.out.println(new SameTree().isSameTree(p, q)); // true\n\n        TreeNode r = new TreeNode(1);\n        r.left = new TreeNode(2);\n\n        TreeNode s = new TreeNode(1);\n        s.right = new TreeNode(2);\n\n        System.out.println(new SameTree().isSameTree(r, s)); // false\n    }\n}\n"}, {"name": "SumOfLeftLeaves", "subcat": "DFS", "link": "", "code": "package leetcode.tree.DFS;\n\nimport leetcode.tree.TreeNode;\n\n/**\n * LeetCode 404: Sum of Left Leaves\n * https://leetcode.com/problems/sum-of-left-leaves/\n *\n * Given the root of a binary tree, return the sum of all left leaves.\n * A leaf is a node with no children. A left leaf is a leaf that is the\n * left child of another node.\n *\n * Example 1:\n *   Input: root = [3,9,20,null,null,15,7]\n *   Output: 24 (9 + 15)\n *\n * Example 2:\n *   Input: root = [1]\n *   Output: 0\n *\n * Constraints:\n *   - The number of nodes is in [1, 1000]\n *   - -1000 <= Node.val <= 1000\n *\n * Approach: DFS with isLeft marker\n *   - Pass a boolean flag to track if current node is a left child.\n *   - At a leaf node that is a left child, return its value.\n *\n * Time Complexity: O(n)\n * Space Complexity: O(h)\n */\npublic class SumOfLeftLeaves {\n\n    // Use marker to mark left leave with no child\n    public static int helper(TreeNode root, boolean isLeft) {\n        if (root == null) return 0;\n\n        if (isLeft && root.left == null && root.right == null) return root.val;\n\n        int left = helper(root.left, true);\n        int right = helper(root.right, false);\n\n        return left + right;\n    }\n\n    public static int sumOfLeftLeaves(TreeNode root) {\n        return helper(root, false);\n    }\n\n\n    public static void main(String[] args) {\n        TreeNode root = new TreeNode(6);\n        root.left = new TreeNode(8);\n        System.out.println(sumOfLeftLeaves(root));\n    }\n}\n"}, {"name": "SumOfRootToLeafBinaryNumbers", "subcat": "DFS", "link": "", "code": "package leetcode.tree.DFS;\n\nimport leetcode.tree.TreeNode;\n\n/**\n * LeetCode 1022: Sum of Root To Leaf Binary Numbers\n * https://leetcode.com/problems/sum-of-root-to-leaf-binary-numbers/\n *\n * You are given the root of a binary tree where each node has a value 0 or 1.\n * Each root-to-leaf path represents a binary number starting with the most\n * significant bit. Return the sum of these numbers.\n *\n * Example 1:\n *   Input: root = [1,0,1,0,1,0,1]\n *   Output: 22 (paths: 100=4, 101=5, 110=6, 111=7 -> 22)\n *\n * Example 2:\n *   Input: root = [0]\n *   Output: 0\n *\n * Constraints:\n *   - The number of nodes is in [1, 1000]\n *   - Node.val is 0 or 1\n *\n * Approach 1: DFS with String concatenation\n *   - Build binary string along path, parse at leaf.\n *\n * Approach 2: DFS with Horner's method (optimal)\n *   - sum = 2 * sum + node.val at each step.\n *   - At leaf, return accumulated sum.\n *\n * Time Complexity: O(n)\n * Space Complexity: O(h)\n */\npublic class SumOfRootToLeafBinaryNumbers {\n\n    String bits = \"\";\n\n    int sum = 0;\n\n\n    // Binary to decimal can be converted using Horner's method.\n    //  Horner's method converts single MSB bit into decimal\n    public void helper(TreeNode root) {\n        if (root == null) return;\n\n        bits = bits + root.val;\n\n        if (root.left == null && root.right == null) {\n            sum += Integer.parseInt(bits, 2);\n        }\n\n        helper(root.left);\n        helper(root.right);\n\n        bits = bits.substring(0, bits.length() - 1);\n    }\n\n    public int sumRootToLeaf(TreeNode root) {\n        helper(root);\n        return sum;\n    }\n\n\n    /**\n     * Horner's method, 100\n     * <p>\n     * Sum = 0;\n     * <p>\n     * 1. sum = 1 + (2 * sum = 0) = 1\n     * 2. sum = 0 + (2 * sum = 1) = 2\n     * 3. sum = 0 + (2 * sum = 2) = 4\n     *\n     *\n     **/\n\n    /*\n    public int sumRootToLeaf(TreeNode root) {\n        return sumRootToLeaf(root, 0);\n    }\n\n    public int sumRootToLeaf(TreeNode root, int sum){\n        if(root == null) return 0;\n        sum = (2 * sum) + root.val;\n        if(root.left == null && root.right == null) return sum;\n        return sumRootToLeaf(root.left, sum) + sumRootToLeaf(root.right, sum);\n    }\n     */\n\n\n    public static void main(String[] args) {\n        // Creating each node\n        TreeNode node1 = new TreeNode(1);\n        TreeNode node2 = new TreeNode(0);\n        TreeNode node3 = new TreeNode(1);\n        TreeNode node4 = new TreeNode(0);\n        TreeNode node5 = new TreeNode(1);\n        TreeNode node6 = new TreeNode(0);\n        TreeNode node7 = new TreeNode(1);\n\n        // Connecting nodes according to the structure [1,0,1,0,1,0,1]\n        node1.left = node2;\n        node1.right = node3;\n        node2.left = node4;\n        node2.right = node5;\n        node3.left = node6;\n        node3.right = node7;\n\n        System.out.println(new SumOfRootToLeafBinaryNumbers().sumRootToLeaf(node1));\n    }\n\n\n}\n"}, {"name": "SymmetricTree", "subcat": "DFS", "link": "", "code": "package leetcode.tree.DFS;\n\nimport leetcode.tree.TreeNode;\n\nimport java.util.LinkedList;\nimport java.util.Queue;\n\n/**\n * LeetCode 101: Symmetric Tree\n * https://leetcode.com/problems/symmetric-tree/\n *\n * Given the root of a binary tree, check whether it is a mirror of itself\n * (i.e., symmetric around its center).\n *\n * Example 1:\n *   Input: root = [1,2,2,3,4,4,3]\n *   Output: true\n *\n * Example 2:\n *   Input: root = [1,2,2,null,3,null,3]\n *   Output: false\n *\n * Constraints:\n *   - The number of nodes is in [1, 1000]\n *   - -100 <= Node.val <= 100\n *\n * Approach 1: Iterative BFS with Queue\n *   - Enqueue left and right children in mirror order.\n *   - Compare pairs: left.left with right.right, left.right with right.left.\n *\n * Approach 2: Recursive\n *   - Compare two subtrees in parallel checking mirror symmetry.\n *\n * Time Complexity: O(n)\n * Space Complexity: O(n)\n */\npublic class SymmetricTree {\n\n\n\n    public static boolean isSymmetric(TreeNode root) {\n        if (root == null) return true;\n        Queue<TreeNode> q = new LinkedList<>();\n        q.add(root.left);\n        q.add(root.right);\n        while (!q.isEmpty()) {\n            TreeNode left = q.poll();\n            TreeNode right = q.poll();\n            if (left == null && right == null) continue;\n            if (left == null || right == null || left.val != right.val) return false;\n            q.add(left.left);\n            q.add(right.right);\n            q.add(left.right);\n            q.add(right.left);\n\n        }\n        return true;\n    }\n\n    //----------------------------------------------------------------------------------//\n\n    public static boolean isSymmetricRecursion(TreeNode root) {\n        if (root == null) return true;\n        return helper(root.left, root.right);\n    }\n\n    // Comparing two subtree parallels\n    public static boolean helper(TreeNode p, TreeNode q) {\n        if (p == null && q == null) return true;\n\n        if (p == null || q == null) return false;\n\n        return (p.val == q.val) && helper(p.left, q.right) && helper(p.right, q.left);\n    }\n\n    public static void main(String[] args) {\n        // Creating nodes\n        TreeNode node3Left = new TreeNode(3);\n        TreeNode node4Left = new TreeNode(4);\n        TreeNode node4Right = new TreeNode(4);\n        TreeNode node3Right = new TreeNode(3);\n\n        TreeNode node2Left = new TreeNode(2, node3Left, node4Left);\n        TreeNode node2Right = new TreeNode(2, node4Right, node3Right);\n\n        TreeNode root = new TreeNode(1, node2Left, node2Right);\n\n        System.out.println(isSymmetric(root));\n\n    }\n}\n"}, {"name": "LCABinarySearchTree", "subcat": "LCA", "link": "", "code": "package leetcode.tree.LCA;\n\nimport leetcode.tree.TreeNode;\n\n/**\n * LeetCode 235: Lowest Common Ancestor of a Binary Search Tree\n * https://leetcode.com/problems/lowest-common-ancestor-of-a-binary-search-tree/\n *\n * Given a BST, find the lowest common ancestor (LCA) of two given nodes.\n * The LCA is the lowest node that has both p and q as descendants (a node\n * can be a descendant of itself).\n *\n * Example 1:\n *   Input: root = [6,2,8,0,4,7,9,null,null,3,5], p = 2, q = 8\n *   Output: 6\n *\n * Example 2:\n *   Input: root = [6,2,8,0,4,7,9,null,null,3,5], p = 2, q = 4\n *   Output: 2\n *\n * Constraints:\n *   - The number of nodes is in [2, 10^5]\n *   - -10^9 <= Node.val <= 10^9\n *   - All Node.val are unique\n *   - p != q, both exist in the BST\n *\n * Approach: Exploit BST property\n *   - If both p and q are smaller than root, LCA is in left subtree.\n *   - If both are larger, LCA is in right subtree.\n *   - Otherwise, root is the split point = LCA.\n *\n * Time Complexity: O(h)\n * Space Complexity: O(1) iterative, O(h) recursive\n */\npublic class LCABinarySearchTree {\n\n    // Iterative approach\n    public TreeNode lowestCommonAncestor(TreeNode root, TreeNode p, TreeNode q) {\n        TreeNode current = root;\n        while (current != null) {\n            if (p.val < current.val && q.val < current.val) {\n                current = current.left;\n            } else if (p.val > current.val && q.val > current.val) {\n                current = current.right;\n            } else {\n                return current; // Split point = LCA\n            }\n        }\n        return null;\n    }\n\n    //------------------------------------------------------------------//\n\n    // Recursive approach\n    public TreeNode lowestCommonAncestorRecursive(TreeNode root, TreeNode p, TreeNode q) {\n        if (p.val < root.val && q.val < root.val) {\n            return lowestCommonAncestorRecursive(root.left, p, q);\n        }\n        if (p.val > root.val && q.val > root.val) {\n            return lowestCommonAncestorRecursive(root.right, p, q);\n        }\n        return root;\n    }\n\n    public static void main(String[] args) {\n        TreeNode root = new TreeNode(6);\n        root.left = new TreeNode(2);\n        root.right = new TreeNode(8);\n        root.left.left = new TreeNode(0);\n        root.left.right = new TreeNode(4);\n        root.right.left = new TreeNode(7);\n        root.right.right = new TreeNode(9);\n        root.left.right.left = new TreeNode(3);\n        root.left.right.right = new TreeNode(5);\n\n        LCABinarySearchTree lca = new LCABinarySearchTree();\n        System.out.println(lca.lowestCommonAncestor(root, root.left, root.right).val); // 6\n        System.out.println(lca.lowestCommonAncestor(root, root.left, root.left.right).val); // 2\n    }\n}\n"}, {"name": "LCABinaryTree", "subcat": "LCA", "link": "", "code": "package leetcode.tree.LCA;\n\nimport leetcode.tree.TreeNode;\n\n/**\n * LeetCode 236: Lowest Common Ancestor of a Binary Tree\n * https://leetcode.com/problems/lowest-common-ancestor-of-a-binary-tree/\n *\n * Given a binary tree, find the lowest common ancestor (LCA) of two given nodes.\n * The LCA is the lowest node that has both p and q as descendants (a node can\n * be a descendant of itself).\n *\n * Example 1:\n *   Input: root = [3,5,1,6,2,0,8,null,null,7,4], p = 5, q = 1\n *   Output: 3\n *\n * Example 2:\n *   Input: root = [3,5,1,6,2,0,8,null,null,7,4], p = 5, q = 4\n *   Output: 5\n *\n * Constraints:\n *   - The number of nodes is in [2, 10^5]\n *   - -10^9 <= Node.val <= 10^9\n *   - All Node.val are unique\n *   - p != q, both exist in the tree\n *\n * Approach: Recursive DFS\n *   - If current node is null, return null.\n *   - If current node is p or q, return it.\n *   - Recurse on left and right subtrees.\n *   - If both sides return non-null, current node is the LCA (split point).\n *   - Otherwise return whichever side is non-null.\n *\n * Time Complexity: O(n)\n * Space Complexity: O(h)\n */\npublic class LCABinaryTree {\n\n    public TreeNode lowestCommonAncestor(TreeNode root, TreeNode p, TreeNode q) {\n        // Base case: reached null or found one of the targets\n        if (root == null || root == p || root == q) {\n            return root;\n        }\n\n        // Search in left and right subtrees\n        TreeNode left = lowestCommonAncestor(root.left, p, q);\n        TreeNode right = lowestCommonAncestor(root.right, p, q);\n\n        // If both sides found a target, current node is the LCA\n        if (left != null && right != null) {\n            return root;\n        }\n\n        // Otherwise, return whichever side found something\n        return left != null ? left : right;\n    }\n\n    public static void main(String[] args) {\n        TreeNode root = new TreeNode(3);\n        root.left = new TreeNode(5);\n        root.right = new TreeNode(1);\n        root.left.left = new TreeNode(6);\n        root.left.right = new TreeNode(2);\n        root.right.left = new TreeNode(0);\n        root.right.right = new TreeNode(8);\n        root.left.right.left = new TreeNode(7);\n        root.left.right.right = new TreeNode(4);\n\n        LCABinaryTree lca = new LCABinaryTree();\n        System.out.println(lca.lowestCommonAncestor(root, root.left, root.right).val); // 3\n        System.out.println(lca.lowestCommonAncestor(root, root.left, root.left.right.right).val); // 5\n    }\n}\n"}, {"name": "ConstructFromInorderPostorder", "subcat": "construction", "link": "", "code": "package leetcode.tree.construction;\n\nimport leetcode.tree.TreeNode;\n\nimport java.util.HashMap;\nimport java.util.Map;\n\n/**\n * LeetCode 106: Construct Binary Tree from Inorder and Postorder Traversal\n * https://leetcode.com/problems/construct-binary-tree-from-inorder-and-postorder-traversal/\n *\n * Given two integer arrays inorder and postorder where inorder is the inorder\n * traversal and postorder is the postorder traversal of the same tree, construct\n * and return the binary tree.\n *\n * Example 1:\n *   Input: inorder = [9,3,15,20,7], postorder = [9,15,7,20,3]\n *   Output: [3,9,20,null,null,15,7]\n *   Tree:\n *       3\n *      / \\\n *     9  20\n *       /  \\\n *      15   7\n *\n * Example 2:\n *   Input: inorder = [-1], postorder = [-1]\n *   Output: [-1]\n *\n * Constraints:\n *   - 1 <= inorder.length <= 3000\n *   - postorder.length == inorder.length\n *   - -3000 <= inorder[i], postorder[i] <= 3000\n *   - All values are unique\n *\n * Approach: Recursive Divide and Conquer (reverse of LC 105)\n *   - Last element of postorder is the root.\n *   - Find root's position in inorder \u2192 split into left/right subtrees.\n *   - Traverse postorder from right to left; build RIGHT subtree first\n *     (postorder: left -> right -> ROOT, so reverse = ROOT -> right -> left).\n *   - Use a HashMap for O(1) index lookup in inorder array.\n *\n * Time Complexity: O(n)\n * Space Complexity: O(n) \u2014 HashMap + recursion stack\n */\npublic class ConstructFromInorderPostorder {\n\n    int postorderIndex;\n    Map<Integer, Integer> inorderMap = new HashMap<>();\n\n    public TreeNode buildTree(int[] inorder, int[] postorder) {\n        postorderIndex = postorder.length - 1;\n\n        for (int i = 0; i < inorder.length; i++) {\n            inorderMap.put(inorder[i], i);\n        }\n\n        return build(postorder, 0, inorder.length - 1);\n    }\n\n    private TreeNode build(int[] postorder, int inLeft, int inRight) {\n        if (inLeft > inRight) return null;\n\n        // Pick the next element from the end of postorder as root\n        int rootVal = postorder[postorderIndex--];\n        TreeNode root = new TreeNode(rootVal);\n\n        int inorderIdx = inorderMap.get(rootVal);\n\n        // Build RIGHT subtree first (postorder reverse: root -> right -> left)\n        root.right = build(postorder, inorderIdx + 1, inRight);\n        root.left = build(postorder, inLeft, inorderIdx - 1);\n\n        return root;\n    }\n\n    public static void main(String[] args) {\n        int[] inorder = {9, 3, 15, 20, 7};\n        int[] postorder = {9, 15, 7, 20, 3};\n\n        TreeNode root = new ConstructFromInorderPostorder().buildTree(inorder, postorder);\n        System.out.println(root.val);       // 3\n        System.out.println(root.left.val);  // 9\n        System.out.println(root.right.val); // 20\n    }\n}\n"}, {"name": "ConstructFromPreorderInorder", "subcat": "construction", "link": "", "code": "package leetcode.tree.construction;\n\nimport leetcode.tree.TreeNode;\n\nimport java.util.HashMap;\nimport java.util.Map;\n\n/**\n * LeetCode 105: Construct Binary Tree from Preorder and Inorder Traversal\n * https://leetcode.com/problems/construct-binary-tree-from-preorder-and-inorder-traversal/\n *\n * Given two integer arrays preorder and inorder where preorder is the preorder\n * traversal and inorder is the inorder traversal of the same tree, construct\n * and return the binary tree.\n *\n * Example 1:\n *   Input: preorder = [3,9,20,15,7], inorder = [9,3,15,20,7]\n *   Output: [3,9,20,null,null,15,7]\n *   Tree:\n *       3\n *      / \\\n *     9  20\n *       /  \\\n *      15   7\n *\n * Example 2:\n *   Input: preorder = [\u22121], inorder = [\u22121]\n *   Output: [\u22121]\n *\n * Constraints:\n *   - 1 <= preorder.length <= 3000\n *   - inorder.length == preorder.length\n *   - -3000 <= preorder[i], inorder[i] <= 3000\n *   - All values are unique\n *\n * Approach: Recursive Divide and Conquer\n *   - First element of preorder is the root.\n *   - Find root's position in inorder \u2192 elements left of it = left subtree,\n *     right of it = right subtree.\n *   - Use a HashMap for O(1) index lookup in inorder array.\n *   - Recursively build left and right subtrees using index boundaries.\n *\n * Time Complexity: O(n)\n * Space Complexity: O(n) \u2014 HashMap + recursion stack\n */\npublic class ConstructFromPreorderInorder {\n\n    int preorderIndex = 0;\n    Map<Integer, Integer> inorderMap = new HashMap<>();\n\n    public TreeNode buildTree(int[] preorder, int[] inorder) {\n        // Build a value -> index map for inorder array\n        for (int i = 0; i < inorder.length; i++) {\n            inorderMap.put(inorder[i], i);\n        }\n        return build(preorder, 0, inorder.length - 1);\n    }\n\n    private TreeNode build(int[] preorder, int inLeft, int inRight) {\n        if (inLeft > inRight) return null;\n\n        // Pick the next element from preorder as root\n        int rootVal = preorder[preorderIndex++];\n        TreeNode root = new TreeNode(rootVal);\n\n        // Find root's index in inorder to split into left/right subtrees\n        int inorderIdx = inorderMap.get(rootVal);\n\n        // Build left subtree first (preorder: root -> LEFT -> right)\n        root.left = build(preorder, inLeft, inorderIdx - 1);\n        root.right = build(preorder, inorderIdx + 1, inRight);\n\n        return root;\n    }\n\n    public static void main(String[] args) {\n        int[] preorder = {3, 9, 20, 15, 7};\n        int[] inorder = {9, 3, 15, 20, 7};\n\n        TreeNode root = new ConstructFromPreorderInorder().buildTree(preorder, inorder);\n        // root.val = 3, root.left.val = 9, root.right.val = 20\n        System.out.println(root.val);       // 3\n        System.out.println(root.left.val);  // 9\n        System.out.println(root.right.val); // 20\n    }\n}\n"}, {"name": "FlattenBinaryTreeLinkedList", "subcat": "modification", "link": "", "code": "package leetcode.tree.modification;\n\nimport leetcode.tree.TreeNode;\n\n/**\n * LeetCode 114: Flatten Binary Tree to Linked List\n * https://leetcode.com/problems/flatten-binary-tree-to-linked-list/\n *\n * Given the root of a binary tree, flatten the tree into a \"linked list\":\n *   - The linked list should use the same TreeNode class where the right child\n *     pointer points to the next node and the left child pointer is always null.\n *   - The linked list should be in the same order as a pre-order traversal.\n *\n * Example:\n *   Input: root = [1,2,5,3,4,null,6]\n *   Output: [1,null,2,null,3,null,4,null,5,null,6]\n *\n * Constraints:\n *   - The number of nodes is in [0, 2000]\n *   - -100 <= Node.val <= 100\n *\n * Approach: Reverse Preorder (right -> left -> root)\n *   - Process right subtree, then left, then current node.\n *   - Set current node's right to previously processed node (pre).\n *   - Set left to null. This builds the flattened list from tail to head.\n *\n * Time Complexity: O(n)\n * Space Complexity: O(h) \u2014 recursion stack\n */\npublic class FlattenBinaryTreeLinkedList {\n\n    TreeNode pre = null;\n\n    // Reverse preorder traversal\n    public void flatten(TreeNode root) {\n        if (root == null)\n            return;\n\n        flatten(root.right);\n        flatten(root.left);\n        root.right = pre;\n        root.left = null;\n        pre = root;\n    }\n\n    public static void main(String[] args) {\n        // Creating nodes\n        TreeNode node3 = new TreeNode(3);\n        TreeNode node4 = new TreeNode(4);\n        TreeNode node6 = new TreeNode(6);\n        TreeNode node5 = new TreeNode(5, null, node6); // Node 5 has only the right child\n        // Node 2 has left child node3 and right child node4\n        TreeNode node2 = new TreeNode(2, node3, node4);\n        // Root node 1 has left child node2 and right child node5\n        TreeNode root = new TreeNode(1, node2, node5);\n\n        new FlattenBinaryTreeLinkedList().flatten(root);\n    }\n}\n"}, {"name": "InvertBinaryTree", "subcat": "modification", "link": "", "code": "package leetcode.tree.modification;\n\nimport leetcode.tree.TreeNode;\n\n/**\n * LeetCode 226: Invert Binary Tree\n * https://leetcode.com/problems/invert-binary-tree/\n *\n * Given the root of a binary tree, invert the tree, and return its root.\n * Inverting means swapping left and right children at every node.\n *\n * Example 1:\n *   Input: root = [4,2,7,1,3,6,9]\n *   Output: [4,7,2,9,6,3,1]\n *          4              4\n *        /   \\    \u2192     /   \\\n *       2     7        7     2\n *      / \\   / \\      / \\   / \\\n *     1   3 6   9    9   6 3   1\n *\n * Example 2:\n *   Input: root = [2,1,3]\n *   Output: [2,3,1]\n *\n * Constraints:\n *   - The number of nodes is in [0, 100]\n *   - -100 <= Node.val <= 100\n *\n * Approach: Recursive DFS\n *   - At each node, swap left and right children.\n *   - Recursively invert left and right subtrees.\n *\n * Time Complexity: O(n)\n * Space Complexity: O(h)\n */\npublic class InvertBinaryTree {\n\n    public TreeNode invertTree(TreeNode root) {\n        if (root == null) return null;\n\n        // Swap children\n        TreeNode temp = root.left;\n        root.left = root.right;\n        root.right = temp;\n\n        invertTree(root.left);\n        invertTree(root.right);\n\n        return root;\n    }\n\n    public static void main(String[] args) {\n        TreeNode root = new TreeNode(4);\n        root.left = new TreeNode(2);\n        root.right = new TreeNode(7);\n        root.left.left = new TreeNode(1);\n        root.left.right = new TreeNode(3);\n        root.right.left = new TreeNode(6);\n        root.right.right = new TreeNode(9);\n\n        TreeNode inverted = new InvertBinaryTree().invertTree(root);\n        System.out.println(inverted.left.val);  // 7\n        System.out.println(inverted.right.val); // 2\n    }\n}\n"}, {"name": "MergeTrees", "subcat": "modification", "link": "", "code": "package leetcode.tree.modification;\n\nimport leetcode.tree.TreeNode;\n\n/**\n * LeetCode 617: Merge Two Binary Trees\n * https://leetcode.com/problems/merge-two-binary-trees/\n *\n * You are given two binary trees root1 and root2. Merge them into a new tree.\n * If two nodes overlap, sum their values. Otherwise, the non-null node is used.\n *\n * Example:\n *   Input: root1 = [1,3,2,5], root2 = [2,1,3,null,4,null,7]\n *   Output: [3,4,5,5,4,null,7]\n *\n * Constraints:\n *   - The number of nodes in both trees is in [0, 2000]\n *   - -10^4 <= Node.val <= 10^4\n *\n * Approach: Recursive DFS (in-place on root1)\n *   - If one tree is null, return the other.\n *   - Otherwise, add root2's value to root1, and recursively merge children.\n *\n * Time Complexity: O(min(m, n)) where m, n are sizes of the two trees\n * Space Complexity: O(min(h1, h2)) \u2014 recursion stack\n */\npublic class MergeTrees {\n\n    public TreeNode mergeTrees(TreeNode root1, TreeNode root2) {\n\n        if (root2 == null) return root1;\n        if (root1 == null) return root2;\n\n        root1.val = root1.val + root2.val;\n        root1.left = mergeTrees(root1.left, root2.left);\n        root1.right = mergeTrees(root1.right, root2.right);\n\n        return root1;\n    }\n\n}\n"}, {"name": "BinaryTreeMaximumPathSum", "subcat": "pathSumVariations", "link": "", "code": "package leetcode.tree.pathSumVariations;\n\nimport leetcode.tree.TreeNode;\n\n/**\n * LeetCode 124: Binary Tree Maximum Path Sum\n * https://leetcode.com/problems/binary-tree-maximum-path-sum/\n *\n * A path in a binary tree is a sequence of nodes where each pair of adjacent\n * nodes has an edge. A node can only appear at most once in the path. The path\n * does not need to pass through the root.\n *\n * Return the maximum path sum of any non-empty path.\n *\n * Example 1:\n *   Input: root = [1,2,3]\n *   Output: 6 (path 2 -> 1 -> 3)\n *\n * Example 2:\n *   Input: root = [-10,9,20,null,null,15,7]\n *   Output: 42 (path 15 -> 20 -> 7)\n *\n * Constraints:\n *   - The number of nodes is in [1, 3 * 10^4]\n *   - -1000 <= Node.val <= 1000\n *\n * Approach: Postorder DFS\n *   - At each node, compute the max gain from left and right children (clamp to 0).\n *   - The path through this node = node.val + leftGain + rightGain.\n *   - Update global max with this \"arch\" path sum.\n *   - Return node.val + max(leftGain, rightGain) for parent to use (single branch only).\n *\n * Time Complexity: O(n)\n * Space Complexity: O(h)\n */\npublic class BinaryTreeMaximumPathSum {\n\n    int maxSum = Integer.MIN_VALUE;\n\n    public int maxPathSum(TreeNode root) {\n        maxGain(root);\n        return maxSum;\n    }\n\n    // Returns max gain extending downward from this node (single branch)\n    private int maxGain(TreeNode node) {\n        if (node == null) return 0;\n\n        // Max gain from left/right children; ignore negative paths\n        int leftGain = Math.max(maxGain(node.left), 0);\n        int rightGain = Math.max(maxGain(node.right), 0);\n\n        // Path through this node as the \"turning point\" (arch)\n        int currentPathSum = node.val + leftGain + rightGain;\n        maxSum = Math.max(maxSum, currentPathSum);\n\n        // Return the max single-branch gain for the parent\n        return node.val + Math.max(leftGain, rightGain);\n    }\n\n    public static void main(String[] args) {\n        // Example: [-10,9,20,null,null,15,7] -> 42\n        TreeNode root = new TreeNode(-10);\n        root.left = new TreeNode(9);\n        root.right = new TreeNode(20);\n        root.right.left = new TreeNode(15);\n        root.right.right = new TreeNode(7);\n\n        System.out.println(new BinaryTreeMaximumPathSum().maxPathSum(root)); // 42\n    }\n}\n"}, {"name": "PathSum", "subcat": "pathSumVariations", "link": "", "code": "package leetcode.tree.pathSumVariations;\n\n\n/**\n * LeetCode Problem 112: Path Sum\n *\n * Given the root of a binary tree and an integer targetSum, return true if the\n * tree has a root-to-leaf path such that adding up all the values along the\n * path equals targetSum.\n *\n * A leaf is a node with no children.\n *\n * This solution uses a recursive DFS approach.\n *\n * Example:\n * Input: root = [5,4,8,11,null,13,4,7,2,null,null,null,1], targetSum = 22\n * Tree:\n *    5\n *  /  \\\n * 4    8\n * /   / \\\n * 11  13  4\n * /    \\    \\\n * 7     2    1\n *\n * Output: true (The path 5 -> 4 -> 11 -> 2 sums to 22)\n */\npublic class PathSum {\n\n    // Definition for a binary tree node.\n    public static class TreeNode {\n        int val;\n        TreeNode left;\n        TreeNode right;\n        TreeNode(int val) { this.val = val; }\n        TreeNode(int val, TreeNode left, TreeNode right) {\n            this.val = val;\n            this.left = left;\n            this.right = right;\n        }\n    }\n\n    /**\n     * Determines if there exists a root-to-leaf path with the given sum.\n     *\n     * @param root The root of the binary tree.\n     * @param targetSum The target sum to find.\n     * @return true if such a path exists, false otherwise.\n     */\n    public boolean hasPathSum(TreeNode root, int targetSum) {\n\n        // **Base Case 1:** If the current node is null, there is no path.\n        // This handles empty trees or paths that extend beyond a leaf.\n        if (root == null) {\n            return false;\n        }\n\n        // **Base Case 2:** We have reached a leaf node (no children).\n        // This is the end of a potential path. We check if the remaining\n        // targetSum is exactly the value of this leaf node.\n        if (root.left == null && root.right == null) {\n            return targetSum == root.val;\n        }\n\n        // **Recursive Step:** If it's not a leaf node, we continue the search.\n        // We subtract the current node's value from the targetSum and\n        // ask if a valid path exists in either the left OR the right subtree.\n        // If either call returns true, the result is true.\n        boolean foundInLeft = hasPathSum(root.left, targetSum - root.val);\n        boolean foundInRight = hasPathSum(root.right, targetSum - root.val);\n\n        return foundInLeft || foundInRight;\n    }\n\n    public static void main(String[] args) {\n        // Construct the tree from the example:\n        TreeNode root = new TreeNode(5);\n        root.left = new TreeNode(4);\n        root.right = new TreeNode(8);\n        root.left.left = new TreeNode(11);\n        root.left.left.left = new TreeNode(7);\n        root.left.left.right = new TreeNode(2);\n        root.right.left = new TreeNode(13);\n        root.right.right = new TreeNode(4);\n        root.right.right.right = new TreeNode(1);\n\n        PathSum solution = new PathSum();\n        int targetSum = 22;\n\n        System.out.println(\"Does a path with sum \" + targetSum + \" exist?\");\n        boolean result = solution.hasPathSum(root, targetSum);\n\n        System.out.println(result); // Expected: true\n    }\n}\n"}, {"name": "PathSum_2", "subcat": "pathSumVariations", "link": "", "code": "package leetcode.tree.pathSumVariations;\n\nimport leetcode.tree.TreeNode;\n\nimport java.util.ArrayList;\nimport java.util.List;\n\n/**\n * LeetCode 113: Path Sum II\n * https://leetcode.com/problems/path-sum-ii/\n *\n * Given the root of a binary
