 tree and an integer targetSum, return all\n * root-to-leaf paths where the sum of the node values equals targetSum.\n * Each path should be returned as a list of node values.\n *\n * Example 1:\n *   Input: root = [5,4,8,11,null,13,4,7,2,null,null,5,1], targetSum = 22\n *   Output: [[5,4,11,2],[5,8,4,5]]\n *\n * Example 2:\n *   Input: root = [1,2,3], targetSum = 5\n *   Output: []\n *\n * Constraints:\n *   - The number of nodes is in [0, 5000]\n *   - -1000 <= Node.val <= 1000\n *   - -1000 <= targetSum <= 1000\n *\n * Approach: DFS Backtracking\n *   - Maintain a current path list. At each node, add its value and subtract from target.\n *   - At a leaf, if remaining target == 0, add a copy of the path to results.\n *   - Backtrack by removing the last element after exploring subtrees.\n *\n * Time Complexity: O(n^2) worst case (copying paths)\n * Space Complexity: O(n) for path + recursion stack\n */\npublic class PathSum_2 {\n\n    public List<List<Integer>> pathSum(TreeNode root, int targetSum) {\n        List<List<Integer>> result = new ArrayList<>();\n        dfs(root, targetSum, new ArrayList<>(), result);\n        return result;\n    }\n\n    private void dfs(TreeNode node, int remaining, List<Integer> path, List<List<Integer>> result) {\n        if (node == null) return;\n\n        path.add(node.val);\n\n        // Leaf node check\n        if (node.left == null && node.right == null && remaining == node.val) {\n            result.add(new ArrayList<>(path)); // Copy the current path\n        }\n\n        dfs(node.left, remaining - node.val, path, result);\n        dfs(node.right, remaining - node.val, path, result);\n\n        path.remove(path.size() - 1); // Backtrack\n    }\n\n    public static void main(String[] args) {\n        // [5,4,8,11,null,13,4,7,2,null,null,5,1], targetSum = 22\n        TreeNode root = new TreeNode(5);\n        root.left = new TreeNode(4);\n        root.right = new TreeNode(8);\n        root.left.left = new TreeNode(11);\n        root.right.left = new TreeNode(13);\n        root.right.right = new TreeNode(4);\n        root.left.left.left = new TreeNode(7);\n        root.left.left.right = new TreeNode(2);\n        root.right.right.left = new TreeNode(5);\n        root.right.right.right = new TreeNode(1);\n\n        System.out.println(new PathSum_2().pathSum(root, 22));\n        // [[5,4,11,2],[5,8,4,5]]\n    }\n}\n"}, {"name": "PathSum_3", "subcat": "pathSumVariations", "link": "", "code": "package leetcode.tree.pathSumVariations;\n\nimport leetcode.tree.TreeNode;\n\nimport java.util.HashMap;\nimport java.util.Map;\n\n/**\n * LeetCode 437: Path Sum III\n * https://leetcode.com/problems/path-sum-iii/\n *\n * Given the root of a binary tree and an integer targetSum, return the number\n * of paths where the values along the path sum to targetSum. The path does not\n * need to start at the root or end at a leaf, but it must go downwards\n * (traveling only from parent to child nodes).\n *\n * Example 1:\n *   Input: root = [10,5,-3,3,2,null,11,3,-2,null,1], targetSum = 8\n *   Output: 3\n *   Paths: 5->3, 5->2->1, -3->11\n *\n * Example 2:\n *   Input: root = [5,4,8,11,null,13,4,7,2,null,null,5,1], targetSum = 22\n *   Output: 3\n *\n * Constraints:\n *   - The number of nodes is in [0, 1000]\n *   - -10^9 <= Node.val <= 10^9\n *   - -1000 <= targetSum <= 1000\n *\n * Approach: Prefix Sum + DFS (similar to subarray sum equals K)\n *   - Maintain a running prefix sum from root to current node.\n *   - Use a HashMap to store frequency of each prefix sum seen so far.\n *   - At each node, check if (currentSum - targetSum) exists in map.\n *   - Backtrack: remove current prefix sum from map after exploring subtrees.\n *\n * Time Complexity: O(n)\n * Space Complexity: O(n)\n */\npublic class PathSum_3 {\n\n    int count = 0;\n\n    public int pathSum(TreeNode root, int targetSum) {\n        Map<Long, Integer> prefixSumMap = new HashMap<>();\n        prefixSumMap.put(0L, 1); // Base case: empty path\n        dfs(root, 0L, targetSum, prefixSumMap);\n        return count;\n    }\n\n    private void dfs(TreeNode node, long currentSum, int targetSum, Map<Long, Integer> prefixSumMap) {\n        if (node == null) return;\n\n        currentSum += node.val;\n\n        // Check how many paths ending here sum to targetSum\n        count += prefixSumMap.getOrDefault(currentSum - targetSum, 0);\n\n        // Add current prefix sum to map\n        prefixSumMap.put(currentSum, prefixSumMap.getOrDefault(currentSum, 0) + 1);\n\n        dfs(node.left, currentSum, targetSum, prefixSumMap);\n        dfs(node.right, currentSum, targetSum, prefixSumMap);\n\n        // Backtrack: remove current prefix sum\n        prefixSumMap.put(currentSum, prefixSumMap.get(currentSum) - 1);\n    }\n\n    public static void main(String[] args) {\n        // [10,5,-3,3,2,null,11,3,-2,null,1], targetSum = 8\n        TreeNode root = new TreeNode(10);\n        root.left = new TreeNode(5);\n        root.right = new TreeNode(-3);\n        root.left.left = new TreeNode(3);\n        root.left.right = new TreeNode(2);\n        root.right.right = new TreeNode(11);\n        root.left.left.left = new TreeNode(3);\n        root.left.left.right = new TreeNode(-2);\n        root.left.right.right = new TreeNode(1);\n\n        System.out.println(new PathSum_3().pathSum(root, 8)); // 3\n    }\n}\n"}, {"name": "BinaryTreeTilt", "subcat": "postorder", "link": "", "code": "package leetcode.tree.postorder;\n\n\nimport leetcode.tree.TreeNode;\n\n/**\n * LeetCode 563: Binary Tree Tilt\n * https://leetcode.com/problems/binary-tree-tilt/\n *\n * Given the root of a binary tree, return the sum of every tree node's tilt.\n * The tilt of a tree node is the absolute difference between the sum of all\n * left subtree node values and all right subtree node values. If a node does\n * not have a left/right child, the sum is 0.\n *\n * Example 1:\n *   Input: root = [1,2,3]\n *   Output: 1 (tilt of 2=0, tilt of 3=0, tilt of 1=|2-3|=1, total=1)\n *\n * Example 2:\n *   Input: root = [4,2,9,3,5,null,7]\n *   Output: 15\n *\n * Constraints:\n *   - The number of nodes is in [0, 10^4]\n *   - -1000 <= Node.val <= 1000\n *\n * Approach: Postorder DFS\n *   - Return subtree sum from each node.\n *   - Accumulate |leftSum - rightSum| into global result.\n *\n * Time Complexity: O(n)\n * Space Complexity: O(h)\n */\npublic class BinaryTreeTilt {\n\n    int result = 0;\n\n\n    // https://leetcode.com/problems/binary-tree-tilt/\n    public int helper(TreeNode root) {\n        if (root == null)\n            return 0;\n\n        int left = helper(root.left);\n        int right = helper(root.right);\n\n        result += Math.abs(left - right);\n\n        return left + right + root.val;\n    }\n\n    public int findTilt(TreeNode root) {\n        helper(root);\n        return result;\n    }\n\n    public static void main(String[] args) {\n        TreeNode root = new TreeNode(1);\n        root.right = new TreeNode(2);\n        System.out.println(new BinaryTreeTilt().findTilt(root));\n    }\n\n}\n"}, {"name": "MostFrequentSubtreeSum", "subcat": "postorder", "link": "", "code": "package leetcode.tree.postorder;\n\nimport leetcode.tree.TreeNode;\n\nimport java.util.*;\n\n/**\n * LeetCode 508: Most Frequent Subtree Sum\n * https://leetcode.com/problems/most-frequent-subtree-sum/\n *\n * Given the root of a binary tree, return the most frequent subtree sum.\n * The subtree sum of a node is the sum of all node values in its subtree\n * (including itself). If there is a tie, return all values with the highest\n * frequency in any order.\n *\n * Example 1:\n *   Input: root = [5,2,-3]\n *   Output: [2,-3,4]\n *\n * Example 2:\n *   Input: root = [5,2,-5]\n *   Output: [2]\n *\n * Constraints:\n *   - The number of nodes is in [1, 10^4]\n *   - -10^5 <= Node.val <= 10^5\n *\n * Approach: Postorder DFS + HashMap\n *   - Compute subtree sum via postorder: left + right + root.val.\n *   - Store each sum's frequency in a HashMap.\n *   - Find max frequency, collect all sums with that frequency.\n *\n * Time Complexity: O(n)\n * Space Complexity: O(n)\n */\n@SuppressWarnings(\"all\")\npublic class MostFrequentSubtreeSum {\n\n    public static int subTreeSum(TreeNode root, int sum, Map<Integer, Integer> map) {\n        if (root == null) return 0;\n\n        int left = subTreeSum(root.left, sum, map);\n        int right = subTreeSum(root.right, sum, map);\n\n        int currentSum = left + right + root.val;\n        map.put(currentSum, map.getOrDefault(currentSum, 0) + 1);\n\n        return currentSum;\n    }\n\n\n    public int[] findFrequentTreeSum(TreeNode root) {\n        Map<Integer, Integer> map = new HashMap<>();\n        subTreeSum(root, 0,  map);\n\n        int max = 0;\n        for (int i : map.values()) {\n            max = Math.max(max, i);\n        }\n\n        List<Integer> result = new ArrayList<>();\n        for (int i : map.keySet()) {\n            if (map.get(i) == max) {\n                result.add(i);\n            }\n        }\n\n        return result.stream().mapToInt(x -> x.intValue()).toArray();\n    }\n\n\n}\n"}, {"name": "SerializeDeserializeBinaryTree", "subcat": "serialization", "link": "", "code": "package leetcode.tree.serialization;\n\nimport leetcode.tree.TreeNode;\n\nimport java.util.Arrays;\nimport java.util.LinkedList;\nimport java.util.Queue;\n\n/**\n * LeetCode 297: Serialize and Deserialize Binary Tree\n * https://leetcode.com/problems/serialize-and-deserialize-binary-tree/\n *\n * Design an algorithm to serialize and deserialize a binary tree. Serialization\n * is the process of converting a data structure into a sequence of bits.\n * Deserialization is the reverse process.\n *\n * Example 1:\n *   Input: root = [1,2,3,null,null,4,5]\n *   Output: [1,2,3,null,null,4,5]\n *\n * Example 2:\n *   Input: root = []\n *   Output: []\n *\n * Constraints:\n *   - The number of nodes is in [0, 10^4]\n *   - -1000 <= Node.val <= 1000\n *\n * Approach: Preorder DFS\n *   - Serialize: Preorder traversal, use \"null\" for null nodes, comma-separated.\n *   - Deserialize: Split string by comma, use a Queue to consume tokens in\n *     preorder sequence, reconstructing the tree recursively.\n *\n * Time Complexity: O(n) for both serialize and deserialize\n * Space Complexity: O(n)\n */\npublic class SerializeDeserializeBinaryTree {\n\n    // Encodes a tree to a single string\n    public String serialize(TreeNode root) {\n        StringBuilder sb = new StringBuilder();\n        serializeHelper(root, sb);\n        return sb.toString();\n    }\n\n    private void serializeHelper(TreeNode node, StringBuilder sb) {\n        if (node == null) {\n            sb.append(\"null,\");\n            return;\n        }\n        sb.append(node.val).append(\",\");\n        serializeHelper(node.left, sb);\n        serializeHelper(node.right, sb);\n    }\n\n    // Decodes your encoded data to tree\n    public TreeNode deserialize(String data) {\n        Queue<String> queue = new LinkedList<>(Arrays.asList(data.split(\",\")));\n        return deserializeHelper(queue);\n    }\n\n    private TreeNode deserializeHelper(Queue<String> queue) {\n        String val = queue.poll();\n        if (val == null || val.equals(\"null\")) {\n            return null;\n        }\n        TreeNode node = new TreeNode(Integer.parseInt(val));\n        node.left = deserializeHelper(queue);\n        node.right = deserializeHelper(queue);\n        return node;\n    }\n\n    public static void main(String[] args) {\n        TreeNode root = new TreeNode(1);\n        root.left = new TreeNode(2);\n        root.right = new TreeNode(3);\n        root.right.left = new TreeNode(4);\n        root.right.right = new TreeNode(5);\n\n        SerializeDeserializeBinaryTree codec = new SerializeDeserializeBinaryTree();\n        String serialized = codec.serialize(root);\n        System.out.println(serialized); // \"1,2,null,null,3,4,null,null,5,null,null,\"\n\n        TreeNode deserialized = codec.deserialize(serialized);\n        System.out.println(deserialized.val);       // 1\n        System.out.println(deserialized.right.val); // 3\n    }\n}\n"}, {"name": "VerifyPreorderSerialization", "subcat": "serialization", "link": "", "code": "package leetcode.tree.serialization;\n\nimport java.util.Stack;\n\n/**\n * LeetCode 331: Verify Preorder Serialization of a Binary Tree\n * https://leetcode.com/problems/verify-preorder-serialization-of-a-binary-tree/\n *\n * One way to serialize a binary tree is to use preorder traversal. When we\n * encounter a non-null node, we record the node's value. If it is a null node,\n * we record '#'. Given a string of comma-separated values, verify whether it\n * is a correct preorder serialization of a binary tree (without reconstructing).\n *\n * Example 1:\n *   Input: preorder = \"9,3,4,#,#,1,#,#,2,#,6,#,#\"\n *   Output: true\n *\n * Example 2:\n *   Input: preorder = \"1,#\"\n *   Output: false\n *\n * Constraints:\n *   - 1 <= preorder.length <= 10^4\n *   - preorder consists of integers in [0, 100] and '#' separated by commas\n *\n * Approach 1: Slot-based (Indegree/Outdegree)\n *   - Start with 1 slot. Each non-null consumes 1 slot, adds 2. Each '#' consumes 1.\n *   - If slots go negative at any point, invalid. Must end with 0 slots.\n *\n * Approach 2: Stack-based\n *   - When top 3 elements are [val, #, #], replace them with '#' (subtree fully consumed).\n *   - Valid if stack ends with a single '#'.\n *\n * Time Complexity: O(n)\n * Space Complexity: O(n) stack-based, O(1) slot-based\n */\npublic class VerifyPreorderSerialization {\n\n    public boolean slotBased(String preorder) {\n        int slot = 1;\n        String[] str = preorder.split(\",\");\n\n        for (String value : str) {\n            slot--;\n\n            if (slot < 0) return false;\n\n            if (!value.equals(\"#\")) {\n                slot += 2;\n            }\n        }\n\n        return slot == 0;\n    }\n\n    @SuppressWarnings(\"all\")\n    public boolean stackBased(String preorder){\n        String[] str = preorder.split(\",\");\n        Stack<String> stack = new Stack<>();\n\n        for (String s : str) {\n            stack.push(s);\n\n            while (stack.size() >= 3\n                    && stack.get(stack.size() - 1).equals(\"#\")\n                    && stack.get(stack.size() - 2).equals(\"#\")\n                    && !stack.get(stack.size() - 3).equals(\"#\")) {\n\n                stack.pop();\n                stack.pop();\n                stack.pop();\n\n                stack.push(\"#\");\n            }\n        }\n\n        return stack.size() == 1 && stack.peek().equals(\"#\");\n    }\n\n    public boolean isValidSerialization(String preorder) {\n      //return slotBased(preorder);\n        return stackBased(preorder);\n    }\n\n    public static void main(String[] args){\n        String preorder = \"9,3,4,#,#,1,#,#,2,#,6,#,#\";\n        //preorder = \"9,#,#,1\";\n        System.out.println(new VerifyPreorderSerialization().isValidSerialization(preorder));\n    }\n}\n"}, {"name": "BST", "subcat": "types", "link": "", "code": "package leetcode.tree.types;\n\n\npublic  class BST {\n\n    private TreeNode root;\n\n    //----------------------- Insertion --------------------------//\n    private TreeNode insertHelper(TreeNode root, int key) {\n        if (root == null) {\n            return new TreeNode(key);\n        }\n        if (key < root.val) {\n            root.left = insertHelper(root.left, key); // Fill the new node\n        } else if (key > root.val) {\n            root.right = insertHelper(root.right, key); // // Fill the new node\n        }\n        return root; // Return the root, means fill the left and right child of parent node\n    }\n\n    // Inserts and return the root\n    public void insert(int key) {\n        root = insertHelper(root, key);\n    }\n\n    //----------------------- Searching --------------------------//\n    private boolean containsHelper(TreeNode root, int key) {\n        if (root == null) {\n            return false;\n        }\n\n        if (key == root.val) {\n            return true;\n        }\n\n        return key < root.val ? containsHelper(root.left, key) : containsHelper(root.right, key);\n    }\n\n    // Check if the key is in the tree\n    public boolean contains(int key) {\n        return containsHelper(root, key);\n    }\n\n    //----------------------- Deletion --------------------------//\n    private TreeNode deleteHelper(TreeNode root, int key) {\n        if (root == null) return null;\n\n        if (key < root.val)\n            root.left = deleteHelper(root.left, key); // If no child,  null is filled, if one node filled either one left or right node\n        else if (key > root.val)\n            root.right = deleteHelper(root.right, key);\n        else {\n            // Node with only one child or no child\n            if (root.left == null) return root.right;\n            else if (root.right == null)  return root.left;\n\n            root.val = inorderSuccessor(root.right); // Replace with Inorder Successor\n            root.right = deleteHelper(root.right, root.val); // Delete the inorder successor\n        }\n\n        return root;\n    }\n\n    private int inorderSuccessor(TreeNode root) {\n        int min = root.val;\n        while (root.left != null) {\n            min = root.left.val;\n            root = root.left;\n        }\n        return min;\n    }\n\n    // Deletes the key from the tree\n    public void delete(int key) {\n        root = deleteHelper(root, key);\n    }\n\n    public static void main(String[] args) {\n        BST bst = new BST();\n        int[] values = {-10, -3, 0, 5, 9};\n        for (int value : values) {\n            bst.insert(value);\n        }\n\n        bst.delete(3);\n\n        // Check if values exist\n        System.out.println(\"Contains 3: \" + bst.contains(3)); // Should print: false\n    }\n\n}"}, {"name": "EulerTour", "subcat": "types", "link": "", "code": "package leetcode.tree.types;\n\nimport java.util.ArrayList;\nimport java.util.Arrays;\nimport java.util.List;\n\n/**\n * Euler Tour of a Tree \u2014 flatten a tree into an array so that subtree queries\n * become range queries, solvable with a Segment Tree or BIT.\n *\n * KEY IDEA:\n *   Perform a DFS on the tree. Record the \"entry time\" (tin) when you first\n *   visit a node, and the \"exit time\" (tout) when you leave it after visiting\n *   all its descendants. Every node in u's subtree will have entry times in\n *   the contiguous range [tin[u], tout[u]].\n *\n *   This transforms subtree operations into range operations on a flat array.\n *\n * EXAMPLE:\n *\n *   Tree (rooted at 0):\n *\n *           0\n *          / \\\n *         1   2\n *        / \\   \\\n *       3   4   5\n *\n *   DFS traversal order:  0 \u2192 1 \u2192 3 \u2192 (back) \u2192 4 \u2192 (back) \u2192 (back) \u2192 2 \u2192 5\n *\n *   Node:  0  1  2  3  4  5\n *   tin:   0  1  4  2  3  5\n *   tout:  5  3  5  2  3  5\n *\n *   Euler order array (nodes ordered by tin):\n *     index: 0  1  2  3  4  5\n *     node:  0  1  3  4  2  5\n *\n *   Subtree of node 1 \u2192 range [tin[1], tout[1]] = [1, 3] \u2192 nodes {1, 3, 4} \u2713\n *   Subtree of node 2 \u2192 range [tin[2], tout[2]] = [4, 5] \u2192 nodes {2, 5}    \u2713\n *   Subtree of node 0 \u2192 range [tin[0], tout[0]] = [0, 5] \u2192 all nodes       \u2713\n *\n * USE CASES:\n *   1. Subtree sum/min/max queries \u2192 Euler Tour + Segment Tree\n *   2. Subtree update (add value to all nodes in subtree) \u2192 range update\n *   3. LCA queries (with extensions)\n *   4. Path queries on trees (combined with techniques like HLD)\n *\n * TIME:  O(n) to compute the tour\n * SPACE: O(n) for tin[], tout[], and order[]\n */\npublic class EulerTour {\n\n    private final List<List<Integer>> adj; // adjacency list of the tree\n    private final int n;                   // number of nodes\n\n    private int[] tin;      // tin[u]  = entry time of node u (when DFS first visits u)\n    private int[] tout;     // tout[u] = exit time of node u (when DFS finishes u's subtree)\n    private int[] order;    // order[t] = which node has entry time t (the flat Euler array)\n    private int timer;      // global clock, incremented at each new node visit\n\n    public EulerTour(int n) {\n        this.n = n;\n        this.adj = new ArrayList<>();\n        for (int i = 0; i < n; i++) {\n            adj.add(new ArrayList<>());\n        }\n    }\n\n    // Add an undirected edge (tree edge)\n    public void addEdge(int u, int v) {\n        adj.get(u).add(v);\n        adj.get(v).add(u);\n    }\n\n    // \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n    // Compute the Euler Tour starting from the given root.\n    //\n    // After this call:\n    //   tin[u]   = the position in the flat array where node u appears\n    //   tout[u]  = the last position belonging to u's subtree\n    //   order[i] = the node at position i in the flat array\n    //\n    // Subtree of u \u2192 contiguous range [tin[u], tout[u]] in order[].\n    // \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n    public void computeTour(int root) {\n        tin = new int[n];\n        tout = new int[n];\n        order = new int[n];\n        timer = 0;\n\n        dfs(root, -1);\n    }\n\n    private void dfs(int u, int parent) {\n        // Record entry time: u is the (timer)-th node we visit\n        tin[u] = timer;\n        order[timer] = u;\n        timer++;\n\n        // Visit all children (skip parent to avoid going back up)\n        for (int v : adj.get(u)) {\n            if (v != parent) {\n                dfs(v, u);\n            }\n        }\n\n        // Record exit time: all descendants of u have been visited.\n        // tout[u] = timer - 1 means the last index belonging to u's subtree.\n        tout[u] = timer - 1;\n    }\n\n    // \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n    // Getters \u2014 used to wire up with a Segment Tree for queries.\n    // \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\n    /** Entry time of node u (= index in the flat array) */\n    public int tin(int u) { return tin[u]; }\n\n    /** Exit time of node u (= last index of u's subtree) */\n    public int tout(int u) { return tout[u]; }\n\n    /** The flat array: order[i] = node at position i */\n    public int[] getOrder() { return order; }\n\n    /** Number of nodes in u's subtree = tout[u] - tin[u] + 1 */\n    public int subtreeSize(int u) { return tout[u] - tin[u] + 1; }\n\n    // \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n    // EXAMPLE: Euler Tour + Segment Tree for subtree sum queries.\n    //\n    // Given node values val[], answer:\n    //   1. subtreeSum(u) \u2014 sum of all values in u's subtree\n    //   2. updateNode(u, newVal) \u2014 change val[u] and update the tree\n    //\n    // Approach:\n    //   - Compute Euler Tour to get tin[], tout[], order[].\n    //   - Build a flat array where flat[tin[u]] = val[u].\n    //   - Build a Segment Tree over the flat array.\n    //   - subtreeSum(u) = segTree.query(tin[u], tout[u])\n    //   - updateNode(u, newVal) = segTree.update(tin[u], newVal)\n    // \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n    public static void main(String[] args) {\n        /*\n         * Tree structure (rooted at 0):\n         *\n         *         0 (val=1)\n         *        / \\\n         *   (val=2)1  2(val=3)\n         *      / \\     \\\n         * (val=4)3 4(val=5) 5(val=6)\n         */\n        int n = 6;\n        int[] val = {1, 2, 3, 4, 5, 6}; // value of each node\n\n        // Build the tree\n        EulerTour et = new EulerTour(n);\n        et.addEdge(0, 1);\n        et.addEdge(0, 2);\n        et.addEdge(1, 3);\n        et.addEdge(1, 4);\n        et.addEdge(2, 5);\n\n        // Compute Euler Tour from root = 0\n        et.computeTour(0);\n\n        // Print the tour info\n        System.out.println(\"Node:  0  1  2  3  4  5\");\n        System.out.println(\"tin:   \" + Arrays.toString(et.tin));\n        System.out.println(\"tout:  \" + Arrays.toString(et.tout));\n        System.out.println(\"order: \" + Arrays.toString(et.order));\n\n        // Build a flat array in Euler order: flat[i] = val[order[i]]\n        int[] flat = new int[n];\n        for (int i = 0; i < n; i++) {\n            flat[i] = val[et.order[i]];\n        }\n        System.out.println(\"flat:  \" + Arrays.toString(flat));\n\n        // Build Segment Tree over the flat array\n        SegmentTree seg = new SegmentTree(flat);\n\n        // Subtree sum of node 1 \u2192 query range [tin[1], tout[1]]\n        // Subtree of 1 = {1, 3, 4} \u2192 values {2, 4, 5} \u2192 sum = 11\n        int sum1 = seg.query(et.tin(1), et.tout(1));\n        System.out.println(\"Subtree sum of node 1: \" + sum1); // 11\n\n        // Subtree sum of node 0 (entire tree) \u2192 1+2+3+4+5+6 = 21\n        int sum0 = seg.query(et.tin(0), et.tout(0));\n        System.out.println(\"Subtree sum of node 0: \" + sum0); // 21\n\n        // Update node 3's value from 4 to 10\n        // Node 3 sits at flat index tin[3], so update that position\n        seg.update(et.tin(3), 10);\n\n        // Subtree sum of node 1 is now {2, 10, 5} = 17\n        int sum1Updated = seg.query(et.tin(1), et.tout(1));\n        System.out.println(\"Subtree sum of node 1 after update: \" + sum1Updated); // 17\n    }\n}\n"}, {"name": "MaxHeap", "subcat": "types", "link": "", "code": "package leetcode.tree.types;\n\nimport java.util.ArrayList;\nimport java.util.List;\n\npublic class MaxHeap {\n    public final List<Integer> heap;\n\n    public MaxHeap() {\n        this.heap = new ArrayList<>();\n    }\n\n    public int parent(int i) {\n        return (i - 1) / 2;\n    }\n\n    public int leftChild(int i) {\n        return i * 2 + 1;\n    }\n\n    public int rightChild(int i) {\n        return i * 2 + 2;\n    }\n\n\n    // Insert Operation\n    public void insert(int value) {\n        heap.add(value);\n        heapifyUp(heap.size() - 1);\n    }\n\n    // After insert heapify up\n    public void heapifyUp(int i) {\n        while (i > 0 && heap.get(i) > heap.get(parent(i))) {\n\n            // Swap child with parent\n            int temp = heap.get(i);\n            heap.set(i, heap.get(parent(i)));\n            heap.set(parent(i), temp);\n\n            // heapify up next node\n            i = parent(i);\n        }\n    }\n\n    // Extract a max element from heap\n    public int extractMax() {\n        if (heap.isEmpty()) throw new IllegalStateException(\"Heap is empty\");\n\n        int max = heap.get(0);\n        int last = heap.get(heap.size() - 1);\n\n        heap.set(0, last);\n        heapifyDown(0);\n\n        return max;\n    }\n\n\n    // After extracting max heapify down\n    public void heapifyDown(int i) {\n        int largest = i;\n        int left = leftChild(i);\n        int right = rightChild(i);\n\n        if (left < heap.size() && heap.get(left) > heap.get(largest)) {\n            largest = left;\n        }\n\n        if (right < heap.size() && heap.get(right) > heap.get(largest)) {\n            largest = right;\n        }\n\n        if (i != largest) {\n            // Swap child with parent\n            int temp = heap.get(i);\n            heap.set(i, heap.get(largest));\n            heap.set(largest, temp);\n\n            heapifyDown(largest);\n        }\n    }\n\n\n    public static void main(String[] args) {\n        MaxHeap maxHeap = new MaxHeap();\n        maxHeap.insert(20);\n        maxHeap.insert(5);\n        maxHeap.insert(30);\n        maxHeap.insert(10);\n        maxHeap.insert(15);\n\n        System.out.println(\"Heap: \" + maxHeap.heap);\n        System.out.println(\"Max: \" + maxHeap.extractMax());\n        System.out.println(\"Max: \" + maxHeap.extractMax());\n        System.out.println(\"Max: \" + maxHeap.extractMax());\n        System.out.println(\"Heap: \" + maxHeap.heap);\n    }\n\n}\n"}, {"name": "SegmentTree", "subcat": "types", "link": "", "code": "package leetcode.tree.types;\n\n/**\n * Segment Tree \u2014 a binary tree data structure for efficient range queries\n * and point updates on an array.\n *\n * KEY IDEA:\n *   Each node stores an aggregate (here: sum) of a contiguous subarray.\n *   The root covers the entire array [0, n-1].\n *   Its left child covers [0, mid], right child covers [mid+1, n-1], and so on\n *   recursively until each leaf covers a single element.\n *\n * TREE LAYOUT (stored in a flat array, 1-indexed or 0-indexed):\n *   - Node i's left child  = 2*i + 1\n *   - Node i's right child = 2*i + 2\n *   - We allocate 4*n space to safely hold all nodes.\n *\n *         [0..5] sum=36          <- root covers full array\n *        /              \\\n *    [0..2] sum=9     [3..5] sum=27\n *    /      \\          /       \\\n * [0..1]=4  [2]=5   [3..4]=16  [5]=11\n *  /   \\              /    \\\n * [0]=1 [1]=3      [3]=7  [4]=9\n *\n * TIME COMPLEXITY:\n *   Build:  O(n)        \u2014 visits every node once\n *   Query:  O(log n)    \u2014 at most 2 nodes per level are visited\n *   Update: O(log n)    \u2014 walks one root-to-leaf path\n *\n * SPACE: O(n) \u2014 the tree array has at most 4*n entries.\n */\npublic class SegmentTree {\n\n    private final int[] tree; // internal array storing node values\n    private final int n;      // size of the original array\n\n    public SegmentTree(int[] arr) {\n        n = arr.length;\n        tree = new int[4 * n]; // 4*n guarantees enough space for any n\n        buildTree(arr, 0, 0, n - 1);\n    }\n\n    // \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n    // BUILD: Recursively construct the tree bottom-up.\n    //\n    //   node  = index in the tree[] array for the current segment\n    //   start = left boundary of the segment this node covers\n    //   end   = right boundary of the segment this node covers\n    //\n    // Base case: leaf node (start == end) \u2192 store the array element.\n    // Recursive: build left and right children, then merge (sum).\n    // \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n    public void buildTree(int[] arr, int node, int start, int end) {\n        if (start == end) {\n            // Leaf: this node covers exactly one element arr[start].\n            tree[node] = arr[start];\n        } else {\n            int mid = (start + end) / 2;\n\n            // Build left subtree covering [start, mid]\n            buildTree(arr, 2 * node + 1, start, mid);\n\n            // Build right subtree covering [mid+1, end]\n            buildTree(arr, 2 * node + 2, mid + 1, end);\n\n            // Internal node = aggregate of its two children\n            tree[node] = tree[2 * node + 1] + tree[2 * node + 2];\n        }\n    }\n\n    // \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n    // QUERY: Find the sum of elements in range [l, r].\n    //\n    //   Three cases at each node covering [start, end]:\n    //\n    //   1. NO OVERLAP:   [start, end] is completely outside [l, r]\n    //      \u2192 return 0 (identity for sum)\n    //\n    //   2. TOTAL OVERLAP: [start, end] is completely inside [l, r]\n    //      \u2192 return tree[node] directly (no need to go deeper)\n    //\n    //   3. PARTIAL OVERLAP: some part overlaps\n    //      \u2192 recurse into both children and combine results\n    // \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n    public int query(int l, int r) {\n        return query(0, 0, n - 1, l, r);\n    }\n\n    private int query(int node, int start, int end, int l, int r) {\n        // Case 1: No overlap \u2014 this segment is entirely outside [l, r]\n        if (start > r || end < l) {\n            return 0; // identity element for sum\n        }\n\n        // Case 2: Total overlap \u2014 this segment is entirely within [l, r]\n        if (start >= l && end <= r) {\n            return tree[node];\n        }\n\n        // Case 3: Partial overlap \u2014 split and combine\n        int mid = (start + end) / 2;\n        int leftSum = query(2 * node + 1, start, mid, l, r);\n        int rightSum = query(2 * node + 2, mid + 1, end, l, r);\n        return leftSum + rightSum;\n    }\n\n    // \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n    // POINT UPDATE: Set arr[index] = value, then propagate changes\n    //               up the tree.\n    //\n    //   Walk from root toward the leaf that holds arr[index].\n    //   At each level, go left or right depending on where index falls.\n    //   Once we reach the leaf, set its value.\n    //   On the way back up, recalculate each ancestor as the sum\n    //   of its two children.\n    // \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n    public void update(int index, int value) {\n        update(0, 0, n - 1, index, value);\n    }\n\n    private void update(int node, int start, int end, int index, int value) {\n        if (start == end) {\n            // Leaf node \u2014 update the value\n            tree[node] = value;\n            return;\n        }\n\n        int mid = (start + end) / 2;\n\n        if (index <= mid) {\n            // index falls in the left child's range [start, mid]\n            update(2 * node + 1, start, mid, index, value);\n        } else {\n            // index falls in the right child's range [mid+1, end]\n            update(2 * node + 2, mid + 1, end, index, value);\n        }\n\n        // After updating the leaf, recalculate this node from its children\n        tree[node] = tree[2 * node + 1] + tree[2 * node + 2];\n    }\n\n\n    public static void main(String[] args) {\n        int[] arr = {1, 3, 5, 7, 9, 11};\n        SegmentTree segmentTree = new SegmentTree(arr);\n\n        // Query sum of arr[1..3] = 3 + 5 + 7 = 15\n        System.out.println(segmentTree.query(1, 3)); // 15\n\n        // Update arr[1] = 10, then query arr[1..3] = 10 + 5 + 7 = 22\n        segmentTree.update(1, 10);\n        System.out.println(segmentTree.query(1, 3)); // 22\n    }\n}\n"}, {"name": "TreeNode", "subcat": "types", "link": "", "code": "package leetcode.tree.types;\n\nclass TreeNode {\n   public TreeNode left;\n   public int val;\n   public TreeNode right;\n\n   public TreeNode() {\n   }\n\n   public TreeNode(int val) {\n       this.val = val;\n   }\n\n   public TreeNode(int val, TreeNode left, TreeNode right) {\n       this.val = val;\n       this.left = left;\n       this.right = right;\n   }\n}\n"}, {"name": "TreeTraversal", "subcat": "types", "link": "", "code": "package leetcode.tree.types;\n\nimport java.util.LinkedList;\nimport java.util.Queue;\nimport java.util.Stack;\n\npublic class TreeTraversal {\n\n    /**\n     * Level order traversal\n     **/\n    static void BFS(TreeNode root) {\n        Queue<TreeNode> queue = new LinkedList<>();\n        queue.add(root);\n\n        while (!queue.isEmpty()) {\n            TreeNode x = queue.poll();\n            System.out.print(x.val + \" \");\n            if (x.left != null) queue.add(x.left);\n            if (x.right != null) queue.add(x.right);\n        }\n    }\n\n\n    //-----------------------------------------DFS Recursive-----------------------------------//\n\n    /**\n     * Depth First Search recursion\n     * Preorder\n     **/\n    static void preorderRecursion(TreeNode node) {\n        if (node == null) return;\n\n        System.out.print(node.val + \" \");\n        preorderRecursion(node.left);\n        preorderRecursion(node.right);\n    }\n\n\n    /**\n     * Depth-First Search recursion\n     * Postorder\n     **/\n    static void postorderRecursion(TreeNode node) {\n        if (node == null) return;\n\n        postorderRecursion(node.left);\n        postorderRecursion(node.right);\n        System.out.print(node.val + \" \");\n    }\n\n    /**\n     * Depth-First Search recursion\n     * Inorder\n     **/\n    static void inorderRecursion(TreeNode node) {\n        if (node == null) return;\n\n        inorderRecursion(node.left);\n        System.out.print(node.val + \" \");\n        inorderRecursion(node.right);\n    }\n\n\n    //-----------------------------------------DFS Iterative-----------------------------------//\n\n    /**\n     * Depth-First Search iterative\n     * Inorder\n     **/\n    static void inorderIterative(TreeNode root) {\n        if (root == null) {\n            return;\n        }\n\n        Stack<TreeNode> stack = new Stack<>();\n        TreeNode current = root;\n\n        while (current != null || !stack.isEmpty()) {\n\n            while (current != null) {\n                stack.push(current);\n                current = current.left;\n            }\n\n            current = stack.pop();\n            System.out.print(current.val + \" \");\n            current = current.right;\n        }\n    }\n\n\n    /**\n     * Depth First Search iterative\n     * Preorder\n     **/\n    static void preorderIterative(TreeNode root) {\n        Stack<TreeNode> stack = new Stack<>();\n        stack.add(root);\n\n        while (!stack.isEmpty()) {\n            TreeNode x = stack.pop();\n            System.out.print(x.val + \" \");\n            if (x.right != null) stack.add(x.right);\n            if (x.left != null) stack.add(x.left);\n        }\n    }\n\n\n    /**\n     * Depth-First Search iterative\n     * Postorder\n     **/\n    static void postorderIterative(TreeNode root) {\n        if (root == null) {\n            return;\n        }\n\n        Stack<TreeNode> stack = new Stack<>();\n        Stack<TreeNode> output = new Stack<>();\n        stack.push(root);\n\n        while (!stack.isEmpty()) {\n            TreeNode node = stack.pop();\n            output.push(node);\n\n            // Push the left child first, so it's processed after the right child\n            if (node.left != null) {\n                stack.push(node.left);\n            }\n            if (node.right != null) {\n                stack.push(node.right);\n            }\n        }\n\n        while (!output.isEmpty()) {\n            System.out.print(output.pop().val + \" \");\n        }\n    }\n\n\n    static void main(String[] args) {\n        /*\n                 5\n               /   \\\n              3     7\n             / \\   / \\\n            2   4 6   8\n\n       */\n        // Create root node\n        TreeNode root = new TreeNode(5);\n        // Create left subtree\n        root.left = new TreeNode(3);\n        root.left.left = new TreeNode(2);\n        root.left.right = new TreeNode(4);\n        // Create right subtree\n        root.right = new TreeNode(7);\n        root.right.left = new TreeNode(6);\n        root.right.right = new TreeNode(8);\n\n        System.out.print(\"Preorder: \");\n        preorderIterative(root);\n        System.out.print(\"\\n\");\n        System.out.print(\"Inorder: \");\n        inorderIterative(root);\n        System.out.print(\"\\n\");\n        System.out.print(\"Postorder: \");\n        postorderIterative(root);\n    }\n}\n"}, {"name": "BottomView", "subcat": "views", "link": "", "code": "package leetcode.tree.views;\n\nimport leetcode.tree.TreeNode;\n\nimport java.util.ArrayList;\nimport java.util.LinkedList;\nimport java.util.Map;\nimport java.util.TreeMap;\n\n/**\n * Bottom View of Binary Tree (GeeksforGeeks)\n * https://www.geeksforgeeks.org/problems/bottom-view-of-binary-tree/1\n *\n * Given a binary tree, return the bottom view from left to right.\n * The bottom view contains the last node at each horizontal distance.\n *\n * Example:\n *   Input:\n *          20\n *        /    \\\n *      8       22\n *    /   \\       \\\n *   5     3      25\n *        / \\\n *      10   14\n *   Output: [5, 10, 3, 14, 25]\n *\n * Approach: BFS + TreeMap (horizontal distance)\n *   - Assign horizontal distance 0 to root, -1 for left, +1 for right.\n *   - BFS level by level; for each node, overwrite the map entry at its\n *     horizontal distance (last node at that position wins = bottom view).\n *   - TreeMap keeps keys sorted for left-to-right output.\n *\n * Time Complexity: O(n)\n * Space Complexity: O(n)\n */\npublic class BottomView {\n\n    public static ArrayList<Integer> bottomView(TreeNode root) {\n        // add your code\n        var map = new TreeMap<Integer, Integer>();\n        var q = new LinkedList<Pair>();\n        var list = new ArrayList<Integer>();\n        if (root == null) return list;\n        q.add(new Pair(0, root));\n        while (!q.isEmpty()) {\n            Pair pair = q.poll();\n            int pos = pair.ind;\n            TreeNode node = pair.root;\n            if (!map.containsKey(pos)) map.put(pos, node.val);\n            if (map.containsKey(pos)) map.replace(pos, node.val);\n            if (node.left != null) q.add(new Pair(pos - 1, node.left));\n            if (node.right != null) q.add(new Pair(pos + 1, node.right));\n\n        }\n\n        for (Map.Entry<Integer, Integer> entry : map.entrySet()) {\n            list.add(entry.getValue());\n        }\n\n        return list;\n    }\n\n\n    static class Pair {\n        int ind;\n        TreeNode root;\n\n        Pair(int _ind, TreeNode _root) {\n            ind = _ind;\n            root = _root;\n        }\n    }\n\n}\n"}, {"name": "LeftView", "subcat": "views", "link": "", "code": "package leetcode.tree.views;\n\nimport leetcode.tree.TreeNode;\n\nimport java.util.ArrayList;\n\n/**\n * Left View of Binary Tree (GeeksforGeeks)\n * https://www.geeksforgeeks.org/problems/left-view-of-binary-tree/1\n *\n * Given the root of a binary tree, return the left view \u2014 the set of nodes\n * visible when the tree is viewed from the left side.\n *\n * Example:\n *   Input:\n *        1\n *      /   \\\n *     2     3\n *    / \\     \\\n *   4   5     6\n *   Output: [1, 2, 4]\n *\n * Approach: DFS with depth tracking\n *   - If list.size() == depth, this is the first node at this depth (leftmost).\n *   - Visit left child before right child to see left side first.\n *\n * Time Complexity: O(n)\n * Space Complexity: O(h)\n */\npublic class LeftView {\n\n    public ArrayList<Integer> leftView(TreeNode root) {\n        var list = new ArrayList<Integer>();\n        dfs(root, list, 0);\n        return list;\n    }\n\n    public void dfs(TreeNode root, ArrayList<Integer> list, int depth) {\n        if (root == null) return;\n        if (list.size() == depth) list.add(root.val);\n        if (root.left != null) dfs(root.left, list, depth + 1);\n        if (root.right != null) dfs(root.right, list, depth + 1);\n    }\n\n}\n"}, {"name": "RightView", "subcat": "views", "link": "", "code": "package leetcode.tree.views;\n\nimport leetcode.tree.TreeNode;\n\nimport java.util.ArrayList;\nimport java.util.List;\n\n/**\n * LeetCode 199: Binary Tree Right Side View\n * https://leetcode.com/problems/binary-tree-right-side-view/\n *\n * Given the root of a binary tree, return the values of the nodes you can see\n * ordered from top to bottom when looking from the right side.\n *\n * Example 1:\n *   Input: root = [1,2,3,null,5,null,4]\n *   Output: [1,3,4]\n *\n * Example 2:\n *   Input: root = [1,null,3]\n *   Output: [1,3]\n *\n * Constraints:\n *   - The number of nodes is in [0, 100]\n *   - -100 <= Node.val <= 100\n *\n * Approach: DFS with depth tracking\n *   - Same as LeftView but visit right child before left.\n *   - If list.size() == depth, this is the first (rightmost) node at this depth.\n *\n * Time Complexity: O(n)\n * Space Complexity: O(h)\n */\npublic class RightView {\n\n    void dfs(TreeNode root, ArrayList<Integer> list, int depth) {\n        if (root == null) return;\n        if (list.size() == depth) list.add(root.val);\n        if (root.right != null) dfs(root.right, list, depth + 1);\n        if (root.left != null) dfs(root.left, list, depth + 1);\n    }\n\n\n    public List<Integer> rightSideView(TreeNode root) {\n        var list = new ArrayList<Integer>();\n        dfs(root, list, 0);\n        return list;\n    }\n\n}\n"}, {"name": "TopView", "subcat": "views", "link": "", "code": "package leetcode.tree.views;\n\nimport leetcode.tree.TreeNode;\n\nimport java.util.ArrayList;\nimport java.util.LinkedList;\nimport java.util.Map;\nimport java.util.TreeMap;\n\n/**\n * Top View of Binary Tree (GeeksforGeeks)\n * https://www.geeksforgeeks.org/problems/top-view-of-binary-tree/1\n *\n * Given a binary tree, return the top view from left to right.\n * The top view contains the first node seen at each horizontal distance.\n *\n * Example:\n *   Input:\n *        1\n *      /   \\\n *     2     3\n *    / \\   / \\\n *   4   5 6   7\n *   Output: [4, 2, 1, 3, 7]\n *\n * Approach: BFS + TreeMap (horizontal distance)\n *   - Assign horizontal distance 0 to root, -1 for left, +1 for right.\n *   - BFS level by level; only store the first node at each horizontal distance.\n *   - TreeMap keeps keys sorted for left-to-right output.\n *\n * Time Complexity: O(n)\n * Space Complexity: O(n)\n */\npublic class TopView {\n\n    public static ArrayList<Integer> topView(TreeNode root) {\n        var map = new TreeMap<Integer, Integer>();\n        var q = new LinkedList<Pair>();\n        var list = new ArrayList<Integer>();\n        if (root == null) return list;\n        q.add(new Pair(0, root));\n        while (!q.isEmpty()) {\n            Pair pair = q.poll();\n            int pos = pair.ind;\n            TreeNode node = pair.root;\n            if (!map.containsKey(pos)) map.put(pos, node.val);\n            if (node.left != null) q.add(new Pair(pos - 1, node.left));\n            if (node.right != null) q.add(new Pair(pos + 1, node.right));\n\n        }\n\n        for (Map.Entry<Integer, Integer> entry : map.entrySet()) {\n            list.add(entry.getValue());\n        }\n        \n        return list;\n    }\n\n\n    static class Pair {\n        int ind;\n        TreeNode root;\n\n        Pair(int _ind, TreeNode _root) {\n            ind = _ind;\n            root = _root;\n        }\n    }\n\n}\n"}], "Trie": [{"name": "Trie", "subcat": "", "link": "", "code": "package leetcode.trie;\n\npublic class Trie {\n\n    private final TrieNode root;\n\n    private static class TrieNode {\n        public boolean isWord;\n        public TrieNode[] children = new TrieNode[26];\n\n        public TrieNode() {\n        }\n    }\n\n    public Trie() {\n        root = new TrieNode();\n    }\n\n    public void insert(String word) {\n        TrieNode dictionary = root;\n        for (int i = 0; i < word.length(); i++) {\n            char ch = word.charAt(i);\n            if (dictionary.children[ch - 'a'] == null) {\n                dictionary.children[ch - 'a'] = new TrieNode();\n            }\n            dictionary = dictionary.children[ch - 'a'];\n        }\n        dictionary.isWord = true;\n    }\n\n    public boolean search(String word) {\n        TrieNode dictionary = root;\n        for (int i = 0; i < word.length(); i++) {\n            char ch = word.charAt(i);\n            if (dictionary.children[ch - 'a'] == null) {\n                return false;\n            }\n            dictionary = dictionary.children[ch - 'a'];\n        }\n        return dictionary.isWord;\n    }\n\n    public boolean startsWith(String prefix) {\n        TrieNode dictionary = root;\n        for (int i = 0; i < prefix.length(); i++) {\n            char ch = prefix.charAt(i);\n            if (dictionary.children[ch - 'a'] == null) {\n                return false;\n            }\n            dictionary = dictionary.children[ch - 'a'];\n        }\n        return true;\n    }\n\n    public static void main(String[] args) {\n        Trie trie = new Trie();\n        trie.insert(\"cat\");\n        System.out.println(trie.search(\"apple\"));\n        System.out.println(trie.startsWith(\"app\"));\n    }\n\n}\n"}, {"name": "TrieWithMap", "subcat": "", "link": "", "code": "package leetcode.trie;\n\nimport java.util.HashMap;\n\n\n class TrieWithMap {\n\n    private final TrieNode root;\n\n    private static class TrieNode {\n        HashMap<Character, TrieNode> children;\n        boolean isWord;\n\n        public TrieNode() {\n            children = new HashMap<>();\n            isWord = false;\n        }\n    }\n\n     public TrieWithMap() {\n         root = new TrieNode();\n     }\n\n     //-------------------------------Insertion--------------------------------//\n    // Inserts an element into the trie.\n    public void insert(String word) {\n        TrieNode current = root;\n        for (char ch : word.toCharArray()) {\n            current = current.children.computeIfAbsent(ch, c -> new TrieNode());\n        }\n        current.isWord = true;\n    }\n\n    //-------------------------------Searching--------------------------------//\n    // Search an element in the trie.\n    public boolean search(String word) {\n        TrieNode node = getNode(word);\n        return node != null && node.isWord;\n    }\n\n    //-------------------------------Starts With --------------------------------//\n    // Find starts with substring in trie\n    public boolean startsWith(String prefix) {\n        return getNode(prefix) != null;\n    }\n\n    private TrieNode getNode(String str) {\n        TrieNode current = root;\n        for (char ch : str.toCharArray()) {\n            current = current.children.get(ch);\n            if (current == null) {\n                return null;\n            }\n        }\n        return current;\n    }\n\n    public static void main(String[] args) {\n        TrieWithMap trie = new TrieWithMap();\n        trie.insert(\"cat\");\n        System.out.println(trie.search(\"apple\")); // false\n        System.out.println(trie.startsWith(\"app\")); // false\n        System.out.println(trie.search(\"cat\")); // true\n        System.out.println(trie.startsWith(\"ca\")); // true\n    }\n}\n"}]};

        function highlightJava(code) {
            // Tokenize first to avoid highlighting inside strings/comments
            const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            const tokens = [];
            let i = 0;
            while (i < code.length) {
                // Multi-line comment
                if (code[i] === '/' && code[i + 1] === '*') {
                    let end = code.indexOf('*/', i + 2);
                    if (end === -1) end = code.length; else end += 2;
                    tokens.push({ type: 'cmt', text: code.slice(i, end) }); i = end; continue;
                }
                // Single-line comment
                if (code[i] === '/' && code[i + 1] === '/') {
                    let end = code.indexOf('\n', i);
                    if (end === -1) end = code.length;
                    tokens.push({ type: 'cmt', text: code.slice(i, end) }); i = end; continue;
                }
                // String
                if (code[i] === '"') {
                    let j = i + 1;
                    while (j < code.length && code[j] !== '"') { if (code[j] === '\\') j++; j++; }
                    tokens.push({ type: 'str', text: code.slice(i, j + 1) }); i = j + 1; continue;
                }
                // Char literal
                if (code[i] === "'") {
                    let j = i + 1;
                    while (j < code.length && code[j] !== "'") { if (code[j] === '\\') j++; j++; }
                    tokens.push({ type: 'str', text: code.slice(i, j + 1) }); i = j + 1; continue;
                }
                // Annotation
                if (code[i] === '@' && /[a-zA-Z]/.test(code[i + 1] || '')) {
                    let j = i + 1;
                    while (j < code.length && /\w/.test(code[j])) j++;
                    tokens.push({ type: 'ann', text: code.slice(i, j) }); i = j; continue;
                }
                // Word (identifier or keyword)
                if (/[a-zA-Z_$]/.test(code[i])) {
                    let j = i;
                    while (j < code.length && /[\w$]/.test(code[j])) j++;
                    tokens.push({ type: 'word', text: code.slice(i, j) }); i = j; continue;
                }
                // Number
                if (/\d/.test(code[i]) || (code[i] === '.' && /\d/.test(code[i + 1] || ''))) {
                    let j = i;
                    while (j < code.length && /[\d.xXa-fA-FLlFfDd_]/.test(code[j])) j++;
                    tokens.push({ type: 'num', text: code.slice(i, j) }); i = j; continue;
                }
                // Other character
                tokens.push({ type: 'other', text: code[i] }); i++;
            }
            const KW = new Set('abstract,assert,boolean,break,byte,case,catch,char,class,const,continue,default,do,double,else,enum,extends,final,finally,float,for,goto,if,implements,import,instanceof,int,interface,long,native,new,package,private,protected,public,return,short,static,strictfp,super,switch,synchronized,this,throw,throws,transient,try,void,volatile,while,true,false,null,yield,var,record,sealed,permits'.split(','));
            return tokens.map(t => {
                const s = esc(t.text);
                if (t.type === 'cmt') return '<span class="cmt">' + s + '</span>';
                if (t.type === 'str') return '<span class="str">' + s + '</span>';
                if (t.type === 'ann') return '<span class="ann">' + s + '</span>';
                if (t.type === 'num') return '<span class="num">' + s + '</span>';
                if (t.type === 'word' && KW.has(t.text)) return '<span class="kw">' + s + '</span>';
                return s;
            }).join('');
        }

            const pct = total > 0 ? Math.round(revised / total * 100) : 0;
            document.getElementById('stats').innerHTML =
                `${total} problems &middot; ${cats} categories &middot; <span style="color:var(--green)">${revised} revised (${pct}%)</span>`;
        }

        function renderTabs() {
            const container = document.getElementById('tabsContainer');
            let html = '';
            for (const cat of Object.keys(data)) {
                const isActive = cat === activeTab ? 'active' : '';
                html += `<button class="tab-btn ${isActive}" onclick="switchTab('${esc(cat)}')">${esc(cat)} <span class="badge">${data[cat].length}</span></button>`;
            }
            html += `<button class="add-tab-btn" onclick="openCategoryModal()" title="Add Category">+</button>`;
            container.innerHTML = html;
        }

        function renderContent() {
            const container = document.getElementById('content');
            const search = document.getElementById('searchBox').value.toLowerCase().trim();
            if (!activeTab || !data[activeTab]) {
                container.innerHTML = '<div class="empty-state"><div class="icon">&#128194;</div><p>No category selected</p></div>';
                return;
            }
            let cards = data[activeTab];
            // search filter
            if (search) {
                cards = cards.filter(c =>
                    c.name.toLowerCase().includes(search) ||
                    (c.subcat || '').toLowerCase().includes(search) ||
                    (c.notes || '').toLowerCase().includes(search) ||
                    (c.pattern || '').toLowerCase().includes(search) ||
                    (c.code || '').toLowerCase().includes(search));
            }
            // toolbar filter
            const today = new Date().toISOString().slice(0, 10);
            if (activeFilter === 'needs-review') cards = cards.filter(c => !c.lastRevised || daysSince(c.lastRevised) > 7);
            else if (activeFilter === 'revised-today') cards = cards.filter(c => c.lastRevised === today);
            else if (activeFilter === 'easy') cards = cards.filter(c => c.difficulty === 'easy');
            else if (activeFilter === 'medium') cards = cards.filter(c => c.difficulty === 'medium');
            else if (activeFilter === 'hard') cards = cards.filter(c => c.difficulty === 'hard');
            else if (activeFilter === 'conf-low') cards = cards.filter(c => c.confidence === 'low');
            else if (activeFilter === 'conf-medium') cards = cards.filter(c => c.confidence === 'medium');
            else if (activeFilter === 'conf-high') cards = cards.filter(c => c.confidence === 'high');
            else if (activeFilter === 'no-link') cards = cards.filter(c => !c.link);
            else if (activeFilter === 'has-notes') cards = cards.filter(c => c.notes);

            // Group by subcategory
            const groups = {};
            cards.forEach(c => {
                const g = c.subcat || '';
                if (!groups[g]) groups[g] = [];
                groups[g].push(c);
            });

            // Category-level stats
            const allCards = data[activeTab];
            const revised = allCards.filter(c => c.lastRevised).length;
            const pct = allCards.length > 0 ? Math.round(revised / allCards.length * 100) : 0;
            const pctColor = pct >= 80 ? 'var(--green)' : pct >= 40 ? 'var(--orange)' : 'var(--red)';

            let html = `<div class="category-header">
    <div>
      <span class="category-title">${esc(activeTab)}</span>
      <span class="subcategory-tag">${cards.length} shown / ${allCards.length} total</span>
      <div class="progress-bar" style="width:160px;margin-top:6px"><div class="progress-fill" style="width:${pct}%;background:${pctColor}"></div></div>
    </div>
    <div style="display:flex;gap:8px">
      <button class="btn btn-sm btn-primary" onclick="openAddCard()">+ Add Problem</button>
      <button class="btn btn-sm btn-danger" onclick="confirmDeleteCategory('${esc(activeTab)}')">Delete Category</button>
    </div>
  </div>`;

            const sortedGroups = Object.keys(groups).sort();
            for (const grp of sortedGroups) {
                if (grp && sortedGroups.length > 1) {
                    html += `<div style="margin:18px 0 10px;font-size:13px;font-weight:600;color:var(--purple)">&#x25B8; ${esc(grp)}</div>`;
                }
                html += '<div class="cards-grid">';
                for (const c of groups[grp]) {
                    const realIdx = data[activeTab].indexOf(c);
                    html += renderCard(c, realIdx);
                }
                html += '</div>';
            }
            html += '<div class="cards-grid" style="margin-top:14px"><div class="add-card" onclick="openAddCard()"><span style="font-size:22px">+</span> Add Problem</div></div>';
            container.innerHTML = html;
        }

        function renderCard(card, index) {
            const sub = card.subcat ? `<span class="card-subcat">${esc(card.subcat)}</span>` : '';

            // Difficulty
            let diffHtml = '';
            if (card.difficulty) {
                diffHtml = `<span class="difficulty-badge difficulty-${card.difficulty}">${card.difficulty}</span>`;
            }

            // Confidence
            let confClass = '';
            let confHtml = '';
            if (card.confidence) {
                const colors = { low: 'var(--red)', medium: 'var(--orange)', high: 'var(--green)' };
                confClass = ' confidence-' + card.confidence;
                confHtml = `<span class="confidence-dot" style="background:${colors[card.confidence]}"></span><span class="confidence-label">${card.confidence}</span>`;
            }

            // Pattern
            let patternHtml = '';
            if (card.pattern) {
                patternHtml = `<span style="font-size:10px;background:rgba(57,210,192,.1);color:var(--cyan);padding:2px 8px;border-radius:10px">${esc(card.pattern)}</span>`;
            }

            // Link
            let linkHtml = card.link
                ? `<div class="card-link"><span style="font-size:11px">&#x1F517;</span><a href="${escA(card.link)}" target="_blank" rel="noopener noreferrer">${esc(card.link.replace('https://leetcode.com/problems/', '').replace(/\/$/, ''))}</a></div>`
                : '';

            // Complexity
            let cxHtml = '';
            if (card.timeC || card.spaceC) {
                cxHtml = '<div class="complexity-row">';
                if (card.timeC) cxHtml += `<span><span class="label">T:</span> ${esc(card.timeC)}</span>`;
                if (card.spaceC) cxHtml += `<span><span class="label">S:</span> ${esc(card.spaceC)}</span>`;
                cxHtml += '</div>';
            }

            // Notes
            let notesHtml = card.notes ? `<div class="card-notes">${esc(card.notes)}</div>` : '';

            // Code
            let codeHtml = '';
            if (card.code) {
                const lines = card.code.split('\n').length;
                codeHtml = `<button class="code-toggle" onclick="openDrawer(${index})"><span>&#x1F4C4; View Code (${lines} lines)</span><span style="font-size:10px;color:var(--text-muted)">opens panel &#x2192;</span></button>`;
            } else {
                codeHtml = '<div style="color:var(--text-muted);font-size:11px;font-style:italic">No code yet</div>';
            }

            // Revision
            let revHtml = '<div class="revision-row">';
            if (card.lastRevised) {
                const d = daysSince(card.lastRevised);
                const col = d <= 1 ? 'var(--green)' : d <= 7 ? 'var(--orange)' : 'var(--red)';
                revHtml += `<span class="revision-date" style="color:${col}">Revised: ${card.lastRevised} (${d === 0 ? 'today' : d + 'd ago'})</span>`;
            } else {
                revHtml += '<span class="revision-date">Not yet revised</span>';
            }
            revHtml += `<button class="mark-revised-btn" onclick="markRevised(${index})">&#x2705; Mark Revised</button></div>`;

            return `<div class="card${confClass}">
    <div class="card-header">
      <div style="display:flex;align-items:center;gap:6px;min-width:0;flex-wrap:wrap">${diffHtml}<span class="card-title">${esc(card.name)}</span>${sub}${patternHtml}${confHtml}</div>
      <div class="card-actions">
        <button onclick="openEditCard(${index})" title="Edit">&#x270F;&#xFE0F;</button>
        <button class="delete-btn" onclick="confirmDeleteCard(${index})" title="Delete">&#x1F5D1;&#xFE0F;</button>
      </div>
    </div>
    <div class="card-body">${linkHtml}${cxHtml}${notesHtml}${codeHtml}${revHtml}</div>
  </div>`;
        }

        // ━━━ CODE DRAWER ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        let drawerCardIdx = null;
        function openDrawer(index) {
            const card = data[activeTab][index];
            if (!card || !card.code) return;
            drawerCardIdx = index;
            document.getElementById('drawerTitle').textContent = card.name;
            // Meta info
            let meta = '';
            if (card.subcat) meta += `<span class="tag">${esc(card.subcat)}</span>`;
            if (card.difficulty) meta += `<span class="tag">${esc(card.difficulty)}</span>`;
            if (card.pattern) meta += `<span class="tag" style="color:var(--cyan)">${esc(card.pattern)}</span>`;
            const lines = card.code.split('\n').length;
            meta += `<span>${lines} lines</span>`;
            if (card.timeC) meta += `<span>T: ${esc(card.timeC)}</span>`;
            if (card.spaceC) meta += `<span>S: ${esc(card.spaceC)}</span>`;
            if (card.link) meta += `<a href="${escA(card.link)}" target="_blank" rel="noopener noreferrer" style="color:var(--accent);text-decoration:none">&#x1F517; LeetCode</a>`;
            document.getElementById('drawerMeta').innerHTML = meta;
            document.getElementById('drawerBody').innerHTML = `<pre class="code-block">${highlightJava(card.code)}</pre>`;
            document.getElementById('codeDrawer').classList.add('open');
            document.getElementById('drawerOverlay').classList.add('open');
            document.body.style.overflow = 'hidden';
        }
        function closeDrawer() {
            document.getElementById('codeDrawer').classList.remove('open');
            document.getElementById('drawerOverlay').classList.remove('open');
            document.body.style.overflow = '';
            drawerCardIdx = null;
        }
        function drawerCopy() {
            if (drawerCardIdx !== null) {
                const code = data[activeTab][drawerCardIdx]?.code;
                if (code) navigator.clipboard.writeText(code).then(() => showToast('Copied!'));
            }
        }

        // ━━━ TABS ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function switchTab(cat) { activeTab = cat; render(); }

        // ━━━ FILTER ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function setFilter(f) {
            activeFilter = activeFilter === f ? 'all' : f;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active', 'active-green', 'active-orange', 'active-red'));
            const btn = document.querySelector(`.filter-btn[data-filter="${activeFilter}"]`);
            if (btn) btn.classList.add('active');
            renderContent();
        }

        // ━━━ CARD CRUD ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function openAddCard() {
            editingCardId = null;
            document.getElementById('cardModalTitle').textContent = 'Add Problem';
            document.getElementById('cardName').value = '';
            document.getElementById('cardSubcat').value = '';
            document.getElementById('cardLink').value = '';
            document.getElementById('cardDifficulty').value = '';
            document.getElementById('cardTimeC').value = '';
            document.getElementById('cardSpaceC').value = '';
            document.getElementById('cardConfidence').value = '';
            document.getElementById('cardPattern').value = '';
            document.getElementById('cardNotes').value = '';
            document.getElementById('cardCode').value = '';
            document.getElementById('cardSaveBtn').textContent = 'Add';
            document.getElementById('cardModal').classList.add('open');
            document.getElementById('cardName').focus();
        }
        function openEditCard(index) {
            const c = data[activeTab][index];
            if (!c) return;
            editingCardId = { cat: activeTab, index };
            document.getElementById('cardModalTitle').textContent = 'Edit Problem';
            document.getElementById('cardName').value = c.name;
            document.getElementById('cardSubcat').value = c.subcat || '';
            document.getElementById('cardLink').value = c.link || '';
            document.getElementById('cardDifficulty').value = c.difficulty || '';
            document.getElementById('cardTimeC').value = c.timeC || '';
            document.getElementById('cardSpaceC').value = c.spaceC || '';
            document.getElementById('cardConfidence').value = c.confidence || '';
            document.getElementById('cardPattern').value = c.pattern || '';
            document.getElementById('cardNotes').value = c.notes || '';
            document.getElementById('cardCode').value = c.code || '';
            document.getElementById('cardSaveBtn').textContent = 'Update';
            document.getElementById('cardModal').classList.add('open');
            document.getElementById('cardName').focus();
        }
        function saveCard() {
            const name = document.getElementById('cardName').value.trim();
            if (!name) { showToast('Name required', true); return; }
            const obj = {
                name,
                subcat: document.getElementById('cardSubcat').value.trim(),
                link: document.getElementById('cardLink').value.trim(),
                difficulty: document.getElementById('cardDifficulty').value,
                timeC: document.getElementById('cardTimeC').value.trim(),
                spaceC: document.getElementById('cardSpaceC').value.trim(),
                confidence: document.getElementById('cardConfidence').value,
                pattern: document.getElementById('cardPattern').value.trim(),
                notes: document.getElementById('cardNotes').value.trim(),
                code: document.getElementById('cardCode').value,
                lastRevised: editingCardId ? data[editingCardId.cat][editingCardId.index].lastRevised : null
            };
            if (editingCardId) {
                data[editingCardId.cat][editingCardId.index] = obj;
                showToast('Updated!');
            } else {
                data[activeTab].push(obj);
                showToast('Added!');
            }
            saveData(); closeCardModal(); render();
        }
        function deleteCard(idx) { data[activeTab].splice(idx, 1); saveData(); render(); showToast('Deleted'); }
        function closeCardModal() { document.getElementById('cardModal').classList.remove('open'); editingCardId = null; }

        // ━━━ REVISION ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function markRevised(idx) {
            data[activeTab][idx].lastRevised = new Date().toISOString().slice(0, 10);
            saveData(); render(); showToast('Marked as revised!');
        }
        function daysSince(dateStr) {
            return Math.floor((Date.now() - new Date(dateStr).getTime()) / 86400000);
        }

        // ━━━ CATEGORY CRUD ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function openCategoryModal() { document.getElementById('categoryName').value = ''; document.getElementById('categoryModal').classList.add('open'); document.getElementById('categoryName').focus(); }
        function closeCategoryModal() { document.getElementById('categoryModal').classList.remove('open'); }
        function saveCategory() {
            const name = document.getElementById('categoryName').value.trim();
            if (!name) { showToast('Name required', true); return; }
            if (data[name]) { showToast('Already exists', true); return; }
            data[name] = []; activeTab = name; saveData(); closeCategoryModal(); render(); showToast('Created!');
        }
        function deleteCategory(cat) { delete data[cat]; activeTab = Object.keys(data)[0] || ''; saveData(); render(); showToast('Deleted'); }

        // ━━━ CONFIRM ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function confirmDeleteCard(idx) {
            document.getElementById('confirmTitle').textContent = 'Delete Problem';
            document.getElementById('confirmMsg').textContent = `Delete "${data[activeTab][idx].name}"?`;
            pendingConfirm = () => deleteCard(idx);
            document.getElementById('confirmModal').classList.add('open');
        }
        function confirmDeleteCategory(cat) {
            document.getElementById('confirmTitle').textContent = 'Delete Category';
            document.getElementById('confirmMsg').textContent = `Delete "${cat}" with ${data[cat].length} problems?`;
            pendingConfirm = () => deleteCategory(cat);
            document.getElementById('confirmModal').classList.add('open');
        }
        function confirmAction() { if (pendingConfirm) pendingConfirm(); closeConfirm(); }
        function closeConfirm() { document.getElementById('confirmModal').classList.remove('open'); pendingConfirm = null; }

        // ━━━ EXPORT / IMPORT / RESET ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function exportData() {
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'leetcode-dashboard-' + new Date().toISOString().slice(0, 10) + '.json';
            a.click();
            showToast('Exported!');
        }
        function importData(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function (ev) {
                try {
                    data = JSON.parse(ev.target.result);
                    activeTab = Object.keys(data)[0] || '';
                    saveData(); render();
                    showToast('Imported!');
                } catch (err) { showToast('Invalid file', true); }
            };
            reader.readAsText(file);
            e.target.value = '';
        }
        function resetData() {
            if (!confirm('Reset all data to original? This will lose all edits.')) return;
            data = JSON.parse(JSON.stringify(INITIAL_DATA));
            activeTab = Object.keys(data)[0] || '';
            saveData(); render();
            showToast('Reset complete!');
        }

        // ━━━ UTILS ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function copyCode(idx) {
            const code = data[activeTab][idx]?.code;
            if (code) navigator.clipboard.writeText(code).then(() => showToast('Copied!'));
        }
        function esc(s) { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }
        function escA(s) { return (s || '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/'/g, '&#39;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
        let toastT;
        function showToast(m, err) { const t = document.getElementById('toast'); t.textContent = m; t.style.background = err ? 'var(--red)' : 'var(--green)'; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2000); }

        // ━━━ KEYBOARD ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') { closeDrawer(); closeCardModal(); closeCategoryModal(); closeConfirm(); }
            if ((e.ctrlKey || e.metaKey) && e.key === 'k') { e.preventDefault(); document.getElementById('searchBox').focus(); }
            if (!e.target.matches('input,textarea,select')) {
                const tabs = Object.keys(data);
                const idx = tabs.indexOf(activeTab);
                if (e.key === 'ArrowRight' && idx < tabs.length - 1) { switchTab(tabs[idx + 1]); }
                if (e.key === 'ArrowLeft' && idx > 0) { switchTab(tabs[idx - 1]); }
            }
        });
        document.getElementById('searchBox').addEventListener('input', () => renderContent());
        for (const id of ['cardModal', 'categoryModal', 'confirmModal']) {
            document.getElementById(id).addEventListener('click', e => { if (e.target === e.currentTarget) { closeCardModal(); closeCategoryModal(); closeConfirm(); } });
        }

        // ━━━ THEME ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function setTheme(name) {
            document.documentElement.setAttribute('data-theme', name);
            localStorage.setItem('leetcode-theme', name);
            updateThemeUI(name);
            closeThemeDropdown();
        }
        function toggleThemeDropdown() {
            document.getElementById('themeDropdown').classList.toggle('open');
        }
        function closeThemeDropdown() {
            document.getElementById('themeDropdown').classList.remove('open');
        }
        function updateThemeUI(name) {
            document.querySelectorAll('.theme-option').forEach(b => {
                b.classList.toggle('active', b.textContent.trim().toLowerCase().startsWith(name));
            });
        }
        // Close dropdown when clicking outside
        document.addEventListener('click', e => {
            if (!e.target.closest('#themePicker')) closeThemeDropdown();
        });

        // ━━━ INIT ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        const savedTheme = localStorage.getItem('leetcode-theme') || 'dark';
        setTheme(savedTheme);
        document.querySelector('.filter-btn[data-filter="all"]').classList.add('active');
        render();
    </script>
</body>

</html>
