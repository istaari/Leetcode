<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeetCode Problem Dashboard</title>
    <style>
        /* ── Theme: Dark (GitHub Dark) ── */
        :root,
        [data-theme="dark"] {
            --bg: #0d1117;
            --surface: #161b22;
            --surface2: #21262d;
            --border: #30363d;
            --text: #e6edf3;
            --text-muted: #8b949e;
            --accent: #58a6ff;
            --accent-hover: #79c0ff;
            --green: #3fb950;
            --red: #f85149;
            --orange: #d29922;
            --purple: #bc8cff;
            --yellow: #e3b341;
            --cyan: #39d2c0;
            --code-bg: #0d1117;
            --code-text: #e6edf3;
            --code-border: #30363d;
            --kw: #ff7b72;
            --str: #a5d6ff;
            --num: #79c0ff;
            --cmt: #8b949e;
            --ann: #d2a8ff;
        }

        /* ── Theme: Light ── */
        [data-theme="light"] {
            --bg: #ffffff;
            --surface: #f6f8fa;
            --surface2: #eaeef2;
            --border: #d1d9e0;
            --text: #1f2328;
            --text-muted: #59636e;
            --accent: #0969da;
            --accent-hover: #0550ae;
            --green: #1a7f37;
            --red: #cf222e;
            --orange: #9a6700;
            --purple: #8250df;
            --yellow: #7d6608;
            --cyan: #0e7c6b;
            --code-bg: #24292e;
            --code-text: #e1e4e8;
            --code-border: #444d56;
            --kw: #f97583;
            --str: #9ecbff;
            --num: #79b8ff;
            --cmt: #6a737d;
            --ann: #b392f0;
        }

        /* ── Theme: Sepia (Warm, easy on eyes) ── */
        [data-theme="sepia"] {
            --bg: #f4ecd8;
            --surface: #ede4ce;
            --surface2: #e3d9bf;
            --border: #c9bc9f;
            --text: #433422;
            --text-muted: #78664a;
            --accent: #8b5e34;
            --accent-hover: #6d4525;
            --green: #4a7c3f;
            --red: #b5403a;
            --orange: #96692a;
            --purple: #7b5ea7;
            --yellow: #7d6608;
            --cyan: #3a7d6e;
            --code-bg: #2b2118;
            --code-text: #e6dcc8;
            --code-border: #5a4a36;
            --kw: #ff8c7c;
            --str: #e6c38e;
            --num: #d2a57e;
            --cmt: #9c8b6e;
            --ann: #c5a0e0;
        }

        /* ── Theme: Solarized Dark ── */
        [data-theme="solarized"] {
            --bg: #002b36;
            --surface: #073642;
            --surface2: #0a4050;
            --border: #2a5c66;
            --text: #93a1a1;
            --text-muted: #657b83;
            --accent: #268bd2;
            --accent-hover: #2aa198;
            --green: #859900;
            --red: #dc322f;
            --orange: #cb4b16;
            --purple: #6c71c4;
            --yellow: #b58900;
            --cyan: #2aa198;
            --code-bg: #002b36;
            --code-text: #93a1a1;
            --code-border: #2a5c66;
            --kw: #859900;
            --str: #2aa198;
            --num: #d33682;
            --cmt: #586e75;
            --ann: #6c71c4;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh
        }

        /* Header */
        .header {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 14px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100
        }

        .header h1 {
            font-size: 20px;
            font-weight: 600
        }

        .header h1 span {
            color: var(--accent)
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 12px
        }

        .search-box {
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 6px 12px;
            color: var(--text);
            font-size: 14px;
            width: 240px;
            outline: none
        }

        .search-box:focus {
            border-color: var(--accent)
        }

        .stats {
            font-size: 12px;
            color: var(--text-muted)
        }

        /* Toolbar */
        .toolbar {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 8px 24px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap
        }

        .filter-btn {
            background: var(--surface2);
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 4px 12px;
            border-radius: 14px;
            font-size: 12px;
            cursor: pointer;
            transition: all .15s
        }

        .filter-btn:hover,
        .filter-btn.active {
            border-color: var(--accent);
            color: var(--accent);
            background: rgba(88, 166, 255, .1)
        }

        .filter-btn.active-green {
            border-color: var(--green);
            color: var(--green);
            background: rgba(63, 185, 80, .1)
        }

        .filter-btn.active-orange {
            border-color: var(--orange);
            color: var(--orange);
            background: rgba(210, 153, 34, .1)
        }

        .filter-btn.active-red {
            border-color: var(--red);
            color: var(--red);
            background: rgba(248, 81, 73, .1)
        }

        .toolbar-sep {
            width: 1px;
            height: 20px;
            background: var(--border)
        }

        /* Tabs */
        .tabs-container {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 16px;
            overflow-x: auto;
            scrollbar-width: thin;
            scrollbar-color: var(--border) transparent
        }

        .tabs-container::-webkit-scrollbar {
            height: 4px
        }

        .tabs-container::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 2px
        }

        .tab-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            padding: 10px 14px;
            font-size: 13px;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            white-space: nowrap;
            transition: all .15s;
            display: flex;
            align-items: center;
            gap: 6px
        }

        .tab-btn:hover {
            color: var(--text)
        }

        .tab-btn.active {
            color: var(--accent);
            border-bottom-color: var(--accent)
        }

        .tab-btn .badge {
            background: var(--surface2);
            color: var(--text-muted);
            font-size: 11px;
            padding: 1px 7px;
            border-radius: 10px
        }

        .tab-btn.active .badge {
            background: rgba(88, 166, 255, .15);
            color: var(--accent)
        }

        .add-tab-btn {
            background: none;
            border: 1px dashed var(--border);
            color: var(--text-muted);
            padding: 4px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 18px;
            margin-left: 8px;
            flex-shrink: 0;
            transition: all .15s
        }

        .add-tab-btn:hover {
            border-color: var(--accent);
            color: var(--accent)
        }

        /* Content */
        .content {
            padding: 20px 24px
        }

        .category-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 10px
        }

        .category-title {
            font-size: 18px;
            font-weight: 600
        }

        .subcategory-tag {
            display: inline-block;
            background: rgba(88, 166, 255, .12);
            color: var(--accent);
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 12px;
            margin-left: 8px
        }

        /* Cards Grid */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: 14px
        }

        /* Card */
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
            transition: border-color .15s, box-shadow .15s
        }

        .card:hover {
            border-color: var(--accent);
            box-shadow: 0 0 0 1px rgba(88, 166, 255, .15)
        }

        .card.confidence-high {
            border-left: 3px solid var(--green)
        }

        .card.confidence-medium {
            border-left: 3px solid var(--orange)
        }

        .card.confidence-low {
            border-left: 3px solid var(--red)
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px;
            border-bottom: 1px solid var(--border);
            gap: 6px
        }

        .card-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text);
            word-break: break-word
        }

        .card-subcat {
            font-size: 10px;
            color: var(--purple);
            background: rgba(188, 140, 255, .1);
            padding: 2px 8px;
            border-radius: 10px;
            flex-shrink: 0
        }

        .card-actions {
            display: flex;
            gap: 2px;
            flex-shrink: 0
        }

        .card-actions button {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 3px 5px;
            border-radius: 4px;
            font-size: 13px;
            transition: all .15s
        }

        .card-actions button:hover {
            background: var(--surface2);
            color: var(--text)
        }

        .card-actions .delete-btn:hover {
            color: var(--red)
        }

        .card-body {
            padding: 10px 14px
        }

        /* Card Meta Row */
        .card-meta {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
            flex-wrap: wrap
        }

        .difficulty-badge {
            font-size: 10px;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 10px;
            text-transform: uppercase;
            letter-spacing: .5px
        }

        .difficulty-easy {
            background: rgba(63, 185, 80, .15);
            color: var(--green)
        }

        .difficulty-medium {
            background: rgba(210, 153, 34, .15);
            color: var(--orange)
        }

        .difficulty-hard {
            background: rgba(248, 81, 73, .15);
            color: var(--red)
        }

        .confidence-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0
        }

        .confidence-label {
            font-size: 11px;
            color: var(--text-muted)
        }

        .card-link {
            display: flex;
            align-items: center;
            gap: 5px;
            margin-bottom: 6px
        }

        .card-link a {
            color: var(--accent);
            text-decoration: none;
            font-size: 12px;
            word-break: break-all
        }

        .card-link a:hover {
            text-decoration: underline;
            color: var(--accent-hover)
        }

        /* Complexity */
        .complexity-row {
            display: flex;
            gap: 12px;
            margin-bottom: 8px;
            font-size: 11px;
            color: var(--text-muted)
        }

        .complexity-row span {
            display: flex;
            align-items: center;
            gap: 4px
        }

        .complexity-row .label {
            color: var(--cyan);
            font-weight: 600
        }

        /* Notes */
        .card-notes {
            background: rgba(227, 179, 65, .06);
            border: 1px solid rgba(227, 179, 65, .15);
            border-radius: 4px;
            padding: 6px 10px;
            font-size: 12px;
            color: var(--yellow);
            margin-bottom: 8px;
            line-height: 1.5;
            white-space: pre-wrap
        }

        /* Code */
        .code-toggle {
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 6px 12px;
            font-size: 11px;
            color: var(--text-muted);
            cursor: pointer;
            width: 100%;
            text-align: left;
            transition: all .15s;
            display: flex;
            align-items: center;
            justify-content: space-between
        }

        .code-toggle:hover {
            border-color: var(--accent);
            color: var(--accent)
        }

        .code-block {
            background: var(--code-bg, var(--bg));
            border: 1px solid var(--code-border, var(--border));
            border-radius: 6px;
            padding: 12px 14px;
            font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
            font-size: 12px;
            line-height: 1.6;
            overflow: auto;
            white-space: pre;
            color: var(--code-text, var(--text));
            scrollbar-width: thin;
            scrollbar-color: var(--code-border, var(--border)) transparent;
            tab-size: 4
        }

        .code-block::-webkit-scrollbar {
            width: 6px;
            height: 6px
        }

        .code-block::-webkit-scrollbar-thumb {
            background: var(--code-border, var(--border));
            border-radius: 3px
        }

        /* Code Drawer Panel */
        .code-drawer-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .4);
            z-index: 150
        }

        .code-drawer-overlay.open {
            display: block
        }

        .code-drawer {
            position: fixed;
            top: 0;
            right: 0;
            bottom: 0;
            width: 55vw;
            max-width: 900px;
            min-width: 380px;
            background: var(--surface);
            border-left: 1px solid var(--border);
            z-index: 160;
            transform: translateX(100%);
            transition: transform .25s ease;
            display: flex;
            flex-direction: column;
            box-shadow: -8px 0 30px rgba(0, 0, 0, .3)
        }

        .code-drawer.open {
            transform: translateX(0)
        }

        .drawer-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 20px;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
            gap: 12px
        }

        .drawer-header h3 {
            font-size: 15px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis
        }

        .drawer-header-actions {
            display: flex;
            gap: 8px;
            flex-shrink: 0
        }

        .drawer-close {
            background: none;
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 4px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px
        }

        .drawer-close:hover {
            color: var(--text);
            border-color: var(--text-muted)
        }

        .drawer-copy {
            background: var(--accent);
            border: none;
            color: #fff;
            padding: 4px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px
        }

        .drawer-copy:hover {
            background: var(--accent-hover)
        }

        .drawer-meta {
            display: flex;
            gap: 12px;
            padding: 10px 20px;
            border-bottom: 1px solid var(--border);
            font-size: 12px;
            color: var(--text-muted);
            flex-shrink: 0;
            flex-wrap: wrap;
            align-items: center
        }

        .drawer-meta .tag {
            background: var(--surface2);
            padding: 2px 10px;
            border-radius: 10px
        }

        .drawer-body {
            flex: 1;
            overflow: auto;
            padding: 0
        }

        .drawer-body .code-block {
            border: none;
            border-radius: 0;
            height: 100%;
            max-height: none
        }

        @media(max-width:900px) {
            .code-drawer {
                width: 85vw
            }
        }

        /* Revision date */
        .revision-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 8px;
            padding-top: 6px;
            border-top: 1px solid var(--border)
        }

        .revision-date {
            font-size: 11px;
            color: var(--text-muted)
        }

        .mark-revised-btn {
            background: none;
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 2px 10px;
            border-radius: 4px;
            font-size: 11px;
            cursor: pointer;
            transition: all .15s
        }

        .mark-revised-btn:hover {
            border-color: var(--green);
            color: var(--green)
        }

        /* Add card */
        .add-card {
            border: 2px dashed var(--border);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100px;
            cursor: pointer;
            color: var(--text-muted);
            font-size: 14px;
            transition: all .15s;
            gap: 8px
        }

        .add-card:hover {
            border-color: var(--accent);
            color: var(--accent)
        }

        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .6);
            backdrop-filter: blur(4px);
            z-index: 200;
            align-items: center;
            justify-content: center
        }

        .modal-overlay.open {
            display: flex
        }

        .modal {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            width: 620px;
            max-width: 95vw;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 16px 48px rgba(0, 0, 0, .4)
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 20px;
            border-bottom: 1px solid var(--border)
        }

        .modal-header h2 {
            font-size: 16px;
            font-weight: 600
        }

        .modal-close {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 20px;
            cursor: pointer;
            padding: 4px
        }

        .modal-close:hover {
            color: var(--text)
        }

        .modal-body {
            padding: 16px 20px
        }

        .form-group {
            margin-bottom: 14px
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 500;
            margin-bottom: 4px;
            color: var(--text-muted)
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 7px 10px;
            color: var(--text);
            font-size: 13px;
            outline: none;
            font-family: inherit
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            border-color: var(--accent)
        }

        .form-group textarea {
            font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
            font-size: 12px;
            line-height: 1.5;
            min-height: 180px;
            resize: vertical
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px
        }

        .form-row-3 {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 12px
        }

        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            padding: 14px 20px;
            border-top: 1px solid var(--border)
        }

        .btn {
            padding: 7px 16px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            border: 1px solid var(--border);
            transition: all .15s
        }

        .btn-secondary {
            background: var(--surface2);
            color: var(--text)
        }

        .btn-secondary:hover {
            background: var(--border)
        }

        .btn-primary {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent)
        }

        .btn-primary:hover {
            background: var(--accent-hover)
        }

        .btn-danger {
            background: var(--red);
            color: #fff;
            border-color: var(--red)
        }

        .btn-danger:hover {
            opacity: .9
        }

        .btn-sm {
            padding: 4px 10px;
            font-size: 11px
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: var(--green);
            color: #fff;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            transform: translateY(80px);
            opacity: 0;
            transition: all .3s;
            z-index: 300
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1
        }

        .empty-state {
            text-align: center;
            padding: 48px;
            color: var(--text-muted)
        }

        .empty-state .icon {
            font-size: 40px;
            margin-bottom: 12px
        }

        .confirm-msg {
            font-size: 14px;
            line-height: 1.6;
            color: var(--text-muted)
        }

        /* Syntax highlighting — uses theme vars */
        .kw {
            color: var(--kw)
        }

        .str {
            color: var(--str)
        }

        .num {
            color: var(--num)
        }

        .cmt {
            color: var(--cmt);
            font-style: italic
        }

        .ann {
            color: var(--ann)
        }

        .typ {
            color: var(--orange)
        }

        .fn {
            color: var(--ann)
        }

        /* Theme picker */
        .theme-picker {
            position: relative;
            display: inline-block
        }

        .theme-btn {
            background: var(--surface2);
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 4px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: all .15s
        }

        .theme-btn:hover {
            border-color: var(--accent);
            color: var(--text)
        }

        .theme-dropdown {
            display: none;
            position: absolute;
            right: 0;
            top: calc(100% + 6px);
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            min-width: 170px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, .25);
            z-index: 110;
            overflow: hidden
        }

        .theme-dropdown.open {
            display: block
        }

        .theme-option {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 9px 14px;
            font-size: 13px;
            color: var(--text);
            cursor: pointer;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
            transition: background .1s
        }

        .theme-option:hover {
            background: var(--surface2)
        }

        .theme-option.active {
            color: var(--accent)
        }

        .theme-swatch {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            border: 2px solid var(--border);
            flex-shrink: 0
        }

        /* Progress bar */
        .progress-bar {
            height: 3px;
            background: var(--surface2);
            border-radius: 2px;
            overflow: hidden;
            margin-top: 4px
        }

        .progress-fill {
            height: 100%;
            border-radius: 2px;
            transition: width .3s
        }

        /* Keyboard shortcuts hint */
        .shortcuts-hint {
            position: fixed;
            bottom: 24px;
            left: 24px;
            font-size: 11px;
            color: var(--text-muted);
            opacity: .6
        }

        .shortcuts-hint kbd {
            background: var(--surface2);
            border: 1px solid var(--border);
            padding: 1px 5px;
            border-radius: 3px;
            font-size: 10px
        }

        @media(max-width:600px) {
            .cards-grid {
                grid-template-columns: 1fr
            }

            .form-row,
            .form-row-3 {
                grid-template-columns: 1fr
            }
        }
    </style>
</head>

<body>

    <div class="header">

                    </button>
                    <button class="theme-option" onclick="setTheme('sepia')">
                        <span class="theme-swatch" style="background:#f4ecd8;border-color:#c9bc9f"></span> Sepia (Warm)
                    </button>
                    <button class="theme-option" onclick="setTheme('solarized')">
                        <span class="theme-swatch" style="background:#002b36;border-color:#2a5c66"></span> Solarized
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="toolbar" id="toolbar">
        <span style="font-size:12px;color:var(--text-muted);font-weight:500">Filter:</span>
        <button class="filter-btn" data-filter="all" onclick="setFilter('all')">All</button>
        <button class="filter-btn" data-filter="needs-review" onclick="setFilter('needs-review')">&#x1F534; Needs
            Review</button>
        <button class="filter-btn" data-filter="revised-today" onclick="setFilter('revised-today')">&#x2705; Revised
            Today</button>

    <div class="tabs-container" id="tabsContainer"></div>
    <div class="content" id="content"></div>

    <!-- Card Modal -->

                    <div class="form-group"><label>Subcategory</label><input type="text" id="cardSubcat"
                            placeholder="e.g. bitmask, grid"></div>
                </div>
                <div class="form-group"><label>LeetCode Link</label><input type="url" id="cardLink"

    <script>
        // ━━━ INITIAL DATA ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        const INITIAL_DATA = { "Tree": [{ "name": "Node", "subcat": "", "link": "", "code": "package leetcode.tree;\n\nimport java.util.ArrayList;\nimport java.util.List;\n\npublic class Node {\n    public int val;\n    public List<Node> children;\n\n    public Node() {\n    }\n\n    public Node(int _val) {\n        val = _val;\n        children = new ArrayList<>();\n    }\n\n    public Node(int _val, List<Node> _children) {\n        val = _val;\n        children = _children;\n    }\n}\n" }, { "name": "TreeNode", "subcat": "", "link": "", "code": "package leetcode.tree;\n\npublic class TreeNode {\n    public int val;\n    public TreeNode left;\n    public TreeNode right;\n\n    public TreeNode() {\n    }\n\n    public TreeNode(int val) {\n        this.val = val;\n    }\n\n    public TreeNode(int val, TreeNode left, TreeNode right) {\n        this.val = val;\n        this.left = left;\n        this.right = right;\n    }\n}\n" }, { "name": "BottomLeftTreeValue", "subcat": "BFS", "link": "", "code": "package leetcode.tree.BFS;\n\nimport leetcode.tree.TreeNode;\n\nimport java.util.*;\n\npublic class BottomLeftTreeValue {\n\n    public int findBottomLeftValue(TreeNode root) {\n\n        Queue<TreeNode> queue = new LinkedList<>();\n        queue.add(root);\n\n        int result = 0;\n        while (!queue.isEmpty()) {\n            int size = queue.size();\n\n            for (int i = 0; i < size; i++) {\n                TreeNode current = queue.poll();\n                assert current != null;\n                result = current.val;\n\n                if (current.right != null) queue.add(current.right);\n                if (current.left != null) queue.add(current.left);\n            }\n        }\n\n        return result;\n    }\n\n}\n" }, { "name": "LargestValueInTreeRow", "subcat": "BFS", "link": "", "code": "package leetcode.tree.BFS;\n\nimport leetcode.tree.TreeNode;\n\nimport java.util.ArrayList;\nimport java.util.LinkedList;\nimport java.util.List;\nimport java.util.Queue;\n\npublic class LargestValueInTreeRow {\n\n    @SuppressWarnings(\"all\")\n    public List<Integer> largestValues(TreeNode root) {\n        List<Integer> result = new ArrayList<>();\n\n        if (root == null) return result;\n\n        Queue<TreeNode> queue = new LinkedList<>();\n        queue.add(root);\n\n        while (!queue.isEmpty()) {\n            int size = queue.size();\n            int max = Integer.MIN_VALUE;\n\n            for (int i = 0; i < size; i++) {\n                TreeNode current = queue.poll();\n                max = Math.max(max, current.val);\n\n                if (current.left != null) queue.add(current.left);\n                if (current.right != null) queue.add(current.right);\n            }\n\n            result.add(max);\n        }\n\n        return result;\n    }\n\n\n}\n" }, { "name": "FindTarget", "subcat": "BST", "link": "", "code": "package leetcode.tree.BST;\n\nimport leetcode.tree.TreeNode;\n\nimport java.util.ArrayList;\nimport java.util.List;\n\npublic class FindTarget {\n\n    public static boolean helper(TreeNode root, int k, List<Integer> remaining) {\n        if (root == null) return false;\n\n        if(remaining.contains(root.val)) return true;\n\n        remaining.add(k - root.val);\n\n        return helper(root.left, k ,remaining) || helper(root.right, k, remaining);\n    }\n\n    public static boolean findTarget(TreeNode root, int k) {\n        return helper(root, k, new ArrayList<>());\n    }\n\n    public static void main(String[] args) {\n        int k = 9;\n        // Creating nodes manually\n        TreeNode root = new TreeNode(5);\n        root.left = new TreeNode(3);\n        root.right = new TreeNode(6);\n        root.left.left = new TreeNode(2);\n        root.left.right = new TreeNode(4);\n        root.right.right = new TreeNode(7);\n\n        System.out.println(findTarget(root, k));\n    }\n\n\n}\n" }, { "name": "MinAbsoluteInBST", "subcat": "BST", "link": "https://leetcode.com/problems/minimum-absolute-difference-in-bst", "code": "package leetcode.tree.BST;\n\nimport leetcode.tree.TreeNode;\n\npublic class MinAbsoluteInBST {\n\n    int minDiff = Integer.MAX_VALUE;\n    TreeNode prev = null;\n\n\n    // https://leetcode.com/problems/minimum-absolute-difference-in-bst/description/\n    // Keeping track of previous value in inorder traversal\n    public void helper(TreeNode root) {\n\n\n        if (root == null) {\n            return;\n        }\n\n        helper(root.left);\n\n        if (prev != null) {\n            minDiff = Math.min(minDiff, Math.abs(root.val - prev.val));\n        }\n\n        prev = root;\n\n        helper(root.right);\n    }\n\n\n    public int getMinimumDifference(TreeNode root) {\n        helper(root);\n        return minDiff;\n    }\n\n    public static void main(String[] args) {\n        // Constructing the nodes\n        TreeNode root = new TreeNode(236);\n        TreeNode node104 = new TreeNode(104);\n        TreeNode node701 = new TreeNode(701);\n        TreeNode node227 = new TreeNode(227);\n        TreeNode node911 = new TreeNode(911);\n\n        // Setting up the left and right child relationships\n        root.left = node104;\n        root.right = node701;\n        node104.right = node227;\n        node701.right = node911;\n\n        System.out.println(new MinAbsoluteInBST().getMinimumDifference(root));\n    }\n\n\n}\n" }, { "name": "ModeInBST", "subcat": "BST", "link": "https://leetcode.com/problems/find-mode-in-binary-search-tree", "code": "package leetcode.tree.BST;\n\nimport leetcode.tree.TreeNode;\n\nimport java.util.*;\n\npublic class ModeInBST {\n\n\n\n    // https://leetcode.com/problems/find-mode-in-binary-search-tree/description/\n    Map<Integer, Integer> map = new HashMap<>();\n\n    public void helper(TreeNode root) {\n        if (root == null) return;\n\n        helper(root.left);\n        map.put(root.val, map.getOrDefault(root.val, 0) + 1);\n        helper(root.right);\n    }\n\n    public int[] findMode(TreeNode root) {\n        map.clear();\n\n        helper(root);\n        int max = Integer.MIN_VALUE;\n\n        for (int value : map.values()) {\n            if (value > max) max = value;\n        }\n\n        List<Integer> result = new ArrayList<>();\n\n        for (Map.Entry<Integer, Integer> entry : map.entrySet()) {\n            if (entry.getValue() == max) {\n                result.add(entry.getKey());\n            }\n        }\n\n        return result.stream().mapToInt(Integer::intValue).toArray();\n    }\n\n\n    public static void main(String[] args) {\n\n        ModeInBST modeInBST = new ModeInBST();\n\n        TreeNode root = new TreeNode(1);\n        root.right = new TreeNode(2);\n        System.out.println(Arrays.toString(modeInBST.findMode(root)));\n\n    }\n\n}\n" }, { "name": "SearchInBST", "subcat": "BST", "link": "", "code": "package leetcode.tree.BST;\n\nimport leetcode.tree.TreeNode;\n\npublic class SearchInBST {\n\n\n    public TreeNode searchBST(TreeNode root, int val) {\n\n        if (root == null) return null;\n\n        if (val == root.val) return root;\n\n        if (val < root.val) {\n            return searchBST(root.left, val);\n        } else {\n            return searchBST(root.right, val);\n        }\n\n    }\n\n\n    public TreeNode searchBSTIterative(TreeNode root, int val) {\n        TreeNode current = root;\n\n        while (current != null) {\n\n            if (val == current.val) {\n                return current;\n            }\n\n            if (val < root.val) {\n                current = current.left;\n            } else {\n                current = current.right;\n            }\n\n        }\n\n        return null;\n    }\n\n\n}\n" }, { "name": "SortedArrayToBinarySearchTree", "subcat": "BST", "link": "https://leetcode.com/problems/convert-sorted-array-to-binary-search-tree", "code": "package leetcode.tree.BST;\n\nimport leetcode.tree.TreeNode;\n\npublic class SortedArrayToBinarySearchTree {\n\n    // https://leetcode.com/problems/convert-sorted-array-to-binary-search-tree/description/\n    // Binary Search and Divide and conquer\n    // constructing BST from a sorted array\n    public static TreeNode sortedArrayToBST(int[] nums) {\n        int left = 0;\n        int right = nums.length - 1;\n\n        TreeNode root = helper(nums, left, right);\n\n        return root;\n    }\n\n    public static TreeNode helper(int[] nums, int left, int right) {\n\n        if (left > right) return null;\n\n        int mid = left + (right - left) / 2;\n        TreeNode root = new TreeNode(mid);\n        root.left = helper(nums, left, mid - 1);\n        root.right = helper(nums, mid + 1, right);\n\n        return root;\n    }\n\n    public static void main(String[] args) {\n        int[] nums = {-10, -3, 0, 5, 9};\n    }\n}\n" }, { "name": "CousinsInBinaryTree", "subcat": "DFS", "link": "https://leetcode.com/problems/cousins-in-binary-tree/", "code": "package leetcode.tree.DFS;\n\nimport leetcode.tree.TreeNode;\n\n/**\n * LeetCode Problem 993: Cousins in Binary Tree\n * <p>\n * Given the root of a binary tree with unique values, and the values of two\n * different nodes in the tree x and y, return true if the nodes corresponding\n * to the values x and y in the tree are cousins, or false otherwise.\n * <p>\n * Two nodes of a binary tree are cousins if they have the same depth with\n * different parents.\n * <p>\n * This class uses an optimized single-pass DFS approach.\n * <p>\n * Example:\n * Input: root = [1,2,3,4], x = 4, y = 3\n * 1\n * / \\\n * 2   3\n * /\n * 4\n * Output: false (Different depths)\n */\npublic class CousinsInBinaryTree {\n\n    // Class-level variables to store the results from our single traversal.\n    private TreeNode xParent = null;\n    private TreeNode yParent = null;\n    private int xDepth = -1;\n    private int yDepth = -1;\n\n\n    /**\n     * Determines if nodes x and y are cousins.\n     *\n     * @param root The root of the binary tree.\n     * @param x    The value of the first node.\n     * @param y    The value of the second node.\n     * @return true if x and y are cousins, false otherwise.\n     */\n    public boolean isCousins(TreeNode root, int x, int y) {\n        // Start the DFS traversal to find parents and depths.\n        findDepthAndParent(root, x, y, 0, null);\n\n        // After the traversal, check the two conditions for being cousins.\n        // 1. Depths must be equal.\n        // 2. Parents must NOT be the same.\n        return xDepth == yDepth && xParent != yParent;\n    }\n\n    /**\n     * A helper function that traverses the tree to find the depth and parent\n     * of both nodes x and y in a single pass.\n     *\n     * @param node   The current node in the traversal.\n     * @param x      The value of the first target node.\n     * @param y      The value of the second target node.\n     * @param depth  The depth of the current node.\n     * @param parent The parent of the current node.\n     */\n    private void findDepthAndParent(TreeNode node, int x, int y, int depth, TreeNode parent) {\n        // Base case: If the node is null, stop this path.\n        if (node == null) {\n            return;\n        }\n\n        // If the current node's value is x, record its parent and depth.\n        if (node.val == x) {\n            xParent = parent;\n            xDepth = depth;\n        }\n        // If the current node's value is y, record its parent and depth.\n        else if (node.val == y) {\n            yParent = parent;\n            yDepth = depth;\n        }\n\n        // Optimization: If we have already found both nodes, we can stop early.\n        if (xDepth != -1 && yDepth != -1) {\n            return;\n        }\n\n        // Continue the traversal on the left and right children.\n        // The depth for the children will be `depth + 1`.\n        // The parent for the children will be the `node` itself.\n        findDepthAndParent(node.left, x, y, depth + 1, node);\n        findDepthAndParent(node.right, x, y, depth + 1, node);\n    }\n\n\n    static void main(String[] args) {\n        // Construct the tree:\n        //      1\n        //     / \\\n        //    2   3\n        //     \\   \\\n        //      4   5\n        TreeNode root = new TreeNode(1);\n        root.left = new TreeNode(2);\n        root.right = new TreeNode(3);\n        root.left.right = new TreeNode(4);\n        root.right.right = new TreeNode(5);\n\n        CousinsInBinaryTree solution = new CousinsInBinaryTree();\n        // Nodes 4 and 5 are at the same depth (2) and have different parents (2 and 3).\n        boolean result = solution.isCousins(root, 5, 4);\n\n        System.out.println(\"Are nodes 5 and 4 cousins? \" + result); // Expected: true\n    }\n\n}\n" }, { "name": "MaximumDepthOfNaryTree", "subcat": "DFS", "link": "https://leetcode.com/problems/maximum-depth-of-nary-tree/", "code": "package leetcode.tree.DFS;\n\n\nimport leetcode.tree.Node;\n\nimport java.util.Arrays;\nimport java.util.LinkedList;\nimport java.util.Queue;\n\n/**\n * LeetCode Problem 559: Maximum Depth of N-ary Tree\n * <p>\n * Given an n-ary tree, find its maximum depth.\n * <p>\n * The maximum depth is the number of nodes along the longest path from the\n * root node down to the farthest leaf node.\n * <p>\n * An N-ary tree is a tree in which each node has no more than N children.\n * <p>\n * This file provides two solutions:\n * 1. A recursive Depth-First Search (DFS) approach.\n * 2. An iterative Breadth-First Search (BFS) approach.\n * <p>\n * Example:\n * Input: root = [1,null,3,2,4,null,5,6]\n * This represents the tree:\n *   1\n * / | \\\n * 3  2  4\n * / \\\n * 5   6\n * <p>\n * Output: 3\n */\npublic class MaximumDepthOfNaryTree {\n\n    /**\n     * Finds the maximum depth of an N-ary tree using a recursive DFS approach.\n     * The logic is: the depth of a tree is 1 + the maximum depth among all its children.\n     *\n     * @param root The root node of the N-ary tree.\n     * @return The maximum depth of the tree.\n     */\n    public static int maxDepthDFS(Node root) {\n        // Base case 1: If the tree is empty, its depth is 0.\n        if (root == null) {\n            return 0;\n        }\n\n        // Initialize a variable to keep track of the max depth found among children.\n        int maxChildDepth = 0;\n\n        // Recursively find the depth of each child subtree.\n        for (Node child : root.children) {\n            // Update maxChildDepth with the maximum value found so far.\n            maxChildDepth = Math.max(maxChildDepth, maxDepthDFS(child));\n        }\n\n        // The depth of the tree rooted at the current node is 1 (for the current node)\n        // plus the maximum depth of its children.\n        return maxChildDepth + 1;\n    }\n\n\n\n    /**\n     * Finds the maximum depth of an N-ary tree using an iterative BFS approach.\n     * The logic is to perform a level-order traversal and count the number of levels.\n     *\n     * @param root The root node of the N-ary tree.\n     * @return The maximum depth of the tree.\n     */\n    public static int maxDepthBFS(Node root) {\n        // Base case: If the tree is empty, its depth is 0.\n        if (root == null) {\n            return 0;\n        }\n\n        Queue<Node> queue = new LinkedList<>();\n        queue.offer(root);\n        int depth = 0;\n\n        // Continue traversal as long as there are nodes to process.\n        while (!queue.isEmpty()) {\n            // Get the number of nodes at the current level.\n            int size = queue.size();\n\n            // Process all nodes at the current level.\n            for (int i = 0; i < size; i++) {\n                Node current = queue.poll();\n                // Add all children of the current node to the queue for the next level.\n                for (Node child : current.children) {\n                    queue.offer(child);\n                }\n            }\n\n            // After processing all nodes of a level, increment the depth.\n            depth++;\n        }\n\n        return depth;\n    }\n\n\n    static void main(String[] args) {\n        // Manually construct the N-ary tree from the LeetCode example.\n        // Tree structure:\n        //      1\n        //    / | \\\n        //   3  2  4\n        //  / \\\n        // 5   6\n        Node node5 = new Node(5);\n        Node node6 = new Node(6);\n        Node node3 = new Node(3, Arrays.asList(node5, node6));\n        Node node2 = new Node(2);\n        Node node4 = new Node(4);\n        Node root = new Node(1, Arrays.asList(node3, node2, node4));\n\n        System.out.println(\"Finding max depth for the example tree...\");\n\n        // Calculate depth using DFS\n        int depthFromDFS = maxDepthDFS(root);\n        System.out.println(\"Max depth (using DFS): \" + depthFromDFS); // Expected: 3\n\n        // Calculate depth using BFS\n        int depthFromBFS = maxDepthBFS(root);\n        System.out.println(\"Max depth (using BFS): \" + depthFromBFS); // Expected: 3\n    }\n}" }, { "name": "SumOfLeftLeaves", "subcat": "DFS", "link": "", "code": "package leetcode.tree.DFS;\n\nimport leetcode.tree.TreeNode;\n\npublic class SumOfLeftLeaves {\n\n    // Use marker to mark left leave with no child\n    public static int helper(TreeNode root, boolean isLeft) {\n        if (root == null) return 0;\n\n        if (isLeft && root.left == null && root.right == null) return root.val;\n\n        int left = helper(root.left, true);\n        int right = helper(root.right, false);\n\n        return left + right;\n    }\n\n    public static int sumOfLeftLeaves(TreeNode root) {\n        return helper(root, false);\n    }\n\n\n    public static void main(String[] args) {\n        TreeNode root = new TreeNode(6);\n        root.left = new TreeNode(8);\n        System.out.println(sumOfLeftLeaves(root));\n    }\n}\n" }, { "name": "SumOfRootToLeafBinaryNumbers", "subcat": "DFS", "link": "", "code": "package leetcode.tree.DFS;\n\nimport leetcode.tree.TreeNode;\n\npublic class SumOfRootToLeafBinaryNumbers {\n\n    String bits = \"\";\n\n    int sum = 0;\n\n\n    // Binary to decimal can be converted using Horner's method.\n    //  Horner's method converts single MSB bit into decimal\n    public void helper(TreeNode root) {\n        if (root == null) return;\n\n        bits = bits + root.val;\n\n        if (root.left == null && root.right == null) {\n            sum += Integer.parseInt(bits, 2);\n        }\n\n        helper(root.left);\n        helper(root.right);\n\n        bits = bits.substring(0, bits.length() - 1);\n    }\n\n    public int sumRootToLeaf(TreeNode root) {\n        helper(root);\n        return sum;\n    }\n\n\n    /**\n     * Horner's method, 100\n     * <p>\n     * Sum = 0;\n     * <p>\n     * 1. sum = 1 + (2 * sum = 0) = 1\n     * 2. sum = 0 + (2 * sum = 1) = 2\n     * 3. sum = 0 + (2 * sum = 2) = 4\n     *\n     *\n     **/\n\n    /*\n    public int sumRootToLeaf(TreeNode root) {\n        return sumRootToLeaf(root, 0);\n    }\n\n    public int sumRootToLeaf(TreeNode root, int sum){\n        if(root == null) return 0;\n        sum = (2 * sum) + root.val;\n        if(root.left == null && root.right == null) return sum;\n        return sumRootToLeaf(root.left, sum) + sumRootToLeaf(root.right, sum);\n    }\n     */\n\n\n    public static void main(String[] args) {\n        // Creating each node\n        TreeNode node1 = new TreeNode(1);\n        TreeNode node2 = new TreeNode(0);\n        TreeNode node3 = new TreeNode(1);\n        TreeNode node4 = new TreeNode(0);\n        TreeNode node5 = new TreeNode(1);\n        TreeNode node6 = new TreeNode(0);\n        TreeNode node7 = new TreeNode(1);\n\n        // Connecting nodes according to the structure [1,0,1,0,1,0,1]\n        node1.left = node2;\n        node1.right = node3;\n        node2.left = node4;\n        node2.right = node5;\n        node3.left = node6;\n        node3.right = node7;\n\n        System.out.println(new SumOfRootToLeafBinaryNumbers().sumRootToLeaf(node1));\n    }\n\n\n}\n" }, { "name": "SymmetricTree", "subcat": "DFS", "link": "", "code": "package leetcode.tree.DFS;\n\nimport leetcode.tree.TreeNode;\n\nimport java.util.LinkedList;\nimport java.util.Queue;\n\npublic class SymmetricTree {\n\n\n\n    public static boolean isSymmetric(TreeNode root) {\n        if (root == null) return true;\n        Queue<TreeNode> q = new LinkedList<>();\n        q.add(root.left);\n        q.add(root.right);\n        while (!q.isEmpty()) {\n            TreeNode left = q.poll();\n            TreeNode right = q.poll();\n            if (left == null && right == null) continue;\n            if (left == null || right == null || left.val != right.val) return false;\n            q.add(left.left);\n            q.add(right.right);\n            q.add(left.right);\n            q.add(right.left);\n\n        }\n        return true;\n    }\n\n    //----------------------------------------------------------------------------------//\n\n    public static boolean isSymmetricRecursion(TreeNode root) {\n        if (root == null) return true;\n        return helper(root.left, root.right);\n    }\n\n    // Comparing two subtree parallels\n    public static boolean helper(TreeNode p, TreeNode q) {\n        if (p == null && q == null) return true;\n\n        if (p == null || q == null) return false;\n\n        return (p.val == q.val) && helper(p.left, q.right) && helper(p.right, q.left);\n    }\n\n    public static void main(String[] args) {\n        // Creating nodes\n        TreeNode node3Left = new TreeNode(3);\n        TreeNode node4Left = new TreeNode(4);\n        TreeNode node4Right = new TreeNode(4);\n        TreeNode node3Right = new TreeNode(3);\n\n        TreeNode node2Left = new TreeNode(2, node3Left, node4Left);\n        TreeNode node2Right = new TreeNode(2, node4Right, node3Right);\n\n        TreeNode root = new TreeNode(1, node2Left, node2Right);\n\n        System.out.println(isSymmetric(root));\n\n    }\n}\n" }, { "name": "LCABinarySe  {\n\n        // **Base Case 1:** If the current node is null, there is no path.\n        // This handles empty trees or paths that extend beyond a leaf.\n        if (root == null) {\n            return false;\n        }\n\n        // **Base Case 2:** We have reached a leaf node (no children).\n        // This is the end of a potential path. We check if the remaining\n        // targetSum is exactly the value of this leaf node.\n        if (root.left == null && root.right == null) {\n            return targetSum == root.val;\n        }\n\n        // **Recursive Step:** If it's not a leaf node, we continue the search.\n        // We subtract the current node's value from the targetSum and\n        // ask if a valid path exists in either the left OR the right subtree.\n        // If either call returns true, the result is true.\n        boolean foundInLeft = hasPathSum(root.left, targetSum - root.val);\n        boolean foundInRight = hasPathSum(root.right, targetSum - root.val);\n\n        return foundInLeft || foundInRight;\n    }\n\n    public static void main(String[] args) {\n        // Construct the tree from the example:\n        TreeNode root = new TreeNode(5);\n        root.left = new TreeNode(4);\n        root.right = new TreeNode(8);\n        root.left.left = new TreeNode(11);\n        root.left.left.left = new TreeNode(7);\n        root.left.left.right = new TreeNode(2);\n        root.right.left = new TreeNode(13);\n        root.right.right = new TreeNode(4);\n        root.right.right.right = new TreeNode(1);\n\n        PathSum solution = new PathSum();\n        int targetSum = 22;\n\n        System.out.println(\"Does a path with sum \" + targetSum + \" exist?\");\n        boolean result = solution.hasPathSum(root, targetSum);\n\n        System.out.println(result); // Expected: true\n    }\n}\n" }, { "name": "PathSum_2", "subcat": "pathSumVariations", "link": "https://leetcode.com/problems/path-sum-ii", "code": "package leetcode.tree.pathSumVariations;\n\np oot, 0,  map);\n\n        int max = 0;\n        for (int i : map.values()) {\n            max = Math.max(max, i);\n        }\n\n        List<Integer> result = new ArrayList<>();\n        for (int i : map.keySet()) {\n            if (map.get(i) == max) {\n                result.add(i);\n            }\n        }\n\n        return result.stream().mapToInt(x -> x.intValue()).toArray();\n    }\n\n\n}\n" }, { "name": "VerifyPreorderSerialization", "subcat": "serialization", "link": "", "code": "package leetcode.tree.serialization;\n\nimport java.util.Stack;\n\npublic class VerifyPreorderSerialization {\n\n    public boolean slotBased(String preorder) {\n        int slot = 1;\n        String[] str = preorder.split(\",\");\n\n        for (String value : str) {\n            slot--;\n\n            if (slot < 0) return false;\n\n            if (!value.equals(\"#\")) {\n                slot += 2;\n            }\n        }\n\n        return slot == 0;\n    }\n\n    @SuppressWarnings(\"all\")\n    public boolean stackBased(String preorder){\n        String[] str = preorder.split(\",\");\n        Stack<String> stack = new Stack<>();\n\n        for (String s : str) {\n            stack.push(s);\n\n            while (stack.size() >= 3\n                    && stack.get(stack.size() - 1).equals(\"#\")\n                    && stack.get(stack.size() - 2).equals(\"#\")\n                    && !stack.get(stack.size() - 3).equals(\"#\")) {\n\n                stack.pop();\n                stack.pop();\n                stack.pop();\n\n                stack.push(\"#\");\n            }\n        }\n\n        return stack.size() == 1 && stack.peek().equals(\"#\");\n    }\n\n    public boolean isValidSerialization(String preorder) {\n      //return slotBased(preorder);\n        return stackBased(preorder);\n    }\n\n    public static void main(String[] args){\n        String preorder = \"9,3,4,#,#,1,#,#,2,#,6,#,#\";\n        //preorder = \"9,#,#,1\";\n        System.out.println(new VerifyPreorder         }\n    }\n\n}\n" }], "Design": [{ "name": "HashMap", "subcat": "", "link": "", "code": "package leetcode.design;\n\n\n/**\n * Chaining is used to handle collisions\n * LinkedList is used to handle collisions\n */\npublic class HashMap {\n\n    static class ListNode {\n        int key, val;\n        ListNode next;\n        public ListNode(int key, int val, ListNode next) {\n            this.key = key;\n            this.val = val;\n            this.next = next;\n        }\n    }\n\n    static final int size = 10000000;\n    ListNode[] hashTable;\n\n    public HashMap() {\n        this.hashTable = new ListNode[size];\n    }\n\n    private int hash(int key) {\n        return key % size;\n    }\n\n\n    public void put(int key, int val) {\n        remove(key);\n        int h = hash(key);\n        ListNode node = new ListNode(key, val, hashTable[h]); // inserting at head\n        hashTable[h] = node;\n    }\n\n    public int get(int key) {\n        int h = hash(key);\n        ListNode node = hashTable[h];\n\n        while (node != null) {\n            if (node.key == key) return node.val;\n            node = node.next;\n        }\n\n        return -1;\n    }\n\n    public void remove(int key) {\n        int h = hash(key);\n        ListNode node = hashTable[h];\n\n        // When node does not exist\n        if (node == null) return;\n\n        // When the first node is the target node, assign the next node in the array\n        if (node.key == key) hashTable[h] = node.next;\n\n        while (node.next != null) {\n            if (node.next.key == key) {\n                node.next = node.next.next;\n                break;\n            }\n        }\n    }\n\n    public static void main(String[] args) {\n        HashMap hashMap = new HashMap();\n        hashMap.put(1, 1);\n        hashMap.put(2, 2);\n        System.out.println(hashMap.get(1));  // return 1\n        System.out.println(hashMap.get(3));  // return -1\n        hashMap.put(2, 1);          // update the existing value\n        System.out.println(hashMap.get(2));  // return 1\n        hashMap.remove(2);              // remove the mapping for 2\n        System.out.println(hashMap.get(2));  // return -1\n    }\n\n}\n" }, { "name": "HashSet", "subcat": "", "link": "", "code": "package leetcode.design;\n\n\nimport dsa.tree.BST;\n\n/**\n * Chaining is used to handle collisions\n * Binary Search Tree is used to handle collisions\n */\npublic class HashSet {\n    final static int INITIAL_SIZE = 1000;\n    BST[] set;\n\n    public HashSet() {\n        set = new BST[INITIAL_SIZE];\n    }\n\n    public void add(int key) {\n        int h = hash(key);\n        if (set[h] == null) {\n            set[h] = new BST();\n        }\n        set[h].insert(key);\n    }\n\n    public void remove(int key) {\n        int h = hash(key);\n        if (set[h] != null) set[h].delete(key);\n    }\n\n    public boolean contains(int key) {\n        int h = hash(key);\n        if (set[h] != null) return set[h].contains(key);\n        return false;\n    }\n\n    private int hash(int key) {\n        return key % INITIAL_SIZE;\n    }\n\n\n    public static void main(String[] args) {\n        HashSet hashSet = new HashSet();\n        // Add values\n        hashSet.add(5);\n        hashSet.add(3);\n        hashSet.add(7);\n\n        // Check if values exist\n        System.out.println(\"Contains 5: \" + hashSet.contains(5)); // Should print: true\n        System.out.println(\"Contains 3: \" + hashSet.contains(3)); // Should print: true\n        System.out.println(\"Contains 7: \" + hashSet.contains(7)); // Should print: true\n        System.out.println(\"Contains 1: \" + hashSet.contains(1)); // Should print: false\n\n        // Remove some values\n        hashSet.remove(5);\n        hashSet.remove(3);\n\n        // Check if values exist after removal\n        System.out.println(\"\\nContains 5: \" + hashSet.contains(5)); // Should print: false\n        System.out.println(\"Contains 3: \" + hashSet.contain gn;\n\nimport java.util.LinkedList;\nimport java.util.Queue;\n\n@SuppressWarnings(\"all\")\npublic class StackUsingQueues {\n\n    private final Queue<Integer> queue;\n\n    public StackUsingQueues() {\n        queue = new LinkedList<>();\n    }\n\n    public void push(int x) {\n        queue.add(x);\n        for (int i = 0; i < queue.size() - 1; i++)\n            queue.add(queue.poll());\n    }\n\n    public int pop() {\n        return queue.poll();\n    }\n\n    public int top() {\n        return queue.peek();\n    }\n\n    public boolean empty() {\n        return queue.isEmpty();\n    }\n\n\n    public static void main(String[] args) {\n        StackUsingQueues stack = new StackUsingQueues();\n        // Push values\n        stack.push(1);\n        stack.push(2);\n        // Peek at the top\n        System.out.println(\"Top: \" + stack.top()); // Should print: 2\n        // Pop a value\n        stack.pop();\n        // Check if the stack is empty\n        System.out.println(\"Is Empty: \" + stack.empty()); // Should print: false\n    }\n}\n" }, { "name": "TimeMap", "subcat": "", "link": "", "code": "package leetcode.design;\n\nimport java.util.ArrayList;\nimport java.util.List;\nimport java.util.Map;\nimport java.util.concurrent.ConcurrentHashMap;\n\npublic class TimeMap {\n\n    private record Data(String val, int time) { }\n\n    Map<String, List<Data>> map;\n\n    public TimeMap() {\n        map = new ConcurrentHashMap<>();\n    }\n\n    public void set(String key, String value, int timestamp) {\n        if (!map.containsKey(key))\n            map.put(key, new ArrayList<>());\n\n        map.get(key).add(new Data(value, timestamp));\n    }\n\n    public String get(String key, int timestamp) {\n        if (!map.containsKey(key)) return \"\";\n\n        return binarySearch(map.get(key), timestamp);\n    }\n\n    private String binarySearch(List<Data> list, int timestamp) {\n        int start = 0;\n        int end = list.size() - 1;\n        int idx = -1;\n        while (start <= end) {\n            int mid = start + (end - start) / 2;\n            if (list.get(mid).time <= timestamp) {\n                idx = mid;\n                start = mid + 1;\n            } else {\n                end = mid - 1;\n            }\n        }\n\n        return idx != -1 ? list.get(idx).val : \"\";\n    }\n\n    public static void main(String[] args) {\n        TimeMap timeMap = new TimeMap();\n\n        // Set values with timestamps\n        timeMap.set(\"foo\", \"bar\", 1);\n        timeMap.set(\"foo\", \"bar2\", 2);\n\n        // Get the values at different timestamps\n        System.out.println(\"Get 'foo' at timestamp 1: \" + timeMap.get(\"foo\", 1)); // Should print: bar\n        System.out.println(\"Get 'foo' at timestamp 2: \" + timeMap.get(\"foo\", 2)); // Should print: bar2\n        System.out.println(\"Get 'foo' at timestamp 3: \" + timeMap.get(\"foo\", 3)); // Should print: bar2\n        System.out.println(\"Get 'foo' at timestamp 0: \" + timeMap.get(\"foo\", 0)); // Should print: \"\"\n\n        // Set another value with timestamp\n        timeMap.set(\"foo\", \"bar3\", 4);\n\n        // Get the values at different timestamps\n        System.out.println(\"Get 'foo' at timestamp 4: \" + timeMap.get(\"foo\", 4)); // Should print: bar3\n        System.out.println(\"Get 'foo' at timestamp 5: \" + timeMap.get(\"foo\", 5)); // Should print: bar3\n    }\n\n\n}\n" }], "Bit": [{ "name": "AddBinary", "subcat": "", "link": "", "code": "package leetcode.bit;\n\npublic class AddBinary {\n\n    public static String addBinary(String a, String b) {\n        StringBuilder sb = new StringBuilder();\n        int i = a.length() - 1;\n        int j = b.length() - 1;\n        int carry = 0;\n\n\n        while (i >= 0 || j >= 0) {\n            int sum = carry;\n\n            if (i >= 0) {\n                sum += a.charAt(i) - '0';\n                i--;\n            }\n\n\n            if (j >= 0) {\n                sum += b.charAt(j) - '0';\n ic List<Integer> grayCode(int n) {\n        n = 1 << n; // Math.pow(2, n)\n        List<Integer> result = new ArrayList<>();\n\n        for (int i = 0; i < n; i++) {\n            int grayCode = i ^ (i >> 1);\n            result.add(grayCode);\n        }\n\n        return result;\n    }\n\n    public static void main(String[] args) {\n        int n = 2;\n        System.out.println(grayCode(2));\n    }\n\n}\n" }, { "name": "HammingDistance", "subcat": "", "link": "", "code": "package leetcode.bit;\n\npublic class HammingDistance {\n\n    public int hammingDistance(int x, int y) {\n        int xor = x ^ y;\n        int distance = 0;\n\n        for (int i = 0; i < 32; i++) {\n            distance += (xor >> i) & 1;\n        }\n\n        return distance;\n    }\n}\n" }, { "name": "NumberComplement", "subcat": "", "link": "", "code": "package leetcode.bit;\n\npublic class NumberComplement {\n\n    public static int findComplement(int num) {\n        int mask = ~0;\n\n        while ((num & mask) != 0) {\n            mask = mask << 1;\n        }\n\n        return ~num & ~mask;\n    }\n\n    public static void main(String[] args) {\n        int num = 5;\n        System.out.println(findComplement(num)); // 2\n    }\n\n}\n" }, { "name": "PrimeNumberOfSetBits", "subcat": "", "link": "", "code": "package leetcode.bit;\n\npublic class PrimeNumberOfSetBits {\n\n    public static boolean isPrime(int number) {\n        // Check for numbers less than 2\n        if (number <= 1) {\n            return false;\n        }\n\n        // Check for factors from 2 to the square root of num\n        for (int i = 2; i * i <= number; i++) {\n            if (number % i == 0) {\n                return false;\n            }\n        }\n\n        return true;\n    }\n\n    public static int countPrimeSetBits(int left, int right) {\n        int result = 0;\n\n        for (int i = left; i <= right; i++) {\n            int count = 0;\n\n            for (int j = 0; j < 32; j++) {\n                if ((( heck(nums));\n    }\n}\n" }, { "name": "ContainsDuplicate_2", "subcat": "", "link": "https://leetcode.com/problems/contains-duplicate/", "code": "package leetcode.array;\n\nimport java.util.HashMap;\nimport java.util.Map;\n\n\n// LeetCode 219: Contains Duplicate II\n//\n// Problem Statement:\n// Given an integer array `nums` and an integer `k`, return `true` if there are two\n// distinct indices `i` and `j` in the array such that `nums[i] == nums[j]` and\n// the absolute difference `abs(i - j)` is at most `k`.\n//\n// Examples:\n// - nums = [1,2,3,1], k = 3  -> true.  The 1s at index 0 and 3 have a difference of 3, which is <= k.\n// - nums = [1,0,1,1], k = 1  -> true.  The 1s at index 2 and 3 have a difference of 1, which is <= k.\n// - nums = [1,2,3,1,2,3], k = 2 -> false. The minimum distance for any duplicate pair is 3, which is > k.\n\npublic class ContainsDuplicate_2 {\n\n\n    public static boolean containsNearbyDuplicate(int[] nums, int k) {\n        // The map stores the number and its most recently seen index.\n        Map<Integer, Integer> indexMap = new HashMap<>();\n        int difference;\n\n        for (int i = 0; i < nums.length; i++) {\n            // Check if we have seen this number before.\n            if (indexMap.containsKey(nums[i])) {\n                // Get the last index where we saw this number.\n                int lastSeenIndex = indexMap.get(nums[i]);\n                difference = i - lastSeenIndex;\n\n                // Check if the difference is within our threshold 'k'.\n                if (difference <= k) {\n                    return true;\n                }\n            }\n\n            // we always have the closest possible index for future checks.\n            indexMap.put(nums[i], i);\n        }\n\n        // If we finish the loop, no such pair was found.\n        return false;\n    }\n\n\n    public static void main(String[] args) {\n        int[] nums;\n        int k;\n\n        // First case\n        nums = new int[]{1, 0, 1, 1};\n        k = 1;\n        System.out.println(containsNearbyDuplicate(nums, k));\n\n        // Third case\n        nums = new int[]{1, 2, 3, 1, 2, 3};\n        k = 2;\n        System.out.println(containsNearbyDuplicate(nums, k));\n    }\n}\n" }, { "name": "DegreeOfArray", "subcat": "", "link": "https://leetcode.com/problems/degree-of-array/", "code": "package leetcode.array;\n\nimport java.util.HashMap;\nimport java.util.Map;\n\n\n// LeetCode 697: Degree of an Array\n//\n// Problem Statement:\n// Given a non-empty array of non-negative integers `nums`, the degree of this array is\n// defined as the maximum frequency of any one of its elements.\n//\n// Your task is to find the length of the shortest, contiguous subarray of `nums` that\n// has the same degree as `nums`.\n//\n// Example 1:\n// Input: nums = [1,2,2,3,1]\n// Output: 2\n// Explanation:\n// The degree of the array is 2 because both 1 and 2 appear twice.\n// The subarrays that have the same degree are:\n// [1,2,2,3,1] (contains all 1s, length 5)\n// [2,2]       (contains all 2s, length 2)\n// The shortest length is 2.\n//\n// Example 2:\n// Input: nums = [1,2,2,3,1,4,2]\n// Output: 6\n// Explanation:\n// The degree is 3 (element 2 appears 3 times).\n// The subarray containing all 2s is [2,2,3,1,4,2], which starts at index 1 and ends at index 6.\n// Its length is 6 - 1 + 1 = 6.\n\npublic class DegreeOfArray {\n\n\n    public static int findShortestSubArray(int[] nums) {\n        if (nums.length == 0) return 0;\n\n        // The map's value is an array of: [count, first_index, last_index]\n        Map<Integer, int[]> map = new HashMap<>();\n\n        // === PASS 1: GATHER DATA ===\n        for (int i = 0; i < nums.length; i++) {\n            if (!map.containsKey(nums[i])) {\n                // First time seeing this number\n                map.put(nums[i], new int[]{1, i, i});\n            } else {\n                // Already seen this number, update its count and last_index\n                int[] temp = map.get(nums[i]);\n                temp[0]++;       // Increment count\n                temp[2] = i;     // Update last seen index\n            }\n        }\n\n        // === PASS 2: ANALYZE DATA ===\n        int result = Integer.MAX_VALUE;\n        int maxCount = Integer.MIN_VALUE;\n\n        // Iterate through the map's values to find the shortest subarray\n        for (int[] temp : map.values()) {\n            int count = temp[0];\n            int firstIndex = temp[1];\n            int lastIndex = temp[2];\n\n            if (count > maxCount) {\n                // This is the new highest frequency element found so far\n                maxCount = count;\n                result = lastIndex - firstIndex + 1;\n            } else if (count == maxCount) {\n                // There's a tie in frequency, so we check if this element\n                // provides a shorter subarray length.\n                result = Math.min(result, lastIndex - firstIndex + 1);\n            }\n        }\n\n        return result;\n    }\n\n    public static void main(String[] args) {\n        // Example 1: The user's original example\n        int[] nums1 = new int[]{1, 2, 2, 3, 1, 4, 2};\n        System.out.println(\"For [1,2,2,3,1,4,2], shortest subarray length is: \" + findShortestSubArray(nums1));\n        // Expected: 6\n        // Degree is 3 (the number 2 appears 3 times).\n        // The first '2' is at index 1. The last '2' is at index 6.\n        // The shortest subarray is [2,2,3,1,4,2], length = 6 - 1 + 1 = 6.\n        // Your original comment had '7', which was likely a typo.\n\n        // Example 2: The classic LeetCode example\n        int[] nums2 = new int[]{1, 2, 2, 3, 1};\n        System.out.println(\"For [1,2,2,3,1], shortest subarray length is: \" + findShortestSubArray(nums2));\n        // Expected: 2\n        // Degree is 2. The candidates are 1 and 2.\n        // Subarray for 1s: [1,2,2,3,1] -> length = 4 - 0 + 1 = 5.\n        // Subarray for 2s: [2,2] -> length = 2 - 1 + 1 = 2.\n        // The minimum length is 2.\n    }\n}" }, { "name": "HIndex", "subcat": "", "link": "https://leetcode.com/problems/hindex/", "code": "\npackage leetcode.array;\n\nimport java.util.Arrays;\n\n\n// LeetCode 274: H-Index & LeetCode 275: H-Index II\n//\n// Problem Statement:\n// Given an array of integers `citations` where `citations[i]` is the number of citations a\n// researcher has for their i-th paper, compute the researcher's h-index.\n//\n// Definition of h-index:\n// A scientist has an h-index of `h` if `h` of their `N` papers have **at least** `h` citations each,\n// and the other `N - h` papers have **no more than** `h` citations each. The goal is to find the\n// maximum possible value of `h`.\n//\n// Example: citations = [3, 0, 6, 1, 5] (N=5 papers)\n// - Can h be 3? We need 3 papers with at least 3 citations. We have [3, 6, 5]. Yes.\n// - Can h be 4? We need 4 papers with at least 4 citations. We only have [6, 5]. No.\n// So, the maximum h-index is 3.\n//\n// Note: The two methods in this file solve two versions of the problem.\n// - `hIndex()` solves H-Index I (unsorted input).\n// - `hIndexB()` solves H-Index II (input is guaranteed to be sorted in ascending order).\n\n\npublic class HIndex {\n\n    /**\n     * ### Intuition Behind the Binary Search Solution (`hIndexB`)\n     *\n     * This method assumes the `citations` array is already sorted in ascending order.\n     * This sorting creates a monotonic property that allows for binary search.\n     *\n     * 1.  **The Search Space:** We are not searching for a value *in* the array. We are searching\n     * for the optimal value of `h`. The search space is the range of possible h-indices,\n     * which can be mapped to the indices of the array.\n     *\n     * 2.  **The Monotonic Condition:** Let's define a condition for a given index `mid`:\n     * - Let `h = n - mid`. This `h` is the number of papers from index `mid` to the end.\n     * - Let `c = citations[mid]`. This `c` is the *minimum* number of citations for this group of `h` papers (since the array is sorted).\n     * - The h-index condition is: \"Do we have `h` papers with at least `h` citations?\"\n     * - This translates to the check: `c >= h`, or `citations[mid] >= n - mid`.\n     *\n     * 3.  **The Binary Search Logic:**\n     * - `if (citations[mid] >= n - mid)`: This means an h-index of `(n - mid)` is possible. Since we want the *maximum* possible `h`, we should try to find an even better solution. A larger `h` corresponds to a smaller `mid`. So, we store this as a potential answer (`max = n - mid`) and search in the left half (`right = mid - 1`).\n     * - `else`: The number of citations `citations[mid]` is too small for this many papers (`n - mid`). We need to consider fewer papers (a smaller `h`), which means moving to the right half of the array (`left = mid + 1`).\n     *\n     * This binary search efficiently narrows down the search space to find the optimal partition point that defines the maximum h-index.\n     */\n    public static int hIndexB(int[] citations) {\n        int left = 0;\n        int right = citations.length - 1;\n        int n = citations.length;\n        int max = 0;\n\n        while (left <= right) {\n            int mid = left + (right - left) / 2;\n            int h = n - mid; // The potential h-index value\n\n            // Check if the h-index definition is met at this partition\n            if (citations[mid] >= h) {\n                // This is a valid h-index. Store it and try for a larger one.\n                // A larger h means a smaller mid, so we search the left side.\n                max = h;\n                right = mid - 1;\n            } else {\n                // The number of citations is too low for this many papers.\n                // We need a smaller h, which means a larger mid, so search the right side.\n                left = mid + 1;\n            }\n        }\n        return max;\n    }\n\n    /**\n     * ### Intuition Behind the Sorting Solution (`hIndex`)\n     *\n     * This method works for an unsorted input array.\n     *\n     * 1.  **Sort the Data:** The definition of h-index depends on counts of papers relative to\n     * citation numbers. Sorting makes this relationship much easier to analyze.\n     *\n     * 2.  **Sort Descending:** The code sorts ascending and then reverses. This is equivalent to\n     * sorting in descending order. Let's consider the array `[6, 5, 3, 1, 0]`.\n     *\n     * 3.  **The Logic:** After sorting descending, the index `i` can represent the number of papers\n     * we are considering (well, `i+1` does).\n     * - At `i=0`, we are looking at the top `1` paper. It has `citations[0] = 6` citations. Is `1 <= 6`? Yes. So h-index is at least 1.\n     * - At `i=1`, we are looking at the top `2` papers. The one with fewer citations has `citations[1] = 5`. Is `2 <= 5`? Yes. So h-index is at least 2.\n     * - At `i=2`, we look at the top `3` papers. The minimum citations is `citations[2] = 3`. Is `3 <= 3`? Yes. So h-index is at least 3.\n     * - At `i=3`, we look at the top `4` papers. The minimum citations is `citations[3] = 1`. Is `4 <= 1`? No. The condition breaks.\n     *\n     * The loop finds the largest `i+1` (which is our `h`) that satisfies the condition `h <= citations[h-1]`.\n     */\n    public static int hIndex(int[] citations) {\n        Arrays.sort(citations); // Sort in ascending order: e.g., [0, 1, 3, 5, 6]\n\n        int n = citations.length;\n        // Reverse the array to get descending order: e.g., [6, 5, 3, 1, 0]\n        for (int i = 0; i < n / 2; i++) {\n            int temp = citations[i];\n            citations[i] = citations[n - i - 1];\n            citations[n - i - 1] = temp;\n        }\n\n        int h = 0;\n        // Find the largest h such that the h-th paper has at least h citations\n        for (int i = 0; i < n; i++) {\n            // i+1 is the number of papers (our potential h)\n            // citations[i] is the citation count for the i-th paper (0-indexed)\n            if (i + 1 <= citations[i]) {\n                h = i + 1;\n            } else {\n                // As soon as the condition fails, we can stop because the citation\n                // counts will only get smaller from here.\n                break;\n            }\n        }\n\n        return h;\n    }\n\n    public static void main(String[] args) {\n        // --- Testing the Binary Search Method (for sorted input) ---\n        System.out.println(\"--- Binary Search Method (hIndexB) ---\");\n\n        int[] citations1 = {0, 1, 3, 5, 6};\n        System.out.println(\"For [0,1,3,5,6], h-index is: \" + hIndexB(citations1));\n        // Expected: 3. There are 3 papers ([3,5,6]) with at least 3 citations each.\n\n        int[] citations2 = {0, 1};\n        System.out.println(\"For [0,1], h-index is: \" + hIndexB(citations2));\n        // Expected: 1. There is 1 paper ([1]) with at least 1 citation.\n\n        int[] citations3 = {1, 2, 100};\n        System.out.println(\"For [1,2,100], h-index is: \" + hIndexB(citations3));\n        // Expected: 2. There are 2 papers ([2,100]) with at least 2 citations each.\n\n        int[] citations4 = {11, 15};\n        System.out.println(\"For [11,15], h-index is: \" + hIndexB(citations4));\n        // Expected: 2. There are 2 papers with at least 2 citations each.\n    }\n}" }, { "name": "LongestHarmoniousSubsequence", "subcat": "", "link": "https://leetcode.com/problems/longest-harmonious-subsequence/", "code": "\n\npackage leetcode.array;\n\nimport java.util.HashMap;\nimport java.util.Map;\n\n\n// LeetCode 594: Longest Harmonious Subsequence\n//\n// Problem Statement:\n// We define a harmonious array as an array where the difference between its maximum value and\n// its minimum value is exactly 1.\n//\n// Given an integer array `nums`, return the length of its longest harmonious subsequence\n// among all its possible subsequences.\n//\n// A subsequence of an array is a sequence that can
