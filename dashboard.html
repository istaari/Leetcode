if a string is a palindrome\n    public static boolean isPalindrome(String str) {\n        int left = 0, right = str.length() - 1;\n        while (left < right) {\n            if (str.charAt(left) != str.charAt(right)) {\n                return false;\n            }\n            left++;\n            right--;\n        }\n        return true;\n    }\n\n    // Top-down: find min cuts for s[start..end]\n    // Returns -1 when start >= length (accounts for the extra +1 count)\n    public static int backtrack(String s, int start, Map<Integer, Integer> memo) {\n        if (start >= s.length()) return -1; // entire string consumed, no cut needed\n\n        if (memo.containsKey(start)) return memo.get(start);\n\n        int minCut = Integer.MAX_VALUE;\n\n        // Try every possible partition point\n        for (int i = start; i < s.length(); i++) {\n            // If s[start..i] is a palindrome, make a cut here and solve the rest\n            if (isPalindrome(s.substring(start, i + 1))) {\n                minCut = Math.min(minCut, 1 + backtrack(s, i + 1, memo));\n            }\n        }\n\n        memo.put(start, minCut);\n        \n        return minCut;\n    }\n\n    public static int minCut(String s) {\n        return backtrack(s, 0, new HashMap<>());\n    }\n\n    public static void main(String[] args) {\n        String s = \"abcd\";\n        System.out.println(minCut(s));\n    }\n\n}\n"}, {"name": "PredictTheWinner", "subcat": "interval", "link": "", "code": "package leetcode.dp.interval;\n\n/**\n * 486. Predict the Winner\n * https://leetcode.com/problems/predict-the-winner/\n *\n * You are given an integer array nums. Two players take turns picking numbers\n * from either end of the array. Player 1 picks first. Each player adds the\n * picked number to their score. Return true if Player 1 can win or tie.\n *\n * Example 1: Input: nums = [1,5,2] -> Output: false\n *   Explanation: Player 1 picks 1, Player 2 picks 5, Player 1 picks 2.\n *   Score: Player 1 = 3, Player 2 = 5. Player 1 cannot win.\n *\n * Example 2: Input: nums = [1,5,233,7] -> Output: true\n *\n * Constraints:\n *   1 <= nums.length <= 20\n *   0 <= nums[i] <= 10^7\n *\n * ---\n * Approach: Interval DP (minimax with relative score)\n *\n * dp[i][j] = the maximum score difference (current player - opponent)\n * the current player can achieve from nums[i..j].\n *\n * STATE:      dp[i][j] = max relative advantage for current player in [i..j]\n * BASE:       dp[i][i] = nums[i]  (only one element to pick)\n * TRANSITION: dp[i][j] = max(nums[i] - dp[i+1][j], nums[j] - dp[i][j-1])\n *             (pick left or right, then subtract opponent's best result)\n * ANSWER:     dp[0][n-1] >= 0 means Player 1 wins or ties\n *\n * Time:  O(n^2)\n * Space: O(n^2)\n */\npublic class PredictTheWinner {\n\n    // Top-down: returns the max score difference the current player achieves in nums[i..j]\n    public static int recursive(int[] nums, int i, int j, Integer[][] dp) {\n        // Base case: only one element, current player takes it\n        if (i == j) return nums[i];\n\n        if (dp[i][j] != null) return dp[i][j];\n\n        // Pick left:  gain nums[i], then opponent plays optimally on [i+1..j]\n        int pickLeft = nums[i] - recursive(nums, i + 1, j, dp);\n        // Pick right: gain nums[j], then opponent plays optimally on [i..j-1]\n        int pickRight = nums[j] - recursive(nums, i, j - 1, dp);\n\n        // Choose the action that maximizes our relative advantage\n        dp[i][j] = Math.max(pickLeft, pickRight);\n\n        return dp[i][j];\n    }\n\n    public static boolean predictTheWinner(int[] nums) {\n        int n = nums.length;\n        Integer[][] dp = new Integer[n][n];\n\n        // Player 1 wins if their relative score advantage >= 0\n        return recursive(nums, 0, n - 1, dp) >= 0;\n    }\n\n    public static void main(String[] args) {\n        int[] nums = new int[]{1, 5, 2};\n        System.out.println(predictTheWinner(nums));\n    }\n\n}"}, {"name": "WordBreak", "subcat": "interval", "link": "", "code": "package leetcode.dp.interval;\n\nimport java.util.*;\n\n/**\n * 139. Word Break\n * https://leetcode.com/problems/word-break/\n *\n * Given a string s and a dictionary of strings wordDict, return true if s\n * can be segmented into a space-separated sequence of one or more dictionary words.\n * The same word in the dictionary may be reused multiple times.\n *\n * Example 1: Input: s = \"leetcode\", wordDict = [\"leet\",\"code\"] -> Output: true\n * Example 2: Input: s = \"applepenapple\", wordDict = [\"apple\",\"pen\"] -> Output: true\n * Example 3: Input: s = \"catsandog\", wordDict = [\"cats\",\"dog\",\"sand\",\"and\",\"cat\"] -> Output: false\n *\n * Constraints:\n *   1 <= s.length <= 300\n *   1 <= wordDict.length <= 1000\n *   1 <= wordDict[i].length <= 20\n *\n * ---\n * Approach: DP (top-down memoization + bottom-up iterative)\n *\n * STATE:      dp[i] = true if s[0..i-1] can be segmented into dictionary words\n * BASE:       dp[0] = true (empty prefix is trivially valid)\n * TRANSITION: dp[i] = true if there exists j < i such that dp[j] == true AND s[j..i-1] is in dict\n * ANSWER:     dp[n]\n *\n * Time:  O(n^2 * k) where k = average word length for substring comparison\n * Space: O(n)\n */\npublic class WordBreak {\n\n    // Top-down: can we segment s[start..end] using dictionary words?\n    public static boolean helper(String s, int start, Set<String> set, Map<Integer, Boolean> memo) {\n        // Base case: consumed the entire string\n        if (start >= s.length())\n            return true;\n\n        if (memo.containsKey(start)) {\n            return memo.get(start);\n        }\n\n        // Try every possible end point to form a word s[start..end]\n        for (int end = start; end < s.length(); end++) {\n            String word = s.substring(start, end + 1);\n\n            // If this word is in the dictionary AND the rest can be segmented\n            if (set.contains(word) && helper(s, end + 1, set, memo)) {\n                memo.put(start, true);\n                return memo.get(start);\n            }\n        }\n\n        memo.put(start, false);\n        return memo.get(start);\n    }\n\n    public static boolean recursive(String s, List<String> wordDict) {\n        Set<String> set = new HashSet<>(wordDict);\n        return helper(s, 0, set, new HashMap<>());\n    }\n\n    /**\n     * dp = {\n     * 8: true, // \"leetcode\" is fully segmented.\n     * 4: true, // \"code\" can be segmented.\n     * 0: true // \"leet code\" can be segmented.\n     * }\n     * \n     * dp[i] represents: Can the substring s[0...i-1] (the prefix of length i) be successfully segmented into valid dictionary words\n     * \n     **/\n    public static boolean iterative(String s, List<String> wordDict) {\n        Set<String> set = new HashSet<>(wordDict);\n        int n = s.length();\n        boolean[] dp = new boolean[n + 1];\n\n        dp[0] = true;\n\n        for (int i = 1; i <= n; i++) {\n            for (int j = 0; j < i; j++) {\n                String word = s.substring(j, i);\n                if (dp[j] && set.contains(word)) {\n                    dp[i] = true;\n                    break;\n                }\n            }\n        }\n\n        return dp[n];\n    }\n\n    public static boolean wordBreak(String s, List<String> wordDict) {\n        return iterative(s, wordDict);\n    }\n\n    public static void main(String[] args) {\n        String s = \"leetcode\";\n        List<String> wordDict = List.of(\"leet\", \"code\");\n        System.out.println(wordBreak(s, wordDict)); // Output: true\n\n        String s2 = \"applepenapple\";\n        List<String> wordDict2 = List.of(\"apple\", \"pen\");\n        System.out.println(wordBreak(s2, wordDict2)); // Output: true\n\n        String s3 = \"catsandog\";\n        List<String> wordDict3 = List.of(\"cats\", \"dog\", \"sand\", \"and\", \"cat\");\n        System.out.println(wordBreak(s3, wordDict3)); // Output: false\n    }\n\n}\n"}, {"name": "MaxProductSubarray", "subcat": "kandane", "link": "", "code": "package leetcode.dp.kandane;\n\n/**\n * 152. Maximum Product Subarray\n * https://leetcode.com/problems/maximum-product-subarray/\n *\n * Given an integer array nums, find a subarray that has the largest product,\n * and return the product.\n *\n * Example 1: Input: nums = [2,3,-2,4] -> Output: 6  (subarray [2,3])\n * Example 2: Input: nums = [-2,0,-1] -> Output: 0   (subarray [0])\n *\n * Constraints:\n *   1 <= nums.length <= 2 * 10^4\n *   -10 <= nums[i] <= 10\n *\n * ---\n * Approach: Modified Kadane's (track both max and min product)\n *\n * Because a negative number can flip the max/min, we track both.\n * When we encounter a negative number, we swap maxProd and minProd\n * before updating, since multiplying by a negative flips their roles.\n *\n * Time:  O(n)\n * Space: O(1)\n */\npublic class MaxProductSubarray {\n\n    public static int maxProduct(int[] nums) {\n        if (nums == null || nums.length == 0) {\n            return 0;\n        }\n\n        int maxProd = nums[0]; // Maximum product ending at current position\n        int minProd = nums[0]; // Minimum product ending at current position (needed for negatives)\n        int result = nums[0];  // Global maximum product found so far\n\n        for (int i = 1; i < nums.length; i++) {\n            // If current number is negative, swap max and min.\n            // A large negative min * negative num = large positive max.\n            if (nums[i] < 0) {\n                int temp = maxProd;\n                maxProd = minProd;\n                minProd = temp;\n            }\n\n            // Either start a new subarray at nums[i], or extend the current one\n            maxProd = Math.max(nums[i], maxProd * nums[i]);\n            minProd = Math.min(nums[i], minProd * nums[i]);\n\n            // Update global result\n            result = Math.max(result, maxProd);\n        }\n\n        return result;\n    }\n\n    public static void main(String[] args) {\n        // Test case 1\n        int[] nums1 = { 2, 3, -2, 4 };\n        System.out.println(maxProduct(nums1));\n\n        // Test case 2\n        int[] nums2 = { -2, 0, -1 };\n        System.out.println(maxProduct(nums2));\n    }\n}\n"}, {"name": "MaxSubarray", "subcat": "kandane", "link": "", "code": "package leetcode.dp.kandane;\n\n/**\n * 53. Maximum Subarray\n * https://leetcode.com/problems/maximum-subarray/\n *\n * Given an integer array nums, find the subarray with the largest sum,\n * and return its sum.\n *\n * Example 1: Input: nums = [-2,1,-3,4,-1,2,1,-5,4] -> Output: 6\n *   Explanation: The subarray [4,-1,2,1] has the largest sum 6.\n *\n * Example 2: Input: nums = [1] -> Output: 1\n * Example 3: Input: nums = [5,4,-1,7,8] -> Output: 23\n *\n * Constraints:\n *   1 <= nums.length <= 10^5\n *   -10^4 <= nums[i] <= 10^4\n *\n * ---\n * Approach: Kadane's Algorithm\n *\n * Maintain a running sum. At each element, decide: extend the current\n * subarray or start fresh from the current element.\n *\n * STATE:      sum = max subarray sum ending at current index\n * TRANSITION: sum = max(sum + nums[i], nums[i])\n * ANSWER:     max of all sum values\n *\n * Time:  O(n)\n * Space: O(1)\n */\npublic class MaxSubarray {\n\n    public static int maxSubArray(int[] nums) {\n        int max = nums[0];  // Global maximum subarray sum\n        int sum = nums[0];  // Current subarray sum ending at position i\n\n        for (int i = 1; i < nums.length; i++) {\n            // Either extend the previous subarray or start a new one at nums[i]\n            sum = Math.max(sum + nums[i], nums[i]);\n            // Update global maximum\n            max = Math.max(sum, max);\n        }\n\n        return max;\n    }\n\n    public static void main(String[] args) {\n        int[] nums = {10, -5, 10};\n        System.out.println(maxSubArray(nums));\n    }\n\n}\n"}, {"name": "MaxSumCircularSubarray", "subcat": "kandane", "link": "", "code": "package leetcode.dp.kandane;\n\n/**\n * 918. Maximum Sum Circular Subarray\n * https://leetcode.com/problems/maximum-sum-circular-subarray/\n *\n * Given a circular integer array nums, find the maximum possible sum of a\n * non-empty subarray. A circular array means the end connects back to the beginning.\n *\n * Example 1: Input: nums = [1,-2,3,-2] -> Output: 3  (subarray [3])\n * Example 2: Input: nums = [5,-3,5]    -> Output: 10 (subarray [5,5] wrapping around)\n * Example 3: Input: nums = [-3,-2,-3]  -> Output: -2 (subarray [-2])\n *\n * Constraints:\n *   n == nums.length\n *   1 <= n <= 3 * 10^4\n *   -3 * 10^4 <= nums[i] <= 3 * 10^4\n *\n * ---\n * Approach: Kadane's (max + min variant)\n *\n * Two cases for the maximum subarray:\n *   Case 1: Max subarray does NOT wrap around -> standard Kadane's max\n *   Case 2: Max subarray WRAPS around -> totalSum - minKadane\n *           (removing the minimum middle subarray leaves the max wrapping part)\n *\n * Edge case: if maxAfterWrap == 0, all elements are negative -> use Case 1.\n *\n * Time:  O(n)\n * Space: O(1)\n */\npublic class MaxSumCircularSubarray {\n\n    // Standard Kadane's: find maximum subarray sum\n    public static int maxKadane(int[] nums) {\n        int sum = nums[0];\n        int maxSum = nums[0];\n\n        for (int i = 1; i < nums.length; i++) {\n            sum = Math.max(sum + nums[i], nums[i]);\n            maxSum = Math.max(maxSum, sum);\n        }\n\n        return maxSum;\n    }\n\n    // Inverted Kadane's: find minimum subarray sum\n    public static int minKadane(int[] nums) {\n        int minSum = nums[0];\n        int sum = nums[0];\n\n        for (int i = 1; i < nums.length; i++) {\n            sum = Math.min(sum + nums[i], nums[i]);\n            minSum = Math.min(minSum, sum);\n        }\n        return minSum;\n    }\n\n    public static int maxSubarraySumCircular(int[] nums) {\n        // Case 1: max subarray is a normal (non-wrapping) subarray\n        int maxKadane = maxKadane(nums);\n\n        // Case 2: max subarray wraps around = totalSum - minSubarray\n        int totalSum = 0;\n        for (int num : nums) {\n            totalSum += num;\n        }\n\n        int maxAfterWrap = totalSum - minKadane(nums);\n\n        // If maxAfterWrap == 0, all elements are negative; wrapping gives empty array\n        // In that case, return the standard Kadane result\n        return (maxAfterWrap == 0) ? maxKadane : Math.max(maxKadane, maxAfterWrap);\n    }\n\n\n    public static void main(String[] args) {\n        int[] nums = {5, -3, 5};\n        System.out.println(maxSubarraySumCircular(nums));\n    }\n\n}\n"}, {"name": "CoinChange", "subcat": "knapsack", "link": "", "code": "package leetcode.dp.knapsack;\n\nimport java.util.Arrays;\n\n/**\n * LeetCode Problem: 322. Coin Change\n * <p>\n * Question:\n * You are given an integer array `coins` representing coins of different denominations and an integer `amount`\n * representing a total amount of money.\n * Return the fewest number of coins that you need to make up that amount. If that amount of money cannot\n * be made up by any combination of the coins, return -1.\n * You may assume that you have an infinite number of each kind of coin.\n * <p>\n * Example 1:\n * Input: coins = [1, 2, 5], amount = 11\n * Output: 3\n * Explanation: 11 = 5 + 5 + 1\n * <p>\n * Example 2:\n * Input: coins = [2], amount = 3\n * Output: -1\n * <p>\n * Constraints:\n * - 1 <= coins.length <= 12\n * - 1 <= coins[i] <= 2^31 - 1\n * - 0 <= amount <= 10^4\n */\npublic class CoinChange {\n\n    public static int helper(int[] coins, int amount, int[] memo) {\n        // Base case: If the amount is negative, this path is impossible.\n        if (amount < 0) return -1;\n        // Base case: If the amount is zero, we've successfully made the change. 0 coins needed.\n        if (amount == 0) return 0;\n\n        if (memo[amount] != -2) return memo[amount];\n\n        // Initialize minCount to -1 (representing \"impossible\" for this amount so far)\n        int minCount = -1;\n\n        for (int coin : coins) {\n            int count = helper(coins, amount - coin, memo);\n\n            if (count >= 0) {\n                int currentTotal = 1 + count;\n\n                if (minCount == -1 || currentTotal < minCount) {\n                    minCount = currentTotal;\n                }\n            }\n        }\n\n        // Store the result (either the min coins or -1) in the memo table and return it.\n        memo[amount] = minCount;\n        return memo[amount];\n    }\n\n\n    public static int recursive(int[] coins, int amount) {\n        // Initialize memo table. We need `amount + 1` size to store 0 to `amount`.\n        int[] memo = new int[amount + 1];\n        // Fill with a sentinel value (-2) to indicate \"not yet computed\".\n        Arrays.fill(memo, -2);\n        return helper(coins, amount, memo);\n    }\n\n\n    /**\n     * Subproblem: dp[i][j] = The fewest coins to make amount j, using only the first i coin types.\n     *\n     * Example: If coins = {1, 2, 5} and amount = 5:\n     * dp[2][5] asks: \"What is the fewest coins to make 5, using only the first two coins {1, 2}?\"\n     * The answer would be 3 (from 1 + 2 + 2).\n     */\n    public static int iterative(int[] coins, int amount) {\n        // dp[i][j] = min coins to make amount `j` using only the first `i` coins.\n        int[][] dp = new int[coins.length + 1][amount + 1];\n\n        // Base case: 0 coins are needed to make an amount of 0.\n        for (int i = 0; i <= coins.length; i++) {\n            dp[i][0] = 0;\n        }\n\n        // Base case: With 0 coins, it's impossible to make any amount > 0.\n        // We use `amount + 1` as a \"infinity\" value, since it's an unreachable number of coins.\n        for (int j = 1; j <= amount; j++) {\n            dp[0][j] = amount + 1;\n        }\n\n        // Fill the DP table\n        for (int i = 1; i <= coins.length; i++) {\n            for (int j = 1; j <= amount; j++) {\n                // `coin` is the current coin we are considering\n                int coin = coins[i - 1];\n\n                if (coin <= j) {\n                    // We have two choices:\n                    // 1. Don't use the current coin: `dp[i - 1][j]`\n                    // 2. Use the current coin: `1 + dp[i][j - coin]` (We use `dp[i]` here, not `dp[i-1]`, because it's an Unbounded Knapsack,\n                    //  meaning we can use the same coin multiple times).\n                    dp[i][j] = Math.min(dp[i - 1][j], 1 + dp[i][j - coin]);\n                } else {\n                    // If the coin is larger than the amount, we can't use it.\n                    // So, the result is the same as not having this coin.\n                    dp[i][j] = dp[i - 1][j];\n                }\n            }\n        }\n\n        // Get the final answer for all coins and the target amount.\n        int result = dp[coins.length][amount];\n        // If the result is still our \"infinity\" value, it's impossible.\n        return result > amount ? -1 : result;\n    }\n\n\n    static void main(String[] args) {\n        int[] coins = {1, 2, 5};\n        int amount = 11;\n        // Testing the most efficient (1D iterative) solution.\n        System.out.println(\"Min coins for amount 11: \" + iterative(coins, amount)); // Expected: 3\n\n        int[] coins2 = {2};\n        int amount2 = 3;\n        System.out.println(\"Min coins for amount 3: \" + iterative(coins2, amount2)); // Expected: -1\n    }\n\n}"}, {"name": "CoinChange_2", "subcat": "knapsack", "link": "", "code": "package leetcode.dp.knapsack;\n\n/**\n * LeetCode Problem: 518. Coin Change 2\n * <p>\n * Question:\n * You are given an integer array `coins` representing coins of different denominations and an integer `amount`\n * representing a total amount of money.\n * Return the number of combinations that make up that amount. If that amount of money cannot be made up by\n * any combination of the coins, return 0.\n * You may assume that you have an infinite number of each kind of coin.\n * <p>\n * Example:\n * Input: amount = 5, coins = [1, 2, 5]\n * Output: 4\n * Explanation: There are four ways to make up the amount:\n * 5 = 5\n * 5 = 2 + 2 + 1\n * 5 = 2 + 1 + 1 + 1\n * 5 = 1 + 1 + 1 + 1 + 1\n * <p>\n * Constraints:\n * - 1 <= coins.length <= 300\n * - 1 <= coins[i] <= 5000\n * - 0 <= amount <= 5000\n */\npublic class CoinChange_2 {\n\n    // The state is: dp[index][amount] = \"Number of ways to make amount using only coins from index onwards.\"\n    private static int helper(int[] coins, int amount, int index, Integer[][] dp) {\n        // Base case: We found a valid combination.\n        if (amount == 0) return 1;\n        // Base case: This path is invalid.\n        if (amount < 0) return 0;\n\n        if (dp[index][amount] != null) return dp[index][amount];\n\n        int count = 0;\n        for (int i = index; i < coins.length; i++) {\n            count =  count + helper(coins, amount - coins[i], i, dp);\n        }\n\n        dp[index][amount] = count;\n        return count;\n    }\n\n\n    public static int recursive(int amount, int[] coins) {\n        Integer[][] memo = new Integer[coins.length][amount + 1];\n        return helper(coins, amount, 0, memo);\n    }\n\n\n    /**\n     * Subproblem: dp[i][j] = The number of combinations to make amount j, using only the first i coin types.\n     *\n     * Example: If coins = {1, 2, 5} and amount = 5:\n     * dp[2][5] asks: \"How many ways are there to make 5, using only {1, 2}?\"\n     * The answer would be 3 (from [1,1,1,1,1], [1,1,1,2], and [1,2,2]).\n     */\n    public static int Iterative(int amount, int[] coins) {\n        // dp[i][j] = number of ways to make amount `j` using the first `i` coins.\n        int[][] dp = new int[coins.length + 1][amount + 1];\n\n        // Base case: There is 1 way to make amount 0 (by using no coins).\n        for (int i = 0; i <= coins.length; i++) {\n            dp[i][0] = 1;\n        }\n\n        // Fill the DP table\n        for (int i = 1; i <= coins.length; i++) {\n            for (int j = 1; j <= amount; j++) {\n                int coin = coins[i - 1];\n\n                // Recurrence Relation:\n                // We add two possibilities:\n                // 1. Ways to make amount `j` WITHOUT using coin `i` (exclude): dp[i - 1][j]\n                // 2. Ways to make amount `j` WITH coin `i` (include):\n                //    This is `dp[i][j - coin]`. We look at the same row `i` because we can use the coin again.\n                if (coin <= j) {\n                    dp[i][j] = dp[i - 1][j] + dp[i][j - coin];\n                } else {\n                    // If the coin is larger than the amount, we can't use it.\n                    dp[i][j] = dp[i - 1][j];\n                }\n            }\n        }\n\n        // The final answer is in the bottom-right corner.\n        return dp[coins.length][amount];\n    }\n\n\n    static void main(String[] args) {\n        int[] coins = {1, 2, 5};\n        int amount = 5;\n        System.out.println(recursive(amount, coins)); // Expected: 4\n    }\n}"}, {"name": "OnesAndZeroes", "subcat": "knapsack", "link": "", "code": "package leetcode.dp.knapsack;\n\n/**\n * 474. Ones and Zeroes\n * https://leetcode.com/problems/ones-and-zeroes/\n *\n * You are given an array of binary strings strs and two integers m and n.\n * Return the size of the largest subset of strs such that there are at most\n * m 0's and n 1's in the subset.\n *\n * A set x is a subset of a set y if all elements of x are also elements of y.\n *\n * Example 1:\n *   Input: strs = [\"10\",\"0001\",\"111001\",\"1\",\"0\"], m = 5, n = 3\n *   Output: 4\n *   Explanation: The largest subset with at most 5 zeroes and 3 ones is\n *   {\"10\", \"0001\", \"1\", \"0\"}, so the answer is 4.\n *   Other valid but smaller subsets: {\"111001\"} has 4 zeros and 2 ones.\n *\n * Example 2:\n *   Input: strs = [\"10\",\"0\",\"1\"], m = 1, n = 1\n *   Output: 2\n *   Explanation: The largest subset is {\"0\",\"1\"} -> 1 zero, 1 one.\n *\n * Constraints:\n *   1 <= strs.length <= 600\n *   1 <= strs[i].length <= 100\n *   strs[i] consists only of digits '0' and '1'.\n *   1 <= m, n <= 100\n *\n * ---\n * Approach: Multi-dimensional 0/1 Knapsack\n *\n * This is a classic 0/1 knapsack with TWO capacity dimensions:\n *   - Capacity of 0's (m) and capacity of 1's (n).\n *   - Each string is an \"item\" with cost (zeros, ones) and value 1.\n *\n * STATE:  dp[i][j] = max subset size using at most i zeros and j ones\n * BASE:   dp[0][0] = 0\n * TRANSITION: For each string with (zeros, ones) count:\n *   dp[i][j] = max(dp[i][j], dp[i - zeros][j - ones] + 1)\n *\n * We iterate strings in outer loop, and iterate dp in reverse (like 0/1 knapsack)\n * to ensure each string is used at most once.\n *\n * Time:  O(L * m * n) where L = strs.length\n * Space: O(m * n)\n */\npublic class OnesAndZeroes {\n\n    // -------------------- Iterative 2D Knapsack --------------------\n    public static int findMaxForm(String[] strs, int m, int n) {\n        // dp[i][j] = max strings we can pick with at most i zeros and j ones\n        int[][] dp = new int[m + 1][n + 1];\n\n        for (String s : strs) {\n            // Count zeros and ones in current string\n            int zeros = 0, ones = 0;\n            for (char c : s.toCharArray()) {\n                if (c == '0') zeros++;\n                else ones++;\n            }\n\n            // Iterate in REVERSE to avoid using the same string twice (0/1 knapsack)\n            for (int i = m; i >= zeros; i--) {\n                for (int j = n; j >= ones; j--) {\n                    // Either skip this string or take it\n                    dp[i][j] = Math.max(dp[i][j], dp[i - zeros][j - ones] + 1);\n                }\n            }\n        }\n\n        return dp[m][n];\n    }\n\n    // -------------------- Recursive + Memoization --------------------\n    public static int findMaxFormRecursive(String[] strs, int m, int n) {\n        int[][][] memo = new int[strs.length][m + 1][n + 1];\n        // Initialize with -1 to distinguish \"not computed\" from 0\n        for (int[][] layer : memo)\n            for (int[] row : layer)\n                java.util.Arrays.fill(row, -1);\n        return solve(strs, m, n, 0, memo);\n    }\n\n    private static int solve(String[] strs, int m, int n, int idx, int[][][] memo) {\n        if (idx == strs.length) return 0;\n        if (memo[idx][m][n] != -1) return memo[idx][m][n];\n\n        // Count zeros and ones\n        int zeros = 0, ones = 0;\n        for (char c : strs[idx].toCharArray()) {\n            if (c == '0') zeros++;\n            else ones++;\n        }\n\n        // Option 1: Skip current string\n        int skip = solve(strs, m, n, idx + 1, memo);\n\n        // Option 2: Take current string (if capacity allows)\n        int take = 0;\n        if (m >= zeros && n >= ones) {\n            take = 1 + solve(strs, m - zeros, n - ones, idx + 1, memo);\n        }\n\n        memo[idx][m][n] = Math.max(skip, take);\n        return memo[idx][m][n];\n    }\n\n    public static void main(String[] args) {\n        String[] strs1 = {\"10\", \"0001\", \"111001\", \"1\", \"0\"};\n        System.out.println(\"Example 1: \" + findMaxForm(strs1, 5, 3));            // 4\n        System.out.println(\"Recursive: \" + findMaxFormRecursive(strs1, 5, 3));   // 4\n\n        String[] strs2 = {\"10\", \"0\", \"1\"};\n        System.out.println(\"Example 2: \" + findMaxForm(strs2, 1, 1));            // 2\n    }\n}\n"}, {"name": "PartitionSubsetSum", "subcat": "knapsack", "link": "", "code": "package leetcode.dp.knapsack;\n\nimport java.util.Arrays;\n\n/**\n * LeetCode Problem: 416. Partition Equal Subset Sum\n *\n * Question:\n * Given a non-empty array `nums` containing only positive integers, find if the array can be partitioned\n * into two subsets such that the sum of elements in both subsets is equal.\n *\n * Example 1:\n * Input: nums = [1, 5, 11, 5]\n * Output: true\n * Explanation: The array can be partitioned as [1, 5, 5] and [11]. Both have a sum of 11.\n *\n * Example 2:\n * Input: nums = [1, 2, 3, 5]\n * Output: false\n * Explanation: The array cannot be partitioned into two subsets with equal sum.\n *\n * Constraints:\n * - 1 <= nums.length <= 200\n * - 1 <= nums[i] <= 100\n */\n@SuppressWarnings(\"all\")\npublic class PartitionSubsetSum {\n\n    public static boolean recursive(int[] nums, int index, int target, Boolean[][] dp) {\n        // Base case: We've reached the target sum exactly.\n        if (target == 0) {\n            return true;\n        }\n\n        // Base cases: We've run out of numbers or overshot the target.\n        if (index > nums.length - 1 || target < 0) {\n            return false;\n        }\n\n        if (dp[index][target] != null) {\n            return dp[index][target];\n        }\n\n        boolean include = recursive(nums, index + 1, target - nums[index], dp);\n        boolean exclude = recursive(nums, index + 1, target, dp);\n\n        dp[index][target] = include || exclude;\n\n        return dp[index][target];\n    }\n\n    /**\n     * Subproblem: dp[i][j] = True if sum j can be formed using a subset of the first i numbers.\n     *\n     * Example: If nums = {1, 5, 11, 5} and target = 11:\n     * dp[2][6] asks: \"Can we make a sum of 6, using a subset of the first two numbers {1, 5}?\"\n     * The answer would be true (from {1, 5}).\n     *\n     * dp[2][7] asks: \"Can we make a sum of 7, using a subset of {1, 5}?\"\n     * The answer would be false.\n     */\n    public static boolean iterative(int[] nums, int targetSum) {\n        // dp[i][j] = can we make a sum of `j` using only the first `i` numbers?\n        boolean[][] dp = new boolean[nums.length + 1][targetSum + 1];\n\n        // Base case: We can always make a sum of 0 (by taking no elements).\n        for (int i = 0; i <= nums.length; i++) {\n            dp[i][0] = true;\n        }\n\n        for (int i = 1; i <= nums.length; i++) {\n            int currentNum = nums[i - 1]; // The current number we are considering\n            for (int j = 1; j <= targetSum; j++) {\n\n                if (currentNum <= j) {\n                    // We have two choices:\n                    // 1. Exclude the current number: dp[i - 1][j] (result using numbers before this one)\n                    // 2. Include the current number: dp[i - 1][j - currentNum] (result for the remaining sum)\n                    dp[i][j] = dp[i - 1][j] || dp[i - 1][j - currentNum];\n                } else {\n                    // If the number is larger than the target `j`, we can't include it.\n                    // So, the result is the same as not having this number.\n                    dp[i][j] = dp[i - 1][j];\n                }\n            }\n        }\n        // The final answer is whether we can make the `targetSum` using all `nums.length` numbers.\n        return dp[nums.length][targetSum];\n    }\n\n\n    public static boolean canPartition(int[] nums) {\n        int totalSum = 0;\n        for (int val : nums) {\n            totalSum += val;\n        }\n\n        // If the total sum is odd, it's impossible to split into two equal halves.\n        if (totalSum % 2 != 0) return false;\n\n        // The target sum for our subset is half of the total.\n        int targetSum = totalSum / 2;\n\n        // Setup for recursive solution\n        Boolean dp[][] = new Boolean[nums.length][targetSum + 1];\n\n        // Call any of the implementations. The iterative one is shown here.\n        return iterative(nums, targetSum);\n        // return recursive(nums, 0, targetSum, dp);\n        // return iterativeOptimized(nums, targetSum);\n    }\n\n    public static void main(String[] args) {\n        int[] nums = {1, 5, 11, 5};\n        System.out.println(canPartition(nums)); // Expected: true\n    }\n}"}, {"name": "TargetSum", "subcat": "knapsack", "link": "", "code": "package leetcode.dp.knapsack;\n\nimport java.util.Arrays;\n\n/**\n * 494. Target Sum\n * https://leetcode.com/problems/target-sum/\n *\n * You are given an integer array nums and an integer target. You want to build\n * an expression out of nums by adding one of the symbols '+' or '-' before each\n * integer in nums and then concatenate all the integers.\n *\n * Return the number of different expressions that evaluate to target.\n *\n * Example 1: Input: nums = [1,1,1,1,1], target = 3 -> Output: 5\n *   Explanation: -1 + 1 + 1 + 1 + 1 = 3 (5 ways to pick which one is negative)\n *\n * Example 2: Input: nums = [1], target = 1 -> Output: 1\n *\n * Constraints:\n *   1 <= nums.length <= 20\n *   0 <= nums[i] <= 1000\n *   0 <= sum(nums[i]) <= 1000\n *   -1000 <= target <= 1000\n *\n * ---\n * Approach: 0/1 Knapsack (Subset Sum reduction)\n *\n * Key insight: Partition nums into two subsets P (positive) and N (negative).\n *   P - N = target\n *   P + N = totalSum\n *   => P = (target + totalSum) / 2\n *\n * So the problem reduces to: count subsets of nums that sum to P.\n * This is a classic 0/1 knapsack / subset sum count problem.\n *\n * Edge cases:\n *   - If (target + totalSum) is odd, no valid partition exists \u2192 return 0.\n *   - If |target| > totalSum, impossible \u2192 return 0.\n *\n * Time:  O(n * P)\n * Space: O(P) with 1D optimization\n */\npublic class TargetSum {\n\n    /**\n     * Top-down recursive with memoization (the direct +/- approach).\n     *\n     * dp(index, currentSum) = number of ways to reach target from index onward.\n     */\n    public static int recursive(int[] nums, int target) {\n        // Offset currentSum by 1000 to handle negative indices (sum range: -1000 to 1000)\n        int offset = Arrays.stream(nums).sum();\n        Integer[][] memo = new Integer[nums.length][2 * offset + 1];\n        return helper(nums, target, 0, 0, offset, memo);\n    }\n\n    private static int helper(int[] nums, int target, int index, int currentSum, int offset, Integer[][] memo) {\n        // All numbers used: check if we hit the target\n        if (index == nums.length) {\n            return currentSum == target ? 1 : 0;\n        }\n\n        if (memo[index][currentSum + offset] != null) {\n            return memo[index][currentSum + offset];\n        }\n\n        // Two choices: add or subtract the current number\n        int add = helper(nums, target, index + 1, currentSum + nums[index], offset, memo);\n        int sub = helper(nums, target, index + 1, currentSum - nums[index], offset, memo);\n\n        memo[index][currentSum + offset] = add + sub;\n        return add + sub;\n    }\n\n    /**\n     * Bottom-up 0/1 Knapsack (Subset Sum Count)\n     *\n     * Subproblem: dp[j] = number of subsets that sum to j\n     *\n     * Example trace: nums = [1,1,1,1,1], target = 3\n     *   totalSum = 5, P = (3+5)/2 = 4\n     *   Count subsets summing to 4:\n     *\n     *   dp after init:  [1, 0, 0, 0, 0]\n     *   after num=1:    [1, 1, 0, 0, 0]\n     *   after num=1:    [1, 2, 1, 0, 0]\n     *   after num=1:    [1, 3, 3, 1, 0]\n     *   after num=1:    [1, 4, 6, 4, 1]\n     *   after num=1:    [1, 5,10,10, 5]  \u2192 dp[4] = 5  \u2713\n     */\n    public static int iterative(int[] nums, int target) {\n        int totalSum = 0;\n        for (int num : nums) totalSum += num;\n\n        // Edge cases: impossible to partition\n        if (Math.abs(target) > totalSum) return 0;\n        if ((target + totalSum) % 2 != 0) return 0;\n\n        int subsetSum = (target + totalSum) / 2;\n\n        // 1D DP: dp[j] = number of subsets summing to j\n        int[] dp = new int[subsetSum + 1];\n        dp[0] = 1; // Base: empty subset sums to 0\n\n        for (int num : nums) {\n            // Traverse RIGHT to LEFT to avoid using the same element twice (0/1 knapsack)\n            for (int j = subsetSum; j >= num; j--) {\n                dp[j] += dp[j - num]; // Include num: ways to make (j - num) carry over\n            }\n        }\n\n        return dp[subsetSum];\n    }\n\n    /**\n     * 2D Knapsack (for clarity, same logic as iterative but unoptimized)\n     *\n     * dp[i][j] = number of subsets using first i numbers that sum to j\n     *\n     * Transition:\n     *   dp[i][j] = dp[i-1][j]                    (exclude nums[i-1])\n     *            + dp[i-1][j - nums[i-1]]         (include nums[i-1], if j >= nums[i-1])\n     */\n    public static int iterative2D(int[] nums, int target) {\n        int totalSum = 0;\n        for (int num : nums) totalSum += num;\n\n        if (Math.abs(target) > totalSum) return 0;\n        if ((target + totalSum) % 2 != 0) return 0;\n\n        int subsetSum = (target + totalSum) / 2;\n        int n = nums.length;\n\n        int[][] dp = new int[n + 1][subsetSum + 1];\n        dp[0][0] = 1;\n\n        for (int i = 1; i <= n; i++) {\n            int num = nums[i - 1];\n            for (int j = 0; j <= subsetSum; j++) {\n                // Exclude current number\n                dp[i][j] = dp[i - 1][j];\n                // Include current number (if it fits)\n                if (j >= num) {\n                    dp[i][j] += dp[i - 1][j - num];\n                }\n            }\n        }\n\n        return dp[n][subsetSum];\n    }\n\n    public static int findTargetSumWays(int[] nums, int target) {\n        return iterative(nums, target);\n    }\n\n    public static void main(String[] args) {\n        int[] nums1 = {1, 1, 1, 1, 1};\n        System.out.println(\"Recursive:  \" + recursive(nums1, 3));    // 5\n        System.out.println(\"Iterative:  \" + iterative(nums1, 3));    // 5\n        System.out.println(\"2D:         \" + iterative2D(nums1, 3));  // 5\n\n        int[] nums2 = {1};\n        System.out.println(\"Recursive:  \" + recursive(nums2, 1));    // 1\n        System.out.println(\"Iterative:  \" + iterative(nums2, 1));    // 1\n    }\n}\n"}, {"name": "ClimbingStairs", "subcat": "linear", "link": "", "code": "package leetcode.dp.linear;\n\n/**\n * LeetCode Problem: 70. Climbing Stairs\n * <p>\n * Question:\n * You are climbing a staircase. It takes n steps to reach the top.\n * Each time you can either climb 1 or 2 steps. In how many distinct ways can you climb to the top?\n *\n * <p>\n * Example:\n * Input: n = 3\n * Output: 3\n * Explanation: There are three ways to climb to the top.\n * 1. 1 step + 1 step + 1 step\n * 2. 1 step + 2 steps\n * 3. 2 steps + 1 step\n *\n * <p>\n * Constraints:\n * - 1 <= n <= 45\n */\npublic class ClimbingStairs {\n\n\n    public static int iterative(int n) {\n        // Base Cases: If there are 1 or 2 stairs, the number of ways is simply n.\n        if (n <= 2) {\n            return n;\n        }\n\n        // dp[i] will store the number of ways to reach stair 'i'.\n        int[] dp = new int[n + 1];\n\n        // Initialize the base cases for the DP table.\n        // There is 1 way to reach the 1st stair.\n        dp[1] = 1;\n        // There are 2 ways to reach the 2nd stair (1+1 or 2).\n        dp[2] = 2;\n\n        // Fill the DP table from the 3rd stair up to the n-th stair.\n        for (int i = 3; i <= n; i++) {\n            // The number of ways to reach stair 'i' is the sum of the ways to reach\n            // stair 'i-1' (and taking one step) and the ways to reach stair 'i-2'\n            // (and taking two steps). This is the core recurrence relation.\n            dp[i] = dp[i - 1] + dp[i - 2];\n        }\n\n        // The final answer is the number of ways to reach the n-th stair.\n        return dp[n];\n    }\n\n\n    public static int recursive(int n, int[] dp) {\n        // Base Cases: If there are 1 or 2 stairs, the number of ways is n.\n        if (n <= 2) {\n            return n;\n        }\n\n        // Memoization Check: If we have already computed the result for stair 'n',\n        // return the stored value instead of re-calculating.\n        if (dp[n] != 0) {\n            return dp[n];\n        }\n\n        // Recursive Step: If the result is not in our memoization table, calculate it by\n        // breaking it down into smaller subproblems.\n        // The logic is the same: ways(n) = ways(n-1) + ways(n-2).\n        dp[n] = recursive(n - 1, dp) + recursive(n - 2, dp);\n\n        // Store and return the computed result.\n        return dp[n];\n    }\n\n\n    /**\n     * This is the main wrapper function that sets up the environment for the recursive solution.\n     *\n     * @param n The total number of stairs.\n     * @return The number of distinct ways to climb to the top.\n     */\n    public static int climbStairs(int n) {\n        // Create a memoization array (dp table) of size n+1.\n        // It's initialized to all zeros by default in Java.\n        int[] dp = new int[n + 1];\n        // Call the recursive helper function to start the computation.\n        return recursive(n, dp);\n    }\n\n\n    /**\n     * The main method to test the implemented solutions.\n     */\n    static void main(String[] args) {\n        // The climbStairs method is called, which in turn uses the recursive approach.\n        // You could also call the iterative method directly for comparison.\n        System.out.println(\"Ways to climb 2 stairs: \" + climbStairs(2)); // Expected: 2\n        System.out.println(\"Ways to climb 3 stairs: \" + climbStairs(3)); // Expected: 3\n        System.out.println(\"Ways to climb 4 stairs: \" + climbStairs(4)); // Expected: 5\n        System.out.println(\"Ways to climb 5 stairs: \" + climbStairs(5)); // Expected: 8\n    }\n}"}, {"name": "DecodeWays", "subcat": "linear", "link": "", "code": "package leetcode.dp.linear;\n\n/**\n * 91. Decode Ways\n * https://leetcode.com/problems/decode-ways/\n *\n * A message containing letters from A-Z can be encoded into numbers using\n * the mapping: 'A' -> \"1\", 'B' -> \"2\", ..., 'Z' -> \"26\".\n *\n * Given a string s containing only digits, return the number of ways to decode it.\n *\n * Example 1: Input: s = \"12\" -> Output: 2\n *   Explanation: \"12\" could be decoded as \"AB\" (1 2) or \"L\" (12).\n *\n * Example 2: Input: s = \"226\" -> Output: 3\n *   Explanation: \"226\" could be \"BZ\" (2 26), \"VF\" (22 6), or \"BBF\" (2 2 6).\n *\n * Example 3: Input: s = \"06\" -> Output: 0\n *   Explanation: \"06\" cannot be mapped (leading zero is invalid).\n *\n * Constraints:\n *   1 <= s.length <= 100\n *   s contains only digits and may contain leading zeros.\n *\n * ---\n * Approach: Linear DP (similar to Climbing Stairs with constraints)\n *\n * STATE:      dp[i] = number of ways to decode s[0..i-1]\n * BASE:       dp[0] = 1 (empty prefix = 1 way)\n * TRANSITION:\n *   If s[i-1] != '0': dp[i] += dp[i-1]        (single digit decode)\n *   If s[i-2..i-1] forms 10-26: dp[i] += dp[i-2] (two digit decode)\n * ANSWER:     dp[n]\n *\n * Trace: s = \"226\"\n *\n *   dp[0] = 1   (base: empty string)\n *   dp[1] = 1   s[0]='2' \u2260 '0' \u2192 dp[0]=1\n *   dp[2] = 2   s[1]='2' \u2260 '0' \u2192 dp[1]=1; \"22\" in [10,26] \u2192 dp[0]=1; total=2\n *   dp[3] = 3   s[2]='6' \u2260 '0' \u2192 dp[2]=2; \"26\" in [10,26] \u2192 dp[1]=1; total=3\n *\n * Time:  O(n)\n * Space: O(n), can optimize to O(1) with two variables\n */\npublic class DecodeWays {\n\n    /**\n     * Bottom-up iterative DP\n     */\n    public static int iterative(String s) {\n        if (s == null || s.isEmpty() || s.charAt(0) == '0') return 0;\n\n        int n = s.length();\n        int[] dp = new int[n + 1];\n\n        // Base cases\n        dp[0] = 1; // Empty prefix: one way (do nothing)\n        dp[1] = 1; // First character is non-zero (checked above)\n\n        for (int i = 2; i <= n; i++) {\n            // Single digit decode: s[i-1] must not be '0'\n            if (s.charAt(i - 1) != '0') {\n                dp[i] += dp[i - 1];\n            }\n\n            // Two digit decode: s[i-2..i-1] must be between 10 and 26\n            int twoDigit = Integer.parseInt(s.substring(i - 2, i));\n            if (twoDigit >= 10 && twoDigit <= 26) {\n                dp[i] += dp[i - 2];\n            }\n        }\n\n        return dp[n];\n    }\n\n    /**\n     * Space-optimized O(1) \u2014 only need prev two values\n     */\n    public static int iterativeOptimized(String s) {\n        if (s == null || s.isEmpty() || s.charAt(0) == '0') return 0;\n\n        int prevPrev = 1; // dp[i-2]\n        int prev = 1;     // dp[i-1]\n\n        for (int i = 2; i <= s.length(); i++) {\n            int curr = 0;\n\n            // Single digit\n            if (s.charAt(i - 1) != '0') {\n                curr += prev;\n            }\n\n            // Two digit\n            int twoDigit = Integer.parseInt(s.substring(i - 2, i));\n            if (twoDigit >= 10 && twoDigit <= 26) {\n                curr += prevPrev;\n            }\n\n            prevPrev = prev;\n            prev = curr;\n        }\n\n        return prev;\n    }\n\n    /**\n     * Top-down recursive with memoization\n     */\n    public static int recursive(String s) {\n        Integer[] memo = new Integer[s.length()];\n        return helper(s, 0, memo);\n    }\n\n    private static int helper(String s, int index, Integer[] memo) {\n        // Reached the end: one valid decoding found\n        if (index == s.length()) return 1;\n\n        // Leading zero: invalid\n        if (s.charAt(index) == '0') return 0;\n\n        if (memo[index] != null) return memo[index];\n\n        // Take one digit\n        int ways = helper(s, index + 1, memo);\n\n        // Take two digits (if valid)\n        if (index + 1 < s.length()) {\n            int twoDigit = Integer.parseInt(s.substring(index, index + 2));\n            if (twoDigit <= 26) {\n                ways += helper(s, index + 2, memo);\n            }\n        }\n\n        memo[index] = ways;\n        return ways;\n    }\n\n    public static int numDecodings(String s) {\n        return iterative(s);\n    }\n\n    public static void main(String[] args) {\n        System.out.println(\"\\\"12\\\":  \" + numDecodings(\"12\"));   // 2\n        System.out.println(\"\\\"226\\\": \" + numDecodings(\"226\"));  // 3\n        System.out.println(\"\\\"06\\\":  \" + numDecodings(\"06\"));   // 0\n        System.out.println(\"\\\"11106\\\": \" + numDecodings(\"11106\")); // 2\n\n        System.out.println(\"--- Recursive ---\");\n        System.out.println(\"\\\"226\\\": \" + recursive(\"226\"));     // 3\n\n        System.out.println(\"--- Optimized ---\");\n        System.out.println(\"\\\"226\\\": \" + iterativeOptimized(\"226\")); // 3\n    }\n}\n"}, {"name": "HouseRobber", "subcat": "linear", "link": "", "code": "package leetcode.dp.linear;\n\n/**\n * LeetCode Problem: 198. House Robber\n * <p>\n * Question:\n * You are a professional robber planning to rob houses along a street. Each house has a certain amount of money stashed.\n * The only constraint stopping you from robbing each of them is that adjacent houses have security systems connected,\n * and it will automatically contact the police if two adjacent houses were broken into on the same night.\n * <p>\n * Given an integer array `nums` representing the amount of money of each house, return the maximum amount of money\n * you can rob tonight without alerting the police.\n * <p>\n * Example 1:\n * Input: nums = [1, 2, 3, 1]\n * Output: 4\n * Explanation: Rob house 1 (money = 1) and then rob house 3 (money = 3). Total amount you can rob = 1 + 3 = 4.\n * <p>\n * Constraints:\n * - 1 <= nums.length <= 100\n * - 0 <= nums[i] <= 400\n */\npublic class HouseRobber {\n\n    /**\n     * Solves the problem using a recursive, top-down DP approach with memoization.\n     *\n     * @param nums The array of money in each house.\n     * @param i    The index of the current house being considered (from the end).\n     * @param memo The memoization array to store results of subproblems.\n     * @return The maximum amount of money that can be robbed up to house `i`.\n     */\n    public static int recursive(int[] nums, int i, int[] memo) {\n        // Base case: If we are out of bounds (no more houses), the profit is 0.\n        if (i < 0) {\n            return 0;\n        }\n\n        // Memoization check: If we've already calculated the max profit for robbing up to house `i`, return it.\n        if (memo[i] != -1) {\n            return memo[i];\n        }\n\n        // --- The Core Choice ---\n        // At house `i`, we have two options:\n        // 1. Rob this house: The profit is nums[i] + the max profit from robbing houses up to `i-2` (since we can't rob `i-1`).\n        // 2. Don't rob this house: The profit is the max profit from robbing houses up to `i-1`.\n\n        // We choose the option that gives us the maximum profit.\n        int robThisHouse = nums[i] + recursive(nums, i - 2, memo);\n        int skipThisHouse = recursive(nums, i - 1, memo);\n\n        // Store the result in our memoization table before returning.\n        memo[i] = Math.max(robThisHouse, skipThisHouse);\n        return memo[i];\n    }\n\n\n    /**\n     * Solves the problem using an iterative, bottom-up DP approach.\n     *\n     * @param nums The array of money in each house.\n     * @return The maximum amount of money that can be robbed.\n     */\n    public static int iterative(int[] nums) {\n        if (nums.length == 0) return 0;\n        if (nums.length == 1) return nums[0];\n\n        // dp[i] will store the maximum money that can be robbed from the first `i` houses.\n        // We use n+1 size for easier indexing, where dp[0] is a dummy base case.\n        int n = nums.length + 1;\n        int[] dp = new int[n];\n\n        // Base Cases:\n        // dp[0] = 0: Max money from 0 houses is 0.\n        // dp[1] = nums[0]: Max money from the first house is just its own value.\n        dp[0] = 0;\n        dp[1] = nums[0];\n\n        // Build the solution from the second house onwards.\n        // Note: i corresponds to the house at nums[i-1].\n        for (int i = 2; i < n; i++) {\n            // --- The Core Choice (Recurrence Relation) ---\n            // The logic is the same as the recursive approach. To find the max profit for the first `i` houses (dp[i]):\n            // 1. Rob house `i-1`: Profit = nums[i-1] + max profit from the first `i-2` houses (dp[i-2]).\n            // 2. Don't rob house `i-1`: Profit = max profit from the first `i-1` houses (dp[i-1]).\n            dp[i] = Math.max(nums[i - 1] + dp[i - 2], dp[i - 1]);\n        }\n\n        // The final answer is the max profit considering all houses (up to n-1).\n        return dp[n - 1];\n    }\n\n\n    static void main(String[] args) {\n        int[] nums = {1, 2, 3, 1};\n        System.out.println(\"Max profit for [1, 2, 3, 1]: \" + iterative(nums)); // Expected: 4\n\n        int[] nums2 = {2, 7, 9, 3, 1};\n        System.out.println(\"Max profit for [2, 7, 9, 3, 1]: \" + iterative(nums2)); // Expected: 12\n    }\n}"}, {"name": "HouseRobber_2", "subcat": "linear", "link": "", "code": "package leetcode.dp.linear;\n\n/**\n * LeetCode Problem: 213. House Robber II\n * <p>\n * Question:\n * You are a professional robber planning to rob houses along a street. All houses at this place are arranged in a circle.\n * That means the first house is the neighbor of the last one. Otherwise, the robbing rules are the same as House Robber I:\n * if two adjacent houses are broken into on the same night, the police will be contacted.\n * <p>\n * Given an integer array `nums` representing the amount of money of each house, return the maximum amount of money\n * you can rob tonight without alerting the police.\n * <p>\n * Example 1:\n * Input: nums = [2, 3, 2]\n * Output: 3\n * Explanation: You cannot rob house 1 (money = 2) and then rob house 3 (money = 2), because they are adjacent.\n * The best you can do is rob house 2 (money = 3).\n * <p>\n * Constraints:\n * - 1 <= nums.length <= 100\n * - 0 <= nums[i] <= 1000\n */\npublic class HouseRobber_2 {\n\n    /**\n     * This is a helper function that solves the original House Robber I problem for a linear array.\n     * It calculates the maximum amount of money that can be robbed from a given list of houses\n     * without robbing adjacent ones.\n     *\n     * @param nums A linear array of houses.\n     * @return The maximum loot possible from this linear arrangement.\n     */\n    public static int helper(int[] nums) {\n        // dp[i] will store the maximum money that can be robbed from the first `i` houses.\n        int n = nums.length + 1;\n        int[] dp = new int[n];\n\n        // Base Cases\n        dp[0] = 0;        // Max money from 0 houses is 0.\n        dp[1] = nums[0];  // Max money from the first house is its own value.\n\n        // Build the solution from the second house onwards.\n        for (int i = 2; i < n; i++) {\n            // Recurrence Relation: The max profit for the first `i` houses is the greater of:\n            // 1. Robbing the current house (nums[i-1]) + the max profit from non-adjacent previous houses (dp[i-2]).\n            // 2. Not robbing the current house, which means taking the max profit from the previous set of houses (dp[i-1]).\n            dp[i] = Math.max(nums[i - 1] + dp[i - 2], dp[i - 1]);\n        }\n\n        return dp[n - 1];\n    }\n\n    /**\n     * Solves the House Robber II problem.\n     * The core idea is to break the circular dependency by solving two separate linear subproblems.\n     *\n     * @param nums The circular array of money in each house.\n     * @return The maximum amount of money that can be robbed.\n     */\n    public static int rob(int[] nums) {\n\n        // Base case: No houses to rob.\n        if (nums.length == 0) {\n            return 0;\n        }\n\n        // Base case: Only one house, so rob it.\n        if (nums.length == 1) {\n            return nums[0];\n        }\n\n        // --- The Core Logic for Circular Array ---\n        // Since the first and last houses are adjacent, you cannot rob both.\n        // This means any optimal solution will either:\n        // 1. Include the first house but NOT the last house.\n        // 2. Include the last house but NOT the first house.\n        // We can solve this by running the standard House Robber algorithm on two linear subarrays:\n        //   - Subproblem 1: All houses EXCEPT the last one (index 0 to n-2).\n        //   - Subproblem 2: All houses EXCEPT the first one (index 1 to n-1).\n        // The final answer is the maximum of these two results.\n\n        // This implementation simulates the two subproblems by temporarily modifying the input array.\n        // A cleaner approach might use Arrays.copyOfRange to create new subarrays.\n\n        // --- Subproblem 1: Calculate max loot WITHOUT the first house ---\n        int val0 = nums[0]; // Store the original value of the first house\n        nums[0] = 0;        // Temporarily set it to 0 to effectively \"skip\" it.\n        int max1 = helper(nums); // Run the linear robber algorithm.\n        nums[0] = val0;     // Reset the array to its original state.\n\n        // --- Subproblem 2: Calculate max loot WITHOUT the last house ---\n        nums[nums.length - 1] = 0; // Temporarily set the last house to 0 to \"skip\" it.\n        int max2 = helper(nums);    // Run the linear robber algorithm again.\n\n        // The overall maximum is the best result from the two scenarios.\n        return Math.max(max1, max2);\n    }\n\n\n    static void main(String[] args) {\n        int[] nums = {2, 3, 2};\n        System.out.println(\"Max profit for [2, 3, 2]: \" + rob(nums)); // Expected: 3\n\n        int[] nums2 = {1, 2, 3, 1};\n        System.out.println(\"Max profit for [1, 2, 3, 1]: \" + rob(nums2)); // Expected: 4\n    }\n}"}, {"name": "MinCostClimbingStairs", "subcat": "linear", "link": "", "code": "package leetcode.dp.linear;\n\n/**\n * LeetCode Problem: 746. Min Cost Climbing Stairs\n * <p>\n * Question:\n * You are given an integer array `cost` where `cost[i]` is the cost of the `i`-th step on a staircase.\n * Once you pay the cost, you can either climb one or two steps.\n * You can either start from the step with index 0, or the step with index 1.\n * Return the minimum cost to reach the top of the floor. The top of the floor is considered one step past the last index.\n * <p>\n * Example 1:\n * Input: cost = [10, 15, 20]\n * Output: 15\n * Explanation: You will start at index 1. Pay 15 and climb two steps to reach the top. The total cost is 15.\n * <p>\n * Example 2:\n * Input: cost = [1, 100, 1, 1, 1, 100, 1, 1, 100, 1]\n * Output: 6\n * Explanation: You will start at index 0. Pay 1, climb two steps to index 2. Pay 1, climb two steps to index 4. Pay 1, climb two steps to index 6. Pay 1, climb one step to index 7. Pay 1, climb two steps to index 9. Pay 1, climb one step to reach the top. The total cost is 6.\n * <p>\n * Constraints:\n * - 2 <= cost.length <= 1000\n * - 0 <= cost[i] <= 999\n */\npublic class MinCostClimbingStairs {\n\n    public static int recursive(int[] cost, int[] dp, int n) {\n        // Base case: If we are out of bounds, the cost is 0.\n        if (n < 0) return 0;\n\n        // Base cases: For the first two stairs (0 and 1), the cost to reach them is just their own cost.\n        if (n < 2) return cost[n];\n\n        // Memoization check: If we have already calculated the min cost for stair 'n', return it.\n        if (dp[n] != 0) return dp[n];\n\n        // Recursive Step (Recurrence Relation):\n        // The minimum cost to reach stair 'n' is its own cost plus the minimum of the costs\n        // to reach the previous two stairs (n-1 or n-2).\n        dp[n] = cost[n] + Math.min(recursive(cost, dp, n - 1), recursive(cost, dp, n - 2));\n\n        return dp[n];\n    }\n\n    public static int iterative(int[] cost, int[] dp, int n) {\n        // Iterate through each stair to calculate the minimum cost to reach it.\n        for (int i = 0; i < n; i++) {\n            if (i < 2) {\n                // For the first two stairs, the min cost is just their own cost,\n                // as we can start from either of them.\n                dp[i] = cost[i];\n            } else if(i == 2){\n                // Recurrence Relation: The min cost to reach stair 'i' is its own cost\n                // plus the minimum of the costs to reach the previous two stairs.\n                dp[i] = cost[i] + Math.min(dp[i - 1], dp[i - 2]);\n            }else{\n\n                dp[i] = cost[i] + dp[i - 1];\n            }\n        }\n\n        // The \"top\" of the floor is past the last step. To get there, we could have\n        // come from the last step (n-1) or the second-to-last step (n-2).\n        // We return the minimum of these two paths.\n        return Math.min(dp[n - 1], dp[n - 2]);\n    }\n\n\n    public static int minCostClimbingStairs(int[] cost) {\n        int n = cost.length;\n        // The dp array will store the minimum cost to reach step 'i'.\n        int[] dp = new int[n];\n\n        // Call the iterative (bottom-up) solution.\n        return iterative(cost, dp, n);\n        // return Math.min(recursive(cost, dp, n - 1), recursive(cost, dp, n - 2));\n    }\n\n\n    static void main(String[] args) {\n        int[] cost1 = {10, 15, 20};\n        System.out.println(\"Min cost for [10, 15, 20]: \" + minCostClimbingStairs(cost1)); // Expected: 15\n\n        int[] cost2 = {1, 100, 1, 1, 1, 100, 1, 1, 100, 1};\n        System.out.println(\"Min cost for the long array: \" + minCostClimbingStairs(cost2)); // Expected: 6\n    }\n}"}, {"name": "PerfectSquares", "subcat": "linear", "link": "", "code": "package leetcode.dp.linear;\n\n/**\n * 279. Perfect Squares\n * https://leetcode.com/problems/perfect-squares/\n *\n * Given an integer n, return the least number of perfect square numbers that\n * sum to n.\n *\n * A perfect square is an integer that is the square of an integer; in other\n * words, it is the product of some integer with itself. For example, 1, 4, 9,\n * and 16 are perfect squares while 3 and 11 are not.\n *\n * Example 1: Input: n = 12 -> Output: 3  (12 = 4 + 4 + 4)\n * Example 2: Input: n = 13 -> Output: 2  (13 = 4 + 9)\n *\n * Constraints: 1 <= n <= 10^4\n *\n * ---\n * Approach: Unbounded Knapsack / BFS\n *\n * Think of it as: we have \"coins\" of values 1, 4, 9, 16, 25, ...\n * and we want the minimum number of coins to make amount n.\n * This is exactly the Coin Change problem (LC 322) with square numbers as coins.\n *\n * STATE:  dp[i] = minimum number of perfect squares that sum to i\n * BASE:   dp[0] = 0\n * TRANSITION:\n *   dp[i] = min(dp[i - j*j] + 1) for all j where j*j <= i\n *\n * Trace: n = 12\n *   dp[0]  = 0\n *   dp[1]  = dp[0]+1 = 1            (1)\n *   dp[2]  = dp[1]+1 = 2            (1+1)\n *   dp[3]  = dp[2]+1 = 3            (1+1+1)\n *   dp[4]  = min(dp[3]+1, dp[0]+1) = 1   (4)\n *   dp[5]  = min(dp[4]+1, dp[1]+1) = 2   (4+1)\n *   dp[6]  = min(dp[5]+1, dp[2]+1) = 3   (4+1+1)\n *   dp[7]  = min(dp[6]+1, dp[3]+1) = 4   (4+1+1+1)\n *   dp[8]  = min(dp[7]+1, dp[4]+1) = 2   (4+4)\n *   dp[9]  = min(dp[8]+1, dp[5]+1, dp[0]+1) = 1   (9)\n *   dp[10] = min(dp[9]+1, dp[6]+1, dp[1]+1) = 2   (9+1)\n *   dp[11] = min(dp[10]+1, dp[7]+1, dp[2]+1) = 3  (9+1+1)\n *   dp[12] = min(dp[11]+1, dp[8]+1, dp[3]+1) = 3  (4+4+4)  \u2713\n *\n * Time:  O(n * sqrt(n))\n * Space: O(n)\n */\npublic class PerfectSquares {\n\n    // -------------------- Iterative DP (Unbounded Knapsack) --------------------\n    public static int numSquares(int n) {\n        int[] dp = new int[n + 1];\n        java.util.Arrays.fill(dp, Integer.MAX_VALUE);\n        dp[0] = 0;\n\n        for (int i = 1; i <= n; i++) {\n            // Try every perfect square j*j that fits\n            for (int j = 1; j * j <= i; j++) {\n                dp[i] = Math.min(dp[i], dp[i - j * j] + 1);\n            }\n        }\n\n        return dp[n];\n    }\n\n    // -------------------- BFS (Level-order shortest path) --------------------\n    /**\n     * BFS treats the problem as a shortest path in an unweighted graph:\n     *   - Node 0 is the start, node n is the target.\n     *   - From node v, edges go to v + j*j for all valid j.\n     *   - BFS level = number of perfect squares used.\n     */\n    public static int numSquaresBFS(int n) {\n        boolean[] visited = new boolean[n + 1];\n        java.util.Queue<Integer> queue = new java.util.LinkedList<>();\n        queue.offer(0);\n        visited[0] = true;\n        int level = 0;\n\n        while (!queue.isEmpty()) {\n            level++;\n            int size = queue.size();\n            for (int k = 0; k < size; k++) {\n                int curr = queue.poll();\n                // Try adding each perfect square\n                for (int j = 1; curr + j * j <= n; j++) {\n                    int next = curr + j * j;\n                    if (next == n) return level;\n                    if (!visited[next]) {\n                        visited[next] = true;\n                        queue.offer(next);\n                    }\n                }\n            }\n        }\n\n        return level; // Should not reach here for valid input\n    }\n\n    public static void main(String[] args) {\n        System.out.println(\"DP  - n=12: \" + numSquares(12));       // 3\n        System.out.println(\"BFS - n=12: \" + numSquaresBFS(12));    // 3\n        System.out.println(\"DP  - n=13: \" + numSquares(13));       // 2\n        System.out.println(\"BFS - n=13: \" + numSquaresBFS(13));    // 2\n    }\n}\n"}, {"name": "LIS", "subcat": "lis", "link": "", "code": "package leetcode.dp.lis;\n\n\nimport java.util.Arrays;\n\n/**\n * LeetCode Problem: 300. Longest Increasing Subsequence\n *\n * Question:\n * Given an integer array `nums`, return the length of the longest strictly increasing subsequence.\n * A subsequence is a sequence that can be derived from an array by deleting some or no elements without changing the order of the remaining elements.\n *\n * Example 1:\n * Input: nums = [10, 9, 2, 5, 3, 7, 101, 18]\n * Output: 4\n * Explanation: The longest increasing subsequence is [2, 3, 7, 101], therefore the length is 4.\n *\n * Constraints:\n * - 1 <= nums.length <= 2500\n * - -10^4 <= nums[i] <= 10^4\n */\npublic class LIS {\n\n    // Subproblem: dp[i] = The length of the longest increasing subsequence that *ends* at index `i`.\n    public static int iterative(int[] nums) {\n        int n = nums.length;\n        if (n == 0) return 0;\n\n        int[] dp = new int[n];\n        // Base case: Every element by itself is an increasing subsequence of length 1.\n        Arrays.fill(dp, 1);\n\n        int maxLIS = 1;\n\n        // Build the solution from left to right.\n        for (int i = 1; i < n; i++) {\n            // For each element `i`, check all previous elements `j`.\n            for (int j = 0; j < i; j++) {\n                // If `nums[i]` can extend the subsequence ending at `j`...\n                if (nums[i] > nums[j]) {\n                    // then the new LIS length ending at `i` could be `dp[j] + 1`. \n                    // We take the maximum of what we already had for `dp[i]` and this new possibility.\n                    dp[i] = Math.max(dp[i], dp[j] + 1);\n                }\n            }\n            maxLIS = Math.max(maxLIS, dp[i]);\n        }\n\n        return maxLIS;\n    }\n\n    static void main(String[] args) {\n        int[] nums = {10, 9, 2, 5, 3, 7, 101, 18};\n        System.out.println(\"Iterative (O(n^2)): \" + iterative(nums)); // Expected: 4\n    }\n\n}"}, {"name": "NumberOfLIS", "subcat": "lis", "link": "", "code": "package leetcode.dp.lis;\n\nimport java.util.Arrays;\n\n/**\n * 673. Number of Longest Increasing Subsequence\n * https://leetcode.com/problems/number-of-longest-increasing-subsequence/\n *\n * Given an integer array nums, return the number of longest increasing subsequences.\n * Notice that the sequence has to be strictly increasing.\n *\n * Example 1: Input: nums = [1,3,5,4,7] -> Output: 2\n *   Explanation: The two longest increasing subsequences are [1,3,5,7] and [1,3,4,7].\n *\n * Example 2: Input: nums = [2,2,2,2,2] -> Output: 5\n *   Explanation: Length of LIS is 1, and there are 5 such subsequences.\n *\n * Constraints:\n *   1 <= nums.length <= 2000\n *   -10^6 <= nums[i] <= 10^6\n *\n * ---\n * Approach: DP with two arrays (length + count)\n *\n * Extend the classic LIS DP with a second array to track HOW MANY\n * subsequences achieve each length.\n *\n * STATE:\n *   dp[i]    = length of the longest increasing subsequence ending at index i\n *   count[i] = number of LIS of that length ending at index i\n *\n * BASE:       dp[i] = 1, count[i] = 1 (each element alone)\n *\n * TRANSITION: For each j < i where nums[j] < nums[i]:\n *   If dp[j] + 1 > dp[i]:  found a longer subsequence \u2192 dp[i] = dp[j]+1, count[i] = count[j]\n *   If dp[j] + 1 == dp[i]: found another way to reach same length \u2192 count[i] += count[j]\n *\n * ANSWER:     Sum of count[i] for all i where dp[i] == maxLength\n *\n * Example trace: nums = [1, 3, 5, 4, 7]\n *\n *   dp:    [1, 2, 3, 3, 4]\n *   count: [1, 1, 1, 1, 2]\n *                         ^-- 2 because both dp[2]=3 and dp[3]=3 extend to dp[4]=4\n *\n * Time:  O(n^2)\n * Space: O(n)\n */\npublic class NumberOfLIS {\n\n    public static int findNumberOfLIS(int[] nums) {\n        int n = nums.length;\n        if (n == 0) return 0;\n\n        int[] dp = new int[n];    // Length of LIS ending at i\n        int[] count = new int[n]; // Number of LIS of length dp[i] ending at i\n\n        // Base case: each element alone forms a subsequence of length 1\n        Arrays.fill(dp, 1);\n        Arrays.fill(count, 1);\n\n        int maxLen = 1;\n\n        for (int i = 1; i < n; i++) {\n            for (int j = 0; j < i; j++) {\n                if (nums[j] < nums[i]) {\n                    if (dp[j] + 1 > dp[i]) {\n                        // Found a strictly longer subsequence ending at i\n                        dp[i] = dp[j] + 1;\n                        count[i] = count[j]; // Reset count: inherit j's count\n                    } else if (dp[j] + 1 == dp[i]) {\n                        // Found another way to reach the same length\n                        count[i] += count[j]; // Accumulate count\n                    }\n                }\n            }\n            maxLen = Math.max(maxLen, dp[i]);\n        }\n\n        // Sum up counts of all positions whose LIS length equals maxLen\n        int result = 0;\n        for (int i = 0; i < n; i++) {\n            if (dp[i] == maxLen) {\n                result += count[i];\n            }\n        }\n\n        return result;\n    }\n\n    public static void main(String[] args) {\n        int[] nums1 = {1, 3, 5, 4, 7};\n        System.out.println(\"[1,3,5,4,7]: \" + findNumberOfLIS(nums1)); // 2\n\n        int[] nums2 = {2, 2, 2, 2, 2};\n        System.out.println(\"[2,2,2,2,2]: \" + findNumberOfLIS(nums2)); // 5\n\n        int[] nums3 = {1, 2, 4, 3, 5, 4, 7, 2};\n        System.out.println(\"[1,2,4,3,5,4,7,2]: \" + findNumberOfLIS(nums3)); // 3\n    }\n}\n"}, {"name": "RussianDollEnvelopes", "subcat": "lis", "link": "", "code": "package leetcode.dp.lis;\n\nimport java.util.Arrays;\n\n/**\n * 354. Russian Doll Envelopes\n * https://leetcode.com/problems/russian-doll-envelopes/\n *\n * You are given a 2D array of integers envelopes where envelopes[i] = [wi, hi]\n * represents the width and the height of an envelope.\n *\n * One envelope can fit into another if and only if both the width and height\n * of one envelope are strictly greater than the other envelope's width and height.\n *\n * Return the maximum number of envelopes you can Russian doll (put one inside the other).\n * You cannot rotate an envelope.\n *\n * Example 1: Input: envelopes = [[5,4],[6,4],[6,7],[2,3]] -> Output: 3\n *   Explanation: [2,3] => [5,4] => [6,7]\n *\n * Example 2: Input: envelopes = [[1,1],[1,1],[1,1]] -> Output: 1\n *\n * Constraints:\n *   1 <= envelopes.length <= 10^5\n *   envelopes[i].length == 2\n *   1 <= wi, hi <= 10^5\n *\n * ---\n * Approach: Sort + LIS with Binary Search (O(n log n))\n *\n * Key insight: reduce to 1D LIS problem.\n *\n * 1. Sort envelopes by width ascending. If widths are equal, sort by height\n *    DESCENDING. This ensures that for the same width, we never pick two\n *    envelopes (since heights are decreasing, LIS won't select both).\n *\n * 2. Extract the heights array and find the LIS length using patience-sorting\n *    (binary search approach).\n *\n * Example: [[5,4],[6,4],[6,7],[2,3]]\n *   After sort: [[2,3],[5,4],[6,7],[6,4]]  (width asc, height desc for same width)\n *   Heights: [3, 4, 7, 4]\n *   LIS of heights: [3, 4, 7] \u2192 length 3\n *\n * Time:  O(n log n)\n * Space: O(n)\n */\npublic class RussianDollEnvelopes {\n\n    /**\n     * O(n log n) approach: Sort + LIS via binary search (patience sorting)\n     */\n    public static int maxEnvelopes(int[][] envelopes) {\n        // Sort: width ascending, height DESCENDING for same width\n        // Descending height for same width prevents picking two envelopes\n        // with same width in the LIS\n        Arrays.sort(envelopes, (a, b) -> {\n            if (a[0] != b[0]) return a[0] - b[0]; // width ascending\n            return b[1] - a[1];                     // height descending\n        });\n\n        // Now find LIS on heights using patience sorting\n        // tails[i] = smallest possible tail element of an increasing subsequence of length i+1\n        int[] tails = new int[envelopes.length];\n        int size = 0; // Length of the longest subsequence found\n\n        for (int[] env : envelopes) {\n            int h = env[1];\n\n            // Binary search: find the first element in tails >= h\n            int lo = 0, hi = size;\n            while (lo < hi) {\n                int mid = lo + (hi - lo) / 2;\n                if (tails[mid] < h) {\n                    lo = mid + 1; // Look for a larger tail\n                } else {\n                    hi = mid;     // tails[mid] >= h, try to go smaller\n                }\n            }\n\n            // lo is the insertion point\n            tails[lo] = h;\n\n            // If lo == size, we extended the longest subsequence\n            if (lo == size) size++;\n        }\n\n        return size;\n    }\n\n    /**\n     * O(n^2) approach: Sort + classic LIS DP\n     * (TLE for large inputs but easier to understand)\n     */\n    public static int maxEnvelopesDP(int[][] envelopes) {\n        // Sort by width ascending, then height ascending\n        Arrays.sort(envelopes, (a, b) -> {\n            if (a[0] != b[0]) return a[0] - b[0];\n            return a[1] - b[1];\n        });\n\n        int n = envelopes.length;\n        int[] dp = new int[n]; // dp[i] = max envelopes in chain ending at i\n        Arrays.fill(dp, 1);\n\n        int maxLen = 1;\n\n        for (int i = 1; i < n; i++) {\n            for (int j = 0; j < i; j++) {\n                // Both width and height must be strictly greater\n                if (envelopes[j][0] < envelopes[i][0] && envelopes[j][1] < envelopes[i][1]) {\n                    dp[i] = Math.max(dp[i], dp[j] + 1);\n                }\n            }\n            maxLen = Math.max(maxLen, dp[i]);\n        }\n\n        return maxLen;\n    }\n\n    public static void main(String[] args) {\n        int[][] env1 = {{5, 4}, {6, 4}, {6, 7}, {2, 3}};\n        System.out.println(\"O(n log n): \" + maxEnvelopes(env1));   // 3\n        System.out.println(\"O(n^2):     \" + maxEnvelopesDP(env1)); // 3\n\n        int[][] env2 = {{1, 1}, {1, 1}, {1, 1}};\n        System.out.println(\"O(n log n): \" + maxEnvelopes(env2));   // 1\n        System.out.println(\"O(n^2):     \" + maxEnvelopesDP(env2)); // 1\n    }\n}\n"}, {"name": "BestTimeBuySellStock", "subcat": "stock", "link": "", "code": "package leetcode.dp.stock;\n\n/**\n * 121. Best Time to Buy and Sell Stock\n * https://leetcode.com/problems/best-time-to-buy-and-sell-stock/\n *\n * You are given an array prices where prices[i] is the price of a given stock\n * on the i-th day. You want to maximize your profit by choosing a single day\n * to buy and a single day in the future to sell. Return the maximum profit.\n * If you cannot achieve any profit, return 0.\n *\n * Example 1: Input: prices = [7,1,5,3,6,4] -> Output: 5\n *   Explanation: Buy on day 2 (price=1) and sell on day 5 (price=6), profit = 5.\n *\n * Example 2: Input: prices = [7,6,4,3,1] -> Output: 0\n *\n * Constraints:\n *   1 <= prices.length <= 10^5\n *   0 <= prices[i] <= 10^4\n *\n * ---\n * Approach: Greedy / One-pass\n *\n * Track the minimum price seen so far. At each day, the max profit is\n * current price - minimum price seen. Keep a running maximum.\n *\n * Time:  O(n)\n * Space: O(1)\n */\npublic class BestTimeBuySellStock {\n\n    public static int maxProfit(int[] prices) {\n        int minPrice = prices[0];  // Minimum buy price seen so far\n        int maxProfit = 0;         // Best profit achievable\n\n        for (int price : prices) {\n            // Update the cheapest buy price\n            minPrice = Math.min(minPrice, price);\n\n            // Check if selling today gives a better profit\n            if (price - minPrice > maxProfit) {\n                maxProfit = price - minPrice;\n            }\n        }\n\n        return maxProfit;\n    }\n\n    public static void main(String[] args) {\n        int[] prices = { 7, 1, 5, 3, 6, 4 };\n        System.out.println(maxProfit(prices));\n    }\n\n}\n"}, {"name": "BestTimeBuySellStockCooldown", "subcat": "stock", "link": "", "code": "package leetcode.dp.stock;\n\n/**\n * 309. Best Time to Buy and Sell Stock with Cooldown\n * https://leetcode.com/problems/best-time-to-buy-and-sell-stock-with-cooldown/\n *\n * You are given an array prices where prices[i] is the price on the i-th day.\n * Find the maximum profit with as many transactions as you like, but after\n * selling you must wait one day before buying again (cooldown of 1 day).\n *\n * Example 1: Input: prices = [1,2,3,0,2] -> Output: 3\n *   Explanation: [buy, sell, cooldown, buy, sell]\n *\n * Example 2: Input: prices = [1] -> Output: 0\n *\n * Constraints:\n *   1 <= prices.length <= 5000\n *   0 <= prices[i] <= 1000\n *\n * ---\n * Approach: State Machine DP with 3 states\n *\n * On each day, you are in one of three states:\n *   hold:     holding a stock (bought previously or today)\n *   sold:     just sold a stock today\n *   cooldown: not holding, did NOT sell today (either idle or post-cooldown)\n *\n * Transitions:\n *   hold     = max(hold, cooldown - price)  // keep holding OR buy today from cooldown\n *   sold     = hold + price                 // sell the stock we hold\n *   cooldown = max(cooldown, sold)           // stay idle OR transition from yesterday's sold\n *\n * Time:  O(n)\n * Space: O(1)\n */\npublic class BestTimeBuySellStockCooldown {\n\n    public static int maxProfit(int[] prices) {\n        if (prices == null || prices.length == 0) {\n            return 0;\n        }\n\n        int n = prices.length;\n\n        int hold = -prices[0];  // Bought on day 0\n        int sold = 0;           // Haven't sold anything yet\n        int cooldown = 0;       // Haven't done anything yet\n\n        for (int i = 1; i < n; i++) {\n            int prevHold = hold;\n\n            // hold: keep holding OR buy today (must come from cooldown state)\n            hold = Math.max(hold, cooldown - prices[i]);\n            // cooldown: stay in cooldown OR move from yesterday's sold\n            cooldown = Math.max(cooldown, sold);\n            // sold: sell the stock we're holding today\n            sold = prevHold + prices[i];\n        }\n\n        // Answer is max of sold or cooldown (never profitable to end holding)\n        return Math.max(sold, cooldown);\n    }\n\n    public static void main(String[] args) {\n        // Test case 1\n        int[] prices1 = { 1, 2, 3, 0, 2 };\n        System.out.println(maxProfit(prices1)); // Output: 3\n\n        // Test case 2\n        int[] prices2 = { 1 };\n        System.out.println(maxProfit(prices2)); // Output: 0\n    }\n\n}\n"}, {"name": "BestTimeBuySellStockWithTransactionFee", "subcat": "stock", "link": "", "code": "package leetcode.dp.stock;\n\n/**\n * 714. Best Time to Buy and Sell Stock with Transaction Fee\n * https://leetcode.com/problems/best-time-to-buy-and-sell-stock-with-transaction-fee/\n *\n * You are given an array prices where prices[i] is the price of a given stock\n * on the i-th day, and an integer fee representing a transaction fee.\n *\n * Find the maximum profit you can achieve. You may complete as many transactions\n * as you like, but you need to pay the transaction fee for each transaction.\n * You may not engage in multiple transactions simultaneously (you must sell the\n * stock before you buy again).\n *\n * The transaction fee is only charged once for each stock purchase and sale.\n *\n * Example 1:\n *   Input: prices = [1, 3, 2, 8, 4, 9], fee = 2\n *   Output: 8\n *   Explanation: Buy at 1, sell at 8 (profit 8-1-2=5), buy at 4, sell at 9 (profit 9-4-2=3)\n *                Total = 5 + 3 = 8\n *\n * Example 2:\n *   Input: prices = [1, 3, 7, 5, 10, 3], fee = 3\n *   Output: 6\n *\n * Constraints:\n *   1 <= prices.length <= 5 * 10^4\n *   1 <= prices[i] < 5 * 10^4\n *   0 <= fee < 5 * 10^4\n *\n * ---\n * Approach: State Machine DP (same as Buy/Sell Stock II, but subtract fee on sell)\n *\n * Two states at each day:\n *   cash  = max profit when NOT holding stock\n *   hold  = max profit when HOLDING stock\n *\n * Transitions:\n *   cash = max(cash, hold + prices[i] - fee)   // rest or sell (pay fee)\n *   hold = max(hold, cash - prices[i])          // rest or buy\n *\n * Base: cash = 0, hold = -prices[0] (buy on day 0)\n *\n * This is identical to BestTimeBuySellStock_2 with unlimited transactions,\n * except we subtract 'fee' each time we sell.\n *\n * Trace: prices = [1, 3, 2, 8, 4, 9], fee = 2\n *\n *   Day 0 (price=1): cash=0,  hold=-1\n *   Day 1 (price=3): cash=max(0, -1+3-2)=0,   hold=max(-1, 0-3)=-1\n *   Day 2 (p
