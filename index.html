<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🧠 LeetCode Tracker</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#0d1117;--surface:#161b22;--surface2:#1c2333;--border:#30363d;
    --text:#e6edf3;--text2:#8b949e;--accent:#58a6ff;--accent2:#1f6feb;
    --green:#3fb950;--green-bg:rgba(63,185,80,.12);--orange:#d29922;
    --red:#f85149;--purple:#bc8cff;
    --radius:8px;--shadow:0 2px 8px rgba(0,0,0,.3);
  }
  html{scroll-behavior:smooth}
  body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;padding:0}

  /* ── Header ── */
  .header{background:linear-gradient(135deg,#0d1117 0%,#161b22 100%);border-bottom:1px solid var(--border);padding:24px 0;position:sticky;top:0;z-index:100;backdrop-filter:blur(12px)}
  .header-inner{max-width:1100px;margin:0 auto;padding:0 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px}
  .logo{font-size:1.5rem;font-weight:700;display:flex;align-items:center;gap:10px}
  .logo span{background:linear-gradient(135deg,var(--accent),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
  .stats-bar{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
  .stat{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:6px 14px;font-size:.85rem;display:flex;align-items:center;gap:6px}
  .stat .num{font-weight:700;color:var(--green);font-size:1rem}
  .stat .total{color:var(--text2)}
  .progress-ring{width:44px;height:44px}
  .progress-ring circle{transition:stroke-dashoffset .4s ease}

  /* ── Controls ── */
  .controls{max-width:1100px;margin:20px auto;padding:0 24px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
  .search-box{flex:1;min-width:220px;position:relative}
  .search-box input{width:100%;padding:10px 14px 10px 38px;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:.9rem;outline:none;transition:border .2s}
  .search-box input:focus{border-color:var(--accent)}
  .search-box svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text2)}
  .btn{padding:10px 18px;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer;font-size:.85rem;font-weight:600;transition:all .2s;display:flex;align-items:center;gap:6px;white-space:nowrap}
  .btn:hover{border-color:var(--accent);background:var(--surface2)}
  .btn-primary{background:var(--accent2);border-color:var(--accent2);color:#fff}
  .btn-primary:hover{background:var(--accent);border-color:var(--accent)}
  .btn-danger{border-color:var(--red);color:var(--red)}
  .btn-danger:hover{background:rgba(248,81,73,.1)}
  .filter-pills{display:flex;gap:6px;flex-wrap:wrap}
  .pill{padding:5px 12px;border-radius:20px;border:1px solid var(--border);background:var(--surface);color:var(--text2);cursor:pointer;font-size:.8rem;transition:all .2s}
  .pill:hover,.pill.active{border-color:var(--accent);color:var(--accent);background:rgba(88,166,255,.08)}

  /* ── Main ── */
  .main{max-width:1100px;margin:0 auto;padding:0 24px 60px}
  .problem-list{border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);overflow:hidden}

  /* ── Problem Row ── */
  .problem{display:flex;align-items:center;padding:10px 18px;transition:background .15s;gap:12px;border-bottom:1px solid rgba(48,54,61,.4)}
  .problem:last-child{border-bottom:none}
  .problem:hover{background:rgba(88,166,255,.04)}
  .problem.solved{background:var(--green-bg)}
  .problem.highlighted{background:rgba(210,153,34,.15);animation:pulse 1.5s ease 2}
  @keyframes pulse{0%,100%{background:rgba(210,153,34,.15)}50%{background:rgba(210,153,34,.3)}}
  .problem input[type=checkbox]{appearance:none;-webkit-appearance:none;width:18px;height:18px;border:2px solid var(--border);border-radius:4px;cursor:pointer;position:relative;flex-shrink:0;transition:all .2s}
  .problem input[type=checkbox]:checked{background:var(--green);border-color:var(--green)}
  .problem input[type=checkbox]:checked::after{content:'✓';position:absolute;top:-1px;left:2px;font-size:12px;color:#fff;font-weight:700}
  .problem .num{color:var(--text2);font-size:.75rem;min-width:28px;text-align:right;font-variant-numeric:tabular-nums}
  .problem a{color:var(--text);text-decoration:none;font-size:.88rem;flex:1;transition:color .15s}
  .problem a:hover{color:var(--accent)}
  .problem.solved a{color:var(--text2);text-decoration:line-through}

  /* ── Toast ── */
  .toast{position:fixed;bottom:24px;right:24px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:14px 20px;font-size:.9rem;box-shadow:var(--shadow);transform:translateY(100px);opacity:0;transition:all .3s;z-index:200;display:flex;align-items:center;gap:10px}
  .toast.show{transform:translateY(0);opacity:1}

  /* ── Modal ── */
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:300;display:none;align-items:center;justify-content:center}
  .modal-overlay.show{display:flex}
  .modal{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:28px;max-width:480px;width:90%;box-shadow:0 8px 32px rgba(0,0,0,.5);text-align:center}
  .modal h2{margin-bottom:12px;font-size:1.2rem}
  .modal p{color:var(--text2);margin-bottom:8px;font-size:.9rem}
  .modal a{color:var(--accent);font-size:1.1rem;font-weight:600;word-break:break-all}
  .modal .btn{margin:16px auto 0;width:fit-content}

  /* ── Empty State ── */
  .empty{text-align:center;padding:48px 24px;color:var(--text2)}
  .empty .icon{font-size:3rem;margin-bottom:12px}

  /* ── Scrollbar ── */
  ::-webkit-scrollbar{width:8px}
  ::-webkit-scrollbar-track{background:var(--bg)}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
  ::-webkit-scrollbar-thumb:hover{background:var(--text2)}

  /* ── Light Theme ── */
  [data-theme="light"]{
    --bg:#f6f8fa;--surface:#ffffff;--surface2:#f0f2f5;--border:#d0d7de;
    --text:#1f2328;--text2:#656d76;--accent:#0969da;--accent2:#0550ae;
    --green:#1a7f37;--green-bg:rgba(26,127,55,.1);--orange:#9a6700;
    --red:#cf222e;--purple:#8250df;
    --shadow:0 2px 8px rgba(0,0,0,.08);
  }
  [data-theme="light"] .header{background:linear-gradient(135deg,#f6f8fa 0%,#ffffff 100%)}
  [data-theme="light"] .problem:hover{background:rgba(9,105,218,.04)}
  [data-theme="light"] .problem.highlighted{background:rgba(154,103,0,.1);animation:pulse-light 1.5s ease 2}
  @keyframes pulse-light{0%,100%{background:rgba(154,103,0,.1)}50%{background:rgba(154,103,0,.2)}}
  [data-theme="light"] ::-webkit-scrollbar-track{background:#f6f8fa}

  /* ── Theme Toggle ── */
  .theme-toggle{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);width:38px;height:38px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1.1rem;transition:all .2s;flex-shrink:0}
  .theme-toggle:hover{border-color:var(--accent);background:var(--surface2)}

  /* ── Responsive ── */
  @media(max-width:640px){
    .header-inner{flex-direction:column;align-items:flex-start}
    .controls{flex-direction:column}
    .search-box{min-width:100%}
    .problem{padding:8px 12px}
  }
</style>
</head>
<body>

<!-- ═══════ HEADER ═══════ -->
<div class="header">

      <span>LeetCode Tracker</span>
    </div>
    <div class="stats-bar">
      <button class="theme-toggle" id="themeToggle" title="Toggle theme">🌙</button>
      <div class="stat">
        <svg class="progress-ring" viewBox="0 0 44 44">
          <circle cx="22" cy="22" r="18" fill="none" stroke="var(--border)" stroke-width="4"/>
          <circle id="progressCircle" cx="22" cy="22" r="18" fill="none" stroke="var(--green)" stroke-width="4" stroke-linecap="round" stroke-dasharray="113.1" stroke-dashoffset="113.1" transform="rotate(-90 22 22)"/>
        </svg>
        <div>
          <div><span class="num" id="solvedCount">0</span> <span class="total">/ <span id="totalCount">0</span></span></div>
          <div style="font-size:.75rem;color:var(--text2)">Solved</div>
        </div>
      </div>
      <div class="stat" style="gap:4px">
        🔥 <span class="num" id="streakCount">0</span> <span class="total">streak</span>
      </div>
    </div>
  </div>
</div>

<!-- ═══════ CONTROLS ═══════ -->
<div class="controls">
  <div class="search-box">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    <input type="text" id="searchInput" placeholder="Search problems... (press /)">
  </div>
  <div class="filter-pills">
    <div class="pill active" data-filter="all">All</div>
    <div class="pill" data-filter="unsolved">Unsolved</div>
    <div class="pill" data-filter="solved">Solved</div>
  </div>
  <button class="btn btn-primary" id="randomBtn">🎲 Pick Random</button>
  <button class="btn btn-danger" id="resetBtn">🗑 Reset</button>
</div>

<!-- ═══════ MAIN ═══════ -->
<div class="main" id="app"></div>

<!-- ═══════ TOAST ═══════ -->
<div class="toast" id="toast"></div>

<!-- ═══════ MODAL ═══════ -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modal">
    <h2>🎲 Random Pick</h2>
    <p id="modalCategory"></p>
    <a id="modalLink" href="#" target="_blank"></a>
    <br>
    <button class="btn btn-primary" id="modalClose">Got it!</button>
  </div>
</div>

// ═══════════════════════════════════════════════════════════
//  DEDUPLICATE + SHUFFLE (order persisted in localStorage)
// ═══════════════════════════════════════════════════════════
function slug(url) {
  return url.replace(/https?:\/\/leetcode\.com\/problems\//, '').replace(/\/.*$/, '').replace(/\/$/, '');
}

const seen = new Set();
const unique = [];
RAW.forEach(([title, url]) => {
  const s = slug(url);
  if (!seen.has(s)) { seen.add(s); unique.push({ title, url, slug: s }); }
});

// Persist the shuffled order so it stays the same across reloads
const ORDER_KEY = 'lc-shuffle-order-v3';
let shuffledOrder = JSON.parse(localStorage.getItem(ORDER_KEY) || 'null');

if (!shuffledOrder || shuffledOrder.length !== unique.length) {
  shuffledOrder = unique.map((_, i) => i);
  for (let i = shuffledOrder.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [shuffledOrder[i], shuffledOrder[j]] = [shuffledOrder[j], shuffledOrder[i]];
  }
  localStorage.setItem(ORDER_KEY, JSON.stringify(shuffledOrder));
}

const allProblems = shuffledOrder.map(i => unique[i]);

// ═══════════════════════════════════════════════════════════
//  APP STATE  (same keys — your existing progress is kept!)
// ═══════════════════════════════════════════════════════════
const STORAGE_KEY = 'lc-tracker-v2';
const STREAK_KEY = 'lc-streak-v2';

function loadState() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } catch { return {}; }
}
function saveState(state) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}
function loadStreak() {
  try { return JSON.parse(localStorage.getItem(STREAK_KEY)) || { count: 0, lastDate: null }; } catch { return { count: 0, lastDate: null }; }
}
function saveStreak(s) {
  localStorage.setItem(STREAK_KEY, JSON.stringify(s));
}
function todayStr() {
  return new Date().toISOString().slice(0, 10);
}
function updateStreak() {
  const s = loadStreak();
  const today = todayStr();
  if (s.lastDate === today) return s;
  const yesterday = new Date(Date.now() - 86400000).toISOString().slice(0, 10);
  if (s.lastDate === yesterday) { s.count++; } else { s.count = 1; }
  s.lastDate = today;
  saveStreak(s);
  return s;
}

// ═══════════════════════════════════════════════════════════
//  RENDER — flat shuffled list, no grouping
// ═══════════════════════════════════════════════════════════
const app = document.getElementById('app');
let currentFilter = 'all';
let searchTerm = '';

function render() {
  const state = loadState();
  const streak = loadStreak();

  let solvedCount = 0;
  allProblems.forEach(p => { if (state[p.slug]) solvedCount++; });
  const totalCount = allProblems.length;

  document.getElementById('solvedCount').textContent = solvedCount;
  document.getElementById('totalCount').textContent = totalCount;
  document.getElementById('streakCount').textContent = streak.count;

  const pct = totalCount ? solvedCount / totalCount : 0;
  const circ = 2 * Math.PI * 18;
  document.getElementById('progressCircle').setAttribute('stroke-dashoffset', circ * (1 - pct));

  let rows = '';
  let visibleIdx = 0;
  allProblems.forEach(p => {
    const isSolved = !!state[p.slug];
    if (currentFilter === 'solved' && !isSolved) return;
    if (currentFilter === 'unsolved' && isSolved) return;
    if (searchTerm && !p.title.toLowerCase().includes(searchTerm)) return;
    visibleIdx++;
    rows += `<div class="problem ${isSolved ? 'solved' : ''}" data-slug="${p.slug}" id="p-${p.slug}">
      <input type="checkbox" ${isSolved ? 'checked' : ''} data-slug="${p.slug}">
      <span class="num">${visibleIdx}</span>
      <a href="${p.url}" target="_blank" rel="noopener">${p.title}</a>
    </div>`;
  });

  if (visibleIdx === 0) {
    app.innerHTML = `<div class="empty"><div class="icon">🔍</div><p>No problems match your filter.</p></div>`;
  } else {
    app.innerHTML = `<div class="problem-list">${rows}</div>`;
  }
}

// ═══════════════════════════════════════════════════════════
//  EVENT HANDLERS
// ═══════════════════════════════════════════════════════════

app.addEventListener('change', (e) => {
  if (e.target.type !== 'checkbox') return;
  const s = e.target.dataset.slug;
  const state = loadState();
  if (e.target.checked) {
    state[s] = true;
    updateStreak();
    showToast('✅ Marked as solved!');
  } else {
    delete state[s];
    showToast('↩️ Marked as unsolved');
  }
  saveState(state);
  render();
});

document.getElementById('searchInput').addEventListener('input', (e) => {
  searchTerm = e.target.value.toLowerCase().trim();
  render();
});

document.querySelectorAll('.pill').forEach(pill => {
  pill.addEventListener('click', () => {
    document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
    pill.classList.add('active');
    currentFilter = pill.dataset.filter;
    render();
  });
});

document.getElementById('randomBtn').addEventListener('click', () => {
  const state = loadState();
  const unsolved = allProblems.filter(p => !state[p.slug]);
  if (unsolved.length === 0) {
    showToast('🎉 You solved everything! Amazing!');
    return;
  }
  const pick = unsolved[Math.floor(Math.random() * unsolved.length)];

  const overlay = document.getElementById('modalOverlay');
  document.getElementById('modalCategory').textContent = `${unsolved.length} unsolved remaining`;
  const link = document.getElementById('modalLink');
  link.textContent = pick.title;
  link.href = pick.url;
  overlay.classList.add('show');

  if (currentFilter !== 'all') {
    document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
    document.querySelector('.pill[data-filter="all"]').classList.add('active');
    currentFilter = 'all';
    searchTerm = '';
    document.getElementById('searchInput').value = '';
    render();
  }
  const el = document.getElementById('p-' + pick.slug);
  if (el) {
    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    el.classList.add('highlighted');
    setTimeout(() => el.classList.remove('highlighted'), 4000);
  }
});

document.getElementById('modalClose').addEventListener('click', () => {
  document.getElementById('modalOverlay').classList.remove('show');
});
document.getElementById('modalOverlay').addEventListener('click', (e) => {
  if (e.target === e.currentTarget) e.currentTarget.classList.remove('show');
});

document.getElementById('resetBtn').addEventListener('click', () => {
  if (confirm('⚠️ Reset ALL progress? This cannot be undone.')) {
    localStorage.removeItem(STORAGE_KEY);
    localStorage.removeItem(STREAK_KEY);
    localStorage.removeItem(ORDER_KEY);
    showToast('🗑 Progress reset');
    location.reload();
  }
});

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 2200);
}

document.addEventListener('keydown', (e) => {
  if (e.key === '/' && !['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) {
    e.preventDefault();
    document.getElementById('searchInput').focus();
  }
  if (e.key === 'Escape') {
    document.getElementById('modalOverlay').classList.remove('show');
  }
});

// ═══════════════════════════════════════════════════════════
//  THEME TOGGLE
// ═══════════════════════════════════════════════════════════
const THEME_KEY = 'lc-theme';
function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  document.getElementById('themeToggle').textContent = theme === 'light' ? '☀️' : '🌙';
  localStorage.setItem(THEME_KEY, theme);
}
(function initTheme() {
  const saved = localStorage.getItem(THEME_KEY);
  if (saved) applyTheme(saved);
})();
document.getElementById('themeToggle').addEventListener('click', () => {
  const current = document.documentElement.getAttribute('data-theme');
  applyTheme(current === 'light' ? 'dark' : 'light');
});

// ═══════════════════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════════════════
render();
</script>
