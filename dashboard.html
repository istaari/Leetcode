 be derived from the array by deleting some\n// or no elements without changing the order of the remaining elements.\n//\n// Example:\n// Input: nums = [1,3,2,2,5,2,3,7]\n// Output: 5\n// Explanation: The longest harmonious subsequence is [3,2,2,2,3]. Its max is 3, min is 2,\n// and the difference is 1. The length is 5.\npublic class LongestHarmoniousSubsequence {\n\n    /**\n     * ### Intuition Behind the Solution\n     *\n     * 1.  **Understanding \"Harmonious Subsequence\":**\n     * - The definition is key: a subsequence where `max - min = 1`.\n     * - This means a harmonious subsequence can only be formed by two kinds of numbers: some number `x` and its neighbor `x + 1`.\n     * - For example, a subsequence `[2,3,2,3,2]` is harmonious, but `[2,3,4]` is not (max-min=2).\n     *\n     * 2.  **Simplifying the Problem:**\n     * - Since the order of elements in a subsequence doesn't matter for its min/max values, this problem isn't about finding a contiguous subarray. It's about finding counts.\n     * - The problem boils down to: \"Find a number `x` in the array such that `x+1` also exists, and the sum of their frequencies is maximized.\"\n     *\n     * 3.  **The Algorithm's Plan:**\n     * - We can't solve this without knowing the counts of each number. The perfect tool for this is a **HashMap** to store the frequency of each number.\n     *\n     * - **Pass 1: Count Frequencies.**\n     * - We iterate through the entire `nums` array once and populate our frequency map. For `[1,3,2,2,5,2,3,7]`, the map would become `{1=1, 2=3, 3=2, 5=1, 7=1}`.\n     *\n     * - **Pass 2: Find the Longest Pair.**\n     * - Now that we have the counts, we can iterate through the numbers again (or more efficiently, through the keys of our map).\n     * - For each number `num` we look at, we check if its harmonious partner `num + 1` also exists as a key in our map.\n     * - If it does, we calculate the potential length of this harmonious subsequence by adding their counts: `count.get(num) + count.get(num + 1)`.\n     * - We keep track of the maximum length we find during this process.\n     *\n     * - **Final Result:** After checking all the numbers for their harmonious partners, the `maxLen` variable will hold the length of the longest harmonious subsequence. If no such pair was found, it will remain 0.\n     *\n     * This two-pass approach cleanly and efficiently solves the problem by first gathering the necessary data (counts) and then analyzing it.\n     */\n    public static int findLHS(int[] nums) {\n        // Pass 1: Count the frequency of each number.\n        Map<Integer, Integer> count = new HashMap<>();\n        for (int num : nums) {\n            count.put(num, count.getOrDefault(num, 0) + 1);\n        }\n\n        int maxLen = 0;\n\n        // Pass 2: Iterate through the keys (unique numbers) to find harmonious pairs.\n        // Note: Iterating through the keySet is slightly more efficient than iterating through\n        // the original nums array again, as it avoids re-checking the same number.\n        for (int num : count.keySet()) {\n            // Check if the harmonious partner (num + 1) exists in our map.\n            if (count.containsKey(num + 1)) {\n                // If it exists, calculate the combined length and update the max.\n                maxLen = Math.max(maxLen, count.get(num) + count.get(num + 1));\n            }\n        }\n\n        return maxLen;\n    }\n\n    public static void main(String[] args) {\n        // Example 1: The user's original example\n        int[] nums1 = {1, 3, 2, 2, 5, 2, 3, 7};\n        System.out.println(\"For [1,3,2,2,5,2,3,7], LHS length is: \" + findLHS(nums1));\n    }\n}" }, { "name": "LongestPalindrome", "subcat": "", "link": "https://leetcode.com/problems/longest-palindrome/", "code": "package leetcode.array;\n\nimport java.util.HashSet;\nimport java.util.Set;\n\n// LeetCode 409: Longest Palindrome\n//\n// Problem Statement:\n// Given a string `s` which consists of lowercase or uppercase English letters, return the\n// length of the longest palindrome that can be built with those letters.\n//\n// Note that this is case-sensitive, so \"a\" and \"A\" are considered different characters.\n// We are not finding a palindromic substring within `s`, but rearranging the letters of `s`\n// to form the longest possible new string that is a palindrome.\n//\n// Example:\n// Input: s = \"abccccdd\"\n// Output: 7\n// Explanation: One longest palindrome that can be built is \"dccaccd\", which has a length of 7.\n\npublic class LongestPalindrome {\n\n    public static int longestPalindrome(String s) {\n        // This 'count' is actually counting the number of PAIRS of characters.\n        int count = 0;\n        Set<Character> set = new HashSet<>();\n\n        for (int i = 0; i < s.length(); i++) {\n            char c = s.charAt(i);\n            // The remove() method returns true if the element was in the set.\n            // This is a clever trick to check for existence and remove in one step.\n            if (set.remove(c)) {\n                // If we successfully removed the character, it means we found its pair.\n                count++;\n            } else {\n                // If the character was not in the set, add it. It's now waiting for a pair.\n                set.add(c);\n            }\n        }\n\n        // Each pair contributes 2 to the length of the palindrome.\n        int lengthFromPairs = count * 2;\n\n        // If the set is not empty, it means there are leftover unpaired characters.\n        // We can place exactly ONE of these in the center of the palindrome.\n        if (!set.isEmpty()) {\n            return lengthFromPairs + 1;\n        } else {\n            // If the set is empty, all characters formed perfect pairs. No center is needed.\n            return lengthFromPairs;\n        }\n    }\n\n    public static void main(String[] args) {\n        String s = \"abccccdd\";\n        System.out.println(longestPalindrome(s));\n    }\n\n}\n" }, { "name": "MajorityElement", "subcat": "", "link": "https://leetcode.com/problems/majority-element/", "code": "package leetcode.array;\n\nimport java.util.ArrayList;\nimport java.util.List;\n\n\n// LeetCode 229: Majority Element II\n//\n// Problem Statement:\n// Given an integer array `nums` of size `n`, find all the elements that appear more than\n// `⌊ n/3 ⌋` times.\n//\n// Note: The algorithm should run in linear time and in O(1) space.\n//\n// Example 1:\n// Input: nums = [3,2,3]\n// Output: [3]\n//\n// Example 2:\n// Input: nums = [1]\n// Output: [1]\n//\n// Example 3:\n// Input: nums = [1,2]\n// Output: [1,2]\npublic class MajorityElement {\n\n    public static List<Integer> majorityElement(int[] nums) {\n        List<Integer> result = new ArrayList<>();\n        if (nums == null || nums.length == 0) {\n            return result;\n        }\n\n        // --- PASS 1: Find the two potential candidates ---\n        int count1 = 0;\n        // Initialize with values that are guaranteed not to be in the array if possible,\n        // but the logic handles this. Using 0 and 1 is fine as placeholders.\n        int candidate1 = 0;\n\n        int count2 = 0;\n        int candidate2 = 1;\n\n        // This is a slightly different but valid implementation of the voting logic.\n        // A more common pattern is a single if-else-if cascade.\n        for (int val : nums) {\n            if (candidate1 == val) {\n                count1++;\n            } else if (candidate2 == val) {\n                count2++;\n            } else if (count1 == 0) {\n                candidate1 = val;\n                count1 = 1;\n            } else if (count2 == 0) {\n                candidate2 = val;\n                count2 = 1;\n            } else {\n                // This is the \"cancellation\" step for a trio of distinct numbers.\n                count1--;\n                count2--;\n            }\n        }\n\n        // --- PASS 2: Verify the candidates ---\n        count1 = 0;\n        count2 = 0;\n\n        for (int val : nums) {\n            if (val == candidate1) count1++;\n            else if (val == candidate2) count2++;\n        }\n\n        // Check if the counts exceed n/3\n        if (count1 > nums.length / 3) {\n            result.add(candidate1);\n        }\n\n        // The 'candidate1 != candidate2' check is important for cases where only one\n        // majority element exists and might end up in both candidate slots initially.\n        if (candidate1 != candidate2 && count2 > nums.length / 3) {\n            result.add(candidate2);\n        }\n\n        return result;\n    }\n\n\n    public static void main(String[] args) {\n        // Example 1: The user's original example\n        int[] nums1 = {1, 2};\n        System.out.println(\"For [1, 2], majority elements are: \" + majorityElement(nums1));\n        // Expected: [1, 2].\n        // n=2, n/3 = 0. Both 1 and 2 appear 1 time, which is > 0.\n\n        // Example 2: A clear winner\n        int[] nums2 = {3, 2, 3};\n        System.out.println(\"For [3, 2, 3], majority elements are: \" + majorityElement(nums2));\n        // Expected: [3].\n        // n=3, n/3 = 1. '3' appears 2 times (> 1). '2' appears 1 time (not > 1).\n\n        // Example 3: Two winners\n        int[] nums3 = {2, 2, 1, 1, 1, 2, 2};\n        System.out.println(\"For [2,2,1,1,1,2,2], majority elements are: \" + majorityElement(nums3));\n        // Expected: [1, 2] (or [2, 1]).\n        // n=7, n/3 = 2. '1' appears 3 times (> 2). '2' appears 4 times (> 2).\n\n        // Example 4: No winners\n        int[] nums4 = {1, 2, 3};\n        System.out.println(\"For [1, 2, 3], majority elements are: \" + majorityElement(nums4));\n        // Expected: [].\n        // n=3, n/3 = 1. No element appears more than 1 time.\n    }\n}" }, { "name": "MaxConsecutiveOnes", "subcat": "", "link": "", "code": "package leetcode.array;\n\npublic class MaxConsecutiveOnes {\n\n    public static int findMaxConsecutiveOnes(int[] nums) {\n        int max = 0;\n        int count = 0;\n\n        for (int num : nums) {\n            if (num == 1) {\n                count++;\n            } else { // If we encounter a 0, we reset the count\n                max = Math.max(max, count);\n                count = 0;\n            }\n        }\n        return max;\n    }\n\n    public static void main(String[] args) {\n        int[] nums = {1, 1, 0, 1, 1, 1};\n        System.out.println(findMaxConsecutiveOnes(nums));\n    }\n}\n" }, { "name": "MaximumGap", "subcat": "", "link": "https://leetcode.com/problems/maximum-gap/", "code": "\n\npackage leetcode.array;\nimport java.util.Arrays;\n\n\n// LeetCode 164: Maximum Gap\n//\n// Problem Statement:\n// Given an integer array `nums`, return the maximum difference between two successive\n// elements in its sorted form. If the array contains less than two elements, return 0.\n//\n// You must write an algorithm that runs in linear time and uses linear extra space.\n//\n// Example 1:\n// Input: nums = [3,6,9,1]\n// Output: 3\n// Explanation: The sorted form of the array is [1,3,6,9], and the maximum\n// difference is between (3,6) or (6,9), which is 3.\n//\n// Example 2:\n// Input: nums = [10]\n// Output: 0\n// Explanation: The array contains less than 2 elements.\n//\n// Constraint: The O(N) time complexity rules out a simple O(N log N) sorting approach.\n\npublic class MaximumGap {\n\n    /**\n     * ### Intuition Behind the Solution (Pigeonhole Principle & Bucket Sort)\n     *\n     * 1.  **The Constraint is Key:** The problem requires an O(N) solution. This immediately tells us we\n     * cannot use a standard comparison-based sort (like `Arrays.sort()`), which takes O(N log N). We\n     * must use a non-comparison-based sorting idea like Radix Sort or Bucket Sort. This solution\n     * cleverly uses the principles of Bucket Sort.\n     *\n     * 2.  **The Pigeonhole Principle:**\n     * - Imagine we have `N` numbers in the array. In their sorted form, there will be `N-1` gaps\n     * between successive elements.\n     * - The total range of values is `max - min`.\n     * - The *average* gap size would be `(max - min) / (N - 1)`.\n     * - By the pigeonhole principle, the *maximum gap* between any two successive sorted elements must\n     * be **at least** this average gap size.\n     *\n     * 3.  **The Bucket Strategy (The \"Aha!\" Moment):**\n     * - What if we create \"buckets\" to group our numbers, and we make the size of each bucket\n     * smaller than the average gap? Let's say `bucketSize = (max - min) / (N - 1)`.\n     * - Any two numbers that fall into the **same bucket** will have a difference between them that is\n     * less than `bucketSize`.\n     * - Since we know the true `maximumGap` must be greater than or equal to `bucketSize`, this means\n     * the maximum gap **cannot possibly occur inside a single bucket**.\n     * - Therefore, the maximum gap must occur **between** two numbers in **different buckets**.\n     * Specifically, it must be the difference between the **maximum** value in some bucket `i`\n     * and the **minimum** value in the *next non-empty* bucket `j`.\n     *\n     * 4.  **The Algorithm's Plan:**\n     * - **Pass 1:** Find the `min` and `max` values in the array.\n     * - **Calculate Bucket Info:** Determine the `bucketSize` and `bucketCount`.\n     * - **Pass 2 (Distribution):** Create `bucketCount` buckets. For each bucket, we only need to\n     * store the minimum and maximum number that falls into it. We can discard all other numbers\n     * in between, because they can't form the maximum gap.\n     * - **Pass 3 (Gap Calculation):** Iterate through the buckets. Ignore any empty buckets. The\n     * maximum gap will be the largest difference found between the `min` of the current non-empty\n     * bucket and the `max` of the previous non-empty bucket.\n     */\n    public static int maximumGap(int[] nums) {\n\n        if (nums.length < 2) return 0;\n\n        // Pass 1: Find min and max elements\n        int max = Integer.MIN_VALUE;\n        int min = Integer.MAX_VALUE;\n        for (int val : nums) {\n            max = Math.max(max, val);\n            min = Math.min(min, val);\n        }\n\n        if (max == min) return 0; // All elements are the same\n\n        // Calculate bucket size and count based on the Pigeonhole Principle\n        int bucketSize = Math.max(1, (max - min) / (nums.length - 1));\n        int bucketCount = (max - min) / bucketSize + 1;\n\n        // Create buckets, each storing only the min and max value within it\n        int[] bucketMin = new int[bucketCount];\n        int[] bucketMax = new int[bucketCount];\n        Arrays.fill(bucketMin, Integer.MAX_VALUE);\n        Arrays.fill(bucketMax, Integer.MIN_VALUE);\n\n        // Pass 2: Distribute numbers into buckets\n        for (int val : nums) {\n            int bucketIndex = (val - min) / bucketSize;\n            bucketMin[bucketIndex] = Math.min(bucketMin[bucketIndex], val);\n            bucketMax[bucketIndex] = Math.max(bucketMax[bucketIndex], val);\n        }\n\n        // Pass 3: Calculate the maximum gap between non-empty buckets\n        int prevMax = min; // Start with the global min\n        int maxGap = 0;\n\n        for (int i = 0; i < bucketCount; i++) {\n            // Skip empty buckets\n            if (bucketMin[i] == Integer.MAX_VALUE) {\n                continue;\n            }\n\n            // The maximum gap must be between the max of a previous bucket and the min of a current one.\n            maxGap = Math.max(maxGap, bucketMin[i] - prevMax);\n            // Update the previous max for the next iteration\n            prevMax = bucketMax[i];\n        }\n\n        return maxGap;\n    }\n\n    public static void main(String[] args) {\n        // Example 1: The user's original example\n        int[] nums1 = {3, 6, 9, 1};\n        System.out.println(\"For [3, 6, 9, 1], Maximum Gap is: \" + maximumGap(nums1));\n        // Expected: 3.\n        // Sorted form is [1, 3, 6, 9].\n        // Gaps are (3-1)=2, (6-3)=3, (9-6)=3. The max is 3.\n\n        // Example 2: An array with an empty bucket in the middle\n        int[] nums2 = {1, 10, 5};\n        System.out.println(\"For [1, 10, 5], Maximum Gap is: \" + maximumGap(nums2));\n        // Expected: 5.\n        // Sorted form is [1, 5, 10].\n        // Gaps are (5-1)=4, (10-5)=5. The max is 5.\n        // The algorithm will place 1, 5, and 10 in different buckets, and find the gap between them.\n\n        // Example 3: Less than 2 elements\n        int[] nums3 = {100};\n        System.out.println(\"For [100], Maximum Gap is: \" + maximumGap(nums3));\n        // Expected: 0. The array has fewer than two elements.\n    }\n}" }, { "name": "MaximumProduct", "subcat": "", "link": "", "code": "package leetcode.array;\n\npublic class MaximumProduct {\n\n    public int maximumProduct(int[] nums) {\n        int max1 = Integer.MIN_VALUE;\n        int max2 = Integer.MIN_VALUE;\n        int max3 = Integer.MIN_VALUE;\n\n        int min1 = Integer.MAX_VALUE;\n        int min2 = Integer.MAX_VALUE;\n\n        for (int num : nums) {\n            // Find the three largest numbers\n            if (num > max1) {\n                max3 = max2;\n                max2 = max1;\n                max1 = num;\n            } else if (num > max2) {\n                max3 = max2;\n                max2 = num;\n            } else if (num > max3) {\n                max3 = num;\n            }\n\n            // Find the two smallest numbers\n            if (num < min1) {\n                min2 = min1;\n                min1 = num;\n            } else if (num < min2) {\n                min2 = num;\n            }\n        }\n\n        // The maximum product can be either the product of the three largest numbers\n        return Math.max(max1 * max2 * max3, min1 * min2 * max1);\n    }\n\n\n    public static void main(String[] args) {\n        int[] nums = {-100, -98, -1, 2, 3, 4};\n        System.out.println(new MaximumProduct().maximumProduct(nums));\n    }\n}\n" }, { "name": "MergeSortedArray", "subcat": "", "link": "https://leetcode.com/problems/merge-sorted-array/", "code": "package leetcode.array;\n\nimport java.util.Arrays;\n\n\n// LeetCode 88: Merge Sorted Array\n//\n// Problem Statement:\n// You are given two integer arrays, `nums1` and `nums2`, sorted in non-decreasing order,\n// and two integers `m` and `n`, representing the number of elements in `nums1` and `nums2`\n// respectively.\n//\n// Merge `nums2` into `nums1` as a single sorted array.\n//\n// The final sorted array should not be returned by the function, but instead be stored\n// inside the array `nums1`. To accommodate this, `nums1` has a length of `m + n`,\n// where the first `m` elements denote the elements that should be merged, and the last `n`\n// elements are set to 0 and should be ignored.\n//\n// Example:\n// Input: nums1 = [1,2,3,0,0,0], m = 3, nums2 = [2,5,6], n = 3\n// Output: [1,2,2,3,5,6]\n\npublic class MergeSortedArray {\n\n\n    public static void merge(int[] nums1, int m, int[] nums2, int n) {\n        // Pointer for the last valid element in the initial part of nums1\n        int i = m - 1;\n        // Pointer for the last element in nums2\n        int j = n - 1;\n        // Pointer for the last position in the merged array (the end of nums1)\n        int k = m + n - 1;\n\n        // Loop as long as there are elements in nums2 to merge\n        while (j >= 0) {\n            // Check if there are still elements in nums1 to compare and if the\n            // element in nums1 is larger than the element in nums2.\n            if (i >= 0 && nums1[i] > nums2[j]) {\n                // Place the larger element from nums1 at the end\n                nums1[k] = nums1[i];\n                i--;\n            } else {\n                // Place the element from nums2 (it's either larger or we're out of nums1 elements)\n                nums1[k] = nums2[j];\n                j--;\n            }\n            // Move the write pointer to the left\n            k--;\n        }\n    }\n\n    public static void main(String[] args) {\n        // Example 1: Standard case\n        int[] nums1_case1 = {1, 2, 3, 0, 0, 0};\n        int m1 = 3;\n        int[] nums2_case1 = {2, 5, 6};\n        int n1 = 3;\n        merge(nums1_case1, m1, nums2_case1, n1);\n        System.out.println(\"Case 1 Merged Array: \" + Arrays.toString(nums1_case1));\n        // Expected: [1, 2, 2, 3, 5, 6]\n    }\n}" }, { "name": "MoveZeroes", "subcat": "", "link": "https://leetcode.com/problems/move-zeroes/", "code": "package leetcode.array;\n\nimport java.util.Arrays;\n\n\n// LeetCode 283: Move Zeroes\n//\n// Problem Statement:\n// Given an integer array `nums`, move all 0's to the end of it while maintaining the\n// relative order of the non-zero elements.\n//\n// Note that you must do this in-place without making a copy of the array.\n//\n// Example:\n// Input: nums = [0,1,0,3,12]\n// Output: [1,3,12,0,0]\n\npublic class MoveZeroes {\n\n    /**\n     * Moves all zeroes to the end of the array in-place, maintaining the relative\n     * order of non-zero elements.\n     *\n     * This refactored solution uses the \"Snowplow\" or \"Write Pointer\" method.\n     *\n     * 1. A pointer `insertPosition` tracks the next valid spot for a non-zero element.\n     * 2. We iterate through the array. When we find a non-zero element, we place it\n     * at `insertPosition` and increment `insertPosition`.\n     * 3. After this first pass, all non-zero elements are at the front.\n     * 4. A second pass fills the rest of the array with zeroes.\n     *\n     * This approach is clearer and minimizes the number of write operations.\n     *\n     * @param nums The array to be modified.\n     */\n    public static void moveZeroes(int[] nums) {\n        if (nums == null || nums.length == 0) {\n            return;\n        }\n\n        int insertPosition = 0;\n\n        // Pass 1: Move all non-zero elements to the front of the array.\n        for (int num : nums) {\n            if (num != 0) {\n                nums[insertPosition] = num;\n                insertPosition++;\n            }\n        }\n\n        // Pass 2: Fill the remaining part of the array with zeroes.\n        while (insertPosition < nums.length) {\n            nums[insertPosition] = 0;\n            insertPosition++;\n        }\n    }\n\n    public static void main(String[] args) {\n        // Your original test case\n        int[] nums1 = {0, 1, 0, 3, 12};\n        moveZeroes(nums1);\n        System.out.println(\"For [0, 1, 0, 3, 12], result is: \" + Arrays.toString(nums1));\n        // Expected: [1, 3, 12, 0, 0]\n    }\n}" }, { "name": "NextPermutation", "subcat": "", "link": "https://leetcode.com/problems/next-permutation/", "code": "package leetcode.array;\n\nimport java.util.Arrays;\n\n\n// LeetCode 31: Next Permutation\n//\n// Problem Statement:\n// Implement `next permutation`, which rearranges numbers into the lexicographically next\n// greater permutation of numbers.\n//\n// If such an arrangement is not possible (i.e., the array is already in descending order),\n// the array must be rearranged as the lowest possible order (i.e., sorted in ascending order).\n//\n// The replacement must be in-place and use only constant extra memory.\n//\n// Example 1:\n// Input: nums = [1,2,3]\n// Output: [1,3,2]\n//\n// Example 2:\n// Input: nums = [3,2,1]\n// Output: [1,2,3]\n//\n// Example 3:\n// Input: nums = [1,1,5]\n// Output: [1,5,1]\n\npublic class NextPermutation {\n\n    /**\n     * ### Intuition Behind the Algorithm\n     *\n     * The problem asks us to find the very next \"larger\" number we can form by rearranging the\n     * digits, just like finding the next word in a dictionary. Let's think about how we would\n     * do this manually for a number like `236541`.\n     *\n     * 1.  **Goal:** To make the number larger, but only by the smallest possible amount. This means we\n     * should try to change the rightmost digits first.\n     *\n     * 2.  **Find the \"Pivot\":** We scan the number from right to left.\n     * - `1`\n     * - `41`\n     * - `541`\n     * - `6541`\n     * The sequence `6, 5, 4, 1` is in descending order. We cannot rearrange just this part to make\n     * a larger number. The first digit we encounter that is *smaller* than its right neighbor is `3`\n     * (because `3 < 6`). This is our **pivot**. This is the digit we need to increase to get the\n     * next permutation. Your code finds this pivot and stores its index in `pi`.\n     *\n     * 3.  **Find the Successor:** We need to replace the pivot (`3`) with the smallest possible digit\n     * from the suffix `[6, 5, 4, 1]` that is still *larger* than `3`. Scanning the suffix from\n     * right to left, the first number we find that is greater than `3` is `4`. This is our successor.\n     * Your code finds this and stores its index in `greater`.\n     *\n     * 4.  **Swap:** We swap the pivot and its successor.\n     * - `2, 3, 6, 5, 4, 1`  --> swap(3, 4) -->  `2, 4, 6, 5, 3, 1`\n     *\n     * 5.  **Sort the Suffix:** We've now made the prefix of the number larger (`23...` became `24...`).\n     * To make the *overall* number the smallest possible next permutation, the suffix that comes\n     * after the swapped pivot position must be in its smallest possible order (i.e., sorted ascendingly).\n     * - The suffix is `[6, 5, 3, 1]`.\n     * - A key observation is that this suffix is *always* in descending order. Therefore, the most\n     * efficient way to sort it ascendingly is to simply **reverse** it.\n     * - Reversing `[6, 5, 3, 1]` gives `[1, 3, 5, 6]`.\n     *\n     * 6.  **Final Result:**\n     * - `2, 4` + `1, 3, 5, 6`  -->  `[2, 4, 1, 3, 5, 6]`\n     *\n     * This is the exact sequence of steps your code implements.\n     *\n     * **Edge Case:** If the entire array is in descending order (e.g., `[3, 2, 1]`), no pivot `pi`\n     * will be found (it remains -1). This means we are at the largest possible permutation. The \"next\"\n     * one is the smallest, which is the array sorted in ascending order. Reversing the entire\n     * array achieves this.\n     */\n    public static void nextPermutation(int[] nums) {\n        if (nums == null || nums.length <= 1) return;\n\n        // Step 1: Find the first element from the right that is smaller than its next element.\n        // This is our \"pivot\".\n        int pi = -1; // pivot index\n        for (int i = nums.length - 2; i >= 0; i--) {\n            if (nums[i] < nums[i + 1]) {\n                pi = i;\n                break;\n            }\n        }\n\n        // Edge Case: If no such element is found, the array is in descending order (e.g., [3,2,1]).\n        // This is the largest permutation. The \"next\" is the smallest (sorted ascending).\n        if (pi == -1) {\n            reverse(0, nums.length - 1, nums);\n            return;\n        }\n\n        // Step 2: Find the smallest element in the suffix (to the right of the pivot)\n        // that is just larger than the pivot.\n        for (int i = nums.length - 1; i > pi; i--) {\n            if (nums[i] > nums[pi]) {\n                // Step 3: Swap the pivot with this successor element.\n                swap(pi, i, nums);\n                break;\n            }\n        }\n\n        // Step 4: Reverse the suffix to make it the smallest possible sequence.\n        reverse(pi + 1, nums.length - 1, nums);\n    }\n\n    public static void swap(int a, int b, int[] nums) {\n        int temp = nums[b];\n        nums[b] = nums[a];\n        nums[a] = temp;\n    }\n\n    public static void reverse(int left, int right, int[] nums) {\n        while (left < right) {\n            swap(left, right, nums);\n            left++;\n            right--;\n        }\n    }\n\n    public static void main(String[] args) {\n        // --- Test Cases ---\n\n        // Example 1: Standard case (from the user)\n        int[] nums1 = {2, 3, 6, 5, 4, 1};\n        System.out.println(\"Original: \" + Arrays.toString(nums1));\n        nextPermutation(nums1);\n        System.out.println(\"Next Permutation: \" + Arrays.toString(nums1));\n        // Expected: [2, 4, 1, 3, 5, 6]\n\n        // Example 2: Simple increasing sequence\n        int[] nums2 = {1, 2, 3};\n        System.out.println(\"\\nOriginal: \" + Arrays.toString(nums2));\n        nextPermutation(nums2);\n        System.out.println(\"Next Permutation: \" + Arrays.toString(nums2));\n        // Expected: [1, 3, 2]\n\n        // Example 3: Descending sequence (the largest permutation)\n        int[] nums3 = {3, 2, 1};\n        System.out.println(\"\\nOriginal: \" + Arrays.toString(nums3));\n        nextPermutation(nums3);\n        System.out.println(\"Next Permutation: \" + Arrays.toString(nums3));\n        // Expected: [1, 2, 3]\n\n        // Example 4: Array with duplicates\n        int[] nums4 = {1, 1, 5};\n        System.out.println(\"\\nOriginal: \" + Arrays.toString(nums4));\n        nextPermutation(nums4);\n        System.out.println(\"Next Permutation: \" + Arrays.toString(nums4));\n        // Expected: [1, 5, 1]\n    }\n}" }, { "name": "PivotIndex", "subcat": "", "link": "", "code": "package leetcode.array;\n\npublic class PivotIndex {\n\n    public static int pivotIndex(int[] nums) {\n        int n = nums.length;\n        int[] prefix = new int[n];\n        int[] postfix = new int[n];\n\n        int pre = 0;\n        int post = 0;\n\n        for (int i = 0; i < n; i++) {\n            prefix[i] = pre;\n            pre += nums[i];\n\n            postfix[n - 1 - i] = post;\n            post += nums[n - 1 - i];\n        }\n\n        for (int i = 0; i < n; i++) {\n            if (prefix[i] == postfix[i]) return i;\n        }\n\n        return -1;\n    }\n\n\n    public static void main(String[] args) {\n        int[] a = new int[]{1, 7, 3, 6, 5, 6};\n        // a = new int[]{2, 1, -1};\n        System.out.println(pivotIndex(a));\n    }\n\n}\n" }, { "name": "RelativeSortArray", "subcat": "", "link": "https://leetcode.com/problems/relative-sort-array/", "code": "package leetcode.array;\n\nimport java.util.Arrays;\n\n\n// LeetCode 1122: Relative Sort Array\n//\n// Problem Statement:\n// Given two arrays, `arr1` and `arr2`. The elements of `arr2` are distinct, and every\n// element in `arr2` is also in `arr1`.\n//\n// Sort the elements of `arr1` such that the relative ordering of items in `arr1` is the\n// same as the relative ordering of items in `arr2`. Elements that do not appear in `arr2`\n// should be placed at the end of `arr1` in ascending order.\n//\n// Constraints: The values in the arrays will be between 0 and 1000.\n//\n// Example:\n// Input: arr1 = [2,3,1,3,2,4,6,7,9,2,19], arr2 = [2,1,4,3,9,6]\n// Output: [2,2,2,1,4,3,3,9,6,7,19]\n\npublic class RelativeSortArray {\n\n    /**\n     * ### Intuition Behind the Solution (Counting Sort)\n     *\n     * 1.  **The Constraint is a Big Hint:** The problem states that the numbers in the arrays are\n     * within a limited range (0 to 1000). This is a classic signal to use a non-comparison-based\n     * sorting algorithm like **Counting Sort**, which can be much faster (linear time) than\n     * `O(N log N)` algorithms like QuickSort or MergeSort.\n     *\n     * 2.  **The Core Idea:** We need to handle two groups of numbers separately:\n     * - Group A: Numbers that are present in `arr2`. These must be ordered according to `arr2`.\n     * - Group B: Numbers that are *not* in `arr2`. These must be sorted ascendingly at the end.\n     *\n     * 3.  **The Algorithm's Plan (A Three-Phase Approach):**\n     * The code cleverly accomplishes this in three distinct phases.\n     *\n     * - **Phase 1: Frequency Counting.**\n     * - We can't sort or rearrange anything until we know how many of each number we have in `arr1`.\n     * - We create a \"counting\" array (or frequency map) of size 1001. `counting[x]` will store the\n     * number of times `x` appears in `arr1`.\n     * - We make a single pass through `arr1` to populate these counts.\n     *\n     * - **Phase 2: Enforce Relative Order.**\n     * - Now, we build the first part of our result. We iterate through `arr2` (e.g., `[2, 1, 4, ...]`).\n     * - For the first element `2`, we look up its count. Let's say it's 3. We then place three `2`s\n     * at the beginning of `arr1`.\n     * - For the next element `1`, we look up its count and place that many `1`s right after the `2`s.\n     * - We continue this for all elements in `arr2`. A write-pointer `index` keeps track of where to place the next number.\n     * - An important step here is to \"consume\" the counts. After placing three `2`s, we set `counting[2]` to `0` so they aren't processed again in the next phase.\n     *\n     * - **Phase 3: Append Remaining Elements.**\n     * - At this point, the `counting` array only has non-zero counts for numbers that were in `arr1` but not `arr2`.\n     * - The problem requires these to be sorted in ascending order.\n     * - We can achieve this simply by iterating through our `counting` array from index `0` to `1000`.\n     * - If `counting[i]` is greater than zero, we append `i` to our result array `arr1` that many times. Since we are iterating in ascending order of `i`, the remaining elements are automatically sorted.\n     */\n    public static int[] relativeSortArray(int[] arr1, int[] arr2) {\n        // Phase 1: Count the frequency of each number in arr1.\n        // The constraint `0 <= arr1[i] <= 1000` allows this efficient array-based counting.\n        int[] counting = new int[1001];\n        for (int val : arr1) {\n            counting[val]++;\n        }\n\n        // `index` will be our write-pointer for modifying arr1 in-place.\n        int index = 0;\n\n        // Phase 2: Place all elements from arr2 into arr1 in the correct relative order.\n        for (int val : arr2) {\n            // Place the element 'val' as many times as it was counted.\n            while (counting[val] > 0) {\n                arr1[index] = val;\n                index++;\n                counting[val]--; // Decrement the count to mark it as \"used\".\n            }\n        }\n\n        // Phase 3: Place all remaining elements (those not in arr2) at the end.\n        // We iterate through the entire possible range of numbers (0 to 1000).\n        for (int i = 0; i < counting.length; i++) {\n            // If the count for number 'i' is still positive, it means it was not in arr2.\n            while (counting[i] > 0) {\n                arr1[index] = i;\n                index++;\n                counting[i]--;\n            }\n        }\n\n        return arr1;\n    }\n\n\n    public static void main(String[] args) {\n        // Example 1: The user's original example\n        int[] arr1 = {2, 3, 1, 3, 2, 4, 6, 7, 9, 2, 19};\n        int[] arr2 = {2, 1, 4, 3, 9, 6};\n        System.out.println(\"Original arr1: \" + Arrays.toString(arr1));\n        System.out.println(\"Relative order arr2: \" + Arrays.toString(arr2));\n        System.out.println(\"Sorted arr1: \" + Arrays.toString(relativeSortArray(arr1, arr2)));\n        // Expected: [2, 2, 2, 1, 4, 3, 3, 9, 6, 7, 19]\n        // Explanation:\n        // - All three '2's come first, as 2 is first in arr2.\n        // - Then the single '1', as 1 is second in arr2.\n        // - And so on for 4, 3, 9, 6.\n        // - The remaining numbers (7, 19) are placed at the end in ascending order.\n    }\n}" }, { "name": "RemoveDuplicates", "subcat": "", "link": "https://leetcode.com/problems/remove-duplicates/", "code": "package leetcode.array;\n\nimport java.util.Arrays;\n\npublic class RemoveDuplicates {\n\n    /**\n     * ### LeetCode 26: Remove Duplicates from Sorted Array\n     *\n     * Problem:\n     * Given an integer array `nums` sorted in non-decreasing order, remove the duplicates\n     * in-place such that each unique element appears only once. The relative order of the\n     * elements should be kept the same.\n     *\n     * Return `k`, the number of unique elements. The first `k` elements of `nums` should\n     * hold the final result.\n     *\n     * ### Intuition Behind the Solution\n     *\n     * This is a classic \"two-pointer\" problem, specifically the \"fast-runner\" or \"read/write\" pattern.\n     *\n     * 1.  **The Pointers:**\n     * - `j` (the \"read\" pointer): This pointer iterates through the entire array from beginning to end to inspect every element.\n     * - `i` (the \"write\" pointer): This pointer marks the end of the valid, de-duplicated subarray. It only moves forward when we find a new unique element to add.\n     *\n     * 2.  **The Invariant:**\n     * - At any point during the iteration, the subarray `nums[0...i-1]` contains the processed, unique elements. `nums[i-1]` is the last unique element we have accepted.\n     *\n     * 3.  **The Core Logic:**\n     * - We start `i` and `j` at 1.\n     * - We compare the current element `nums[j]` with the last accepted unique element `nums[i-1]`.\n     * - If `nums[j]` is **different** from `nums[i-1]`, it means we have found a new unique element. We should add it to our valid subarray.\n     * - We do this by placing it at the `i`-th position (`nums[i] = nums[j]`) and then advancing our write pointer (`i++`).\n     * - If `nums[j]` is the **same** as `nums[i-1]`, we do nothing but advance `j` to find the next potential unique element.\n     *\n     * The final value of `i` will be the length of the de-duplicated array.\n     */\n    public static int removeDuplicates(int[] nums) {\n        if (nums.length == 0) return 0;\n\n        // 'i' is the write pointer. It marks the position for the next unique element.\n        int i = 1;\n        // 'j' is the read pointer. It scans the array.\n        for (int j = 1; j < nums.length; j++) {\n            // If we find an element that is different from the last unique element...\n            if (nums[j] != nums[i - 1]) {\n                // ...place it at the write position and advance the write pointer.\n                nums[i] = nums[j];\n                i++;\n            }\n        }\n\n        // 'i' is the length of the unique elements array.\n        return i;\n    }\n\n\n    /**\n     * ### LeetCode 80: Remove Duplicates from Sorted Array II\n     *\n     * Problem:\n     * Same as before, but this time, remove the duplicates in-place such that each unique\n     * element appears **at most twice**.\n     *\n     * ### Intuition Behind the Solution\n     *\n     * This is a brilliant generalization of the first problem. The core two-pointer idea remains the same,\n     * but the condition for accepting a new element changes.\n     *\n     * 1.  **The Invariant:**\n     * - The subarray `nums[0...i-1]` holds the valid result.\n     *\n     * 2.  **The Core Logic (The \"Look Back by 2\" Trick):**\n     * - How do we know if we can accept `nums[j]`? We can accept it if it doesn't create a sequence of three or more identical numbers.\n     * - The write pointer `i` is where we would place the new element. The valid elements before it are at `i-1` and `i-2`.\n     * - If `nums[j]` is the same as both `nums[i-1]` and `nums[i-2]`, it means we already have a pair, and this would be the third duplicate. We should skip it.\n     * - Therefore, we can accept `nums[j]` as long as it's **not** the same as the element at `nums[i-2]`.\n     * - The condition `nums[j] != nums[i-2]` elegantly covers this. If the subarray is `[..., 5, 5]` and `i` points to the next slot, `i-2` points to the first `5`. If `nums[j]` is also `5`, the condition `5 != 5` is false, and we correctly skip it. If `nums[j]` is `8`, the condition `8 != 5` is true, and we accept it.\n     *\n     * 3.  **Generalization:** This pattern can be extended. To allow at most `k` duplicates, the condition would be `if (i < k || nums[j] != nums[i - k])`.\n     */\n    public static int removeDuplicates_2(int[] nums) {\n        // If the array has 2 or fewer elements, no duplicates need to be removed.\n        if (nums.length <= 2) return nums.length;\n\n        // 'i' is the write pointer. We start at 2 because the first two elements\n        // are always valid (even if they are duplicates).\n        int i = 2;\n        // 'j' is the read pointer, also starting from the third element.\n        for (int j = 2; j < nums.length; j++) {\n            // Compare the current element `nums[j]` with the element two positions\n            // before the current write position `nums[i-2]`.\n            // If they are different, it's safe to add `nums[j]` without creating\n            // a sequence of more than two duplicates.\n            if (nums[j] != nums[i - 2]) {\n                nums[i] = nums[j];\n                i++;\n            }\n        }\n        return i;\n    }\n\n    public static void main(String[] args) {\n        // Using a more comprehensive test case\n        int[] originalNums = {0, 0, 1, 1, 1, 1, 2, 3, 3};\n        System.out.println(\"Original Array: \" + Arrays.toString(originalNums) + \"\\n\");\n\n        // --- Test for Part I (at most ONE occurrence) ---\n        int[] numsForPart1 = Arrays.copyOf(originalNums, originalNums.length);\n        int k1 = removeDuplicates(numsForPart1);\n        System.out.println(\"Part I (Remove Duplicates):\");\n        System.out.println(\"New length: \" + k1); // Expected: 4\n        System.out.print(\"Modified Array (first \" + k1 + \" elements): \");\n        for (int i = 0; i < k1; i++) {\n            System.out.print(numsForPart1[i] + \" \"); // Expected: 0 1 2 3\n        }\n        System.out.println(\"\\n\");\n\n        // --- Test for Part II (at most TWO occurrences) ---\n        int[] numsForPart2 = Arrays.copyOf(originalNums, originalNums.length);\n        int k2 = removeDuplicates_2(numsForPart2);\n        System.out.println(\"Part II (Remove Duplicates II):\");\n        System.out.println(\"New length: \" + k2); // Expected: 7\n        System.out.print(\"Modified Array (first \" + k2 + \" elements): \");\n        for (int i = 0; i < k2; i++) {\n            System.out.print(numsForPart2[i] + \" \"); // Expected: 0 0 1 1 2 3 3\n        }\n        System.out.println();\n    }\n}" }, { "name": "RotateArrayKTimes", "subcat": "", "link": "https://leetcode.com/problems/rotate-array-ktimes/", "code": "package leetcode.array;\n\nimport java.util.Arrays;\n\n\n// LeetCode 189: Rotate Array\n//\n// Problem Statement:\n// Given an integer array `nums`, rotate the array to the right by `k` steps, where `k` is non-negative.\n// The rotation should be done in-place with O(1) extra space.\n//\n// Example 1:\n// Input: nums = [1,2,3,4,5,6,7], k = 3\n// Output: [5,6,7,1,2,3,4]\n// Explanation:\n// rotate 1 step: [7,1,2,3,4,5,6]\n// rotate 2 steps: [6,7,1,2,3,4,5]\n// rotate 3 steps: [5,6,7,1,2,3,4]\n//\n// Example 2:\n// Input: nums = [-1,-100,3,99], k = 2\n// Output: [3,99,-1,-100]\n\npublic class RotateArrayKTimes {\n\n    /**\n     * Rotates the array `nums` to the right by `k` steps in-place.\n     *\n     * #### Concrete Example: `nums = [1,2,3,4,5,6,7]`, `k = 3`\n     * - `A = [1,2,3,4]`, `B = [5,6,7]`\n     * - **Initial:** `[1, 2, 3, 4, | 5, 6, 7]`\n     * - **Step 1 (Reverse All):** `[7, 6, 5, | 4, 3, 2, 1]`\n     * - **Step 2 (Reverse First k=3):** `[5, 6, 7, | 4, 3, 2, 1]`\n     * - **Step 3 (Reverse Remaining):** `[5, 6, 7, | 1, 2, 3, 4]`\n     * - **Final Result:** `[5, 6, 7, 1, 2, 3, 4]`\n     */\n    public static void rotate(int[] nums, int k) {\n        if (nums == null || nums.length == 0 || k == 0) {\n            return;\n        }\n\n        // Ensure k is within array bounds. Rotating by length is the same as no rotation.\n        k %= nums.length;\n\n        // Step 1: Reverse the entire array\n        reverse(nums, 0, nums.length - 1);\n\n        // Step 2: Reverse the first k elements\n        reverse(nums, 0, k - 1);\n\n        // Step 3: Reverse the remaining n-k elements\n        reverse(nums, k, nums.length - 1);\n    }\n\n    public static void reverse(int[] nums, int start, int end) {\n        while (start < end) {\n            int temp = nums[start];\n            nums[start] = nums[end];\n            nums[end] = temp;\n            start++;\n            end--;\n        }\n    }\n\n    public static void main(String[] args) {\n\n        // Example 1: Standard case\n        int[] nums1 = {1, 2, 3, 4, 5, 6, 7};\n        int k1 = 3;\n        rotate(nums1, k1);\n        System.out.println(\"Rotating [1,2,3,4,5,6,7] by 3 gives: \" + Arrays.toString(nums1));\n        // Expected: [5, 6, 7, 1, 2, 3, 4]\n    }\n}" }, { "name": "SortColors", "subcat": "", "link": "https://leetcode.com/problems/sort-colors/", "code": "package leetcode.array;\n\nimport java.util.Arrays;\n\n\n// LeetCode 75: Sort Colors\n//\n// Problem Statement:\n// Given an array `nums` with `n` objects colored red, white, or blue, sort them in-place\n// so that objects of the same color are adjacent, with the order red, white, and blue.\n//\n// We will use the integers 0, 1, and 2 to represent the color red, white, and blue, respectively.\n// You must solve this problem without using the library's sort function.\n//\n// Example:\n// Input: nums = [2,0,2,1,1,0]\n// Output: [0,0,1,1,2,2]\n\npublic class SortColors {\n\n    /**\n     * ### Approach 1: The One-Pass Overwriting Method\n     *\n     * #### Intuition\n     * This is a very clever, but less intuitive, single-pass algorithm that functions like an\n     * in-place counting sort.\n     *\n     * 1.  **The Pointers as Boundaries:** The pointers `n0`, `n1`, `n2` keep track of the end\n     * position (or the count) of the `0`, `1`, and `2` sections seen so far.\n     *\n     * 2.  **The Overwrite Cascade:** The core logic is a cascade of overwrites. When the loop at\n     * index `i` finds a number, it assumes the space it now occupies might be needed by a\n     * smaller number.\n     * - If `nums[i] == 0`: It knows it needs to place a `0`. To make space, it first places a `2`\n     * at the end of the known elements, then overwrites it with a `1`, and finally overwrites that\n     * with the `0`. This effectively \"shifts\" the conceptual boundaries of the `1`s and `2`s\n     * one step to the right.\n     * - If `nums[i] == 1`: It does the same, but only for `2` and `1`.\n     * - If `nums[i] == 2`: It just places the `2`.\n     *\n     * This method is fast but can be difficult to reason about during an interview.\n     */\n    public static void sortColors(int[] nums, int n) {\n        int n0 = -1, n1 = -1, n2 = -1;\n        for (int i = 0; i < n; ++i) {\n            if (nums[i] == 0) {\n                nums[++n2] = 2; // Make space for a 2\n                nums[++n1] = 1; // Overwrite with a 1 to make space for a 1\n                nums[++n0] = 0; // Place the 0 in its final spot\n            } else if (nums[i] == 1) {\n                nums[++n2] = 2; // Make space for a 2\n                nums[++n1] = 1; // Place the 1\n            } else if (nums[i] == 2) {\n                nums[++n2] = 2; // Place the 2\n            }\n        }\n    }\n\n    /**\n     * ### Approach 2: The Dutch National Flag Algorithm\n     *\n     * #### Intuition\n     * This is the standard, more intuitive in-place swapping algorithm for this problem. It partitions\n     * the array into three sections in one pass.\n     *\n     * 1.  **The Four Sections:** We imagine the array is divided into four sections:\n     * - `[ all 0s | all 1s | unknown | all 2s ]`\n     *\n     * 2.  **The Three Pointers:**\n     * - `red` (or `low`): Points to the boundary right after the last `0`.\n     * - `white` (or `mid`): The current element being considered. It scans the `unknown` section.\n     * - `blue` (or `high`): Points to the boundary right before the first `2`.\n     *\n     * 3.  **The Logic:** We iterate as long as `white <= blue` (i.e., as long as there is an `unknown` section).\n     * - If `nums[white]` is `0`: The `0` is in the wrong place. We swap it with the element at `red`\n     * and increment both `red` and `white`.\n     * - If `nums[white]` is `1`: The `1` is already in its correct potential section. We just move on by\n     * incrementing `white`.\n     * - If `nums[white]` is `2`: The `2` is in the wrong place. We swap it with the element at `blue`\n     * and decrement `blue`. **Crucially, we do not increment `white`** because the element we just\n     * swapped into the `white` position is unknown and needs to be processed.\n     */\n    public static void sortColors(int[] nums) {\n        int red = 0;   // `red` pointer tracks the boundary of the 0s section\n        int white = 0; // `white` pointer is the current element under consideration\n        int blue = nums.length - 1; // `blue` pointer tracks the boundary of the 2s section\n\n        while (white <= blue) {\n            int temp;\n            if (nums[white] == 0) {\n                // If it's a 0, swap it into the red section\n                temp = nums[white];\n                nums[white] = nums[red];\n                nums[red] = temp;\n                white++;\n                red++;\n            } else if (nums[white] == 1) {\n                // If it's a 1, it's in the right place, just move on\n                white++;\n            } else { // nums[white] == 2\n                // If it's a 2, swap it into the blue section\n                temp = nums[white];\n                nums[white] = nums[blue];\n                nums[blue] = temp;\n                blue--;\n                // Do not increment white, as the new nums[white] needs to be processed\n            }\n        }\n    }\n\n    public static void main(String[] args) {\n        System.out.println(\"--- Testing Both Sort Colors Methods ---\");\n\n        int[] originalArray = {2, 0, 2, 1, 1, 0};\n        System.out.println(\"Original Array: \" + Arrays.toString(originalArray) + \"\\n\");\n\n        // --- Test for Approach 1 (Overwriting Method) ---\n        int[] numsForMethod1 = Arrays.copyOf(originalArray, originalArray.length);\n        sortColors(numsForMethod1, numsForMethod1.length);\n        System.out.println(\"Result from Method 1 (Overwriting): \" + Arrays.toString(numsForMethod1));\n        // Expected: [0, 0, 1, 1, 2, 2]\n\n        // --- Test for Approach 2 (Dutch National Flag) ---\n        int[] numsForMethod2 = Arrays.copyOf(originalArray, originalArray.length);\n        sortColors(numsForMethod2);\n        System.out.println(\"Result from Method 2 (Dutch Flag):  \" + Arrays.toString(numsForMethod2));\n        // Expected: [0, 0, 1, 1, 2, 2]\n    }\n}" }, { "name": "ThirdMax", "subcat": "", "link": "", "code": "package leetcode.array;\n\npublic class ThirdMax {\n\n    public static int thirdMax(int[] nums) {\n        // Use nullable Integer objects to correctly handle the Integer.MIN_VALUE edge case\n        // and to track if a max has been found yet.\n        Integer firstMax = null;\n        Integer secondMax = null;\n        Integer thirdMax = null;\n\n        for (Integer num : nums) { // Use Integer wrapper to allow comparison with null\n            // Skip duplicates\n            if (num.equals(firstMax) || num.equals(secondMax) || num.equals(thirdMax)) {\n                continue;\n            }\n\n            // The cascade update logic\n            if (firstMax == null || num > firstMax) {\n                thirdMax = secondMax;\n                secondMax = firstMax;\n                firstMax = num;\n            } else if (secondMax == null || num > secondMax) {\n                thirdMax = secondMax;\n                secondMax = num;\n            } else if (thirdMax == null || num > thirdMax) {\n                thirdMax = num;\n            }\n        }\n\n        // If thirdMax is null, it means there were fewer than three distinct numbers.\n        // In this case, we must return the absolute maximum (firstMax).\n        return thirdMax == null ? firstMax : thirdMax;\n    }\n\n}\n" }], "Linked List": [{ "name": "CycleDetection", "subcat": "", "link": "", "code": "package leetcode.linkedList;\n\npublic class CycleDetection {\n\n    public static Boolean cycle(Node head) {\n        Node fast = head;\n        Node slow = head;\n        while (fast != null && fast.next != null) {\n            slow = slow.next;\n            fast = fast.next.next;\n            // If slow and fast meet at the same node, there is a cycle\n            if (slow == fast) {\n                return true;\n            }\n        }\n        return false;\n    }\n\n\n    // Return the node where the cycle begins. If there is no cycle, return null.\n    public ListNode detectCycle(ListNode head) {\n        ListNode slow = head;\n        ListNode fast = head;\n\n        while (fast != null && fast.next != null) {\n            slow = slow.next;\n            fast = fast.next.next;\n            if (slow == fast) break;\n        }\n\n        if (fast == null || fast.next == null) return null; // No cycle\n\n        fast = head;\n        while (fast != slow) {\n            slow = slow.next;\n            fast = fast.next;\n        }\n\n        return slow;\n    }\n\n\n    public static void main(String[] args) {\n        Node node1 = new Node(2);\n        Node node2 = new Node(3);\n        Node node3 = new Node(4);\n        node1.next = node2;\n        node2.next = node3;\n        node3.next = node2;\n        System.out.println(\"cycle  : \" + cycle(node1));\n    }\n}\n" }, { "name": "FlattenMultiLevel", "subcat": "", "link": "https://leetcode.com/problems/flatten-multi-level/", "code": "package leetcode.linkedList;\n\n/**\n * LeetCode Problem 430: Flatten a Multilevel Doubly Linked List\n *\n * You are given a doubly linked list, which contains nodes that have a next pointer,\n * a previous pointer, and an additional child pointer. This child pointer may or may\n * not point to a separate doubly linked list, also containing these special nodes.\n * These child lists may have one or more children of their own, and so on, to\n * produce a multilevel data structure.\n *\n * Given the head of the first level of the list, flatten the list so that all\n * the nodes appear in a single-level, doubly linked list. The nodes should be ordered\n * according to a preorder traversal of the multilevel structure.\n *\n * After flattening, the child pointers should all be set to null.\n *\n * Example:\n * Input: head = [1,2,3,4,5,6,null,null,null,7,8,9,10,null,null,11,12]\n *\n * Conceptual Structure:\n * 1---2---3---4---5---6--NULL\n * |\n * 7---8---9---10--NULL\n * |\n * 11--12--NULL\n *\n * Output: [1,2,3,7,8,11,12,9,10,4,5,6]\n */\n\npublic class FlattenMultiLevel {\n\n    // Definition for a Node.\n    static class Node {\n        public int val;\n        public Node prev;\n        public Node next;\n        public Node child;\n\n        // Constructor for easier testing\n        public Node(int _val) {\n            this.val = _val;\n        }\n    }\n\n    private Node flattenAndConnect(Node head, Node rest) {\n        // Base Case: If the current list is empty, the result is just the rest of the list.\n        if (head == null) {\n            return rest;\n        }\n\n        // 1. (Post-order) First, recursively flatten the `head.next` list.\n        // This call establishes the link between the flattened `next` list and the `rest`.\n        Node flattenedNext = flattenAndConnect(head.next, rest);\n\n        // 2. (Post-order) Then, recursively flatten the `head.child` list.\n        // The key is that we pass `flattenedNext` as the \"rest\" for the child list.\n        // This connects the tail of the flattened child list to the head of the flattened next list.\n        Node flattenedChild = flattenAndConnect(head.child, flattenedNext);\n\n        // 3. Now, connect the current `head` to the start of its processed child list.\n        head.next = flattenedChild;\n        if (flattenedChild != null) {\n            flattenedChild.prev = head; // Set the crucial back-pointer\n        }\n\n        // 4. Clear the child pointer as required by the problem.\n        head.child = null;\n\n        return head;\n    }\n\n    @SuppressWarnings(\"all\")\n    Node flatten(Node head) {\n        flattenAndConnect(head, null);\n        return head;\n    }\n\n    public static void main(String[] args) {\n        // Building the example list is complex, let's build a simpler one:\n        // 1 -- 2 -- 3 -- 4\n        //      |\n        //      5 -- 6\n        Node head = new Node(1);\n        head.next = new Node(2);\n        head.next.prev = head;\n        head.next.next = new Node(3);\n        head.next.next.prev = head.next;\n        head.next.next.next = new Node(4);\n        head.next.next.next.prev = head.next.next;\n\n        head.next.child = new Node(5);\n        head.next.child.next = new Node(6);\n        head.next.child.next.prev = head.next.child;\n\n        FlattenMultiLevel solution = new FlattenMultiLevel();\n        solution.flatten(head);\n\n        System.out.println(\"Flattened:\");\n        Node current = head;\n        while (current != null) {\n            System.out.print(current.val + \" <-> \");\n            current = current.next;\n        }\n\n        System.out.println(\"null\");\n    }\n\n}\n\n" }, { "name": "LinkedListIntersection", "subcat": "", "link": "", "code": "package leetcode.linkedList;\n\n\npublic class LinkedListIntersection {\n\n    // Exchange the headA and headB to account for the length difference\n    public static ListNode getIntersectionNode(ListNode headA, ListNode headB) {\n        ListNode A = headA;\n        ListNode B = headB;\n\n        while (A != B) {\n            A = A == null ? headB : A.next;\n            B = B == null ? headA : B.next;\n        }\n\n        return A;\n    }\n\n\n    public static void main(String[] args) {\n        // Creating the intersecting part of the list [8 -> 4 -> 5]\n        ListNode intersectingNode = new ListNode(8);\n        intersectingNode.next = new ListNode(4);\n        intersectingNode.next.next = new ListNode(5);\n\n        // Creating List A: [4 -> 1 -> 8 -> 4 -> 5]\n        ListNode listA = new ListNode(4);\n        listA.next = new ListNode(1);\n        listA.next.next = intersectingNode;  // Points to the intersection at node 8\n\n        // Creating List B: [5 -> 6 -> 1 -> 8 -> 4 -> 5]\n        ListNode listB = new ListNode(5);\n        listB.next = new ListNode(6);\n        listB.next.next = new ListNode(1);\n        listB.next.next.next = intersectingNode;  // Points to the intersection at node 8\n\n\n        System.out.println(getIntersectionNode(listA, listB));\n    }\n\n}\n" }, { "name": "ListNode", "subcat": "", "link": "", "code": "package leetcode.linkedList;\n\npublic class ListNode {\n    public int val;\n    public ListNode next;\n\n    public ListNode() {}\n\n    public ListNode(int val) {\n        this.val = val;\n    }\n\n    public ListNode(int val, ListNode next) {\n        this.val = val;\n        this.next = next;\n    }\n}\n" }, { "name": "MergeTwoSortedLinkedList", "subcat": "", "link": "", "code": "package leetcode.linkedList;\n\npublic class MergeTwoSortedLinkedList {\n\n    public static Node mergeTwoLists(Node list1, Node list2) {\n        Node dummy = new Node(0);\n        Node curr = dummy;\n        while (list1 != null && list2 != null) {\n            if (list1.data <= list2.data) {\n                curr.next = list1;\n                list1 = list1.next;\n            } else {\n                curr.next = list2;\n                list2 = list2.next;\n            }\n            curr = curr.next;\n        }\n\n        if (list1 != null) {\n            curr.next = list1;\n        } else {\n            curr.next = list2;\n        }\n\n        return dummy.next;\n    }\n\n    public static Node mergeTwoListsRecursion(Node l1, Node l2) {\n        if (l1 == null) return l2;\n        if (l2 == null) return l1;\n        if (l1.data < l2.data) {\n            l1.next = mergeTwoListsRecursion(l1.next, l2);\n            return l1;\n        } else {\n            l2.next = mergeTwoListsRecursion(l1, l2.next);\n            return l2;\n        }\n    }\n\n}\n" }, { "name": "MiddleElement", "subcat": "", "link": "", "code": "package leetcode.linkedList;\n\npublic class MiddleElement {\n\n\n    public static int middle(Node head) {\n        Node fast = head;\n        Node slow = head;\n\n        while (fast != null && fast.next != null) {\n            //1. When length is odd, slow will point to the middle element\n            //2. When length is even, slow will point to the second middle element\n            slow = slow.next;\n            // 1. When length is odd, fast will point to the last element\n            // 2. When length is even, fast will point to null\n            fast = fast.next.next;\n        }\n\n        return (slow != null) ? slow.data : Integer.MIN_VALUE;\n    }\n\n}\n" }, { "name": "Node", "subcat": "", "link": "", "code": "package leetcode.linkedList;\n\npublic class Node {\n    int data;\n    Node next;\n    Node(int data) {\n        this.data = data;\n        this.next = null;\n    }\n}\n" }, { "name": "OddEvenLinkedList", "subcat": "", "link": "https://leetcode.com/problems/odd-even-linked-list/", "code": "package leetcode.linkedList;\n\n\n/**\n * LeetCode Problem 328: Odd Even Linked List\n *\n * Given the head of a singly linked list, group all the nodes with odd indices\n * together followed by the nodes with even indices, and return the reordered list.\n *\n * The first node is considered odd, the second node is even, and so on.\n *\n * Note that the relative order within both the odd and even groups should remain\n * as it was in the input.\n *\n * You must solve the problem in O(1) extra space complexity and O(n) time complexity.\n *\n * Example 1:\n * Input: head = [1,2,3,4,5]\n * Output: [1,3,5,2,4]\n *\n * Example 2:\n * Input: head = [2,1,3,5,6,4,7]\n * Output: [2,3,6,7,1,5,4]\n */\npublic class OddEvenLinkedList {\n\n    @SuppressWarnings(\"all\")\n    public ListNode oddEvenList(ListNode head) {\n        // Handle edge cases where the list has 0, 1, or 2 nodes.\n        if (head == null || head.next == null || head.next.next == null) {\n            return head;\n        }\n\n        ListNode oddHead = head;\n        ListNode evenHead = head.next;\n        ListNode oddTail = oddHead;\n        ListNode evenTail = evenHead;\n\n        // We iterate through the rest of the list, starting from the third node.\n        ListNode current = head.next.next;\n        boolean isOdd = true; // The third node is an odd-indexed node.\n\n        while (current != null) {\n            if (isOdd) {\n                // Append the current node to the end of the odd list.\n                oddTail.next = current;\n                oddTail = current;\n            } else {\n                // Append the current node to the end of the even list.\n                evenTail.next = current;\n                evenTail = current;\n            }\n            // Move to the next node and flip the flag.\n            current = current.next;\n            isOdd = !isOdd;\n        }\n\n        // After the loop, we need to terminate the even list properly.\n        evenTail.next = null;\n        // Link the tail of the odd list to the head of the even list.\n        oddTail.next = evenHead;\n\n        // The head of the reordered list is the original head (which is also oddHead).\n        return oddHead;\n    }\n\n\n    // Helper method to print the list for verification\n    public static void printList(ListNode head) {\n        System.out.print(\"List: \");\n        ListNode current = head;\n        while (current != null) {\n            System.out.print(current.val + \" -> \");\n            current = current.next;\n        }\n        System.out.println(\"null\");\n    }\n\n    public static void main(String[] args) {\n        // Create a test list: 1 -> 2 -> 3 -> 4 -> 5\n        ListNode head = new ListNode(1);\n        head.next = new ListNode(2);\n        head.next.next = new ListNode(3);\n        head.next.next.next = new ListNode(4);\n        head.next.next.next.next = new ListNode(5);\n\n        System.out.println(\"Original list:\");\n        printList(head);\n\n        OddEvenLinkedList solution = new OddEvenLinkedList();\n        ListNode reorderedHead = solution.oddEvenList(head);\n\n        System.out.println(\"Reordered list:\");\n        printList(reorderedHead); // Expected: 1 -> 3 -> 5 -> 2 -> 4 -> null\n    }\n\n}\n" }, { "name": "PalindromicLinkedList", "subcat": "", "link": "https://leetcode.com/problems/palindromic-linked-list/", "code": "package leetcode.linkedList;\n\nimport java.util.Objects;\n\n/**\n * LeetCode Problem 234: Palindrome Linked List\n *\n * Given the head of a singly linked list, return true if it is a palindrome\n * or false otherwise.\n *\n * A palindrome is a sequence that reads the same forwards and backwards.\n *\n * Can you do it in O(n) time and O(1) space?\n *\n * Example 1:\n * Input: head = [1,2,2,1]\n * Output: true\n *\n * Example 2:\n * Input: head = [1,2]\n * Output: false\n */\npublic class PalindromicLinkedList {\n\n\n    public static boolean isPalindrome(Node head) {\n        // Edge case: an empty or single-node list is a palindrome.\n        if (head == null || head.next == null) {\n            return true;\n        }\n\n        // Step 1: Find the middle of the linked list.\n        // This loop places `slow` at the middle (odd) or upper-middle (even) node.\n        Node slow = head;\n        Node fast = head;\n        Node prev_of_slow = head; // We need a pointer to the node before slow to sever the list.\n\n        while (fast != null && fast.next != null) {\n            prev_of_slow = slow;\n            slow = slow.next;\n            fast = fast.next.next;\n        }\n\n\n        // After the loop:\n        // - For odd lists, `fast` is at the last node. `slow` is at the middle.\n        // - For even lists, `fast` is null. `slow` is at the start of the second half.\n\n        Node secondHalfHead;\n\n        // Step 2: Sever the first half and identify the head of the second half.\n        if (fast != null) { // Odd number of nodes, `slow` is the middle node.\n            secondHalfHead = slow.next; // The second half starts after the middle.\n            slow.next = null; // The middle node has no next in the first half.\n        } else { // Even number of nodes, `slow` is the start of the second half.\n            secondHalfHead = slow;\n            prev_of_slow.next = null; // Sever the link from the first half.\n        }\n\n        // Step 3: Reverse the second half of the linked list.\n        secondHalfHead = reverseList(secondHalfHead);\n\n        // Step 4: Compare the first half with the reversed second half.\n        Node firstHalfPointer = head;\n        Node secondHalfPointer = secondHalfHead;\n        boolean isPalindrome = true;\n\n        while (firstHalfPointer != null && secondHalfPointer != null) {\n            if (firstHalfPointer.data != secondHalfPointer.data) {\n                isPalindrome = false;\n                break;\n            }\n            firstHalfPointer = firstHalfPointer.next;\n            secondHalfPointer = secondHalfPointer.next;\n        }\n\n        return isPalindrome;\n    }\n\n    private static Node reverseList(Node head) {\n        Node previous = null;\n        Node current = head;\n        Node next = null;\n        while (current != null) {\n            next = current.next;\n            current.next = previous;\n            previous = current;\n            current = next;\n        }\n        return previous;\n    }\n\n    // Helper method to print the list for verification\n    public static void printList(Node head) {\n        System.out.print(\"List: \");\n        Node current = head;\n        while (current != null) {\n            System.out.print(current.data + \" -> \");\n            current = current.next;\n        }\n        System.out.println(\"null\");\n    }\n\n\n    public static void main(String[] args) {\n        // Test Case 1: Palindrome with even nodes\n        Node head1 = new Node(1);\n        head1.next = new Node(2);\n        head1.next.next = new Node(2);\n        head1.next.next.next = new Node(1);\n        System.out.println(\"Testing list:\");\n        printList(head1);\n        System.out.println(\"Is Palindrome? \" + isPalindrome(head1)); // Expected: true\n\n        // Test Case 2: Palindrome with odd nodes\n        Node head2 = new Node(1);\n        head2.next = new Node(2);\n        head2.next.next = new Node(3);\n        head2.next.next.next = new Node(2);\n        head2.next.next.next.next = new Node(1);\n        System.out.println(\"\\nTesting list:\");\n        printList(head2);\n        System.out.println(\"Is Palindrome? \" + isPalindrome(head2)); // Expected: true\n\n        // Test Case 3: Not a palindrome\n        Node head3 = new Node(1);\n        head3.next = new Node(2);\n        System.out.println(\"\\nTesting list:\");\n        printList(head3);\n        System.out.println(\"Is Palindrome? \" + isPalindrome(head3)); // Expected: false\n    }\n}\n\n" }, { "name": "PartitionList", "subcat": "", "link": "https://leetcode.com/problems/partition-list/", "code": "package leetcode.linkedList;\n\n/**\n * LeetCode Problem 86: Partition List\n *\n * Given the head of a linked list and a value x, partition it such that all\n * nodes less than x come before nodes greater than or equal to x.\n *\n * You should preserve the original relative order of the nodes in each of the\n * two partitions.\n *\n * Example 1:\n * Input: head = [1,4,3,2,5,2], x = 3\n * Output: [1,2,2,4,3,5]\n *\n * Example 2:\n * Input: head = [2,1], x = 2\n * Output: [1,2]\n */\npublic class PartitionList {\n\n\n    public static ListNode partition(ListNode head, int x) {\n        ListNode dummySmall = new ListNode(-1);\n        ListNode dummyLarge = new ListNode(-1);\n\n        ListNode small = dummySmall;\n        ListNode large = dummyLarge;\n\n        // `current` will iterate through the original input list.\n        ListNode current = head;\n\n        while (current != null) {\n            // Based on the node's value, we append it to the appropriate list.\n            if (current.val < x) {\n                // Add the current node to the end of the \"small\" list.\n                small.next = current;\n                small = small.next; // Move the small tail pointer forward.\n            } else {\n                // Add the current node to the end of the \"large\" list.\n                large.next = current;\n                large = large.next; // Move the large tail pointer forward.\n            }\n            // Move to the next node in the original list.\n            current = current.next;\n        }\n\n        // Important: terminate the \"large\" list to avoid potential cycles.\n        large.next = null;\n        // Connect the \"small\" list with the \"large\" list.\n        small.next = dummyLarge.next;\n\n        // The head of our final partitioned list is `dummySmall.next`.\n        return dummySmall.next;\n    }\n\n\n    // Helper method to print the list for verification\n    public static void printList(ListNode head) {\n        System.out.print(\"List: \");\n        ListNode current = head;\n        while (current != null) {\n            System.out.print(current.val + \" -> \");\n            current = current.next;\n        }\n        System.out.println(\"null\");\n    }\n\n\n    public static void main(String[] args) {\n        // Manually creating the linked list: 1 -> 4 -> 3 -> 2 -> 5 -> 2 -> null\n        ListNode head = new ListNode(1);\n        head.next = new ListNode(4);\n        head.next.next = new ListNode(3);\n        head.next.next.next = new ListNode(2);\n        head.next.next.next.next = new ListNode(5);\n        head.next.next.next.next.next = new ListNode(2);\n\n        int x = 3;\n\n        System.out.println(\"Original list:\");\n        printList(head);\n\n        ListNode partitionedHead = partition(head, x);\n\n        System.out.println(\"Partitioned list (x = \" + x + \"):\");\n        printList(partitionedHead); // Expected: 1 -> 2 -> 2 -> 4 -> 3 -> 5 -> null\n    }\n}\n" }, { "name": "RemoveDuplicates", "subcat": "", "link": "https://leetcode.com/problems/remove-duplicates/", "code": "package leetcode.linkedList;\n\nimport java.util.Objects;\n\n/**\n * LeetCode Problem 83: Remove Duplicates from Sorted List\n *\n * Given the head of a sorted linked list, delete all duplicates such that each\n * element appears only once. Return the linked list sorted as well.\n *\n * Example 1:\n * Input: head = [1,1,2]\n * Output: [1,2]\n *\n * Example 2:\n * Input: head = [1,1,2,3,3]\n * Output: [1,2,3]\n */\npublic class RemoveDuplicates {\n\n    public static Node deleteDuplicates(Node head) {\n        // A sentinel (or dummy) node is used to simplify the logic of building\n        // the new list. We don't need to handle the head as a special case.\n        Node dummy = new Node(Integer.MIN_VALUE);\n\n        Node curr = dummy;\n        Node temp = head;\n\n        while (temp != null) {\n\n            if (curr.data != temp.data) {\n                curr.next = temp;\n                curr = curr.next;\n            }\n\n            temp = temp.next;\n        }\n\n        // It's crucial to terminate the list. The last unique node might\n        // have originally pointed to a duplicate. We must sever that link.\n        curr.next = null;\n\n        return dummy.next;\n    }\n}\n" }, { "name": "ReverseLinkedList", "subcat": "", "link": "", "code": "package leetcode.linkedList;\n\npublic class ReverseLinkedList {\n\n    public static Node reverse(Node head) {\n        if (head == null || head.next == null) {\n            return head;\n        }\n\n        Node prev = null; // points to the previous node\n        Node curr = head; // points to the current node\n        Node next = null; // points to the next node\n\n        while (curr != null) {\n            next = curr.next;\n            curr.next = prev;\n            prev = curr;\n            curr = next; // At the end of the loop, curr will be null and prev will be the new head\n        }\n\n        return prev;\n    }\n\n    public static Node recursiveReverse(Node head) {\n        // Base case: if the list is empty or has only one node\n        if (head == null || head.next == null) {\n            return head;\n        }\n\n        // Recursive step: reverse the rest of the list\n        Node newHead = recursiveReverse(head.next);\n\n        // Make adjustments to reverse the current pair of nodes\n        head.next.next = head;\n        head.next = null;\n\n        // Return the new head of the reversed list\n        return newHead;\n    }\n\n}\n" }, { "name": "SwapNodesPairs", "subcat": "", "link": "https://leetcode.com/problems/swap-nodes-pairs/", "code": "package leetcode.linkedList;\n\n/**\n * LeetCode Problem 24: Swap Nodes in Pairs\n *\n * Given a linked list, swap every two adjacent nodes and return its head.\n * You must solve the problem without modifying the values in the list's nodes\n * (i.e., only nodes themselves may be changed.)\n *\n * Example 1:\n * Input: head = [1,2,3,4]\n * Output: [2,1,4,3]\n *\n * Example 2:\n * Input: head = []\n * Output: []\n *\n * Example 3:\n * Input: head = [1]\n * Output: [1]\n */\npublic class SwapNodesPairs {\n\n    public static ListNode swapPairs(ListNode head) {\n        ListNode dummy = new ListNode(0);\n        dummy.next = head;\n\n        // `prevNode` points to the node *before* the pair we are about to swap.\n        // Initially, this is the dummy node.\n        ListNode prevNode = dummy;\n\n        while (head != null && head.next != null) {\n            // Nodes to be swapped\n            ListNode firstNode = head;\n            ListNode secondNode = head.next;\n\n            // --- The Swap ---\n            // 1. The node before the pair (`prevNode`) should now point to the second node.\n            prevNode.next = secondNode;\n\n            // 2. The first node's `next` should point to the node *after* the second node.\n            firstNode.next = secondNode.next;\n\n            // 3. The second node's `next` should point back to the first node.\n            secondNode.next = firstNode;\n\n            // --- Prepare for the Next Iteration ---\n            // The `prevNode` for the next pair is now the `firstNode` of the current pair.\n            prevNode = firstNode;\n\n            // The `head` for the next pair is the node that was originally after the second node.\n            head = firstNode.next;\n        }\n\n        // The new head of the list is the node right after the dummy node.\n        return dummy.next;\n    }\n\n\n    // Helper method to print the list for verification\n    public static void printList(ListNode head) {\n        System.out.print(\"List: \");\n        ListNode current = head;\n        while (current != null) {\n            System.out.print(current.val + \" -> \");\n            current = current.next;\n        }\n        System.out.println(\"null\");\n    }\n\n\n    public static void main(String[] args) {\n        // Creating the linked list: 1 -> 2 -> 3 -> 4\n        ListNode head = new ListNode(1);\n        head.next = new ListNode(2);\n        head.next.next = new ListNode(3);\n        head.next.next.next = new ListNode(4);\n\n        System.out.println(\"Original list:\");\n        printList(head);\n\n        ListNode swappedHead = swapPairs(head);\n\n        System.out.println(\"List after swapping pairs:\");\n        printList(swappedHead); // Expected: 2 -> 1 -> 4 -> 3 -> null\n    }\n}\n\n" }], "Binary Search": [{ "name": "FindPeakElement", "subcat": "", "link": "https://leetcode.com/problems/find-peak-element/", "code": "package leetcode.binarySearch;\n\nimport java.util.Arrays;\n\n/**\n * LeetCode Problem 162: Find Peak Element\n *\n * A peak element is an element that is strictly greater than its neighbors.\n *\n * Given an integer array nums, find a peak element, and return its index. If the\n * array contains multiple peaks, return the index to any of the peaks.\n *\n * You may imagine that nums[-1] = nums[n] = -∞.\n *\n * You must write an algorithm that runs in O(log n) time.\n *\n * This is a classic \"Binary Search on a Monotonic Property\" problem. We use the\n * \"slope\" of the array at the midpoint to decide which half to discard.\n *\n * Example 1:\n * Input: nums = [1,2,3,1]\n * Output: 2\n * Explanation: 3 is a peak element and your function should return the index number 2.\n *\n * Example 2:\n * Input: nums = [1,2,1,3,5,6,4]\n * Output: 5\n * Explanation: Your function can return either index number 1 where the peak is 2, or\n * index number 5 where the peak is 6.\n */\npublic class FindPeakElement {\n\n    public static int findPeakElement(int[] nums) {\n        int low = 0;\n        int high = nums.length - 1;\n\n        // We use the `low < high` template, which is ideal for converging\n        // on a single element without extra checks after the loop.\n        while (low < high) {\n            int mid = low + (high - low) / 2;\n\n            // Compare the middle element with its right neighbor to determine the \"slope\".\n            if (nums[mid] < nums[mid + 1]) {\n                // We are on an \"uphill\" slope. The peak must be to the right.\n                // We can safely discard the left half, including mid.\n                low = mid + 1;\n            } else {\n                // We are on a \"downhill\" slope. `mid` could be the peak, or the\n                // peak is to its left. We can safely discard the right half.\n                high = mid;\n            }\n        }\n\n        // The loop terminates when low == high, which is the index of a peak element.\n        // No post-loop processing is needed.\n        return low;\n    }\n\n    public static void main(String[] args)
