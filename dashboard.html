+ Arrays.toString(Arrays.copyOf(chars1, newLength1))); // Expected: [a, 2, b, 2, c, 3]\n        System.out.println(\"--------------------\");\n\n        char[] chars2 = {'a'};\n        int newLength2 = compress(chars2);\n        System.out.println(\"Test Case 2:\");\n        System.out.println(\"New Length: \" + newLength2); // Expected: 1\n        System.out.println(\"Modified Array: \" + Arrays.toString(Arrays.copyOf(chars2, newLength2))); // Expected: [a]\n        System.out.println(\"--------------------\");\n\n        char[] chars3 = {'a', 'b', 'b', 'b', 'b', 'b', 'b', 'b', 'b', 'b', 'b', 'b', 'b'};\n        int newLength3 = compress(chars3);\n        System.out.println(\"Test Case 3:\");\n        System.out.println(\"New Length: \" + newLength3); // Expected: 4\n        System.out.println(\"Modified Array: \" + Arrays.toString(Arrays.copyOf(chars3, newLength3))); // Expected: [a, b, 1, 2]\n    }\n}\n" }, { "name": "ValidPalindrome", "subcat": "", "link": "", "code": "package leetcode.string;\n\npublic class ValidPalindrome {\n\n    public static boolean validPalindrome(String s) {\n        int i = 0;\n        int j = s.length() - 1;\n\n        while (i < j) {\n            if (s.charAt(i) != s.charAt(j)) {\n                return isPalindrome(s, i + 1, j) || isPalindrome(s, i, j - 1);\n            }\n\n            i++;\n            j--;\n        }\n\n        return true;\n    }\n\n    public static boolean isPalindrome(String s, int i, int j) {\n        while (i < j) {\n            if (s.charAt(i) != s.charAt(j)) return false;\n            i++;\n            j--;\n        }\n\n        return true;\n    }\n\n    public static void main(String[] args) {\n        System.out.println(validPalindrome(\"MOM\"));\n    }\n}\n" }, { "name": "ZigzagConversion", "subcat": "", "link": "", "code": "package leetcode.string;\n\npublic class ZigzagConversion {\n\n    public static String convert(String s, int numRows) {\n        StringBuilder[] stringBuilders = new StringBuilder[numRows];\n\n        for (int i = 0; i < numRows; i++) {\n            stringBuilders[i] = new StringBuilder();\n        }\n\n        int i = 0;\n        int size = s.length();\n\n        while (i < size) {\n\n            for (int index = 0; index < numRows && i < size; index++) {\n                stringBuilders[index].append(s.charAt(i));\n                i++;\n            }\n\n            for (int index = numRows - 2; index >=1 && i < size; index--) {\n                stringBuilders[index].append(s.charAt(i));\n                i++;\n            }\n\n        }\n\n        for (int k = 1; k < numRows; k++) {\n            stringBuilders[0].append(stringBuilders[k]);\n        }\n\n        return stringBuilders[0].toString();\n    }\n\n    public static void main(String[] args) {\n        String s = \"PAYPALISHIRING\";\n        int numRows = 4;\n        System.out.println(convert(s, numRows));// PAHNAPLSIIGYIR\n    }\n}\n" }], "Stack": [{ "name": "AsteroidCollision", "subcat": "", "link": "", "code": "package leetcode.stack;\n\nimport java.util.Arrays;\nimport java.util.Stack;\n\npublic class AsteroidCollision {\n\n    /**\n     * We are given an array `asteroids` of integers representing asteroids in a row.\n     * For each asteroid, the absolute value represents its size, and the sign represents its direction\n     * (positive meaning right, negative meaning left). All asteroids are moving at the same speed.\n     * <p>\n     * Find out the state of the asteroids after all collisions. If two asteroids meet, the smaller one will explode.\n     * If both are the same size, both will explode. Two asteroids moving in the same direction will never meet.\n     *\n     * @param asteroids An array of integers representing the asteroids.\n     * @return An array representing the state of asteroids after all collisions.\n     * @example For asteroids = [5, 10, -5]:\n     * - The -5 and 10 collide. Since |10| > |-5|, the -5 asteroid explodes.\n     * - The 5 and 10 never collide as they move in the same direction.\n     * - The final state is [5, 10].\n     * @example For asteroids = [10, 2, -5]:\n     * - The -5 and 2 collide. Since |-5| > |2|, the 2 explodes.\n     * - The stack becomes [10], and the current asteroid is still -5.\n     * - Now, -5 and 10 collide. Since |10| > |-5|, the -5 explodes.\n     * - The final state is [10].\n     */\n    public static int[] asteroidCollision(int[] asteroids) {\n        Stack<Integer> stack = new Stack<>();\n\n        // Iterate through each asteroid in the input array.\n        for (int asteroid : asteroids) {\n            boolean exploded = false;\n\n            // A collision occurs only if the stack has a right-moving asteroid (positive)\n            // and the current asteroid is a left-moving one (negative).\n            while (!stack.isEmpty() && stack.peek() > 0 && asteroid < 0) {\n                int top = stack.peek();\n\n                // Case 1: The asteroid on the stack is smaller. It explodes.\n                if (Math.abs(top) < Math.abs(asteroid)) {\n                    stack.pop(); // The top asteroid is destroyed.\n                    // The loop continues to check if the current asteroid collides with the new top.\n                }\n                // Case 2: Both asteroids are the same size. They both explode.\n                else if (Math.abs(top) == Math.abs(asteroid)) {\n                    stack.pop();      // The top asteroid is destroyed.\n                    exploded = true;  // The current asteroid is also destroyed.\n                    break;            // The current asteroid is gone, so stop checking for collisions.\n                }\n                // Case 3: The asteroid on the stack is larger. The current asteroid explodes.\n                else {\n                    exploded = true; // The current asteroid is destroyed.\n                    break;           // The top asteroid survives, stop checking for collisions.\n                }\n            }\n\n            // If the current asteroid was not destroyed in any collision, add it to the stack.\n            if (!exploded) {\n                stack.push(asteroid);\n            }\n        }\n\n        // Convert the stack to an array for the final output.\n        int[] result = new int[stack.size()];\n        // We fill the array from the end because stack.pop() gives us the last elements first.\n        for (int i = result.length - 1; i >= 0; i--) {\n            result[i] = stack.pop();\n        }\n\n        return result;\n    }\n\n    /**\n     * Main method to test the functionality with a few examples.\n     */\n    public static void main(String[] args) {\n        int[] arr1 = {5, 10, -5};\n        System.out.println(\"Input: \" + Arrays.toString(arr1));\n        System.out.println(\"Output: \" + Arrays.toString(asteroidCollision(arr1))); // Expected: [5, 10]\n\n        int[] arr2 = {-2, -1, 1, 2};\n        System.out.println(\"\\nInput: \" + Arrays.toString(arr2));\n        System.out.println(\"Output: \" + Arrays.toString(asteroidCollision(arr2))); // Expected: [-2, -1, 1, 2]\n    }\n}" }, { "name": "CarFleet", "subcat": "monotonic", "link": "", "code": "package leetcode.stack.monotonic;\n\nimport java.util.ArrayList;\nimport java.util.Collections;\nimport java.util.List;\nimport java.util.Stack;\n\npublic class CarFleet {\n\n    static class Car implements Comparable<Car> {\n        int pos;\n        int speed;\n\n        public Car(int pos, int speed) {\n            this.pos = pos;\n            this.speed = speed;\n        }\n\n        @Override\n        public int compareTo(Car other) {\n            // Sort cars based on their starting position in ascending order.\n            return Integer.compare(this.pos, other.pos);\n        }\n    }\n\n    /**\n     * There are `n` cars going to the same destination along a one-lane road. The destination is `target` miles away.\n     * You are given two integer arrays `position` and `speed`, both of length `n`.\n     * A car fleet is a non-empty set of cars driving at the same position and same speed.\n     * A car can catch up to another car ahead of it, but it cannot pass it. Once they meet, they drive together\n     * at the speed of the slower car.\n     * <p>\n     * Return the number of car fleets that will arrive at the destination.\n     *\n     * @param target The distance to the destination.\n     * @param position An array of initial positions for each car.\n     * @param speed An array of speeds for each car.\n     * @return The total number of car fleets that will arrive.\n     * @example For target = 12, position = {10, 8, 0, 5, 3}, speed = {2, 4, 1, 1, 3}:\n     * - The car at 10 (speed 2) arrives in (12-10)/2 = 1 hour.\n     * - The car at 8 (speed 4) arrives in (12-8)/4 = 1 hour. These two form a fleet.\n     * - The car at 5 (speed 1) arrives in (12-5)/1 = 7 hours. This is a new fleet.\n     * - The car at 3 (speed 3) arrives in (12-3)/3 = 3 hours. It catches the fleet at position 5.\n     * - The car at 0 (speed 1) arrives in (12-0)/1 = 12 hours. This is a final fleet.\n     * - Result: 3 fleets.\n     */\n    public int carFleet(int target, int[] position, int[] speed) {\n        int n = position.length;\n        if (n == 0) {\n            return 0;\n        }\n\n        // Step 1: Combine position and speed into a list of Car objects.\n        List<Car> cars = new ArrayList<>();\n        for (int i = 0; i < n; i++) {\n            cars.add(new Car(position[i], speed[i]));\n        }\n\n        // Step 2: Sort the cars by their starting position.\n        // This allows us to process them in the order they appear on the road.\n        Collections.sort(cars);\n\n        // A stack to store the arrival times of the fleets.\n        // The stack will maintain the arrival times of fleets in increasing order from bottom to top.\n        Stack<Float> stack = new Stack<>();\n\n        // Step 3: Iterate through the cars from closest to the start line to closest to the target.\n        for (Car car : cars) {\n            // Calculate the time it would take this car to reach the target if it were alone.\n            float time = (float) (target - car.pos) / car.speed;\n\n            // Step 4: Check if this car forms a new fleet or joins an existing one.\n            while (!stack.isEmpty() && stack.peek() <= time) {\n                stack.pop();\n            }\n\n            // After merging with any possible fleets ahead, the current car's arrival time represents\n            // the new fleet leader's time. Push it onto the stack.\n            stack.push(time);\n        }\n\n        // The final size of the stack is the number of distinct fleets.\n        return stack.size();\n    }\n\n    /**\n     * Main method for testing the carFleet function.\n     */\n    public static void main(String[] args) {\n        int target = 12;\n        int[] position = {10, 8, 0, 5, 3};\n        int[] speed = {2, 4, 1, 1, 3};\n\n        // Expected output: 3\n        System.out.println(new CarFleet().carFleet(target, position, speed));\n    }\n}" }, { "name": "LargestRectangleHistogram", "subcat": "monotonic", "link": "", "code": "package leetcode.stack.monotonic;\n\nimport java.util.Arrays;\nimport java.util.Stack;\n\n\n// Question: Given an array of integers `heights` representing the histogram's bar height\n// where the width of each bar is 1, return the area of the largest rectangle in the histogram.\n//\n// Example:\n// Input: heights = [2, 1, 5, 6, 2, 3]\n// Output: 10\n// Explanation: The largest rectangle is shown in the diagram. It has an area of 10 (height 5, width 2).\n// ]\n//\n// The core idea of the optimized solution is:\n// For each bar `heights[i]`, we assume it is the shortest bar in our target rectangle.\n// Then, we just need to find how far this rectangle can extend to the left and to the right.\n// The rectangle can extend as long as it doesn't hit a bar that is shorter than `heights[i]`.\npublic class LargestRectangleHistogram {\n\n    public static int largestRectangleArea(int[] heights) {\n        int n = heights.length;\n        if (n == 0) return 0;\n\n        // `left[i]` will store the index of the first bar to the left of `i` that is SHORTER than `heights[i]`.\n        int[] left = new int[n];\n        // `right[i]` will store the index of the first bar to the right of `i` that is SHORTER than `heights[i]`.\n        int[] right = new int[n];\n\n        // Default boundaries: -1 for the left and n for the right.\n        Arrays.fill(left, -1);\n        Arrays.fill(right, n);\n\n        Stack<Integer> stack = new Stack<>();\n\n        // --- Pass 1: Calculate Left Boundaries ---\n        // We iterate from left to right to find the \"previous smaller element\" for each bar.\n        for (int i = 0; i < n; i++) {\n            // While the stack is not empty and the bar at the stack's top is taller than or equal to the current bar...\n            while (!stack.isEmpty() && heights[stack.peek()] >= heights[i]) {\n                // ...it can't be a left boundary, so we pop it.\n                stack.pop();\n            }\n            if (!stack.isEmpty()) {\n                // The new stack top is the first shorter bar to the left.\n                left[i] = stack.peek();\n            }\n            // Add the current bar's index to the stack for future comparisons.\n            stack.push(i);\n        }\n\n        stack.clear();\n\n        // --- Pass 2: Calculate Right Boundaries ---\n        // We iterate from right to left to find the \"next smaller element\" for each bar.\n        for (int i = n - 1; i >= 0; i--) {\n            while (!stack.isEmpty() && heights[stack.peek()] >= heights[i]) {\n                stack.pop();\n            }\n            if (!stack.isEmpty()) {\n                right[i] = stack.peek();\n            }\n            stack.push(i);\n        }\n\n        // --- Pass 3: Calculate Areas ---\n        // Now that we have the boundaries for each bar, we can calculate the area.\n        int maxArea = 0;\n        for (int i = 0; i < n; i++) {\n            // The width is the distance between the right and left boundaries.\n            int width = right[i] - left[i] - 1;\n            int area = heights[i] * width;\n            maxArea = Math.max(maxArea, area);\n        }\n\n        return maxArea;\n    }\n\n\n    public static void main(String[] args) {\n        int[] heights = {2, 1, 5, 6, 2, 3};\n        System.out.println(\"Largest area is: \" + largestRectangleArea(heights)); // Expected: 10\n    }\n\n}" }, { "name": "MonotonicStackTemplate", "subcat": "monotonic", "link": "", "code": "package leetcode.stack.monotonic;\n\nimport java.util.Arrays;\nimport java.util.Stack;\n\n\npublic class MonotonicStackTemplate {\n\n    public void findPreviousNextSmallerValue(int[] arr) {\n        int n = arr.length;\n        int[] prevSmaller = new int[n];\n        int[] nextSmaller = new int[n];\n        Arrays.fill(prevSmaller, -1);\n        Arrays.fill(nextSmaller, -1);\n\n        // The stack must store INDICES, not values, to know which position to update in the nextSmaller array.\n        // It maintains indices for a monotonically increasing sequence of values.\n        Stack<Integer> stack = new Stack<>();\n\n        for (int i = 0; i < n; i++) {\n            // The current element arr[i] is the \"Next Smaller\" for any elements on the stack that are greater than it.\n            while (!stack.isEmpty() && arr[stack.peek()] > arr[i]) {\n                int pastIndex = stack.pop();\n                nextSmaller[pastIndex] = arr[i];\n            }\n\n            // After clearing the stack, what remains on top is the first element to the left that is smaller.\n            // This is the \"Previous Smaller\" for the current element arr[i].\n            if (!stack.isEmpty()) {\n                prevSmaller[i] = arr[stack.peek()];\n            }\n\n            // Push the current INDEX onto the stack.\n            stack.push(i);\n        }\n\n        System.out.println(\"--- Smaller Elements ---\");\n        System.out.println(\"Input Array:      \" + Arrays.toString(arr));\n        System.out.println(\"Previous Smaller: \" + Arrays.toString(prevSmaller));\n        System.out.println(\"Next Smaller:     \" + Arrays.toString(nextSmaller));\n    }\n\n\n    public void findPreviousNextGreaterValue(int[] arr) {\n        int n = arr.length;\n        int[] prevGreater = new int[n];\n        int[] nextGreater = new int[n];\n        Arrays.fill(prevGreater, -1);\n        Arrays.fill(nextGreater, -1);\n\n        // This stack stores INDICES for a monotonically decreasing sequence of values.\n        Stack<Integer> stack = new Stack<>();\n\n        for (int i = 0; i < n; i++) {\n            // The current element arr[i] is the \"Next Greater\" for any elements on the stack that are smaller than it.\n            while (!stack.isEmpty() && arr[stack.peek()] < arr[i]) {\n                int pastIndex = stack.pop();\n                nextGreater[pastIndex] = arr[i];\n            }\n\n            // After clearing the stack, what remains on top is the first element to the left that is greater.\n            // This is the \"Previous Greater\" for the current element arr[i].\n            if (!stack.isEmpty()) {\n                prevGreater[i] = arr[stack.peek()];\n            }\n\n            // Push the current INDEX onto the stack.\n            stack.push(i);\n        }\n\n        System.out.println(\"\\n--- Greater Elements ---\");\n        System.out.println(\"Input Array:      \" + Arrays.toString(arr));\n        System.out.println(\"Previous Greater: \" + Arrays.toString(prevGreater));\n        System.out.println(\"Next Greater:     \" + Arrays.toString(nextGreater));\n    }\n\n\n    public static void main(String[] args) {\n        MonotonicStackTemplate template = new MonotonicStackTemplate();\n        int[] arr = {4, 8, 5, 2, 25};\n\n        template.findPreviousNextSmallerValue(arr);\n        /*\n         Expected Output:\n         --- Smaller Elements ---\n         Input Array:      [4, 8, 5, 2, 25]\n         Previous Smaller: [-1, 4, 4, -1, 2]\n         Next Smaller:     [2, 5, 2, -1, -1]\n        */\n\n        template.findPreviousNextGreaterValue(arr);\n        /*\n         Expected Output:\n         --- Greater Elements ---\n         Input Array:      [4, 8, 5, 2, 25]\n         Previous Greater: [-1, -1, 8, 5, -1]\n         Next Greater:     [8, 25, 25, 25, -1]\n        */\n    }\n}\n\n" }, { "name": "NextGreaterElementCircular", "subcat": "monotonic", "link": "", "code": "package leetcode.stack.monotonic;\n\nimport java.util.Arrays;\nimport java.util.Stack;\n\npublic class NextGreaterElementCircular {\n\n    /**\n     * Given a circular integer array `nums`, return the next greater number for every element.\n     * The next greater number of a number `x` is the first greater number to its traversing-order next in the array,\n     * which means you could search circularly to find its next greater number. If it doesn't exist, return -1.\n     * <p>\n     * This implementation uses a monotonic stack and a single pass (emulated as two passes) to find the solution efficiently.\n     *\n     * @param arr The input circular integer array.\n     * @return An array of the same size where result[i] is the next greater element for arr[i].\n     * @example For arr = [1, 2, 1]:\n     * - The next greater element for the first 1 is 2.\n     * - The next greater element for 2 is -1 (no greater element).\n     * - The next greater element for the second 1 is 2 (found by searching circularly).\n     * - The result will be [2, -1, 2].\n     */\n    public static int[] nextGreaterElements(int[] arr) {\n        int n = arr.length;\n        int[] nextGreater = new int[n];\n        Arrays.fill(nextGreater, -1); // Default value if no greater element is found.\n\n        // The stack stores indices, maintaining a monotonically decreasing order for the values at those indices.\n        Stack<Integer> stack = new Stack<>();\n\n        // We iterate through the array twice to handle the circular nature.\n        // The modulo operator (k % n) wraps the index around for the second pass.\n        for (int k = 0; k < n * 2; k++) {\n            int currentIndex = k % n;\n            int currentElement = arr[currentIndex];\n\n            // While the stack is not empty and the current element is greater than\n            // the element at the index on top of the stack...\n            while (!stack.isEmpty() && arr[stack.peek()] < currentElement) {\n                // ...the current element is the \"Next Greater Element\" for the element at the popped index.\n                int poppedIndex = stack.pop();\n                nextGreater[poppedIndex] = currentElement;\n            }\n\n            // Push the current index onto the stack. We only do this in the first pass\n            // to avoid redundant pushes and ensure each index is processed correctly.\n            if (k < n) {\n                stack.push(currentIndex);\n            }\n        }\n\n        return nextGreater;\n    }\n\n\n    public static void main(String[] args) {\n        int[] nums1 = {1, 2, 1};\n        System.out.println(\"Input: \" + Arrays.toString(nums1));\n        System.out.println(\"Next Greater Elements: \" + Arrays.toString(nextGreaterElements(nums1))); // Expected: [2, -1, 2]\n\n        System.out.println(\"---\");\n\n        int[] nums2 = {1, 2, 3, 4, 3};\n        System.out.println(\"Input: \" + Arrays.toString(nums2));\n        System.out.println(\"Next Greater Elements: \" + Arrays.toString(nextGreaterElements(nums2))); // Expected: [2, 3, 4, -1, 4]\n    }\n}\n" }, { "name": "RemoveKDigits", "subcat": "monotonic", "link": "", "code": "package leetcode.stack.monotonic;\n\nimport java.util.Stack;\n\n// Question: Given a non-negative integer `num` represented as a string,\n// remove `k` digits from the number so that the new number is the smallest possible.\n//\n// Example 1:\n// Input: num = \"1432219\", k = 3\n// Output: \"1219\"\n// Explanation: Remove the three digits 4, 3, and 2 to form the new number 1219 which is the smallest.\n//\n// Example 2:\n// Input: num = \"10200\", k = 1\n// Output: \"200\"\n// Explanation: Remove the leading 1 and the new number is 200. Note that the output must not have leading zeroes.\npublic class RemoveKDigits {\n\n    public static String removeKdigits(String num, int k) {\n        // If we need to remove all digits, the result is \"0\".\n        if (num.length() == k) return \"0\";\n\n        // We use a stack to build the result. The goal is to keep the digits\n        // in the stack in an increasing order (a \"monotonic stack\").\n        Stack<Character> stack = new Stack<>();\n\n        for (char ch : num.toCharArray()) {\n            // This is the core logic. While we still have digits to remove (k > 0)\n            // and the previous digit on the stack is GREATER than the current digit,\n            // we should remove the previous digit. This is because removing a larger digit\n            // from a more significant position (further to the left) yields a smaller number.\n            while (k > 0 && !stack.isEmpty() && stack.peek() > ch) {\n                stack.pop();\n                k--;\n            }\n            // Add the current digit to the stack.\n            stack.push(ch);\n        }\n\n        // After the first loop, if k is still > 0, it means the number's\n        // digits were in increasing order (e.g., \"12345\"). To make it smallest,\n        // we must remove the largest digits from the end.\n        while (k > 0) {\n            stack.pop();\n            k--;\n        }\n\n        // Now, we construct the final number from the stack.\n        StringBuilder result = new StringBuilder();\n\n        // The stack contains the result, but we need to put it into a string.\n        // We'll build it up and then handle leading zeros.\n        while (!stack.isEmpty()) {\n            result.insert(0, stack.pop());\n        }\n\n        // Remove any leading zeros from the final result.\n        while (result.length() > 1 && result.charAt(0) == '0') {\n            result.deleteCharAt(0);\n        }\n\n        // If the result is empty after all operations (e.g., input was \"10\", k=2), return \"0\".\n        return (result.isEmpty()) ? \"0\" : result.toString();\n    }\n\n\n    public static void main(String[] args) {\n        String str = \"1432219\";\n        int k = 3;\n        System.out.println(\"Removing \" + k + \" digits from \" + str + \" -> \" + removeKdigits(str, k)); // Expected: 1219\n\n        str = \"10200\";\n        k = 1;\n        System.out.println(\"Removing \" + k + \" digits from \" + str + \" -> \" + removeKdigits(str, k)); // Expected: 200\n\n        str = \"10\";\n        k = 2;\n        System.out.println(\"Removing \" + k + \" digits from \" + str + \" -> \" + removeKdigits(str, k)); // Expected: 0\n    }\n}" }, { "name": "SumOfSubarrayMinimums", "subcat": "monotonic", "link": "", "code": "package leetcode.stack.monotonic;\n\nimport java.util.Arrays;\nimport java.util.Stack;\n\n\n// Question: Given an array of integers `arr`, find the sum of `min(b)` for every\n// contiguous subarray `b` of `arr`. Since the answer may be large, return the answer modulo 10^9 + 7.\n//\n// Example:\n// Input: arr = [3, 1, 2, 4]\n// Output: 17\n// Explanation:\n// Subarrays are [3], [1], [2], [4], [3,1], [1,2], [2,4], [3,1,2], [1,2,4], [3,1,2,4].\n// Minimums are   3,   1,   2,   4,    1,     1,     2,      1,       1,       1.\n// The sum of the minimums is 3 + 1 + 2 + 4 + 1 + 1 + 2 + 1 + 1 + 1 = 17.\n//\n// The core idea of the optimized solution is to change our perspective. Instead of:\n// \"For each subarray, find its minimum and add it to the sum.\"\n// We think:\n// \"For each number `arr[i]`, in how many subarrays is it the minimum?\n//  Then, its total contribution to the sum is `arr[i] * (count of those subarrays)`.\"\n\npublic class SumOfSubarrayMinimums {\n\n    private static final int MOD = 1_000_000_007;\n\n    /**\n     * Brute-force approach. This is simple to understand but too slow for large inputs.\n     * It generates every possible subarray, finds the minimum of each, and sums them up.\n     * Time Complexity: O(n^2)\n     * Result: Time Limit Exceeded (TLE) on most platforms.\n     */\n    public static int sumSubarrayMinsBruteForce(int[] arr) {\n        long result = 0;\n        int n = arr.length;\n\n        // The outer loop picks the starting point of the subarray.\n        for (int i = 0; i < n; i++) {\n            int min = arr[i];\n            // The inner loop expands the subarray to the right.\n            for (int j = i; j < n; j++) {\n                // Keep track of the minimum value in the current subarray [i...j].\n                min = Math.min(min, arr[j]);\n\n                // Add this minimum to the total result, applying modulo at each step\n                // to prevent overflow.\n                result = (result + min) % MOD;\n            }\n        }\n        return (int) result;\n    }\n\n\n    public static int sumSubarrayMinsOptimize(int[] nums) {\n        int n = nums.length;\n\n        // `prevSmaller[i]` = index of the first element to the left of i that is < nums[i].\n        int[] prevSmaller = new int[n];\n        // `nextSmaller[i]` = index of the first element to the right of i that is <= nums[i].\n        int[] nextSmaller = new int[n];\n\n        Arrays.fill(prevSmaller, -1); // Virtual boundary if no smaller element exists to the left, i+1\n        Arrays.fill(nextSmaller, n);  // Virtual boundary if no smaller element exists to the right, n-i\n\n        // A monotonic stack stores indices of elements in increasing order of their values.\n        Stack<Integer> stack = new Stack<>();\n\n        // A single pass to calculate both prevSmaller and nextSmaller.\n        for (int i = 0; i < n; i++) {\n            while (!stack.isEmpty() && nums[stack.peek()] >= nums[i]) {\n                nextSmaller[stack.pop()] = i;\n            }\n\n            if (!stack.isEmpty()) {\n                prevSmaller[i] = stack.peek();\n            }\n\n            // Push the current index onto the stack.\n            stack.push(i);\n        }\n\n        long result = 0;\n        // Calculate the contribution of each element.\n        for (int i = 0; i < n; i++) {\n            // Number of subarrays starting at or after prevSmaller and ending at i.\n            long leftBoundary = i - prevSmaller[i];\n\n            // Number of subarrays starting at i and ending at or before nextSmaller.\n            long rightBoundary = nextSmaller[i] - i;\n\n            // Total number of subarrays where nums[i] is the minimum.\n            long totalSubarrays = leftBoundary * rightBoundary;\n\n            // Add the total contribution of nums[i] to the result.\n            long contribution = (totalSubarrays * nums[i]) % MOD;\n            result = (result + contribution) % MOD;\n        }\n\n        return (int) result;\n    }\n\n    public static void main(String[] args) {\n        int[] nums = {3, 1, 2, 4};\n        System.out.println(sumSubarrayMinsOptimize(nums)); // Expected: 17\n    }\n}" }, { "name": "SumOfSubarrayRanges", "subcat": "monotonic", "link": "", "code": "package leetcode.stack.monotonic;\n\nimport java.util.Arrays;\nimport java.util.Stack;\n\n\n// Question: You are given an integer array `nums`. The range of a subarray is the\n// difference between the largest and smallest element in the subarray.\n// Return the sum of all subarray ranges.\n//\n// Example:\n// Input: nums = [1, 2, 3]\n// Output: 4\n// Explanation:\n// The subarrays are [1], [2], [3], [1,2], [2,3], [1,2,3].\n// Their ranges are:\n// [1]: max=1, min=1, range=0\n// [2]: max=2, min=2, range=0\n// [3]: max=3, min=3, range=0\n// [1,2]: max=2, min=1, range=1\n// [2,3]: max=3, min=2, range=1\n// [1,2,3]: max=3, min=1, range=2\n// Sum of ranges = 0 + 0 + 0 + 1 + 1 + 2 = 4\n//\n// The core idea of the optimized solution is to realize that:\n// Sum of all Ranges = (Sum of all subarray maximums) - (Sum of all subarray minimums)\n// We can calculate both sums using the contribution method with a monotonic stack.\npublic class SumOfSubarrayRanges {\n\n    /**\n     * Brute-force O(n^2) approach.\n     * It iterates through all possible subarrays, finds the min and max of each,\n     * and adds their difference to the result.\n     * Note: I've corrected a small bug here; the inner loop should start from `j=i`\n     * to include single-element subarrays (whose range is 0).\n     */\n    public static long subArrayRangesBruteForce(int[] nums) {\n        long result = 0;\n        int n = nums.length;\n\n        // Outer loop picks the start of the subarray.\n        for (int i = 0; i < n; i++) {\n            int max = nums[i];\n            int min = nums[i];\n            // Inner loop expands the subarray to the right.\n            for (int j = i; j < n; j++) {\n                max = Math.max(max, nums[j]);\n                min = Math.min(min, nums[j]);\n                result += (long) max - min;\n            }\n        }\n        return result;\n    }\n\n    /**\n     * Optimized O(n) solution using a monotonic stack.\n     * It calculates the sum of maximums and the sum of minimums separately and finds their difference.\n     */\n    public static long subArrayRangesStackOptimized(int[] nums) {\n        int n = nums.length;\n\n        // Helper arrays to store the boundaries for each element.\n        int[] prevSmaller = new int[n];\n        int[] prevGreater = new int[n];\n        int[] nextSmaller = new int[n];\n        int[] nextGreater = new int[n];\n\n        // Initialize with default boundaries.\n        Arrays.fill(prevSmaller, -1);\n        Arrays.fill(prevGreater, -1);\n        Arrays.fill(nextSmaller, n);\n        Arrays.fill(nextGreater, n);\n\n        Stack<Integer> stack = new Stack<>();\n\n        // Pass 1: Calculate prevSmaller for all elements.\n        for (int i = 0; i < n; i++) {\n            while (!stack.isEmpty() && nums[stack.peek()] >= nums[i]) {\n                stack.pop();\n            }\n            if (!stack.isEmpty()) {\n                prevSmaller[i] = stack.peek();\n            }\n            stack.push(i);\n        }\n\n        // Pass 2: Calculate prevGreater for all elements.\n        stack.clear();\n        for (int i = 0; i < n; i++) {\n            while (!stack.isEmpty() && nums[stack.peek()] <= nums[i]) {\n                stack.pop();\n            }\n            if (!stack.isEmpty()) {\n                prevGreater[i] = stack.peek();\n            }\n            stack.push(i);\n        }\n\n        // Pass 3: Calculate nextSmaller for all elements (iterating from the right).\n        stack.clear();\n        for (int i = n - 1; i >= 0; i--) {\n            // Using strict inequality here to handle duplicates correctly with prevSmaller.\n            while (!stack.isEmpty() && nums[stack.peek()] > nums[i]) {\n                stack.pop();\n            }\n            if (!stack.isEmpty()) {\n                nextSmaller[i] = stack.peek();\n            }\n            stack.push(i);\n        }\n\n        // Pass 4: Calculate nextGreater for all elements (iterating from the right).\n        stack.clear();\n        for (int i = n - 1; i >= 0; i--) {\n            // Using strict inequality here to handle duplicates correctly with prevGreater.\n            while (!stack.isEmpty() && nums[stack.peek()] < nums[i]) {\n                stack.pop();\n            }\n            if (!stack.isEmpty()) {\n                nextGreater[i] = stack.peek();\n            }\n            stack.push(i);\n        }\n\n        long sumOfMaxes = 0;\n        long sumOfMins = 0;\n\n        // Calculate the total contribution of each element to the sum of maxes and mins.\n        for (int i = 0; i < n; i++) {\n            // Number of subarrays where nums[i] is the MINIMUM.\n            long numSubarraysAsMin = (long) (i - prevSmaller[i]) * (nextSmaller[i] - i);\n            sumOfMins += numSubarraysAsMin * nums[i];\n\n            // Number of subarrays where nums[i] is the MAXIMUM.\n            long numSubarraysAsMax = (long) (i - prevGreater[i]) * (nextGreater[i] - i);\n            sumOfMaxes += numSubarraysAsMax * nums[i];\n        }\n\n        /**\n         * --- The Core Insight: Sum of Ranges = Sum of Maxes - Sum of Mins ---\n         *\n         * The problem is to find the sum of `(max(s) - min(s))` for every subarray `s`.\n         * Using the distributive property of summation, we can re-group the terms:\n         *\n         * Sum(max(s) - min(s)) over all s\n         * = (max(A) - min(A)) + (max(B) - min(B)) + ...\n         * = (max(A) + max(B) + ...) - (min(A) + min(B) + ...)\n         * = Sum(max(s)) - Sum(min(s))\n         *\n         * This allows us to solve for the sum of maximums and minimums separately.\n         */\n        return sumOfMaxes - sumOfMins;\n    }\n\n    public static void main(String[] args) {\n        int[] nums = {1, 2, 3};\n        System.out.println(subArrayRangesStackOptimized(nums)); // Expected: 4\n    }\n}" }, { "name": "BasicCalculator", "subcat": "parenthesesPathsExpression", "link": "", "code": "package leetcode.stack.parenthesesPathsExpression;\n\nimport java.util.Stack;\n\n// Question: Given a string `s` which represents a mathematical expression,\n// implement a basic calculator to evaluate it and return the result.\n//\n// The expression string contains non-negative integers and the operators +, -, *, /.\n// Integer division should truncate toward zero.\n// You can assume the given expression is always valid.\n//\n// Note: This solution correctly handles operator precedence (* and / before + and -).\n//\n// Example:\n// Input: s = \"3+2*2\"\n// Output: 7\n//\n// Input: s = \" 3/2 \"\n// Output: 1\npublic class BasicCalculator {\n\n    public static int calculate(String s) {\n        // `sign` stores the operator that comes *before* the current number.\n        // We initialize it to '+' for the very first number.\n        char sign = '+';\n        Stack<Integer> stack = new Stack<>();\n        int current = 0;\n\n        for (int i = 0; i < s.length(); i++) {\n            char ch = s.charAt(i);\n\n            // If the character is a digit, build the current number.\n            // This handles multi-digit numbers (e.g., \"42\").\n            if (Character.isDigit(ch)) {\n                current = current * 10 + (ch - '0');\n            }\n\n            // This block triggers when we hit an operator OR the end of the string.\n            // It's time to process the `current` number with its preceding `sign`.\n            if (!Character.isDigit(ch) && ch != ' ' || i == s.length() - 1) {\n\n                // Based on the *previous* sign, perform an action.\n                if (sign == '-') {\n                    stack.push(-current);\n                }\n                if (sign == '+') {\n                    stack.push(current);\n                }\n                // For * and /, they have higher precedence. We pop the last number from the stack,\n                // perform the operation, and push the result back immediately.\n                if (sign == '*') {\n                    stack.push(stack.pop() * current);\n                }\n                if (sign == '/') {\n                    stack.push(stack.pop() / current);\n                }\n\n                // Update the sign for the next number and reset current.\n                sign = ch;\n                current = 0;\n            }\n        }\n\n        // After the loop, the stack contains only numbers that need to be added.\n        // The * and / operations have already been resolved.\n        int result = 0;\n        while (!stack.isEmpty()) {\n            result += stack.pop();\n        }\n\n        return result;\n    }\n\n    /**\n     * Main method for testing the function.\n     */\n    public static void main(String[] args) {\n        String s = \"3+2*2\";\n        System.out.println(s + \" = \" + calculate(s)); // Expected: 7\n\n        String s2 = \" 42 - 10 / 5 \";\n        System.out.println(s2 + \" = \" + calculate(s2)); // Expected: 40\n    }\n}" }, { "name": "DecodeString", "subcat": "parenthesesPathsExpression", "link": "", "code": "package leetcode.stack.parenthesesPathsExpression;\n\nimport java.util.Stack;\n\n\n// Question: Given an encoded string, return its decoded string.\n//\n// The encoding rule is: k[encoded_string], where the encoded_string inside the\n// square brackets is being repeated exactly k times. k is guaranteed to be a positive integer.\n// You may assume that the input string is always valid; there are no extra white spaces,\n// square brackets are well-formed, etc.\n//\n// Example 1:\n// Input: s = \"3[a]2[bc]\"\n// Output: \"aaabcbc\"\n//\n// Example 2:\n// Input: s = \"3[a2[c]]\"\n// Output: \"accaccacc\"\n//\n// Example 3:\n// Input: s = \"2[abc]3[cd]ef\"\n// Output: \"abcabccdcdcdef\"\npublic class DecodeString {\n\n    @SuppressWarnings(\"all\")\n    public static String decodeString(String s) {\n        // Stack to store the repeat counts (the 'k' values).\n        Stack<Integer> countStack = new Stack<>();\n        // Stack to store the partially built string from outer layers.\n        Stack<String> stringStack = new Stack<>();\n        // This will hold the string being built at the CURRENT level of nesting.\n        String result = \"\";\n\n        int i = 0;\n        while (i < s.length()) {\n            char ch = s.charAt(i);\n\n            // Case 1: The character is a digit.\n            if (Character.isDigit(ch)) {\n                int count = 0;\n                // Parse the entire number (e.g., \"100\" instead of just \"1\").\n                while (Character.isDigit(s.charAt(i))) {\n                    count = count * 10 + (s.charAt(i) - '0');\n                    i++;\n                }\n                // Push the repeat count for the upcoming string.\n                countStack.push(count);\n            }\n            // Case 2: The character is an opening bracket '['.\n            else if (ch == '[') {\n                // We are starting a new, nested string.\n                // Save the `result` from the PREVIOUS level onto the stack.\n                stringStack.push(result);\n                // Reset `result` to start building the new nested string.\n                result = \"\";\n                i++;\n            }\n            // Case 3: The character is a closing bracket ']'.\n            else if (ch == ']') {\n                // We have finished building the nested string (currently in `result`).\n                // Pop the string from the PREVIOUS level to append to.\n                StringBuilder temp = new StringBuilder(stringStack.pop());\n\n                // Pop the repeat count for the nested string we just finished.\n                int repeatTimes = countStack.pop();\n\n                // Repeat the nested string `repeatTimes` and append it.\n                temp.append(result.repeat(repeatTimes));\n\n                // This combined string is now the new \"current\" result.\n                result = temp.toString();\n                i++;\n            }\n            // Case 4: The character is a letter.\n            else {\n                // Simply append the letter to the current level's string.\n                result += ch;\n                i++;\n            }\n        }\n\n        return result;\n    }\n\n    /**\n     * Main method for testing the function.\n     */\n    public static void main(String[] args) {\n        String s = \"3[a2[c]]\";\n        System.out.println(\"Encoded: \" + s);\n        System.out.println(\"Decoded: \" + decodeString(s)); // Expected: \"accaccacc\"\n    }\n}" }, { "name": "EvaluateNotation", "subcat": "parenthesesPathsExpression", "link": "https://leetcode.com/problems/evaluate-reverse-polish-notation", "code": "package leetcode.stack.parenthesesPathsExpression;\n\nimport java.util.Stack;\n\n\n/**\n * Solves LeetCode problems related to evaluating arithmetic expressions.\n * This class demonstrates stack-based solutions for both Reverse Polish (postfix), standard Infix, and Polish (prefix) notation.\n */\npublic class EvaluateNotation {\n\n    //<editor-fold desc=\"Reverse Polish Notation Methods\">\n\n    /**\n     * Evaluates the value of an arithmetic expression in Reverse Polish Notation (RPN).\n     * <p>\n     * Reverse Polish Notation is a mathematical notation in which operators follow their operands.\n     * For example, the infix expression `(2 + 1) * 3` is written as `[\"2\", \"1\", \"+\", \"3\", \"*\"]` in RPN.\n     * <p>\n     * The algorithm uses a stack:\n     * 1. If the token is a number, push it onto the stack.\n     * 2. If the token is an operator, pop the top two numbers from the stack, perform the operation,\n     * and push the result back onto the stack.\n     * The final result is the last number remaining on the stack.\n     *\n     * @param tokens An array of strings representing the RPN expression. Valid operators are \"+\", \"-\", \"*\", \"/\".\n     *               It is guaranteed that the given RPN expression is always valid.\n     * @return The integer result of the expression.\n     * @example For tokens = [\"2\", \"1\", \"+\", \"3\", \"*\"]:\n     * - Push 2. Stack: [2]\n     * - Push 1. Stack: [2, 1]\n     * - See \"+\", pop 1, pop 2, calculate 2 + 1 = 3. Push 3. Stack: [3]\n     * - Push 3. Stack: [3, 3]\n     * - See \"*\", pop 3, pop 3, calculate 3 * 3 = 9. Push 9. Stack: [9]\n     * - Return 9.\n     * @see <a href=\"https://leetcode.com/problems/evaluate-reverse-polish-notation/\">LeetCode Problem 150</a>\n     */\n    public int evalRPN(String[] tokens) {\n        // This stack stores operands as strings, requiring parsing for each operation.\n        Stack<String> stack = new Stack<>();\n\n        for (String token : tokens) {\n            switch (token) {\n                case \"+\" -> {\n                    // Note: The first pop() gets the second operand (x), the second pop() gets the first (y).\n                    int x = Integer.parseInt(stack.pop());\n                    int y = Integer.parseInt(stack.pop());\n                    stack.push(String.valueOf(y + x));\n                }\n                case \"-\" -> {\n                    int x = Integer.parseInt(stack.pop());\n                    int y = Integer.parseInt(stack.pop());\n                    stack.push(String.valueOf(y - x));\n                }\n                case \"*\" -> {\n                    int x = Integer.parseInt(stack.pop());\n                    int y = Integer.parseInt(stack.pop());\n                    stack.push(String.valueOf(y * x));\n                }\n                case \"/\" -> {\n                    int x = Integer.parseInt(stack.pop());\n                    int y = Integer.parseInt(stack.pop());\n\n                    // Division truncates toward zero as per the problem description.\n                    stack.push(String.valueOf(y / x));\n                }\n                default ->\n                    // If it's not an operator, it's a number. Push it onto the stack.\n                        stack.push(token);\n            }\n        }\n        // The final result is the only element left on the stack.\n        return Integer.parseInt(stack.pop());\n    }\n\n\n    //</editor-fold>\n\n    //<editor-fold desc=\"Infix Notation Methods\">\n\n    /**\n     * Evaluates a standard infix arithmetic expression with support for +, -, *, /, and parentheses.\n     * This method uses Dijkstra's Shunting-yard algorithm logic with two stacks.\n     *\n     * @param expression A string representing the infix expression, e.g., \"10 + 2 * 6\".\n     * @return The integer result of the calculation.\n     */\n    public int evalInfix(String expression) {\n        Stack<Integer> values = new Stack<>(); // Stack for integer operands\n        Stack<Character> ops = new Stack<>();    // Stack for operators\n\n        for (int i = 0; i < expression.length(); i++) {\n            char c = expression.charAt(i);\n\n            if (c == ' ') continue; // Skip whitespace\n\n            // If the character is a digit, parse the full number\n            if (Character.isDigit(c)) {\n                StringBuilder sb = new StringBuilder();\n                // Handle multi-digit numbers\n                while (i < expression.length() && Character.isDigit(expression.charAt(i))) {\n                    sb.append(expression.charAt(i++));\n                }\n                i--; // Correct for the extra increment in the while loop\n                values.push(Integer.parseInt(sb.toString()));\n            } else if (c == '(') {\n                ops.push(c);\n            } else if (c == ')') {\n                // Solve the entire sub-expression inside the parentheses\n                while (ops.peek() != '(') {\n                    values.push(applyOperation(ops.pop(), values.pop(), values.pop()));\n                }\n                ops.pop(); // Pop the opening parenthesis\n            } else { // The Current token is an operator\n                // While the top of the ops stack has the same or greater precedence, apply it\n                while (!ops.isEmpty() && hasPrecedence(c, ops.peek())) {\n                    values.push(applyOperation(ops.pop(), values.pop(), values.pop()));\n                }\n                // Push the current operator onto the stack\n                ops.push(c);\n            }\n        }\n\n        // The Entire expression has been parsed, apply remaining operations\n        while (!ops.isEmpty()) {\n            values.push(applyOperation(ops.pop(), values.pop(), values.pop()));\n        }\n\n        // The final result is the top of the values stack\n        return values.pop();\n    }\n\n    /**\n     * Helper method to check operator precedence.\n     * Returns true if op2 has higher or same precedence as op1, false otherwise.\n     */\n    private boolean hasPrecedence(char op1, char op2) {\n        if (op2 == '(' || op2 == ')') return false;\n        return (op1 != '*' && op1 != '/') || (op2 != '+' && op2 != '-');\n    }\n\n    /**\n     * Helper method to apply an operator to two operands.\n     */\n    private int applyOperation(char op, int b, int a) {\n        return switch (op) {\n            case '+' -> a + b;\n            case '-' -> a - b;\n            case '*' -> a * b;\n            case '/' -> {\n                if (b == 0) throw new UnsupportedOperationException(\"Cannot divide by zero\");\n                yield a / b;\n            }\n            default -> 0;\n        };\n    }\n    //</editor-fold>\n\n    //<editor-fold desc=\"Prefix Notation Methods\">\n\n    /**\n     * Evaluates the value of an arithmetic expression in Polish Notation (Prefix).\n     * The key is to iterate through the tokens from right to left.\n     *\n     * @param tokens An array of strings representing the Prefix expression.\n     * @return The integer result of the expression.\n     * @example For tokens = [\"*\", \"+\", \"2\", \"1\", \"3\"]:\n     * - Read \"3\", push 3. Stack: [3]\n     * - Read \"1\", push 1. Stack: [3, 1]\n     * - Read \"2\", push 2. Stack: [3, 1, 2]\n     * - Read \"+\", pop 2 (a), pop 1 (b), calculate 2 + 1 = 3. Push 3. Stack: [3, 3]\n     * - Read \"*\", pop 3 (a), pop 3 (b), calculate 3 * 3 = 9. Push 9. Stack: [9]\n     * - Return 9.\n     */\n    public int evalPrefix(String[] tokens) {\n        Stack<Integer> stack = new Stack<>();\n\n        // Iterate from right to left\n        for (int i = tokens.length - 1; i >= 0; i--) {\n            String token = tokens[i];\n\n            if (\"+\".equals(token)) {\n                int a = stack.pop();\n                int b = stack.pop();\n                stack.push(a + b);\n            } else if (\"-\".equals(token)) {\n                int a = stack.pop();\n                int b = stack.pop();\n                stack.push(a - b);\n            } else if (\"*\".equals(token)) {\n                int a = stack.pop();\n                int b = stack.pop();\n                stack.push(a * b);\n            } else if (\"/\".equals(token)) {\n                int a = stack.pop();\n                int b = stack.pop();\n                stack.push(a / b);\n            } else {\n                stack.push(Integer.parseInt(token));\n            }\n        }\n        return stack.pop();\n    }\n    //</editor-fold>\n\n\n    public static void main(String[] args) {\n        EvaluateNotation evaluator = new EvaluateNotation();\n\n        System.out.println(\"--- Reverse Polish Notation (Postfix) ---\");\n        String[] tokens1 = {\"2\", \"1\", \"+\", \"3\", \"*\"};\n        System.out.println(\"Expression: [\\\"2\\\", \\\"1\\\", \\\"+\\\", \\\"3\\\", \\\"*\\\"]\");\n        System.out.println(\"Result (Optimized): \" + evaluator.evalRPN(tokens1)); // Expected: 9\n\n        System.out.println(\"\\n\\n--- Standard Notation (Infix) ---\");\n        String infix1 = \"3 + 5 / 2\";\n        System.out.println(\"Expression: \\\"\" + infix1 + \"\\\"\");\n        System.out.println(\"Result: \" + evaluator.evalInfix(infix1)); // Expected: 5 (integer division)\n\n\n        System.out.println(\"\\n\\n--- Polish Notation (Prefix) ---\");\n        String[] prefixTokens = {\"*\", \"+\", \"2\", \"1\", \"3\"}; // Same as (2+1)*3\n        System.out.println(\"Expression: [\\\"*\\\", \\\"+\\\", \\\"2\\\", \\\"1\\\", \\\"3\\\"]\");\n        System.out.println(\"Result: \" + evaluator.evalPrefix(prefixTokens)); // Expected: 9\n    }\n}\n\n" }, { "name": "RemoveOutermostParentheses", "subcat": "parenthesesPathsExpression", "link": "", "code": "package leetcode.stack.parenthesesPathsExpression;\n\nimport java.util.Stack;\n\n\nclass RemoveOutermostParentheses {\n\n    /**\n     * A valid parentheses string is primitive if it is nonempty, and it does not have a way to be split into s = A + B,\n     * with A and B nonempty valid parentheses strings.\n     * <p>\n     * Given a valid parentheses string s, consider its primitive decomposition: s = P1 + P2 + ... + Pk,\n     * where Pi are primitive valid parentheses strings.\n     * <p>\n     * Return s after removing the outermost parentheses of every primitive string in the primitive decomposition of s.\n     *\n     * @param s The input string consisting of '(' and ')'. It is guaranteed to be a valid parentheses string.\n     * @return The string s after removing the outermost parentheses of each primitive component.\n     * @example For s = \"(()())(())\":\n     * - The primitive decomposition is P1 = \"(()())\" and P2 = \"(())\".\n     * - Removing the outer parentheses of P1 gives \"()()\".\n     * - Removing the outer parentheses of P2 gives \"()\".\n     * - The final result is \"()()\" + \"()\" = \"()()()\".\n     */\n    public static String removeOuterParentheses(String s) {\n        // A stack can be used to track the depth of nested parentheses.\n        Stack<Character> stack = new Stack<>();\n        StringBuilder result = new StringBuilder();\n\n        for (int i = 0; i < s.length(); i++) {\n            char currentChar = s.charAt(i);\n\n            if (currentChar == '(') {\n                // Before pushing, check the stack size. If the stack is not empty,\n                // this opening parenthesis is NOT an outermost one, so we append it.\n                if (!stack.isEmpty()) {\n                    result.append(currentChar);\n                }\n                // Push every opening parenthesis to track depth.\n                stack.push(currentChar);\n            } else { // currentChar is ')'\n                // Pop first to correctly assess the depth *before* this parenthesis.\n                stack.pop();\n\n                // After popping, if the stack is still not empty,\n                // it means this closing parenthesis was not an outermost one.\n                if (!stack.isEmpty()) {\n                    result.append(currentChar);\n                }\n            }\n        }\n        return result.toString();\n    }\n\n\n    public static void main(String[] args) {\n        String p = \"(()())(())\";\n        System.out.println(\"Input: \" + p);\n        System.out.println(\"Output: \" + removeOuterParentheses(p)); // Expected: \"()()()\"\n\n        String p2 = \"()()\";\n        System.out.println(\"\\nInput: \" + p2);\n        System.out.println(\"Output: \" + removeOuterParentheses(p2)); // Expected: \"\"\n    }\n}\n" }], "Matrix": [{ "name": "CellsOddValuesMatrix", "subcat": "", "link": "", "code": "package leetcode.matrix;\n\npublic class CellsOddValuesMatrix {\n\n    public static int oddCells(int m, int n, int[][] indices) {\n        int[][] result = new int[m][n];\n\n        for (int[] index : indices) {\n            int row = index[0];\n            int col = index[1];\n\n            for (int i = 0; i < n; i++) {\n                result[row][i]++;\n            }\n\n            for (int i = 0; i < m; i++) {\n                result[i][col]++;\n            }\n        }\n\n        int count = 0;\n\n        for (int i = 0; i < m; i++) {\n            for (int j = 0; j < n; j++) {\n                if (result[i][j] % 2 != 0) {\n                    count++;\n                }\n            }\n        }\n\n        return count;\n    }\n\n    public static void main(String[] args) {\n        int m = 2;\n        int n = 3;\n        int[][] indices = { { 0, 1 }, { 1, 1 } };\n        System.out.println(oddCells(m, n, indices));\n    }\n}\n" }, { "name": "FlippingImage", "subcat": "", "link": "", "code": "package leetcode.matrix;\n\nimport java.util.Arrays;\n\npublic class FlippingImage {\n\n    public static int[][] flipAndInvertImage(int[][] image) {\n\n        int rLen = image.length;\n        int cLen = image[0].length;\n\n        // Flip horizontally\n        for (int i = 0; i < rLen ass MatrixReshape {\n\n    public static int[][] matrixReshape(int[][] mat, int r, int c) {\n        int n = mat.length;\n        int m = mat[0].length;\n\n        if (m * n != r * c) return mat;\n\n        int[][] result = new int[r][c];\n\n        int[] temp = new int[n * m];\n\n        // First convert into 1D array, i * columnLength + j\n        for (int i = 0; i < n; i++) {\n            for (int j = 0; j < m; j++) {\n                temp[i * m + j] = mat[i][j];\n            }\n        }\n        // Now convert 1D array to 2D array, i * columnLength + j, with new column length\n        for (int i = 0; i < r; i++) {\n            for (int j = 0; j < c; j++) {\n                result[i][j] = temp[i * c + j];\n            }\n        }\n\n        return result;\n    }\n\n\n    public static void main(String[] args) {\n        int[][] mat = {{1, 2, 3, 4}};\n        int r = 2, c = 2;\n        System.out.println(Arrays.deepToString(matrixReshape(mat, r, c)));\n    }\n\n\n}\n" }, { "name": "SpiralMatrix", "subcat": "", "link": "", "code": "package leetcode.matrix;\n\nimport java.util.ArrayList;\nimport java.util.List;\n\npublic class SpiralMatrix {\n\n    public static List<Integer> spiralOrder(int[][] matrix) {\n        List<Integer> result = new ArrayList<>();\n\n        if (matrix == null || matrix.length == 0 || matrix[0].length == 0) {\n            return result;\n        }\n\n        int left = 0; // First column\n        int right = matrix[0].length - 1; // Last Column\n\n        int top = 0; // First row\n        int bottom = matrix.length - 1; // Last Row\n\n        while (top <= bottom && left <= right) {\n            // Traverse Right\n            for (int j = left; j <= right; j++) {\n                result.add(matrix[top][j]);\n            }\n            top++;\n\n            // Traverse Down\n            for (int i = top; i <= bottom; i++) {\n                result.add(matrix[i][right]);\n            }\n            right--;\n\n            if (top <= bottom)
