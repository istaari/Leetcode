int[] coins, int amount, int index, Integer[][] dp) {\n        // Base case: We found a valid combination.\n        if (amount == 0) return 1;\n        // Base case: This path is invalid.\n        if (amount < 0) return 0;\n\n        if (dp[index][amount] != null) return dp[index][amount];\n\n        int count = 0;\n        for (int i = index; i < coins.length; i++) {\n            count =  count + helper(coins, amount - coins[i], i, dp);\n        }\n\n        dp[index][amount] = count;\n        return count;\n    }\n\n\n    public static int recursive(int amount, int[] coins) {\n        Integer[][] memo = new Integer[coins.length][amount + 1];\n        return helper(coins, amount, 0, memo);\n    }\n\n\n    /**\n     * Subproblem: dp[i][j] = The number of combinations to make amount j, using only the first i coin types.\n     *\n     * Example: If coins = {1, 2, 5} and amount = 5:\n     * dp[2][5] asks: \"How many ways are there to make 5, using only {1, 2}?\"\n     * The answer would be 3 (from [1,1,1,1,1], [1,1,1,2], and [1,2,2]).\n     */\n    public static int Iterative(int amount, int[] coins) {\n        // dp[i][j] = number of ways to make amount `j` using the first `i` coins.\n        int[][] dp = new int[coins.length + 1][amount + 1];\n\n        // Base case: There is 1 way to make amount 0 (by using no coins).\n        for (int i = 0; i <= coins.length; i++) {\n            dp[i][0] = 1;\n        }\n\n        // Fill the DP table\n        for (int i = 1; i <= coins.length; i++) {\n            for (int j = 1; j <= amount; j++) {\n                int coin = coins[i - 1];\n\n                // Recurrence Relation:\n                // We add two possibilities:\n                // 1. Ways to make amount `j` WITHOUT using coin `i` (exclude): dp[i - 1][j]\n                // 2. Ways to make amount `j` WITH coin `i` (include):\n                //    This is `dp[i][j - coin]`. We look at the same row `i` because we can use the coin again.\n                if (coin <= j) {\n                    dp[i][j] = dp[i - 1][j] + dp[i][j - coin];\n                } else {\n                    // If the coin is larger than the amount, we can't use it.\n                    dp[i][j] = dp[i - 1][j];\n                }\n            }\n        }\n\n        // The final answer is in the bottom-right corner.\n        return dp[coins.length][amount];\n    }\n\n\n    static void main(String[] args) {\n        int[] coins = {1, 2, 5};\n        int amount = 5;\n        System.out.println(recursive(amount, coins)); // Expected: 4\n    }\n}" }, { "name": "PartitionSubsetSum", "subcat": "knapsack", "link": "https://leetcode.com/problems/partition-subset-sum/", "code": "package leetcode.dp.knapsack;\n\nimport java.util.Arrays;\n\n/**\n * LeetCode Problem: 416. Partition Equal Subset Sum\n *\n * Question:\n * Given a non-empty array `nums` containing only positive integers, find if the array can be partitioned\n * into two subsets such that the sum of elements in both subsets is equal.\n *\n * Example 1:\n * Input: nums = [1, 5, 11, 5]\n * Output: true\n * Explanation: The array can be partitioned as [1, 5, 5] and [11]. Both have a sum of 11.\n *\n * Example 2:\n * Input: nums = [1, 2, 3, 5]\n * Output: false\n * Explanation: The array cannot be partitioned into two subsets with equal sum.\n *\n * Constraints:\n * - 1 <= nums.length <= 200\n * - 1 <= nums[i] <= 100\n */\n@SuppressWarnings(\"all\")\npublic class PartitionSubsetSum {\n\n    public static boolean recursive(int[] nums, int index, int target, Boolean[][] dp) {\n        // Base case: We've reached the target sum exactly.\n        if (target == 0) {\n            return true;\n        }\n\n        // Base cases: We've run out of numbers or overshot the target.\n        if (index > nums.length - 1 || target < 0) {\n            return false;\n        }\n\n        if (dp[index][target] != null) {\n            return dp[index][target];\n        }\n\n        boolean include = recursive(nums, index + 1, target - nums[index], dp);\n        boolean exclude = recursive(nums, index + 1, target, dp);\n\n        dp[index][target] = include || exclude;\n\n        return dp[index][target];\n    }\n\n    /**\n     * Subproblem: dp[i][j] = True if sum j can be formed using a subset of the first i numbers.\n     *\n     * Example: If nums = {1, 5, 11, 5} and target = 11:\n     * dp[2][6] asks: \"Can we make a sum of 6, using a subset of the first two numbers {1, 5}?\"\n     * The answer would be true (from {1, 5}).\n     *\n     * dp[2][7] asks: \"Can we make a sum of 7, using a subset of {1, 5}?\"\n     * The answer would be false.\n     */\n    public static boolean iterative(int[] nums, int targetSum) {\n        // dp[i][j] = can we make a sum of `j` using only the first `i` numbers?\n        boolean[][] dp = new boolean[nums.length + 1][targetSum + 1];\n\n        // Base case: We can always make a sum of 0 (by taking no elements).\n        for (int i = 0; i <= nums.length; i++) {\n            dp[i][0] = true;\n        }\n\n        for (int i = 1; i <= nums.length; i++) {\n            int currentNum = nums[i - 1]; // The current number we are considering\n            for (int j = 1; j <= targetSum; j++) {\n\n                if (currentNum <= j) {\n                    // We have two choices:\n                    // 1. Exclude the current number: dp[i - 1][j] (result using numbers before this one)\n                    // 2. Include the current number: dp[i - 1][j - currentNum] (result for the remaining sum)\n                    dp[i][j] = dp[i - 1][j] || dp[i - 1][j - currentNum];\n                } else {\n                    // If the number is larger than the target `j`, we can't include it.\n                    // So, the result is the same as not having this number.\n                    dp[i][j] = dp[i - 1][j];\n                }\n            }\n        }\n        // The final answer is whether we can make the `targetSum` using all `nums.length` numbers.\n        return dp[nums.length][targetSum];\n    }\n\n\n    public static boolean canPartition(int[] nums) {\n        int totalSum = 0;\n        for (int val : nums) {\n            totalSum += val;\n        }\n\n        // If the total sum is odd, it's impossible to split into two equal halves.\n        if (totalSum % 2 != 0) return false;\n\n        // The target sum for our subset is half of the total.\n        int targetSum = totalSum / 2;\n\n        // Setup for recursive solution\n        Boolean dp[][] = new Boolean[nums.length][targetSum + 1];\n\n        // Call any of the implementations. The iterative one is shown here.\n        return iterative(nums, targetSum);\n        // return recursive(nums, 0, targetSum, dp);\n        // return iterativeOptimized(nums, targetSum);\n    }\n\n    public static void main(String[] args) {\n        int[] nums = {1, 5, 11, 5};\n        System.out.println(canPartition(nums)); // Expected: true\n    }\n}" }, { "name": "ClimbingStairs", "subcat": "linear", "link": "https://leetcode.com/problems/climbing-stairs/", "code": "package leetcode.dp.linear;\n\n/**\n * LeetCode Problem: 70. Climbing Stairs\n * <p>\n * Question:\n * You are climbing a staircase. It takes n steps to reach the top.\n * Each time you can either climb 1 or 2 steps. In how many distinct ways can you climb to the top?\n *\n * <p>\n * Example:\n * Input: n = 3\n * Output: 3\n * Explanation: There are three ways to climb to the top.\n * 1. 1 step + 1 step + 1 step\n * 2. 1 step + 2 steps\n * 3. 2 steps + 1 step\n *\n * <p>\n * Constraints:\n * - 1 <= n <= 45\n */\npublic class ClimbingStairs {\n\n\n    public static int iterative(int n) {\n        // Base Cases: If there are 1 or 2 stairs, the number of ways is simply n.\n        if (n <= 2) {\n            return n;\n        }\n\n        // dp[i] will store the number of ways to reach stair 'i'.\n        int[] dp = new int[n + 1];\n\n        // Initialize the base cases for the DP table.\n        // There is 1 way to reach the 1st stair.\n        dp[1] = 1;\n        // There are 2 ways to reach the 2nd stair (1+1 or 2).\n        dp[2] = 2;\n\n        // Fill the DP table from the 3rd stair up to the n-th stair.\n        for (int i = 3; i <= n; i++) {\n            // The number of ways to reach stair 'i' is the sum of the ways to reach\n            // stair 'i-1' (and taking one step) and the ways to reach stair 'i-2'\n            // (and taking two steps). This is the core recurrence relation.\n            dp[i] = dp[i - 1] + dp[i - 2];\n        }\n\n        // The final answer is the number of ways to reach the n-th stair.\n        return dp[n];\n    }\n\n\n    public static int recursive(int n, int[] dp) {\n        // Base Cases: If there are 1 or 2 stairs, the number of ways is n.\n        if (n <= 2) {\n            return n;\n        }\n\n        // Memoization Check: If we have already computed the result for stair 'n',\n        // return the stored value instead of re-calculating.\n        if (dp[n] != 0) {\n            return dp[n];\n        }\n\n        // Recursive Step: If the result is not in our memoization table, calculate it by\n        // breaking it down into smaller subproblems.\n        // The logic is the same: ways(n) = ways(n-1) + ways(n-2).\n        dp[n] = recursive(n - 1, dp) + recursive(n - 2, dp);\n\n        // Store and return the computed result.\n        return dp[n];\n    }\n\n\n    /**\n     * This is the main wrapper function that sets up the environment for the recursive solution.\n     *\n     * @param n The total number of stairs.\n     * @return The number of distinct ways to climb to the top.\n     */\n    public static int climbStairs(int n) {\n        // Create a memoization array (dp table) of size n+1.\n        // It's initialized to all zeros by default in Java.\n        int[] dp = new int[n + 1];\n        // Call the recursive helper function to start the computation.\n        return recursive(n, dp);\n    }\n\n\n    /**\n     * The main method to test the implemented solutions.\n     */\n    static void main(String[] args) {\n        // The climbStairs method is called, which in turn uses the recursive approach.\n        // You could also call the iterative method directly for comparison.\n        System.out.println(\"Ways to climb 2 stairs: \" + climbStairs(2)); // Expected: 2\n        System.out.println(\"Ways to climb 3 stairs: \" + climbStairs(3)); // Expected: 3\n        System.out.println(\"Ways to climb 4 stairs: \" + climbStairs(4)); // Expected: 5\n        System.out.println(\"Ways to climb 5 stairs: \" + climbStairs(5)); // Expected: 8\n    }\n}" }, { "name": "HouseRobber", "subcat": "linear", "link": "https://leetcode.com/problems/house-robber/", "code": "package leetcode.dp.linear;\n\n/**\n * LeetCode Problem: 198. House Robber\n * <p>\n * Question:\n * You are a professional robber planning to rob houses along a street. Each house has a certain amount of money stashed.\n * The only constraint stopping you from robbing each of them is that adjacent houses have security systems connected,\n * and it will automatically contact the police if two adjacent houses were broken into on the same night.\n * <p>\n * Given an integer array `nums` representing the amount of money of each house, return the maximum amount of money\n * you can rob tonight without alerting the police.\n * <p>\n * Example 1:\n * Input: nums = [1, 2, 3, 1]\n * Output: 4\n * Explanation: Rob house 1 (money = 1) and then rob house 3 (money = 3). Total amount you can rob = 1 + 3 = 4.\n * <p>\n * Constraints:\n * - 1 <= nums.length <= 100\n * - 0 <= nums[i] <= 400\n */\npublic class HouseRobber {\n\n    /**\n     * Solves the problem using a recursive, top-down DP approach with memoization.\n     *\n     * @param nums The array of money in each house.\n     * @param i    The index of the current house being considered (from the end).\n     * @param memo The memoization array to store results of subproblems.\n     * @return The maximum amount of money that can be robbed up to house `i`.\n     */\n    public static int recursive(int[] nums, int i, int[] memo) {\n        // Base case: If we are out of bounds (no more houses), the profit is 0.\n        if (i < 0) {\n            return 0;\n        }\n\n        // Memoization check: If we've already calculated the max profit for robbing up to house `i`, return it.\n        if (memo[i] != -1) {\n            return memo[i];\n        }\n\n        // --- The Core Choice ---\n        // At house `i`, we have two options:\n        // 1. Rob this house: The profit is nums[i] + the max profit from robbing houses up to `i-2` (since we can't rob `i-1`).\n        // 2. Don't rob this house: The profit is the max profit from robbing houses up to `i-1`.\n\n        // We choose the option that gives us the maximum profit.\n        int robThisHouse = nums[i] + recursive(nums, i - 2, memo);\n        int skipThisHouse = recursive(nums, i - 1, memo);\n\n        // Store the result in our memoization table before returning.\n        memo[i] = Math.max(robThisHouse, skipThisHouse);\n        return memo[i];\n    }\n\n\n    /**\n     * Solves the problem using an iterative, bottom-up DP approach.\n     *\n     * @param nums The array of money in each house.\n     * @return The maximum amount of money that can be robbed.\n     */\n    public static int iterative(int[] nums) {\n        if (nums.length == 0) return 0;\n        if (nums.length == 1) return nums[0];\n\n        // dp[i] will store the maximum money that can be robbed from the first `i` houses.\n        // We use n+1 size for easier indexing, where dp[0] is a dummy base case.\n        int n = nums.length + 1;\n        int[] dp = new int[n];\n\n        // Base Cases:\n        // dp[0] = 0: Max money from 0 houses is 0.\n        // dp[1] = nums[0]: Max money from the first house is just its own value.\n        dp[0] = 0;\n        dp[1] = nums[0];\n\n        // Build the solution from the second house onwards.\n        // Note: i corresponds to the house at nums[i-1].\n        for (int i = 2; i < n; i++) {\n            // --- The Core Choice (Recurrence Relation) ---\n            // The logic is the same as the recursive approach. To find the max profit for the first `i` houses (dp[i]):\n            // 1. Rob house `i-1`: Profit = nums[i-1] + max profit from the first `i-2` houses (dp[i-2]).\n            // 2. Don't rob house `i-1`: Profit = max profit from the first `i-1` houses (dp[i-1]).\n            dp[i] = Math.max(nums[i - 1] + dp[i - 2], dp[i - 1]);\n        }\n\n        // The final answer is the max profit considering all houses (up to n-1).\n        return dp[n - 1];\n    }\n\n\n    static void main(String[] args) {\n        int[] nums = {1, 2, 3, 1};\n        System.out.println(\"Max profit for [1, 2, 3, 1]: \" + iterative(nums)); // Expected: 4\n\n        int[] nums2 = {2, 7, 9, 3, 1};\n        System.out.println(\"Max profit for [2, 7, 9, 3, 1]: \" + iterative(nums2)); // Expected: 12\n    }\n}" }, { "name": "HouseRobber_2", "subcat": "linear", "link": "https://leetcode.com/problems/house-robber/", "code": "package leetcode.dp.linear;\n\n/**\n * LeetCode Problem: 213. House Robber II\n * <p>\n * Question:\n * You are a professional robber planning to rob houses along a street. All houses at this place are arranged in a circle.\n * That means the first house is the neighbor of the last one. Otherwise, the robbing rules are the same as House Robber I:\n * if two adjacent houses are broken into on the same night, the police will be contacted.\n * <p>\n * Given an integer array `nums` representing the amount of money of each house, return the maximum amount of money\n * you can rob tonight without alerting the police.\n * <p>\n * Example 1:\n * Input: nums = [2, 3, 2]\n * Output: 3\n * Explanation: You cannot rob house 1 (money = 2) and then rob house 3 (money = 2), because they are adjacent.\n * The best you can do is rob house 2 (money = 3).\n * <p>\n * Constraints:\n * - 1 <= nums.length <= 100\n * - 0 <= nums[i] <= 1000\n */\npublic class HouseRobber_2 {\n\n    /**\n     * This is a helper function that solves the original House Robber I problem for a linear array.\n     * It calculates the maximum amount of money that can be robbed from a given list of houses\n     * without robbing adjacent ones.\n     *\n     * @param nums A linear array of houses.\n     * @return The maximum loot possible from this linear arrangement.\n     */\n    public static int helper(int[] nums) {\n        // dp[i] will store the maximum money that can be robbed from the first `i` houses.\n        int n = nums.length + 1;\n        int[] dp = new int[n];\n\n        // Base Cases\n        dp[0] = 0;        // Max money from 0 houses is 0.\n        dp[1] = nums[0];  // Max money from the first house is its own value.\n\n        // Build the solution from the second house onwards.\n        for (int i = 2; i < n; i++) {\n            // Recurrence Relation: The max profit for the first `i` houses is the greater of:\n            // 1. Robbing the current house (nums[i-1]) + the max profit from non-adjacent previous houses (dp[i-2]).\n            // 2. Not robbing the current house, which means taking the max profit from the previous set of houses (dp[i-1]).\n            dp[i] = Math.max(nums[i - 1] + dp[i - 2], dp[i - 1]);\n        }\n\n        return dp[n - 1];\n    }\n\n    /**\n     * Solves the House Robber II problem.\n     * The core idea is to break the circular dependency by solving two separate linear subproblems.\n     *\n     * @param nums The circular array of money in each house.\n     * @return The maximum amount of money that can be robbed.\n     */\n    public static int rob(int[] nums) {\n\n        // Base case: No houses to rob.\n        if (nums.length == 0) {\n            return 0;\n        }\n\n        // Base case: Only one house, so rob it.\n        if (nums.length == 1) {\n            return nums[0];\n        }\n\n        // --- The Core Logic for Circular Array ---\n        // Since the first and last houses are adjacent, you cannot rob both.\n        // This means any optimal solution will either:\n        // 1. Include the first house but NOT the last house.\n        // 2. Include the last house but NOT the first house.\n        // We can solve this by running the standard House Robber algorithm on two linear subarrays:\n        //   - Subproblem 1: All houses EXCEPT the last one (index 0 to n-2).\n        //   - Subproblem 2: All houses EXCEPT the first one (index 1 to n-1).\n        // The final answer is the maximum of these two results.\n\n        // This implementation simulates the two subproblems by temporarily modifying the input array.\n        // A cleaner approach might use Arrays.copyOfRange to create new subarrays.\n\n        // --- Subproblem 1: Calculate max loot WITHOUT the first house ---\n        int val0 = nums[0]; // Store the original value of the first house\n        nums[0] = 0;        // Temporarily set it to 0 to effectively \"skip\" it.\n        int max1 = helper(nums); // Run the linear robber algorithm.\n        nums[0] = val0;     // Reset the array to its original state.\n\n        // --- Subproblem 2: Calculate max loot WITHOUT the last house ---\n        nums[nums.length - 1] = 0; // Temporarily set the last house to 0 to \"skip\" it.\n        int max2 = helper(nums);    // Run the linear robber algorithm again.\n\n        // The overall maximum is the best result from the two scenarios.\n        return Math.max(max1, max2);\n    }\n\n\n    static void main(String[] args) {\n        int[] nums = {2, 3, 2};\n        System.out.println(\"Max profit for [2, 3, 2]: \" + rob(nums)); // Expected: 3\n\n        int[] nums2 = {1, 2, 3, 1};\n        System.out.println(\"Max profit for [1, 2, 3, 1]: \" + rob(nums2)); // Expected: 4\n    }\n}" }, { "name": "MinCostClimbingStairs", "subcat": "linear", "link": "https://leetcode.com/problems/min-cost-climbing-stairs/", "code": "package leetcode.dp.linear;\n\n/**\n * LeetCode Problem: 746. Min Cost Climbing Stairs\n * <p>\n * Question:\n * You are given an integer array `cost` where `cost[i]` is the cost of the `i`-th step on a staircase.\n * Once you pay the cost, you can either climb one or two steps.\n * You can either start from the step with index 0, or the step with index 1.\n * Return the minimum cost to reach the top of the floor. The top of the floor is considered one step past the last index.\n * <p>\n * Example 1:\n * Input: cost = [10, 15, 20]\n * Output: 15\n * Explanation: You will start at index 1. Pay 15 and climb two steps to reach the top. The total cost is 15.\n * <p>\n * Example 2:\n * Input: cost = [1, 100, 1, 1, 1, 100, 1, 1, 100, 1]\n * Output: 6\n * Explanation: You will start at index 0. Pay 1, climb two steps to index 2. Pay 1, climb two steps to index 4. Pay 1, climb two steps to index 6. Pay 1, climb one step to index 7. Pay 1, climb two steps to index 9. Pay 1, climb one step to reach the top. The total cost is 6.\n * <p>\n * Constraints:\n * - 2 <= cost.length <= 1000\n * - 0 <= cost[i] <= 999\n */\npublic class MinCostClimbingStairs {\n\n    public static int recursive(int[] cost, int[] dp, int n) {\n        // Base case: If we are out of bounds, the cost is 0.\n        if (n < 0) return 0;\n\n        // Base cases: For the first two stairs (0 and 1), the cost to reach them is just their own cost.\n        if (n < 2) return cost[n];\n\n        // Memoization check: If we have already calculated the min cost for stair 'n', return it.\n        if (dp[n] != 0) return dp[n];\n\n        // Recursive Step (Recurrence Relation):\n        // The minimum cost to reach stair 'n' is its own cost plus the minimum of the costs\n        // to reach the previous two stairs (n-1 or n-2).\n        dp[n] = cost[n] + Math.min(recursive(cost, dp, n - 1), recursive(cost, dp, n - 2));\n\n        return dp[n];\n    }\n\n    public static int iterative(int[] cost, int[] dp, int n) {\n        // Iterate through each stair to calculate the minimum cost to reach it.\n        for (int i = 0; i < n; i++) {\n            if (i < 2) {\n                // For the first two stairs, the min cost is just their own cost,\n                // as we can start from either of them.\n                dp[i] = cost[i];\n            } else if(i == 2){\n                // Recurrence Relation: The min cost to reach stair 'i' is its own cost\n                // plus the minimum of the costs to reach the previous two stairs.\n                dp[i] = cost[i] + Math.min(dp[i - 1], dp[i - 2]);\n            }else{\n\n                dp[i] = cost[i] + dp[i - 1];\n            }\n        }\n\n        // The \"top\" of the floor is past the last step. To get there, we could have\n        // come from the last step (n-1) or the second-to-last step (n-2).\n        // We return the minimum of these two paths.\n        return Math.min(dp[n - 1], dp[n - 2]);\n    }\n\n\n    public static int minCostClimbingStairs(int[] cost) {\n        int n = cost.length;\n        // The dp array will store the minimum cost to reach step 'i'.\n        int[] dp = new int[n];\n\n        // Call the iterative (bottom-up) solution.\n        return iterative(cost, dp, n);\n        // return Math.min(recursive(cost, dp, n - 1), recursive(cost, dp, n - 2));\n    }\n\n\n    static void main(String[] args) {\n        int[] cost1 = {10, 15, 20};\n        System.out.println(\"Min cost for [10, 15, 20]: \" + minCostClimbingStairs(cost1)); // Expected: 15\n\n        int[] cost2 = {1, 100, 1, 1, 1, 100, 1, 1, 100, 1};\n        System.out.println(\"Min cost for the long array: \" + minCostClimbingStairs(cost2)); // Expected: 6\n    }\n}" }, { "name": "LIS", "subcat": "lis", "link": "https://leetcode.com/problems/lis/", "code": "package leetcode.dp.lis;\n\n\nimport java.util.Arrays;\n\n/**\n * LeetCode Problem: 300. Longest Increasing Subsequence\n *\n * Question:\n * Given an integer array `nums`, return the length of the longest strictly increasing subsequence.\n * A subsequence is a sequence that can be derived from an array by deleting some or no elements without changing the order of the remaining elements.\n *\n * Example 1:\n * Input: nums = [10, 9, 2, 5, 3, 7, 101, 18]\n * Output: 4\n * Explanation: The longest increasing subsequence is [2, 3, 7, 101], therefore the length is 4.\n *\n * Constraints:\n * - 1 <= nums.length <= 2500\n * - -10^4 <= nums[i] <= 10^4\n */\npublic class LIS {\n\n    // Subproblem: dp[i] = The length of the longest increasing subsequence that *ends* at index `i`.\n    public static int iterative(int[] nums) {\n        int n = nums.length;\n        if (n == 0) return 0;\n\n        int[] dp = new int[n];\n        // Base case: Every element by itself is an increasing subsequence of length 1.\n        Arrays.fill(dp, 1);\n\n        int maxLIS = 1;\n\n        // Build the solution from left to right.\n        for (int i = 1; i < n; i++) {\n            // For each element `i`, check all previous elements `j`.\n            for (int j = 0; j < i; j++) {\n                // If `nums[i]` can extend the subsequence ending at `j`...\n                if (nums[i] > nums[j]) {\n                    // then the new LIS length ending at `i` could be `dp[j] + 1`. \n                    // We take the maximum of what we already had for `dp[i]` and this new possibility.\n                    dp[i] = Math.max(dp[i], dp[j] + 1);\n                }\n            }\n            maxLIS = Math.max(maxLIS, dp[i]);\n        }\n\n        return maxLIS;\n    }\n\n    static void main(String[] args) {\n        int[] nums = {10, 9, 2, 5, 3, 7, 101, 18};\n        System.out.println(\"Iterative (O(n^2)): \" + iterative(nums)); // Expected: 4\n    }\n\n}" }, { "name": "BestTimeBuySellStock", "subcat": "stock", "link": "", "code": "package leetcode.dp.stock;\n\npublic class BestTimeBuySellStock {\n\n    // Using greedy approach\n    public static int maxProfit(int[] prices) {\n        int minPrice = prices[0];\n        int maxProfit = 0;\n\n        for (int price : prices) {\n            minPrice = Math.min(minPrice, price);\n\n            if (price - minPrice > maxProfit) {\n                maxProfit = price - minPrice;\n            }\n        }\n\n        return maxProfit;\n    }\n\n    public static void main(String[] args) {\n        int[] prices = { 7, 1, 5, 3, 6, 4 };\n        System.out.println(maxProfit(prices));\n    }\n\n}\n" }, { "name": "BestTimeBuySellStockCooldown", "subcat": "stock", "link": "", "code": "package leetcode.dp.stock;\n\npublic class BestTimeBuySellStockCooldown {\n\n    public static int maxProfit(int[] prices) {\n        if (prices == null || prices.length == 0) {\n            return 0;\n        }\n\n        int n = prices.length;\n\n        int hold = -prices[0];\n        int sold = 0;\n        int cooldown = 0;\n\n        for (int i = 1; i < n; i++) {\n            int prevHold = hold;\n\n            hold = Math.max(hold, cooldown - prices[i]); // Total profit when holding a stock or moving from cooldown\n            cooldown = Math.max(cooldown, sold); // Total profit when in cooldown\n            sold = prevHold + prices[i]; // Total profit when you sold the stock\n        }\n\n        return Math.max(sold, cooldown);\n    }\n\n    public static void main(String[] args) {\n        // Test case 1\n        int[] prices1 = { 1, 2, 3, 0, 2 };\n        System.out.println(maxProfit(prices1)); // Output: 3\n\n        // Test case 2\n        int[] prices2 = { 1 };\n        System.out.println(maxProfit(prices2)); // Output: 0\n    }\n\n}\n" }, { "name": "BestTimeBuySellStock_2", "subcat": "stock", "link": "", "code": "package leetcode.dp.stock;\n\npublic class BestTimeBuySellStock_2 {\n\n    public static int maxProfit(int[] prices) {\n        int profit = 0;\n\n        // Loop through the array and add profits when the next day's price is higher\n        for (int i = 1; i < prices.length; i++) {\n            if (prices[i] > prices[i - 1]) {\n                profit += prices[i] - prices[i - 1];\n            }\n        }\n\n        return profit;\n    }\n\n    public static void main(String[] args) {\n        // Test case 1\n        int[] prices1 = { 7, 1, 5, 3, 6, 4 };\n        System.out.println(maxProfit(prices1)); // Output: 7\n\n        // Test case 2\n        int[] prices2 = { 1, 2, 3, 4, 5 };\n        System.out.println(maxProfit(prices2)); // Output: 4\n\n        // Test case 3\n        int[] prices3 = { 7, 6, 4, 3, 1 };\n        System.out.println(maxProfit(prices3)); // Output: 0\n    }\n}\n" }, { "name": "BestTimeBuySellStock_3", "subcat": "stock", "link": "", "code": "package leetcode.dp.stock;\n\npublic class BestTimeBuySellStock_3 {\n\n    public static int maxProfit(int[] prices) {\n        if (prices == null || prices.length == 0) {\n            return 0;\n        }\n\n        int minPrice1 = Integer.MAX_VALUE;\n        int minPrice2 = Integer.MAX_VALUE;\n        int profit1 = 0;\n        int profit2 = 0;\n\n        for (int price : prices) {\n            minPrice1 = Math.min(minPrice1, price);\n            profit1 = Math.max(profit1, price - minPrice1);\n\n            minPrice2 = Math.min(minPrice2, price - profit1);\n            profit2 = Math.max(profit2, price - minPrice2);\n        }\n\n        return profit2;\n    }\n\n    public static void main(String[] args) {\n        // Test case 1\n        int[] prices1 = { 3, 3, 5, 0, 0, 3, 1, 4 };\n        System.out.println(maxProfit(prices1)); // Output: 6\n\n        // Test case 2\n        int[] prices2 = { 1, 2, 3, 4, 5 };\n        System.out.println(maxProfit(prices2)); // Output: 4\n\n        // Test case 3\n        int[] prices3 = { 7, 6, 4, 3, 1 };\n        System.out.println(maxProfit(prices3)); // Output: 0\n    }\n}\n" }, { "name": "BestTimeBuySellStock_4", "subcat": "stock", "link": "", "code": "package leetcode.dp.stock;\n\nimport java.util.Arrays;\n\npublic class BestTimeBuySellStock_4 {\n\n    public static int maxProfit(int k, int[] prices) {\n        int[] buy = new int[k + 1];\n        int[] sell = new int[k + 1];\n\n        Arrays.fill(buy, Integer.MIN_VALUE);\n        for (int price : prices) {\n            for (int i = 1; i <= k; i++) {\n                buy[i] = Math.max(buy[i], sell[i - 1] - price);\n                sell[i] = Math.max(sell[i], buy[i] + price);\n            }\n        }\n        return sell[k];\n\n    }\n\n    public static void main(String[] args) {\n        // Test case 1\n        int[] prices1 = { 2, 4, 1 };\n        System.out.println(maxProfit(2, prices1)); // Output: 2\n\n        // Test case 2\n        int[] prices2 = { 3, 2, 6, 5, 0, 3 };\n        System.out.println(maxProfit(2, prices2)); // Output: 7\n    }\n}\n" }, { "name": "DistinctSubsequences", "subcat": "string", "link": "", "code": "package leetcode.dp.string;\n\nimport java.util.Arrays;\n\npublic class DistinctSubsequences {\n\n    public static int helper(String s, String t, int i, int j, int[][] dp) {\n        if (j >= t.length()) return 1;\n\n        if (i >= s.length()) return 0;\n\n        if (dp[i][j] != -1) return dp[i][j];\n\n        if (s.charAt(i) == t.charAt(j)) {\n            dp[i][j] = helper(s, t, i + 1, j + 1, dp) + helper(s, t, i + 1, j, dp);\n\n        } else {\n            dp[i][j] = helper(s, t, i + 1, j, dp);\n        }\n\n        return dp[i][j];\n    }\n\n    public static int recursive(String s, String t) {\n        int[][] dp = new int[s.length()][t.length()];\n        for (int[] m : dp) Arrays.fill(m, -1);\n\n        return helper(s, t, 0, 0, dp);\n    }\n\n    public static int iterative(String s, String t) {\n        int m = t.length(); // Target\n        int n = s.length(); // Source\n        int[][] dp = new int[m + 1][n + 1];\n\n        for (int j = 0; j <= n; j++) {\n            // The first row is set to 1 because there's one way to match an empty string t in any prefix of s: by deleting all characters.\n            dp[0][j] = 1;\n        }\n\n        for (int i = 1; i <= m; i++) {\n            for (int j = 1; j <= n; j++) {\n                if (t.charAt(i - 1) == s.charAt(j - 1)) {\n                    dp[i][j] = dp[i - 1][j - 1] + dp[i][j - 1];\n                } else {\n                    dp[i][j] = dp[i][j - 1];\n                }\n            }\n        }\n\n        return dp[t.length()][s.length()];\n    }\n\n    public static int numDistinct(String s, String t) {\n        return recursive(s, t);\n    }\n\n    public static void main(String[] args) {\n        String s = \"rabbbit\";\n        String t = \"rabbit\";\n\n        System.out.println(numDistinct(s, t));\n    }\n\n\n}\n" }, { "name": "EditDistance", "subcat": "string", "link": "", "code": "package leetcode.dp.string;\n\nimport java.util.Arrays;\n\npublic class EditDistance {\n\n    public static int recursive(String word1, String word2, int i, int j, int[][] dp) {\n        // Base case: If one string is empty\n        if (i == 0) return j; // Insert all characters of word2\n        if (j == 0) return i; // Remove all characters of word1\n\n        // Check if the result is already computed\n        if (dp[i][j] != -1) {\n            return dp[i][j];\n        }\n\n        // If the characters are the same, no operation is needed\n        if (word1.charAt(i - 1) == word2.charAt(j - 1)) {\n            dp[i][j] = recursive(word1, word2, i - 1, j - 1, dp);\n        } else {\n            // Calculate the minimum of three operations (Insert, Delete, Replace)\n            int insert = recursive(word1, word2, i, j - 1, dp);    // Insert character from word2\n            int delete = recursive(word1, word2, i - 1, j, dp);    // Delete character from word1\n            int replace = recursive(word1, word2, i - 1, j - 1, dp); // When you replace, it becomes equal\n\n            dp[i][j] = 1 + Math.min(insert, Math.min(delete, replace));\n        }\n\n        return dp[i][j];\n    }\n\n    public static int iterative(String word1, String word2) {\n        int m = word1.length();\n        int n = word2.length();\n\n        // DP table where dp[i][j] represents the minimum number of operations to convert word1[0..i-1] to word2[0..j-1]\n        int[][] dp = new int[m + 1][n + 1];\n\n        // Base case: if word1 is empty, we need to insert all characters of word2\n        for (int i = 0; i <= m; i++) {\n            dp[i][0] = i;\n        }\n\n        // Base case: if word2 is empty, we need to remove all characters of word1\n        for (int j = 0; j <= n; j++) {\n            dp[0][j] = j;\n        }\n\n        for (int i = 1; i <= m; i++) {\n            for (int j = 1; j <= n; j++) {\n                if (word1.charAt(i - 1) == word2.charAt(j - 1)) {\n                    dp[i][j] = dp[i - 1][j - 1];\n                } else {\n                    // Take the minimum of Insert, Delete, and Replace operations\n                    dp[i][j] = 1 + Math.min(dp[i - 1][j], Math.min(dp[i][j - 1], dp[i - 1][j - 1]));\n                }\n            }\n        }\n\n        return dp[m][n];\n    }\n\n    public static int minDistance(String word1, String word2) {\n        int m = word1.length();\n        int n = word2.length();\n\n        int[][] dp = new int[m + 1][n + 1];\n        for (int[] row : dp) {\n            Arrays.fill(row, -1);\n        }\n\n        return recursive(word1, word2, m, n, dp);\n    }\n\n\n    public static void main(String[] args) {\n        String word1 = \"a\";\n        String word2 = \"x\";\n        System.out.println(minDistance(word1, word2));\n    }\n\n}\n" }, { "name": "InterleavingString", "subcat": "string", "link": "", "code": "package leetcode.dp.string;\n\npublic class InterleavingString {\n\n    public static boolean helper(String s1, String s2, String s3, int i, int j, int k, Boolean[][] dp) {\n        if (i == s1.length() && j == s2.length()) return true;\n\n        if (dp[i][j] != null) return dp[i][j];\n\n        // Take first char from s1\n        if (i < s1.length() && s1.charAt(i) == s3.charAt(k)) {\n            dp[i][j] = helper(s1, s2, s3, i + 1, j, k + 1, dp);\n\n            if (dp[i][j]) return true;\n        }\n\n        // Take first char from s2\n        if (j < s2.length() && s2.charAt(j) == s3.charAt(k)) {\n            dp[i][j] = helper(s1, s2, s3, i, j + 1, k + 1, dp);\n\n            if (dp[i][j]) return true;\n        }\n\n        return dp[i][j] = false;\n    }\n\n    public static boolean recursive(String s1, String s2, String s3) {\n        if (s1.length() + s2.length() != s3.length()) return false;\n\n        Boolean[][] dp = new Boolean[s1.length() + 1][s2.length() + 1];\n        helper(s1, s2, s3, 0, 0, 0, dp);\n\n        return helper(s1, s2, s3, 0, 0, 0, dp);\n    }\n\n\n    public static boolean iterative(String s1, String s2, String s3) {\n        int n = s1.length(), m = s2.length();\n\n        if (n + m != s3.length()) return false;\n\n        boolean[][] dp = new boolean[n + 1][m + 1];\n\n        dp[0][0] = true;\n\n        // Fill the first column (considering only s1)\n        for (int i = 1; i <= n; i++) {\n            dp[i][0] = dp[i - 1][0] && s1.charAt(i - 1) == s3.charAt(i - 1);\n        }\n\n        // Fill the first row (considering only s2)\n        for (int j = 1; j <= m; j++) {\n            dp[0][j] = dp[0][j - 1] && s2.charAt(j - 1) == s3.charAt(j - 1);\n        }\n\n        // Fill the DP table\n        for (int i = 1; i <= n; i++) {\n            for (int j = 1; j <= m; j++) {\n                // current index in s3 that we are checking\n                int k = (i + j) - 1;\n                // Check if the current character from s1 or s2 matches the character at index k in s3.\n                // If it matches, inherit truth from previous valid states.\n                // dp[i][j] checks if s1[0..i-1] and s2[0..j-1] match s3[0..i+j-1].\n                dp[i][j] = (s1.charAt(i - 1) == s3.charAt(k) && dp[i - 1][j]) || (s2.charAt(j - 1) == s3.charAt(k) && dp[i][j - 1]);\n            }\n        }\n\n        return dp[n][m];\n    }\n\n\n    public static boolean isInterleave(String s1, String s2, String s3) {\n        return true;\n    }\n\n    public static void main(String[] args) {\n        String s1 = \"aabcc\";\n        String s2 = \"dbbca\";\n        String s3 = \"aadbbcbcac\"; // \"aa dbbc bc a c\";\n        System.out.println(iterative(s1, s2, s3));\n    }\n}\n" }, { "name": "LongestCommonSubsequence", "subcat": "string", "link": "", "code": "package leetcode.dp.string;\n\nimport java.util.Arrays;\n\npublic class LongestCommonSubsequence {\n\n    public static int helper(char[] text1, char[] text2, int i, int j, int[][] dp) {\n        if (i >= text1.length || j >= text2.length) return 0;\n\n        if (dp[i][j] != -1) return dp[i][j];\n\n        if (text1[i] == text2[j]) {\n            dp[i][j] = 1 + helper(text1, text2, i + 1, j + 1, dp);\n\n        } else {\n            int max1 = helper(text1, text2, i + 1, j, dp);\n            int max2 = helper(text1, text2, i, j + 1, dp);\n\n            dp[i][j] = Math.max(max1, max2);\n        }\n\n        return dp[i][j];\n    }\n\n\n    public static int recursive(String text1, String text2) {\n        int[][] dp = new int[text1.length()][text2.length()];\n        for (int[] m : dp) {\n            Arrays.fill(m, -1);\n        }\n        return helper(text1.toCharArray(), text2.toCharArray(), 0, 0, dp);\n    }\n\n\n    public static int iterative(String str1, String str2) {\n        int m = str1.length();\n        int n = str2.length();\n        int[][] dp = new int[m + 1][n + 1];\n\n        for (int i = 0; i <= m; i++) {\n            dp[i][0] = 0;  // First Column\n        }\n\n        for (int j = 0; j <= n; j++) {\n            dp[0][j] = 0; // First Row\n        }\n\n        for (int i = 1; i <= m; i++) {\n            for (int j = 1; j <= n; j++) {\n                if (str1.charAt(i - 1) == str2.charAt(j - 1)) {\n                    dp[i][j] = dp[i - 1][j - 1] + 1;\n                } else {\n                    dp[i][j] = Math.max(dp[i - 1][j], dp[i][j - 1]);\n                }\n            }\n        }\n\n        return dp[m][n];\n    }\n\n\n    public static int longestCommonSubsequence(String text1, String text2) {\n        return recursive(text1, text2);\n    }\n\n\n    public static void main(String[] args) {\n        String text1 = \"mom\";\n        String text2 = \"mom\";\n\n        System.out.println(longestCommonSubsequence(text1, text2));\n    }\n\n\n}\n" }, { "name": "LongestPalindromeSubsequence", "subcat": "string", "link": "", "code": "package leetcode.dp.string;\n\nimport java.util.Arrays;\n\npublic class LongestPalindromeSubsequence {\n\n    public static int helper(String s, int i, int j, int[][] dp) {\n        if (i > j) return 0;\n        if (i == j) return 1;\n\n        if (dp[i][j] != -1) return dp[i][j]; // Use memoized result\n\n        if (s.charAt(i) == s.charAt(j)) {\n            dp[i][j] = 2 + helper(s, i + 1, j - 1, dp);\n        } else {\n            dp[i][j] = Math.max(helper(s, i + 1, j, dp), helper(s, i, j - 1, dp));\n        }\n\n        return dp[i][j];\n    }\n\n\n    public static int recursive(String s) {\n        int[][] dp = new int[s.length()][s.length()];\n        for (int[] row : dp) Arrays.fill(row, -1);\n\n        return helper(s, 0, s.length() - 1, dp);\n    }\n\n    public static int iterative(String s) {\n        int n = s.length();\n\n        int[][] dp = new int[n][n];\n\n        for (int i = 0; i < n; i++) dp[i][i] = 1;\n\n        for (int j = 0; j < n; j++) {\n            for (int i = j - 1; i >= 0; i--) {\n                if (s.charAt(i) == s.charAt(j)) {\n                    dp[i][j] = 2 + dp[i + 1][j - 1];\n                } else {\n\n                    dp[i][j] = Math.max(dp[i + 1][j], dp[i][j - 1]);\n                }\n            }\n        }\n\n        return dp[0][n - 1];\n    }\n\n\n    public static int longestPalindromeSubseq(String s) {\n        return recursive(s);\n    }\n\n\n    public static void main(String[] args) {\n        String s = \"cbbd\";\n        System.out.println(iterative(s));\n    }\n\n\n}\n" }, { "name": "LongestPalindromicSubstring", "subcat": "string", "link": "", "code": "package leetcode.dp.string;\n\npublic class LongestPalindromicSubstring {\n\n    // Iterative solution for longest palindromic substring\n    public static String iterative(String s) {\n        String result = \"\";\n        boolean[][] dp = new boolean[s.length()][s.length()];\n\n        for (int i = 0; i < s.length(); i++) {\n            dp[i][i] = true;\n        }\n\n        for (int i = 0; i < s.length(); i++) {\n            for (int j = 0; j <= i; j++) {\n                if (s.charAt(i) == s.charAt(j) && (i - j <= 2 || dp[j + 1][i - 1])) {\n                    dp[j][i] = true;\n\n                    if (i - j + 1 > result.length()) {\n                        result = s.substring(j, Math.min(i + 1, s.length()));\n                    }\n                }\n            }\n        }\n\n        return result;\n    }\n\n\n    static String longestPalindrome(String s) {\n        return iterative(s);\n    }\n\n    public static void main(String[] args) {\n        String s = \"babad\";\n        System.out.println(longestPalindrome(s));\n    }\n\n}\n" }, { "name": "WildcardMatching", "subcat": "string", "link": "", "code": "package leetcode.dp.string;\n\nimport java.util.Arrays;\n\npublic class WildcardMatching {\n\n    private static boolean helper(String s, String p, int i, int j, int[][] dp) {\n        // If the pattern is exhausted, check if the string is also exhausted\n        if (j == p.length()) {\n            return i == s.length();\n        }\n\n        // If the string is exhausted but the pattern is not\n        if (i == s.length()) {\n            // All remaining characters in the pattern must be '*'\n            for (int k = j; k < p.length(); k++) {\n                if (p.charAt(k) != '*') {\n                    return false;\n                }\n            }\n            return true;\n        }\n\n        // Check if the result is already computed\n        if (dp[i][j] != -1) {\n            return dp[i][j] == 1;\n        }\n\n        // If the characters match or the pattern has '?', move both pointers\n        if (p.charAt(j) == s.charAt(i) || p.charAt(j) == '?') {\n            dp[i][j] = helper(s, p, i + 1, j + 1, dp) ? 1 : 0;\n        }\n        // If the pattern has a '*' character\n        else if (p.charAt(j) == '*') {\n            // Try two cases:\n            // 1. '*' matches zero characters (skip the '*' in a pattern).\n            // 2. '*' matches one or more characters (move to the next character in s).\n            dp[i][j] = (helper(s, p, i + 1, j, dp) || helper(s, p, i, j + 1, dp)) ? 1 : 0;\n        } else {\n            dp[i][j] = 0; // Characters do not match and no special wildcard\n        }\n\n        return dp[i][j] == 1;\n    }\n\n\n    public static boolean recursive(String s, String p) {\n        int m = s.length();\n        int n = p.length();\n        int[][] dp = new int[m + 1][n + 1];\n\n        for (int[] row : dp) {\n            Arrays.fill(row, -1);\n        }\n\n        return helper(s, p, 0, 0, dp);\n    }\n\n\n    public static boolean iterative(String s, String p) {\n        int m = s.length();\n        int n = p.length();\n        boolean[][] dp = new boolean[m + 1][n + 1];\n\n        // Empty pattern matches empty string\n        dp[0][0] = true;\n\n        // Fill in the first row (when string is empty but the pattern is not)\n        for (int j = 1; j <= n; j++) {\n            if (p.charAt(j - 1) == '*') {\n                dp[0][j] = dp[0][j - 1]; // '*' can match an empty sequence\n            }\n        }\n\n        // Fill the DP table\n        for (int i = 1; i <= m; i++) {\n            for (int j = 1; j <= n; j++) {\n                if (p.charAt(j - 1) == s.charAt(i - 1) || p.charAt(j - 1) == '?') {\n                    dp[i][j] = dp[i - 1][j - 1]; // Match the current characters\n                } else if (p.charAt(j - 1) == '*') {\n                    dp[i][j] = dp[i - 1][j] || dp[i][j - 1]; // '*' matches zero or more characters\n                }\n            }\n        }\n\n        return dp[m][n];\n    }\n\n\n    public static boolean isMatch(String s, String p) {\n        return recursive(s, p);\n    }\n\n\n    public static void main(String[] args) {\n        System.out.println(iterative(\"abc\", \"a*b*\"));\n    }\n\n}\n" }, { "name": "MaxGoodSubtreeScore", "subcat": "trees", "link": "https://leetcode.com/problems/maximum-good-subtree-score", "code": "package leetcode.dp.trees;\n\n// https://leetcode.com/problems/maximum-good-subtree-score/description/?envType=problem-list-v2&envId=ntel9tzc\npublic class MaxGoodSubtreeScore {\n\n    public int goodSubtreeSum(int[] vals, int[] par) {\n        return 0;\n    }\n\n}\n" }], "String": [{ "name": "BullsCows", "subcat": "", "link": "https://leetcode.com/problems/bulls-cows/", "code": "package leetcode.string;\n\n\n/**\n * LeetCode Problem 299: Bulls and Cows\n *\n * You are playing the Bulls and Cows game with your friend.\n *\n * You write down a secret number and ask your friend to guess what the number is.\n * When your friend makes a guess, you provide a hint with the following format:\n *\n * The hint tells your friend how many \"bulls\" and \"cows\" they got. A \"bull\" is a\n * digit in the guess that is in the correct position. A \"cow\" is a digit in the\n * guess that is in the secret number but in the wrong position.\n *\n * Specifically, the non-bull digits in the guess that could be rearranged to match\n * the non-bull digits in the secret number are counted as cows.\n *\n * Given the secret number secret and your friend's guess guess, return the hint.\n *\n * Example 1:\n * Input: secret = \"1807\", guess = \"7810\"\n * Output: \"1A3B\"\n * Explanation: Bulls are at index 1 (8). Cows are 0, 1, and 7.\n *\n * Example 2:\n * Input: secret = \"1123\", guess = \"0111\"\n * Output: \"1A1B\"\n * Explanation: Bull is at index 1 (1). The guess has three 1s but the secret has only\n * two. One 1 from the guess can be matched with a 1 from the secret to form a cow.\n */\npublic class BullsCows {\n\n    // Uses net difference counting to track unmatched digits.\n    public static String getHint(String secret, String guess) {\n        int bulls = 0;\n        int cows = 0;\n\n        // `count` array acts as a frequency map for digits 0-9.\n        // A positive value count[i] means we've seen digit `i` more times in `secret`.\n        // A negative value count[i] means we've seen digit `i` more times in `guess`.\n        int[] count = new int[10];\n\n        for (int i = 0; i < secret.length(); i++) {\n            int s = Character.getNumericValue(secret.charAt(i));\n            int g = Character.getNumericValue(guess.charAt(i));\n\n            if (s == g) {\n                bulls++;\n            } else {\n\n                // If count[s] is negative, it means the `guess` string has an unmatched `s`\n                // from a previous iteration. The current `s` from `secret` can now form a cow.\n                if (count[s] < 0) {\n                    cows++;\n                }\n                // If count[g] is positive, it means the `secret` string has an unmatched `g`\n                // from a previous iteration. The current `g` from `guess` can now form a cow.\n                if (count[g] > 0) {\n                    cows++;\n                }\n\n                // Increment for the digit seen in `secret`.\n                count[s]++;\n                // Decrement for the digit seen in `guess`.\n                count[g]--;\n            }\n        }\n\n        return bulls + \"A\" + cows + \"B\";\n    }\n\n    public static void main(String[] args) {\n        String secret1 = \"1807\";\n        String guess1 = \"7810\";\n        System.out.println(\"Secret: \" + secret1 + \", Guess: \" + guess1);\n        System.out.println(\"Hint: \" + getHint(secret1, guess1)); // Expected: \"1A3B\"\n\n        String secret2 = \"1123\";\n        String guess2 = \"0111\";\n        System.out.println(\"\\nSecret: \" + secret2 + \", Guess: \" + guess2);\n        System.out.println(\"Hint: \" + getHint(secret2, guess2)); // Expected: \"1A1B\"\n\n        String secret3 = \"11\";\n        String guess3 = \"10\";\n        System.out.println(\"\\nSecret: \" + secret3 + \", Guess: \" + guess3);\n        System.out.println(\"Hint: \" + getHint(secret3, guess3)); // Expected: \"1A0B\"\n    }\n}\n" }, { "name": "CountAndSay", "subcat": "", "link": "https://leetcode.com/problems/count-and-say/", "code": "package leetcode.string;\n\n\n/**\n * LeetCode Problem 38: Count and Say\n *\n * The count-and-say sequence is a sequence of digit strings defined by the\n * recursive formula:\n *\n * countAndSay(1) = \"1\"\n * countAndSay(n) is the way you would \"say\" the digit string from\n * countAndSay(n-1), which is then converted into a different digit string.\n *\n * To determine how you \"say\" a digit string, split it into the minimal number\n * of substrings such that each substring contains exactly one unique digit. Then\n * for each substring, say the number of digits, then say the digit. Finally,\n * concatenate every said digit.\n *\n * For example, the saying of \"3322251\" is \"two 3s, three 2s, one 5, one 1\",\n * which becomes \"23321511\".\n *\n * Sequence Generation:\n * n=1: \"1\"\n * n=2: say \"1\" -> \"one 1\" -> \"11\"\n * n=3: say \"11\" -> \"two 1s\" -> \"21\"\n * n=4: say \"21\" -> \"one 2, one 1\" -> \"1211\"\n * n=5: say \"1211\" -> \"one 1, one 2, two 1s\" -> \"111221\"\n *\n * Given a positive integer n, return the nth term of the count-and-say sequence.\n */\npublic class CountAndSay {\n\n    private static String generateNextTerm(String term) {\n        StringBuilder result = new StringBuilder();\n\n        for (int i = 0; i < term.length(); i++) {\n            int count = 1;\n            char currentChar = term.charAt(i);\n\n            // Look ahead to count consecutive occurrences of the same character.\n            while (i + 1 < term.length() && term.charAt(i + 1) == currentChar) {\n                count++;\n                i++; // IMPORTANT: Increment i here to skip the counted characters.\n            }\n\n            // Append the count and the character to the result.\n            result.append(count).append(currentChar);\n        }\n\n        return result.toString();\n    }\n\n\n    public static String countAndSayIterative(int n) {\n        String result = \"1\";\n        // Start with the first term \"1\" and apply the \"saying\" process\n        // n-1 times to build up to the n-th term.\n        for (int i = 1; i < n; i++) {\n            result = generateNextTerm(result);\n        }\n\n        return result;\n    }\n\n    public static void main(String[] args) {\n        int n = 5;\n\n        System.out.println(\"\\nUsing Iterative approach for n = \" + n + \":\");\n        System.out.println(countAndSayIterative(n));  // Expected Output: \"111221\"\n    }\n\n}\n" }, { "name": "FindCommonCharacters", "subcat": "", "link": "https://leetcode.com/problems/find-common-characters/", "code": "package leetcode.string;\n\nimport java.util.ArrayList;\nimport java.util.Arrays;\nimport java.util.List;\n\n\n/**\n * LeetCode Problem 1002: Find Common Characters\n *\n * Given a string array `words`, return an array of all characters that show up\n * in all strings within the `words` (including duplicates). You may return the\n * answer in any order.\n *\n * For example, if a character occurs 3 times in all strings but not 4 times,\n * you need to include that character three times in the final answer.\n *\n * Example 1:\n * Input: words = [\"bella\",\"label\",\"roller\"]\n * Output: [\"e\",\"l\",\"l\"]\n *\n * Example 2:\n * Input: words = [\"cool\",\"lock\",\"cook\"]\n * Output: [\"c\",\"o\"]\n */\npublic class FindCommonCharacters {\n\n    public static List<String> commonChars(String[] words) {\n        // `mainCount` will store the minimum frequency of each character ('a' through 'z')\n        // found across all words. We initialize it with a very large number so that\n        // the first word's frequencies will become the initial minimums.\n        int[] mainCount = new int[26];\n        Arrays.fill(mainCount, Integer.MAX_VALUE);\n\n        // Iterate through each word in the input array.\n        for (String word : words) {\n            // For each word, calculate its own character frequency count.\n            int[] wordCount = new int[26];\n            for (char ch : word.toCharArray()) {\n                wordCount[ch - 'a']++;\n            }\n\n            // Update the mainCount. The new minimum frequency for each character\n            // is the smaller of its previous minimum and the frequency in the current word.\n            // This step effectively finds the intersection of character counts.\n            for (int i = 0; i < 26; i++) {\n                mainCount[i] = Math.min(mainCount[i], wordCount[i]);\n            }\n        }\n\n        // After checking all words, `mainCount` holds the exact number of times\n        // each character appeared in all strings. Now, build the result list.\n        List<String> result = new ArrayList<>();\n        for (int i = 0; i < 26; i++) {\n            // Add the character to the result list `mainCount[i]` times.\n            while (mainCount[i] > 0) {\n                // Convert the index `i` back to a character.\n                result.add(String.valueOf((char) (i + 'a')));\n                mainCount[i]--;\n            }\n        }\n\n        return result;\n    }\n\n\n    public static void main(String[] args) {\n        String[] words1 = {\"bella\", \"label\", \"roller\"};\n        System.out.println(\"Input: \" + Arrays.toString(words1));\n        System.out.println(\"Output: \" + commonChars(words1)); // Expected: [e, l, l]\n\n        String[] words2 = {\"cool\", \"lock\", \"cook\"};\n        System.out.println(\"\\nInput: \" + Arrays.toString(words2));\n        System.out.println(\"Output: \" + commonChars(words2)); // Expected: [c, o]\n    }\n}\n" }, { "name": "IsomorphicStrings", "subcat": "", "link": "https://leetcode.com/problems/isomorphic-strings/", "code": "package leetcode.string;\n\nimport java.util.HashMap;\n\n/**\n * LeetCode Problem 205: Isomorphic Strings\n *\n * Given two strings s and t, determine if they are isomorphic.\n *\n * Two strings s and t are isomorphic if the characters in s can be replaced to get t.\n *\n * All occurrences of a character must be replaced with another character while\n * preserving the order of characters. No two characters may map to the same\n * character, but a character may map to itself.\n *\n * Example 1:\n * Input: s = \"egg\", t = \"add\"\n * Output: true\n *\n * Example 2:\n * Input: s = \"foo\", t = \"bar\"\n * Output: false\n *\n * Example 3:\n * Input: s = \"paper\", t = \"title\"\n * Output: true\n */\npublic class IsomorphicStrings {\n\n    public static boolean isIsomorphic(String s, String t) {\n        // Arrays to store the last seen index of each character.\n        // We use 256 to cover the extended ASCII character set.\n        int[] mapS = new int[256];\n        int[] mapT = new int[256];\n\n        for (int i = 0; i < s.length(); i++) {\n            char charS = s.charAt(i);\n            char charT = t.charAt(i);\n\n            // Check if the mapping is consistent.\n            // If the last seen index of charS is different from the last seen index of charT,\n            // it means one character has been mapped before while the other hasn't,\n            // or they were mapped to different characters in a previous step.\n            if (mapS[charS] != mapT[charT]) {\n                return false;\n            }\n\n            // Update the last seen position for both characters.\n            // We use `i + 1` instead of `i` to distinguish between a character\n            // not seen yet (default value 0) and a character seen at index 0.\n            mapS[charS] = i + 1;\n            mapT[charT] = i + 1;\n        }\n\n        return true;\n    }\n\n    public static void main(String[] args) {\n        String s1 = \"paper\";\n        String t1 = \"title\";\n        System.out.println(\"s = \\\"\" + s1 + \"\\\", t = \\\"\" + t1 + \"\\\"\");\n        System.out.println(\"Using Array Map: \" + isIsomorphic(s1, t1)); // Expected: true\n\n        String s2 = \"foo\";\n        String t2 = \"bar\";\n        System.out.println(\"\\ns = \\\"\" + s2 + \"\\\", t = \\\"\" + t2 + \"\\\"\");\n        System.out.println(\"Using Array Map: \" + isIsomorphic(s2, t2)); // Expected: false\n\n        String s3 = \"badc\";\n        String t3 = \"baba\";\n        System.out.println(\"\\ns = \\\"\" + s3 + \"\\\", t = \\\"\" + t3 + \"\\\"\");\n        System.out.println(\"Using Array Map: \" + isIsomorphic(s3, t3)); // Expected: false\n    }\n\n}\n\n" }, { "name": "LongestHappyPrefix", "subcat": "", "link": "https://leetcode.com/problems/longest-happy-prefix/", "code": "package leetcode.string;\n\n/**\n * LeetCode Problem 1392: Longest Happy Prefix\n *\n * A string is called a happy prefix if it is a non-empty prefix of the string\n * that is also a suffix of the string (excluding the string itself).\n *\n * Given a string s, return its longest happy prefix. Return an empty string \"\"\n * if no such prefix exists.\n *\n * A \"proper prefix\" is a prefix that is not equal to the whole string.\n * A \"proper suffix\" is a suffix that is not equal to the whole string.\n * The problem asks for the longest proper prefix that is also a proper suffix.\n *\n * This is a classic application of the Knuth-Morris-Pratt (KMP) algorithm's\n * preprocessing step, which builds a Longest Proper Prefix Suffix (LPS) array.\n *\n * Example 1:\n * Input: s = \"level\"\n * Output: \"l\"\n * Explanation: The prefixes are \"l\", \"le\", \"lev\", \"leve\". The suffixes are \"l\", \"el\", \"vel\", \"evel\".\n * The longest common prefix-suffix is \"l\".\n *\n * Example 2:\n * Input: s = \"ababab\"\n * Output: \"abab\"\n *\n * Example 3:\n * Input: s = \"leetcodeleet\"\n * Output: \"leet\"\n */\npublic class LongestHappyPrefix {\n\n\n    public static String longestPrefix(String s) {\n        if (s.length() <= 1) {\n            return \"\";\n        }\n\n        // The `lps` array stores the length of the longest proper prefix of the substring\n        // s[0...i] that is also a suffix of that substring.\n        int[] lps = new int[s.length()];\n\n        // `lpsIndex` (often called `len` or `j`) tracks the length of the\n        // current longest prefix suffix. It points to the character *after* the prefix.\n        int lpsIndex = 0;\n\n        // `i` is the main pointer that iterates through the string to build the lps array.\n        int i = 1;\n\n        while (i < s.length()) {\n            // Case 1: The characters match.\n            // This means we have extended the current longest prefix-suffix by one character.\n            if (s.charAt(lpsIndex) == s.charAt(i)) {\n                lpsIndex++;\n                lps[i] = lpsIndex;\n                i++;\n            } else {\n                // Case 2: The characters do not match.\n                if (lpsIndex != 0) {\n                    // This is the core trick of KMP. We don't start over from scratch.\n                    // We \"fall back\" by looking for the lps of the previous prefix.\n                    // This tells us the length of the next best prefix to try matching.\n                    lpsIndex = lps[lpsIndex - 1];\n                } else {\n                    // We have fallen all the way back to a prefix of length 0.\n                    // We record that lps[i] is 0 and move to the next character.\n                    lps[i] = 0;\n                    i++;\n                }\n            }\n        }\n\n        // The length of the longest happy prefix for the entire string `s`\n        // is the last value stored in the `lps` array.\n        int longestPrefixLength = lps[s.length() - 1];\n\n        return s.substring(0, longestPrefixLength);\n    }\n\n\n    public static void main(String[] args) {\n        String s1 = \"level\";\n        System.out.println(\"Input: \\\"\" + s1 + \"\\\"\");\n        System.out.println(\"Longest Happy Prefix: \\\"\" + longestPrefix(s1) + \"\\\"\"); // Expected: \"l\"\n\n        String s2 = \"ababab\";\n        System.out.println(\"\\nInput: \\\"\" + s2 + \"\\\"\");\n        System.out.println(\"Longest Happy Prefix: \\\"\" + longestPrefix(s2) + \"\\\"\"); // Expected: \"abab\"\n\n        String s3 = \"acccbaaacccbaac\";\n        System.out.println(\"\\nInput: \\\"\" + s3 + \"\\\"\");\n        System.out.println(\"Longest Happy Prefix: \\\"\" + longestPrefix(s3) + \"\\\"\"); // Expected: \"ac\"\n    }\n}\n" }, { "name": "LongestNiceSubstring", "subcat": "", "link": "https://leetcode.com/problems/longest-nice-substring/", "code": "package leetcode.string;\n\nimport java.util.HashSet;\nimport java.util.Set;\n\n/**\n * LeetCode Problem 1763: Longest Nice Substring\n *\n * A string s is nice if for every letter of the alphabet that s contains, it\n * appears in both uppercase and lowercase. For example, \"abABB\" is nice because\n * 'A' and 'a' appear, and 'B' and 'b' appear. However, \"abA\" is not nice because\n * 'b' appears but 'B' does not.\n *\n * Given a string s, return the longest substring of s that is nice. If there are\n * multiple, return the substring of the earliest occurrence. If there are none,\n * return an empty string.\n *\n * Example 1:\n * Input: s = \"YazaAay\"\n * Output: \"aAa\"\n * Explanation: \"aAa\" is a nice string because 'A/a' is the only letter of the\n * alphabet in s, and both 'A' and 'a' appear. \"aAa\" is the longest nice substring.\n *\n * Example 2:\n * Input: s = \"Bb\"\n * Output: \"Bb\"\n *\n * Example 3:\n * Input: s = \"c\"\n * Output: \"\"\n */\npublic class LongestNiceSubstring {\n\n\n    public static String longestNiceSubstring(String s) {\n        if (s.length() < 2) {\n            return \"\"; // A single character cannot be nice.\n        }\n\n        // Use a Set to quickly find all unique characters in the current string s.\n        Set<Character> charSet = new HashSet<>();\n        for (char c : s.toCharArray()) {\n            charSet.add(c);\n        }\n\n        // Find the first \"bad\" character that breaks the nice property.\n        for (int i = 0; i < s.length(); i++) {\n            char c = s.charAt(i);\n            if (charSet.contains(Character.toUpperCase(c)) && charSet.contains(Character.toLowerCase(c))) {\n                continue; // This character is fine, check the next one.\n            }\n\n            // If we are here, `c` is a \"bad\" character.\n            // The longest nice substring must be entirely to its left or entirely to its right.\n            // Divide and conquer: split the string at this character and solve for both halves.\n            String leftSubstring = longestNiceSubstring(s.substring(0, i));\n            String rightSubstring = longestNiceSubstring(s.substring(i + 1));\n\n            // Return the longer of the two results.\n            return leftSubstring.length() >= rightSubstring.length() ? leftSubstring : rightSubstring;\n        }\n\n        // If the loop completes without finding any \"bad\" characters,\n        // it means the entire string `s` is nice.\n        return s;\n    }\n\n\n    /**\n     * Brute-force solution.\n     * This method checks every possible substring to see if it's \"nice\" and\n     * keeps track of the longest one found.\n     * Time Complexity: O(N^3) due to nested loops and substring creation/checking.\n     */\n    public static String longestNiceSubstringBruteForce(String s) {\n        String result = \"\";\n        for (int i = 0; i < s.length(); i++) {\n            for (int j = i + 1; j <= s.length(); j++) {\n                String sub = s.substring(i, j);\n                if (isNice(sub)) {\n                    if (sub.length() > result.length()) {\n                        result = sub;\n                    }\n                }\n            }\n        }\n        return result;\n    }\n\n    /**\n     * Helper for the brute-force method to check if a single string is nice.\n     */\n    private static boolean isNice(String sub) {\n        Set<Character> set = new HashSet<>();\n        for (char c : sub.toCharArray()) {\n            set.add(c);\n        }\n        for (char c : set) {\n            if (Character.isUpperCase(c) && !set.contains(Character.toLowerCase(c))) {\n                return false;\n            }\n            if (Character.isLowerCase(c) && !set.contains(Character.toUpperCase(c))) {\n                return false;\n            }\n        }\n        return true;\n    }\n\n\n    public static void main(String[] args) {\n        String s1 = \"YazaAay\";\n        System.out.println(\"Input: \\\"\" + s1 + \"\\\"\");\n        System.out.println(\"Optimized Output: \\\"\" + longestNiceSubstring(s1) + \"\\\"\"); // Expected: \"aAa\"\n\n        String s2 = \"Bb\";\n        System.out.println(\"\\nInput: \\\"\" + s2 + \"\\\"\");\n        System.out.println(\"Optimized Output: \\\"\" + longestNiceSubstring(s2) + \"\\\"\"); // Expected: \"Bb\"\n\n        String s3 = \"c\";\n        System.out.println(\"\\nInput: \\\"\" + s3 + \"\\\"\");\n        System.out.println(\"Optimized Output: \\\"\" + longestNiceSubstring(s3) + \"\\\"\"); // Expected: \"\"\n    }\n}\n" }, { "name": "LongestPalindromicSubstringExpandAround", "subcat": "", "link": "", "code": "package leetcode.string;\n\npublic class LongestPalindromicSubstringExpandAround {\n\n    public static String findLongestPalindromicSubstring(String s) {\n        if (s == null || s.isEmpty()) return \"\";\n\n        int n = s.length();\n        int start = 0;\n        int maxLength = 1;\n\n        for (int i = 0; i < n; i++) {\n\n            // Check for odd length palindromes (centered at i)\n            int left = i, right = i;\n            while (left >= 0 && right < n && s.charAt(left) == s.charAt(right)) {\n                if (right - left + 1 > maxLength) {\n                    start = left;\n                    maxLength = right - left + 1;\n                }\n                left--;\n                right++;\n            }\n\n            // Check for even length palindromes (centered between i-1 and i)\n            left = i;\n            right = i + 1;\n            while (left >= 0 && right < n && s.charAt(left) == s.charAt(right)) {\n                if (right - left + 1 > maxLength) {\n                    start = left;\n                    maxLength = right - left + 1;\n                }\n                left--;\n                right++;\n            }\n\n        }\n\n        return s.substring(start, start + maxLength);\n    }\n\n\n    static void main(String[] args) {\n        String s = \"babad\";\n        System.out.println(findLongestPalindromicSubstring(s));\n    }\n\n}\n" }, { "name": "ReverseVowels", "subcat": "", "link": "", "code": "package leetcode.string;\n\nimport java.util.HashSet;\nimport java.util.Set;\n\npublic class ReverseVowels {\n\n    public static String reverseVowels(String s) {\n        char[] ch = s.toCharArray();\n        Set<Character> vowelSet = new HashSet<>(Set.of('a', 'e', 'i', 'o', 'u', 'A', 'E', 'I', 'O', 'U'));\n\n        int i = 0;\n        int j = ch.length - 1;\n\n        while (i < j) {\n\n            while (i < j && !vowelSet.contains(ch[i])) {\n                i++;\n            }\n\n            while (i < j && !vowelSet.contains(ch[j])) {\n                j--;\n            }\n\n            char temp = ch[i];\n            ch[i] = ch[j];\n            ch[j] = temp;\n\n            i++;\n            j--;\n        }\n\n        return String.valueOf(ch);\n    }\n\n    public static void main(String[] args) {\n        String s = \"icecream\";\n        System.out.println(\"Icecream : \" + reverseVowels(s)); // acecreim\n\n        s = \"leetcode\";\n        System.out.println(\"leetcode : \" +  reverseVowels(s)); // leotcede\n    }\n\n}\n" }, { "name": "ShortestDistanceCharacter", "subcat": "", "link": "https://leetcode.com/problems/shortest-distance-character/", "code": "package leetcode.string;\n\nimport java.util.*;\n\n/*\n * LeetCode Problem: 821. Shortest Distance to a Character\n *\n * Question:\n * Given a string s and a character c that occurs in s, return an array of integers\n * answer where answer.length == s.length and answer[i] is the shortest distance\n * from s[i] to the character c in s.\n *\n * The distance between two indices i and j is abs(i - j).\n *\n * Example 1:\n * Input: s = \"loveleetcode\", c = 'e'\n * Output: [3,2,1,0,1,0,0,1,2,2,1,0]\n * Explanation: The character 'e' appears at indices 3, 5, 6, and 11 (0-indexed).\n * The distance from index 0 to 'e' is min(abs(0-3), abs(0-5), abs(0-6), abs(0-11)) = 3.\n * The distance from index 1 to 'e' is min(abs(1-3), abs(1-5), abs(1-6), abs(1-11)) = 2.\n * For index 4, min(abs(4-3), abs(4-5), abs(4-6), abs(4-11)) = 1.\n * For index 8, min(abs(8-3), abs(8-5), abs(8-6), abs(8-11)) = 3.\n *\n */\n\npublic class ShortestDistanceCharacter {\n\n\n    // Uses treeSet to store indices of character c\n    @SuppressWarnings(\"all\")\n    public static int[] shortestToChar(String s, char c) {\n        TreeSet<Integer> treeSet = new TreeSet<>();\n\n        // put all indices of character c in the TreeSet\n        for (int i = 0; i < s.length(); i++) {\n            if (s.charAt(i) == c) {\n                treeSet.add(i);\n            }\n        }\n\n        int[] result = new int[s.length()];\n\n        for (int i = 0; i < s.length(); i++) {\n            int min;\n\n            int ceilMin = Integer.MAX_VALUE;\n            int floorMin = Integer.MAX_VALUE;\n\n            if (treeSet.ceiling(i) != null) {\n                ceilMin = treeSet.ceiling(i) - i;\n            }\n\n            if (treeSet.floor(i) != null) {\n                floorMin = i - treeSet.floor(i);\n            }\n\n            min = Math.min(ceilMin, floorMin);\n            result[i] = min;\n        }\n\n        return result;\n    }\n\n    /**\n     * Solves the same problem using a pre-computed list of character indices and binary search.\n     * This approach follows the user's suggestion.\n     *\n     * @param s The input string.\n     * @param c The target character.\n     * @return An array of integers representing the shortest distances.\n     */\n    public static int[] shortestToCharBinarySearch(String s, char c) {\n        // Step 1: Find all indices of the character 'c' and store them in a sorted list.\n        List<Integer> cIndices = new ArrayList<>();\n        for (int i = 0; i < s.length(); i++) {\n            if (s.charAt(i) == c) {\n                cIndices.add(i);\n            }\n        }\n\n        int n = s.length();\n        int[] result = new int[n];\n\n        // Step 2: For each character in the string, find the shortest distance to 'c'.\n        for (int i = 0; i < n; i++) {\n            // Use binary search to find the insertion point of the current index 'i'\n            // in our list of 'c' indices. This helps us quickly find the nearest neighbors.\n            int insertionPoint = Collections.binarySearch(cIndices, i);\n\n            // Case 1: 'i' is an index where 'c' is present. The distance is 0.\n            if (insertionPoint >= 0) {\n                result[i] = 0;\n            } else {\n                // Case 2: 'i' is not an index of 'c'.\n                // The binarySearch method returns (-(insertion point) - 1).\n                // We convert it back to the actual insertion point.\n                insertionPoint = -(insertionPoint + 1);\n\n                // Calculate distance to the 'c' on the left.\n                int distToLeft = Integer.MAX_VALUE;\n                // The neighbor to the left is at `insertionPoint - 1`.\n                if (insertionPoint > 0) {\n                    distToLeft = i - cIndices.get(insertionPoint - 1);\n                }\n\n                // Calculate distance to the 'c' on the right.\n                int distToRight = Integer.MAX_VALUE;\n                // The neighbor to the right is at the `insertionPoint`.\n                if (insertionPoint < cIndices.size()) {\n                    distToRight = cIndices.get(insertionPoint) - i;\n                }\n\n                // The shortest distance is the minimum of the two.\n                result[i] = Math.min(distToLeft, distToRight);\n            }\n        }\n\n        return result;\n    }\n\n    /**\n     * Solves the problem using a two-pass (left-to-right and right-to-left) approach.\n     * This corresponds to the \"peaks and valleys\" visualization.\n     *\n     * @param s The input string.\n     * @param c The target character.\n     * @return An array of integers representing the shortest distances.\n     */\n    public static int[] shortestToCharTwoPass(String s, char c) {\n        int n = s.length();\n        int[] result = new int[n];\n        int pos = -n; // Random number should be less than -n\n\n        // Pass 1: Left to Right\n        // For each index, we find the distance to the nearest 'c' on its left.\n        for (int i = 0; i < n; i++) {\n            if (s.charAt(i) == c) {\n                pos = i; // Update the position of the last seen 'c'.\n            }\n            result[i] = i - pos;\n        }\n\n        // Pass 2: Right to Left\n        // For each index, we find the distance to the nearest 'c' on its right.\n        // Then we take the minimum of the left-distance and the right-distance.\n        for (int i = n - 1; i >= 0; i--) {\n            if (s.charAt(i) == c) {\n                pos = i; // Update the position of the last seen 'c'.\n            }\n            // result[i] currently holds the distance to the left 'c'.\n            // pos - i is the distance to the right 'c'. We need the minimum.\n            result[i] = Math.min(result[i], Math.abs(i - pos));\n        }\n\n        return result;\n    }\n\n\n\n\n    public static void main(String[] args) {\n        String s = \"loveleetcode\";\n        char c = 'e';\n        System.out.println(\"Input String: \" + s);\n        System.out.println(\"Target Character: \" + c);\n        System.out.println(\"Result: \" + Arrays.toString(shortestToChar(s, c)));\n    }\n}\n" }, { "name": "StringCompression", "subcat": "", "link": "https://leetcode.com/problems/string-compression/", "code": "package leetcode.string;\n\nimport java.util.Arrays;\n\n/**\n * LeetCode Problem 443: String Compression\n * * Given an array of characters chars, compress it using the following algorithm:\n * * Begin with an empty string s. For each group of consecutive repeating characters in chars:\n * - If the group's length is 1, append the character to s.\n * - Otherwise, append the character followed by the group's length.\n * * The compressed string s should not be returned separately, but instead, be stored in the input character array chars.\n * Note that group lengths that are 10 or longer will be split into multiple characters in chars.\n * * After you are done modifying the input array, return the new length of the array.\n * * You must write an algorithm that uses only constant extra space.\n * * Example 1:\n * Input: chars = [\"a\",\"a\",\"b\",\"b\",\"c\",\"c\",\"c\"]\n * Output: Return 6, and the first 6 characters of the input array should be: [\"a\",\"2\",\"b\",\"2\",\"c\",\"3\"]\n * * Example 2:\n * Input: chars = [\"a\"]\n * Output: Return 1, and the first character of the input array should be: [\"a\"]\n * * Example 3:\n * Input: chars = [\"a\",\"b\",\"b\",\"b\",\"b\",\"b\",\"b\",\"b\",\"b\",\"b\",\"b\",\"b\",\"b\"]\n * Output: Return 4, and the first 4 characters of the input array should be: [\"a\",\"b\",\"1\",\"2\"]\n */\n\npublic class StringCompression {\n\n    /**\n     * Compresses the character array in-place.\n     * This is an optimized solution using a two-pointer approach (a read pointer and a write pointer).\n     *\n     * @param chars The input array of characters to be compressed.\n     * @return The new length of the compressed array.\n     */\n    public static int compress(char[] chars) {\n        // 'writeIndex' is the pointer where we will write the next compressed character.\n        int writeIndex = 0;\n        // 'readIndex' is the pointer that scans through the original array.\n        int readIndex = 0;\n\n        // Loop until we have scanned the entire array.\n        while (readIndex < chars.length) {\n            char currentChar = chars[readIndex];\n            int count = 0;\n\n            // Count consecutive occurrences of the currentChar.\n            while (readIndex < chars.length && chars[readIndex] == currentChar) {\n                count++;\n                readIndex++; // Move the read pointer forward.\n            }\n\n            // Write the character to the compressed part of the array.\n            chars[writeIndex++] = currentChar;\n\n            // If the character was repeated more than once, write its count.\n            if (count > 1) {\n                // Convert the count to a string to handle multi-digit numbers (e.g., 12).\n                String countStr = String.valueOf(count);\n                for (char digit : countStr.toCharArray()) {\n                    chars[writeIndex++] = digit;\n                }\n            }\n        }\n\n        // 'writeIndex' is now at the end of the compressed content, which is the new length.\n        return writeIndex;\n    }\n\n    public static void main(String[] args) {\n        char[] chars1 = {'a', 'a', 'b', 'b', 'c', 'c', 'c'};\n        int newLength1 = compress(chars1);\n        System.out.println(\"Test Case 1:\");\n        System.out.println(\"New Length: \" + newLength1); // Expected: 6\n        System.out.println(\"Modified Array: \"
